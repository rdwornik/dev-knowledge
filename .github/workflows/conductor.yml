# .github/workflows/conductor.yml
#
# CONDUCTOR E's RUNNER ([#689]). Decided by the §3 matrix of
# to-cc/DECLARE-CONDUCTOR-DECISION-2026-09-09.md (E weighted 58, against A 52, B 55, C 38,
# D 46) and built to §8's three steps. §4, verbatim on what this file is:
#
#   "Runner = GitHub Actions. .github/workflows/conductor.yml, on: push · pull_request ·
#    schedule · workflow_dispatch. It reads tasks/, evaluates the phase gate, performs the
#    phase action. Scheduling, durability, retries, logs, UI are GitHub's. The only custom
#    content is the phase table -- which is custom in every option because it is the process."
#
# THE PHASE TABLE IS NOT IN THIS FILE, deliberately. It is scripts/conductor.py, which
# tests/test_conductor.py exercises locally. A gate written in workflow shell is a gate no
# local test can run, and this repo's whole enforcement argument is that a gate nobody can
# exercise is decoration.
#
# "PERFORMS THE PHASE ACTION" IS NOT BUILT HERE, and that is a boundary, not an omission. The
# four delivery-loop transitions belong to [#669]; [#689] owns the field, the runner and the
# gate surface. Both rows' kill-candidates lines say so. This workflow EVALUATES and REPORTS;
# it moves no row.
#
# HOW THIS DIFFERS FROM report-only-wall.yml, so neither absorbs the other. The wall RECORDS
# what landed on main and blocks nothing, permanently and by design. This workflow produces the
# four CHECK CONTEXTS that deploy/conductor-required-checks.ruleset.json arms as required
# checks -- it exists to be a gate. Two organs, two roles, one directory.
#
# ------------------------------------------------------------------------------------------
# THREE PREMISES OF THE DECISION DOC THAT ARE NO LONGER TRUE, recorded here because the next
# reader of this file will otherwise re-derive them:
#
#  1. "the repo is private on the Free tier" (report-only-wall.yml, and
#     ecosystem/fleet-shape-spec.yaml's .github sanction comment). LIVE at 2026-09-11:
#     `gh api repos/rdwornik/dev-knowledge` returns private: false, visibility: public, and
#     `gh api user` returns plan: pro. The rulesets API returns [] at HTTP 200, not the 403
#     AMEND-CONDUCTOR-DECISION-001 §1 measured. Operator decision D2 ratified Pro for exactly
#     this purpose (to-browser/RATIFICATION-2026-09-10-architect.md).
#
#  2. `pull_request` IS VACUOUS TODAY, and is present because §4 names it. The wall's header
#     records why: "the repo merges locally with --no-ff and pushes, so a PR-triggered organ
#     would never fire -- the [#255] vacuity that retired the last .github/ organ." No PR is
#     opened by this repo's landing protocol. The trigger becomes live the day landing moves
#     to PRs, which is the same day required checks can actually gate anything (see 3).
#
#  3. "ARMING REQUIRED CHECKS AND LOCAL-MERGE LANDING ARE MUTUALLY EXCLUSIVE" -- NO LONGER TRUE
#     (foundation-4-merge-gate, M4 D2; ADR-127 D1). A required_status_checks rule refuses a
#     push whose head commit has no passing checks, and a --no-ff merge made locally has none
#     before it is pushed -- that much stands. What changed is that the SAME commit now gets its
#     checks first: the integrator pushes each merge commit to `worktree-integrate-<batch>`
#     (a `worktree-**` push, so this workflow runs on it), waits for the check runs there, and
#     only then pushes THAT sha to `main` -- after re-checking that origin/main is still the
#     integration base. The sha a protected `main` receives already carries its passing checks,
#     so a no-bypass-actor rule is satisfied by the path the repo already uses, with no PR flow
#     and no second merge. The path is tracked: scripts/merge_path.py (`land`, `verdict`,
#     `ruleset apply`). On an integration ref `seal`, `spine` and `anchor` judge the pushed range
#     against origin/main as if it were a push to main (see each job). The ruleset stays
#     `enforcement: disabled` in its file; `merge_path.py ruleset apply` is the one act that
#     arms it, only after a rehearsal record (`ruleset rehearse`) shows both pytest legs and every
#     required context `success` on the named sha, and on the operator's recorded GO.
# ------------------------------------------------------------------------------------------

name: conductor

on:
  push:
    # LANE-5B3-8, O3 FIRST STEP: `worktree-*` added so a pushed lane branch gets its own
    # automatic run, not only `workflow_dispatch` by hand -- CI stops being main-only signal.
    # The existing jobs already carry non-main-ref logic (commit-gate's LANE-5B-7 comment,
    # seal's ancestry check) built anticipating exactly this trigger widening.
    # LANE-5B4-3 (L1, D1): widened from `worktree-*` to `worktree-**` (matches nested
    # worktree-slug refs too, and doubles as the integrator's own `worktree-integrate-...`
    # branches -- same prefix, same glob, no second pattern needed) plus `epic/**`, per the
    # proposal's trigger list ("push to main, worktree-**, epic/** and the integrator's
    # integration branches").
    # DECIDED-BY-OPERATOR 2026-10-24: push-time CI on main is wanted (R168 relaxed); the push reuses the same-sha green verdict (plan step `reuse`), so no second suite run for an already-judged sha.
    branches: ["main", "worktree-**", "epic/**"]
  pull_request:
    branches: [main]
  schedule:
    # 05:00 UTC daily. A schedule leg is what makes the runner a runner rather than a
    # push-reactor: §6 number 1 counts transitions Actions performed WITHOUT an operator act,
    # and a workflow that only fires when a human pushes can never move that number.
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read          # least privilege. This workflow reports; it writes no repo state.

concurrency:
  # [#1540]: the event name is in the group so a nightly `schedule` run on main never
  # cancels the in-progress `push` run of the same sha (push run 37304780263 lost its Windows
  # leg to schedule run 37305923170 on 2026-10-05); two pushes of one ref still share a group,
  # so a superseded push is still cancelled.
  group: conductor-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true    # unlike the wall, a superseded GATE result is worthless

jobs:
  # --- the four required-check contexts -------------------------------------------------
  # Job NAMES are the check CONTEXTS the ruleset names. Renaming a job silently disarms its
  # required check, so deploy/conductor-required-checks.ruleset.json and these four ids are
  # one fact in two files; tests/test_conductor.py asserts they agree.

  plan:
    # ADR-127 AMENDMENT 2 (Linux-first CI, 2026-10-16): which OS legs this run needs. A merge is
    # judged on ubuntu-latest alone; windows-latest joins (a) on `schedule` / `workflow_dispatch`
    # (the nightly full run) and (b) when the diff touches a Windows-sensitive path. The decision
    # is `scripts/ci_os_plan.py` -- the SAME function `merge_path.land` uses to pick the required
    # contexts, so the run and the verdict cannot disagree. Stdlib only: no `uv sync` here.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    outputs:
      reuse: ${{ steps.reuse.outputs.reuse }}
      os: ${{ steps.plan.outputs.os }}
      reason: ${{ steps.plan.outputs.reason }}
      base: ${{ steps.plan.outputs.base }}
      # e2-os-split (ADR-127 AM2; v282 design): the per-leg pytest `-m` expression, decided in
      # scripts/ci_os_plan.py `selection`. m_windows is EMPTY on schedule / workflow_dispatch
      # (the nightly Windows leg runs the full suite, its red flowing to `windows-nightly-triage`).
      m_ubuntu: ${{ steps.plan.outputs.m_ubuntu }}
      m_windows: ${{ steps.plan.outputs.m_windows }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Local `main` ref and origin/main
        run: |
          git rev-parse --verify --quiet refs/heads/main >/dev/null 2>&1 || git branch main origin/main || true
      - name: Decide the OS legs
        id: plan
        run: |
          python3 scripts/ci_os_plan.py --event "${{ github.event_name }}" \
            --head "${{ github.event.pull_request.head.sha || github.sha }}" \
            --before "${{ github.event.before }}" --ref "${{ github.ref }}"
          {
            echo "## OS legs"
            echo
            grep '^os=' "$GITHUB_OUTPUT" | tail -1
            echo
            grep '^reason=' "$GITHUB_OUTPUT" | tail -1 | cut -c8-
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Reuse the same-sha green verdict (push to main only)
        id: reuse
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          n=$(gh run list --workflow conductor.yml --commit "${{ github.sha }}" --limit 50 \
            --json databaseId,headBranch,status,conclusion \
            --jq '[.[] | select(.status == "completed" and .conclusion == "success" and .databaseId != ${{ github.run_id }} and .headBranch != "main")] | length')
          if [ "${n:-0}" -gt 0 ]; then
            echo "reuse=true" >> "$GITHUB_OUTPUT"
          else
            echo "reuse=false" >> "$GITHUB_OUTPUT"
          fi

  pytest:
    # LANE-5B4-3 (L1, D1): the OS matrix. `fail-fast: false` so a red on one leg never cancels
    # the other before ITS duration is known -- the whole point of this lane is measuring both.
    # Job id stays `pytest`; GitHub names the two check CONTEXTS `pytest (ubuntu-latest)` and
    # `pytest (windows-latest)` from the matrix automatically (RATIFICATION D3) -- renaming the
    # job id, not the matrix values, is what would disarm those contexts.
    # ADR-127 AMENDMENT 2: the `os` list is the `plan` job's output -- ["ubuntu-latest"], plus
    # "windows-latest" on the nightly / manual run or a Windows-sensitive diff. The check
    # CONTEXTS are still `pytest (ubuntu-latest)` / `pytest (windows-latest)`; the ruleset file
    # requires only the first (a server-side rule cannot require a check conditionally), and
    # `merge_path.land` adds the second to its required set for a sensitive diff.
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45      # the wall measures ~5m30s-6m with -n auto, 13m19s serial (Linux;
                             # the Windows leg's own duration is what this lane exists to measure)
    defaults:
      run:
        # D1: "shell: bash on both". Every `run:` step below is POSIX (set +e, PIPESTATUS,
        # $GITHUB_OUTPUT/$GITHUB_STEP_SUMMARY redirects) -- windows-latest's own default shell
        # is pwsh, which does not parse any of that. `shell: bash` resolves to the Git-for-
        # Windows bash the runner image already ships (T6: `shell: bash` is supported on
        # windows-latest), not a new dependency.
        shell: bash
    steps:
      - name: Same-sha verdict reused (no suite run)
        if: ${{ needs.plan.outputs.reuse == 'true' }}
        run: echo "CI already judged this sha green on another branch; the suite is not repeated."
      - uses: actions/checkout@v4
        if: ${{ needs.plan.outputs.reuse != 'true' }}
        with:
          fetch-depth: 0     # LOAD-BEARING, and the wall paid for this line: a shallow clone
                             # makes the graft root look like it created whole files, so
                             # canonical_freshness returns false FAILs and
                             # journal_spine_anchor raises a FAIL-class AnchorError.
      - name: Local `main` ref (D1 -- fixes the "main does not resolve" clone artefact, K2/T1)
        if: ${{ needs.plan.outputs.reuse != 'true' }}
        # `fetch-depth: 0` above fetches full history, but on a non-`main` ref it creates no
        # LOCAL `refs/heads/main` -- only the remote-tracking `origin/main`. Every spine-walking
        # instrument (`provision_legs.ref_resolves` et al.) looks up `refs/heads/main`
        # specifically (never the bare name, never the remote ref -- a bare `git rev-parse main`
        # would also match a tag), so those tests read a real, resolvable clone as broken. This
        # is the exact clone artefact the proposal names as 4 reds on a `workflow_dispatch`
        # checkout of a non-main ref; seeding the branch here removes it at the source.
        run: |
          git rev-parse --verify --quiet refs/heads/main >/dev/null 2>&1 || git branch main origin/main
      - uses: astral-sh/setup-uv@v5
        if: ${{ needs.plan.outputs.reuse != 'true' }}
        with:
          version: "0.11.19" # MUST equal pyproject.toml [tool.uv] required-version EXACTLY.
                             # Every command below runs `uv run --locked`; a mismatched uv
                             # fails each one on a version error before any real check runs.
      - name: Assert the toolchain pin is satisfied
        if: ${{ needs.plan.outputs.reuse != 'true' }}
        run: |
          uv --version
          grep -q 'required-version = "==0.11.19"' pyproject.toml \
            || { echo "::error::pyproject uv pin moved -- update this workflow in the same commit"; exit 1; }
      - name: Sync the locked environment
        if: ${{ needs.plan.outputs.reuse != 'true' }}
        run: uv sync --locked --group analytics   # without it, pandas is absent and the
                                                 # fleet_analytics tests fail on the import
      - name: Per-leg test selection (ci_os_plan)
        if: ${{ needs.plan.outputs.reuse != 'true' }}
        # e2-os-split (ADR-127 AMENDMENT 2, v282 design): this leg's `-m` expression from the
        # `plan` job, exported as CI_OS_MARKEXPR; tests/conftest.py ANDs it onto the pytest
        # step's own `-m "not operator_host"`. An env var, not the command: that command text is
        # pinned by tests/test_conductor.py and must not mention matrix.os.
        env:
          IS_WINDOWS: ${{ matrix.os == 'windows-latest' }}
          M_UBUNTU: ${{ needs.plan.outputs.m_ubuntu }}
          M_WINDOWS: ${{ needs.plan.outputs.m_windows }}
        run: |
          if [ "$IS_WINDOWS" = "true" ]; then
            echo "CI_OS_MARKEXPR=$M_WINDOWS" >> "$GITHUB_ENV"
          else
            echo "CI_OS_MARKEXPR=$M_UBUNTU" >> "$GITHUB_ENV"
          fi
      - name: pytest, pinned at -n 4 (logs/SUITE-BASELINE-FREEZE.md's comparison command)
        id: run
        if: ${{ needs.plan.outputs.reuse != 'true' }}
        continue-on-error: true   # judged by the known-reds compare below, not this raw exit
                                   # code -- main carries pre-existing failures today
        run: |
          set +e
          # `--dist loadgroup` (foundation-6): the worker count stays the freeze's pin; only the
          # distribution mode changes, so the `xdist_group` that tests/test_connection_loop.py
          # already carries keeps that lock-serialized module on ONE worker instead of leaving
          # up to three workers blocked on its lock file. Measured (paired round): Linux test step
          # about -45 s on the same failing set; Windows no measurable change (the record:
          # docs/audits/2026-10-03-codex-foundation-6-ci-speed.md).
          # [#1103] (R81.3): `-m "not operator_host"` deselects the tests that read the operator's
          # own disk (tests/conftest.py registers the marker). One selector for both legs; the
          # windows leg never collected them, so only the ubuntu leg's set changes.
          # e2-test-flow-metrics: --durations=50 --junitxml, for the record (no .test_durations exists yet)
          uv run --locked pytest -q --tb=short -n 4 --dist loadgroup -m "not operator_host" --durations=50 --junitxml=junit.xml 2>&1 | tee pytest.out
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Judge the run against the frozen baseline, by node id ([#802])
        id: gate
        if: ${{ needs.plan.outputs.reuse != 'true' }}
        # REPORT-ONLY (LANE-5B3-8 repair 1): retired as this job's verdict -- the frozen
        # 87-member set has no path to admit the four permanent [#664] witnesses (deliberately
        # kept OUT of logs/SUITE-BASELINE-FREEZE.md so every run keeps reporting them), so a
        # gate keyed on that set alone can never go green while they exist. Kept running, and
        # kept under this exact step name, purely for the record: scripts/ci_verdict.py
        # (SUITE_GATE_STEP_NAME) parses this step's own name and log window, so renaming it
        # breaks that reader.
        run: |
          set +e
          uv run --locked python scripts/conductor.py suite-gate \
            --pytest-output pytest.out --workers 4 --pytest-exit "${{ steps.run.outputs.exit }}" \
            --out suite-gate.out
          rc=$?
          cat suite-gate.out
          echo "exit=$rc" >> "$GITHUB_OUTPUT"
      - name: Compare against the committed known-reds registry (LANE-5A-1, ADR-121 step 1)
        id: known_reds
        if: ${{ needs.plan.outputs.reuse != 'true' }}
        # THE JOB'S VERDICT (LANE-5B3-8 repair 1, retiring the [#802] frozen-baseline gate above
        # from that role): every failure this run reports outside the 87-member freeze is
        # already REGISTERED here -- 17 real known-reds plus the 4 permanent [#664] witnesses
        # (attribution `witness`), which `known_reds.compare` reports separately from a genuine
        # regression rather than folding them into either bucket. A report-only step is a
        # different step, not a softened verdict, so this one carries no `continue-on-error`.
        run: |
          set +e
          uv run --locked python scripts/known_reds.py compare \
            --pytest-output pytest.out --workers 4 --pytest-exit "${{ steps.run.outputs.exit }}" \
            --registry logs/KNOWN-REDS-REGISTRY.json --out known-reds-compare.out
          rc=$?
          cat known-reds-compare.out
          echo "exit=$rc" >> "$GITHUB_OUTPUT"
      - name: Write the record
        if: ${{ always() && needs.plan.outputs.reuse != 'true' }}
        run: |
          {
            echo "## suite-baseline gate — \`${{ github.sha }}\`"
            echo
            echo '```'
            cat suite-gate.out 2>/dev/null || echo "no gate output"
            echo '```'
            echo
            echo "## known-reds compare (LANE-5A-1) — \`${{ github.sha }}\`"
            echo
            echo '```'
            cat known-reds-compare.out 2>/dev/null || echo "no known-reds output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && needs.plan.outputs.reuse != 'true' }}
        with:
          # matrix-scoped: v4 refuses two uploads with the same name in one run, and the
          # matrix now runs this job once per OS in every run.
          name: pytest-${{ matrix.os }}-${{ github.sha }}
          path: |
            pytest.out
            suite-gate.out
            known-reds-compare.out
            junit.xml
          retention-days: 90
          if-no-files-found: warn
      - name: Fail the job on the known-reds compare's verdict, not the frozen-baseline gate's (LANE-5B3-8 repair 1)
        if: ${{ needs.plan.outputs.reuse != 'true' }}
        run: exit ${{ steps.known_reds.outputs.exit }}

  windows-gate:
    # ADR-127 AMENDMENT 2: the SERVER-SIDE half of "a Windows-sensitive diff still requires the
    # Windows leg". A ruleset cannot require `pytest (windows-latest)` conditionally, so this ONE
    # always-running job is the required context instead: it passes when the plan left Windows out
    # (Linux alone judges the merge) and, when the plan put Windows in, judges the WINDOWS LEG the
    # way the merge verdict does -- `scripts/windows_gate.py`: success passes; a red leg passes
    # only if every red is also red at the base (no NEW red, no non-test failure); skipped,
    # cancelled, absent or unreadable fails closed. (The first version read the raw matrix
    # conclusion and was red on every Windows-sensitive merge while any known red existed:
    # REFUSED-linux-first-ci, repair 1.) `if: always()` is not a skip condition: it only stops a
    # failed `pytest` or `plan` from SKIPPING this job (a skipped required check counts as
    # passing), and an unreadable plan fails closed below.
    needs: [plan, pytest]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PLAN_RESULT: ${{ needs.plan.result }}
      PLAN_OS: ${{ needs.plan.outputs.os }}
      PLAN_BASE: ${{ needs.plan.outputs.base }}
      PLAN_REUSE: ${{ needs.plan.outputs.reuse }}
    steps:
      - name: Does the plan require the Windows leg?
        id: need
        run: |
          if [ "$PLAN_RESULT" != "success" ] || [ -z "$PLAN_OS" ]; then
            echo "::error::the plan job did not produce an OS list (result: $PLAN_RESULT) -- fail closed"
            exit 1
          fi
          if [ "$PLAN_REUSE" = "true" ]; then
            echo "windows=no" >> "$GITHUB_OUTPUT"
            echo "same-sha verdict reused; that run already judged Windows"
            exit 0
          fi
          case "$PLAN_OS" in
            *windows-latest*) echo "windows=yes" >> "$GITHUB_OUTPUT" ;;
            *) echo "windows=no" >> "$GITHUB_OUTPUT"
               echo "plan $PLAN_OS: Linux alone judges this merge; no Windows leg was required" ;;
          esac
      - uses: actions/checkout@v4
        if: steps.need.outputs.windows == 'yes'
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        if: steps.need.outputs.windows == 'yes'
        with:
          version: "0.11.19" # MUST equal pyproject.toml [tool.uv] required-version EXACTLY.
      - name: Sync the locked environment
        if: steps.need.outputs.windows == 'yes'
        run: uv sync --locked
      - name: The Windows leg's conclusion and its pytest output, tip and base
        id: leg
        if: steps.need.outputs.windows == 'yes'
        run: |
          conclusion=$(gh run view "${{ github.run_id }}" --json jobs \
            --jq '.jobs[] | select(.name == "pytest (windows-latest)") | .conclusion')
          echo "conclusion=${conclusion:-absent}" >> "$GITHUB_OUTPUT"
          if [ "$conclusion" = "failure" ]; then
            gh run download "${{ github.run_id }}" -n "pytest-windows-latest-${{ github.sha }}" -D tip || true
            # The base's Windows red-set: the run on the base sha itself when it ran Windows;
            # otherwise the newest completed run on main that did (Linux-only merges leave no
            # Windows leg, so the nightly run is the usual source). Nothing found = fail closed.
            candidates=$( { [ -n "$PLAN_BASE" ] && gh run list --workflow conductor.yml \
                --status completed --commit "$PLAN_BASE" --limit 3 --json databaseId,headSha \
                --jq '.[] | "\(.databaseId) \(.headSha)"'; \
              gh run list --workflow conductor.yml --branch main --status completed --limit 15 \
                --json databaseId,headSha --jq '.[] | "\(.databaseId) \(.headSha)"'; } || true)
            echo "$candidates" | while read -r rid rsha; do
              [ -n "$rid" ] || continue
              if gh run download "$rid" -n "pytest-windows-latest-$rsha" -D base 2>/dev/null; then
                echo "base Windows output: run $rid @ $rsha"; break
              fi
            done
          fi
      - name: Judge the Windows leg like the merge verdict does
        if: steps.need.outputs.windows == 'yes'
        run: |
          uv run --locked python scripts/windows_gate.py \
            --leg-conclusion "${{ steps.leg.outputs.conclusion }}" \
            --tip-out tip/pytest.out --base-out base/pytest.out --base-sha "$PLAN_BASE"

  windows-nightly-triage:
    # ADR-127 AMENDMENT 2 (Linux-first CI): a Windows red found at night becomes a row the next
    # morning and does not block the day. THE MORNING PICK-UP IS AN EXISTING KIND, not a new one:
    # a GitHub Issue labelled `nightly-triage`, which `scripts/surface_triage.py` (`triage_lines`,
    # run by SessionStart's `session_start.py`) already lists as "[triage] N nightly finding(s)
    # await: #N". The session that sees it files the repair row and feeds it to the integrator's
    # queue. Scoped to `schedule`: a push run never opens an Issue. Nothing here is a required
    # context, so it can never hold a merge.
    #
    # e2-test-flow-metrics (lane L1): this schedule-only job also hosts the nightly TEST-FLOW
    # RECORD (`scripts/test_flow_metrics.py record`, M1-M4), because a new job would have to join
    # the `gate` job's `needs` and its allowed-skips, which lane L2 owns. `workflow_dispatch` is
    # admitted so the record can be produced on a branch before its first scheduled run; the
    # Issue step below stays `schedule`-only. No CI job pushes a record into the repo (the
    # precedent: report-only-wall and substrate-heartbeat upload artifacts only), so the record is
    # the `test-flow-metrics-record` artifact and the laptop ingests it with
    # `test_flow_metrics.py record --from-run <run id>`.
    needs: pytest
    if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.19" # MUST equal pyproject.toml [tool.uv] required-version EXACTLY (see the pytest job)
      - name: Compute the test-flow record (M1-M4)
        # `continue-on-error`: the record is an instrument, never a gate on the run it rides on.
        continue-on-error: true
        run: |
          set -o pipefail
          uv run --locked python scripts/test_flow_metrics.py record --out test-flow-record.json
          {
            echo "## test-flow record (M1-M4) -- \`${GITHUB_SHA}\`"
            echo
            echo '```json'
            cat test-flow-record.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-flow-metrics-record
          path: test-flow-record.json
          retention-days: 90
          if-no-files-found: warn
      - name: Open a nightly-triage Issue when the Windows leg is not green
        if: ${{ github.event_name == 'schedule' }}
        run: |
          set -e
          concl=$(gh run view "${{ github.run_id }}" --json jobs \
            --jq '.jobs[] | select(.name == "pytest (windows-latest)") | .conclusion')
          echo "pytest (windows-latest) concluded: ${concl:-<absent>}"
          case "$concl" in
            success|skipped) echo "Windows leg green: nothing to file"; exit 0 ;;
          esac
          title="Windows nightly red on main @ ${GITHUB_SHA::8} (run ${{ github.run_id }})"
          gh label create nightly-triage --color D93F0B \
            --description "A nightly finding awaiting morning triage" 2>/dev/null || true
          existing=$(gh issue list --label nightly-triage --state open \
            --search "\"run ${{ github.run_id }}\" in:title" --json number --jq '.[].number')
          if [ -n "$existing" ]; then echo "an open issue for this run exists: $existing"; exit 0; fi
          {
            echo "The nightly full-suite run's Windows leg concluded \`${concl:-absent}\`."
            echo
            echo "- run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- sha: ${GITHUB_SHA}"
            echo "- leg: \`pytest (windows-latest)\`; its known-reds compare is in the job summary and the \`pytest-windows-latest-*\` artifact."
            echo
            echo "Per ADR-127 AMENDMENT 2 (Linux-first CI) this does not block merges. File the repair row from this finding and feed it to the integrator's queue; close this Issue when the row is filed."
          } > body.md
          gh issue create --label nightly-triage --title "$title" --body-file body.md

  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.19"
      - name: Sync the locked environment
        run: uv sync --locked
      - name: ruff
        # `check`, never `check --fix`: a gate that edits the tree is not a gate.
        run: uv run --locked ruff check
      - name: platform-skip ratchet (ADR-127 D7)
        # A step of the existing `ruff` job, not a new job: a new job would be a new check
        # context, and the ruleset's required list is a separate decision. The script exits
        # non-zero when a platform-conditioned skip is added above the committed baseline.
        run: uv run --locked python scripts/platform_skip_ratchet.py
      - name: process diagram + binding check (D6, W7)
        # Steps of the existing `ruff` job, not a new job (same reason as above): fails when the
        # stored diagram is not a regeneration, or a bound anchor is stale.
        run: uv run --locked python scripts/gen_process_diagrams.py --check
      - name: process binding gate, two-way completeness ([#1639])
        # Prints every unbound organ (node->code, code->node), never allow-listed. Report-only until
        # W9 settles the list (non-empty today); drop `--report` to make an unbound organ block.
        run: uv run --locked python scripts/gen_process_diagrams.py --gate --report

  tier1:
    # [#1560] (BUILD-2a slot 1, R155): a lane push gets a fast Linux verdict -- ruff, then the
    # tests the LANE'S OWN diff impacts (`impacted_tests.py select-lane`, the triple-dot diff
    # against origin/main), at the same `-n 4 --dist loadgroup` the full leg uses. Scoped to a
    # push to `worktree-<x>`; the integrator's `worktree-integrate-*` branches, `main`,
    # `schedule` and `workflow_dispatch` skip it and keep the full legs. The `gate` job below
    # lists it among the skips it tolerates ONLY off a lane branch, so on a lane push a skipped
    # `tier1` is red.
    # NARROWING (night lane e2-tier1): the shards of [#1562] are not built, and the existing
    # `pytest` legs are left exactly as they are (see the lane handback for why they are not
    # yet skipped on a lane push). A `# FULL SUITE` answer is therefore reported, not re-run
    # here: the unchanged `pytest` leg is the full run.
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/worktree-') && !startsWith(github.ref, 'refs/heads/worktree-integrate-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # `select-lane` diffs `origin/main...HEAD`: it needs the merge-base.
      - name: Local `main` ref (the full leg's seed; no `refs/heads/main` on a non-main checkout)
        run: |
          git rev-parse --verify --quiet refs/heads/main >/dev/null 2>&1 || git branch main origin/main
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.19" # MUST equal pyproject.toml [tool.uv] required-version EXACTLY.
      - name: Sync the locked environment
        run: uv sync --locked --group analytics
      - name: ruff
        # `check`, never `check --fix`: a gate that edits the tree is not a gate.
        run: uv run --locked ruff check
      - name: Select the impacted tests (merge-base with origin/main)
        id: select
        # FAILS CLOSED ([#703]): only the two marker lines the selector prints on purpose are
        # understood. `# NOTHING IMPACTED` is the one legitimate empty answer; `# FULL SUITE`
        # widens; a non-zero exit, empty output or any other line is treated as FULL SUITE,
        # never as "nothing to run".
        run: |
          set +e
          uv run --locked python scripts/impacted_tests.py select-lane --main-ref origin/main \
            --explain > select.out 2> select.explain
          rc=$?
          set -e
          cat select.explain || true
          first=$(head -n 1 select.out)
          if [ "$rc" -ne 0 ]; then
            mode=full; args=""
          else
            case "$first" in
              "# NOTHING IMPACTED"*) mode=none; args="" ;;
              "# FULL SUITE"*) mode=full; args="" ;;
              "#"*|"") mode=full; args="" ;;
              *) mode=args; args="$first" ;;
            esac
          fi
          echo "selector rc=$rc mode=$mode: ${first:-<empty>}"
          {
            echo "mode=$mode"
            echo "args=$args"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## tier1 selection -- \`${{ github.sha }}\`"
            echo
            echo "mode: \`$mode\`  args: \`${args:-none}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: pytest over the selection, -n 4 --dist loadgroup
        id: run
        if: steps.select.outputs.mode == 'args'
        continue-on-error: true   # judged by the known-reds compare below, as the full leg does
        env:
          SELECTED: ${{ steps.select.outputs.args }}
        run: |
          set +e
          # `-m live_repo` (the docs-only tier) must not be followed by a second `-m`: the last
          # one wins and would silently widen the run, so the operator_host exclusion is
          # folded into the same expression.
          case "$SELECTED" in
            "-m live_repo") set -- -m "live_repo and not operator_host" ;;
            *) set -- -m "not operator_host" $SELECTED ;;
          esac
          start=$(date +%s)
          uv run --locked pytest -q --tb=short -n 4 --dist loadgroup "$@" 2>&1 | tee pytest.out
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          echo "wall_seconds=$(( $(date +%s) - start ))" >> "$GITHUB_STEP_SUMMARY"
      - name: Compare against the committed known-reds registry
        if: steps.select.outputs.mode == 'args'
        run: |
          set +e
          uv run --locked python scripts/known_reds.py compare \
            --pytest-output pytest.out --workers 4 --pytest-exit "${{ steps.run.outputs.exit }}" \
            --registry logs/KNOWN-REDS-REGISTRY.json --out known-reds-compare.out
          rc=$?
          cat known-reds-compare.out
          exit $rc

  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # the range below must be resolvable
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.19"
      - name: Sync the locked environment
        run: uv sync --locked
      - name: ADR-101 tree seal over this range's ADDs
        run: |
          set -e
          # THE SEAL IS PROSPECTIVE, and running it with no staged adds is the vacuous pass
          # CLAUDE.md's anti-patterns name explicitly ("Running validators with no args").
          # validate_hermetization reads `git diff --cached --diff-filter=A`, which in a CI
          # checkout is EMPTY because the index already equals HEAD. `git reset --soft` to the
          # range's base restores exactly the staged-add set the local pre-commit hook would
          # have seen -- so CI measures what the hook measures, over the commits that landed.
          # Safe ONLY because this checkout is ephemeral and nothing is pushed from it.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            case "${{ github.ref }}" in
              refs/heads/worktree-integrate-*)
                # foundation-4 item 8 (G3): an INTEGRATION-branch push is judged AS IF it were
                # pushed to main, so the base is where this branch left origin/main -- never
                # `event.before`, which is all-zero on branch creation (the old step then took
                # the "no resolvable range" exit below and sealed NOTHING) and the previous
                # integration tip on an update. An unresolvable base is an ERROR here, not a skip.
                BASE="$(uv run --locked python scripts/merge_path.py seal-base)" || {
                  echo "::error::no merge-base with origin/main -- an unknown base is not an empty one"
                  exit 1
                }
                ;;
              *)
                BASE="${{ github.event.before }}"
                ;;
            esac
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null \
             || ! git merge-base --is-ancestor "$BASE" "HEAD" 2>/dev/null; then
            # ANCESTRY, not mere existence: after a force-push the old tip can still be
            # reachable via another ref, and a diff between unrelated histories reports every
            # file as added -- which would seal the whole tree and fail on all 137
            # grandfathered Rule-B items. An unresolvable range is a SKIP, not a verdict.
            echo "::notice::no resolvable range (schedule, dispatch, or branch creation) -- seal skipped"
            exit 0
          fi
          git reset --soft "$BASE"
          echo "staged adds in $BASE..${{ github.sha }}:"
          git diff --cached --diff-filter=A --no-renames --name-only
          uv run --locked python scripts/validate_hermetization.py

  spine:
    # LANE-5B4-8 (row L5, D4): the server-side equivalent of the local pre-push PREVENT gate
    # (scripts/block_ff_push.py, core-invariant #5) -- so a `git push --no-verify` no longer
    # erases it without a trace. REUSES the existing organ verbatim (never a copy), fed the
    # exact stdin shape a real `git push` supplies: `<local_ref> <local_sha> <remote_ref>
    # <remote_sha>`. This job and the local hook read one script, so they can never disagree
    # about what a violation IS.
    #
    # NO `continue-on-error` -- unlike the report-only legs elsewhere in this file, a seeded
    # FF / direct commit onto main's first-parent spine must turn THIS JOB red (row L5's
    # Done-when, verbatim: "...seeded FF onto the spine...turn the job red"). block_ff_push.py
    # itself scopes to pushes whose remote_ref is its own PROTECTED_REF (refs/heads/main), so
    # a `worktree-**` / `epic/**` push supplies a non-matching ref pair and the organ returns 0
    # -- the same no-op the local hook gives on those pushes, not a widened check.
    #
    # ARMING is not this job's act: `lane-arm-ci` (row L6) adds the `spine` context to
    # deploy/conductor-required-checks.ruleset.json once L0-L5 have merged and the landing
    # probe has picked a path (ruling k). This job only has to exist, name the real organ, and
    # be provably red on the seeded cases -- tests/test_conductor_governance_jobs.py.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # the organ's own range resolver walks the pushed history
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.19"
      - name: Sync the locked environment
        run: uv sync --locked
      - name: block_ff_push.py over this push's range (core-invariant #5, server-side)
        id: run
        run: |
          set +e
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "::notice::not a push event (pull_request/schedule/dispatch) -- spine check skipped"
            echo "exit=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Direct redirect, never a pipe into this script: a `... | uv run ... | tee` chain
          # makes the naive `$?`/`PIPESTATUS[0]` read the WRONG command's exit code (echo's,
          # always 0) -- exactly the shape that silently defeats a gate. `rc=$?` right after a
          # two-stage pipe still reads bash's LAST command, which here is `uv run` itself.
          #
          # foundation-4 item 8 (G3): on an INTEGRATION-branch push the range is judged AS IF it
          # were pushed to main -- the stdin names refs/heads/main on both sides and carries
          # origin/main's sha as the remote sha (built by the tracked merge path, never by hand).
          # Fed as the lane's own ref the organ is a no-op, which let a fast-forward or a direct
          # commit on an integration branch go green. The line goes to a FILE and the organ reads
          # it with `<`, so a failing first stage cannot be masked by a pipe; if the line cannot
          # be built the job fails closed (exit=2) rather than judging an empty range.
          case "${{ github.ref }}" in
            refs/heads/worktree-integrate-*)
              uv run --locked python scripts/merge_path.py target-line --tip "${{ github.sha }}" --out push.stdin > spine.out 2>&1
              if [ "$?" != "0" ]; then
                cat spine.out
                echo "exit=2" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              ;;
            *)
              printf '%s\n' "${{ github.ref }} ${{ github.sha }} ${{ github.ref }} ${{ github.event.before }}" > push.stdin
              ;;
          esac
          uv run --locked python scripts/block_ff_push.py > spine.out 2>&1 < push.stdin
          rc=$?
          cat spine.out
          echo "exit=$rc" >> "$GITHUB_OUTPUT"
      - name: Write the record
        if: always()
        run: |
          {
            echo "## spine (core-invariant #5, server-side) — \`${{ github.sha }}\`"
            echo
            echo '```'
            cat spine.out 2>/dev/null || echo "no output (skipped -- see the step above)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spine-${{ github.sha }}
          path: spine.out
          retention-days: 90
          if-no-files-found: warn
      - name: Fail the job on block_ff_push.py's own verdict
        run: exit ${{ steps.run.outputs.exit }}

  anchor:
    # LANE-5B4-8 (row L5, D4): the server-side equivalent of the ADR-85 HARD leg
    # (scripts/block_unanchored_push.py) -- the second of this lane's two governance gates.
    # report-only-wall.yml already runs this same organ, advisory only, as a STEP inside its
    # `record` job; this is the identical organ and stdin shape, promoted to its own JOB with
    # a real (gating) exit -- the whole point of row L5: the same check now has a server-side
    # leg `--no-verify` cannot erase. NO `continue-on-error`, for the same reason as `spine`.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # the organ reads JOURNAL.md at the pushed tip and walks the
                             # first-parent spine of the range -- both need full history
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.19"
      - name: Sync the locked environment
        run: uv sync --locked
      - name: block_unanchored_push.py over this push's range (ADR-85 §A5, server-side)
        id: run
        run: |
          set +e
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "::notice::not a push event (pull_request/schedule/dispatch) -- anchor check skipped"
            echo "exit=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # NO shell-level "unresolvable range -> skip" guard here (terra CRITICAL,
          # codex review docs/audits/2026-09-27-codex-lane-server-governance.md): a
          # force-push whose prior tip this checkout cannot see would then report a clean
          # exit 0, defeating the one thing this job exists to be resistant to. The organ
          # itself already fails CLOSED on exactly this input -- journal_anchor._git
          # RAISES AnchorError on any git failure (deliberately not fail-soft, "an unknown
          # anchoring state must never render as anchored"), and block_unanchored_push's
          # outer handler turns that into exit 2 (refuse). An all-zero/empty remote sha
          # (legitimate branch creation) is ALSO handled by the organ itself -- its range
          # resolver reads that as "scan the full local history", not a skip. So every
          # case here is passed straight through, exactly as the `spine` job already does
          # for its own organ.
          #
          # foundation-4 item 8 (G3): same as `spine` -- an integration-branch push is judged AS
          # IF it were pushed to main, with origin/main's sha as the remote sha, built by the
          # tracked merge path into a file the organ reads with `<`. A failed build is exit=2.
          case "${{ github.ref }}" in
            refs/heads/worktree-integrate-*)
              uv run --locked python scripts/merge_path.py target-line --tip "${{ github.sha }}" --out push.stdin > anchor.out 2>&1
              if [ "$?" != "0" ]; then
                cat anchor.out
                echo "exit=2" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              ;;
            *)
              printf '%s\n' "${{ github.ref }} ${{ github.sha }} ${{ github.ref }} ${{ github.event.before }}" > push.stdin
              ;;
          esac
          uv run --locked python scripts/block_unanchored_push.py > anchor.out 2>&1 < push.stdin
          rc=$?
          cat anchor.out
          echo "exit=$rc" >> "$GITHUB_OUTPUT"
      - name: Write the record
        if: always()
        run: |
          {
            echo "## anchor (ADR-85 §A5, server-side) — \`${{ github.sha }}\`"
            echo
            echo '```'
            cat anchor.out 2>/dev/null || echo "no output (skipped -- see the step above)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anchor-${{ github.sha }}
          path: anchor.out
          retention-days: 90
          if-no-files-found: warn
      - name: Fail the job on block_unanchored_push.py's own verdict
        run: exit ${{ steps.run.outputs.exit }}

  commit-gate:
    # THE LOCAL COMMIT GATE, MOVED HERE 2026-09-17 (operator ruling, batch AB close). Every hook
    # in .pre-commit-config.yaml at `stages: [manual]` runs here over the pushed range; the
    # config header carries the before-numbers and what stayed local. REPORT-ONLY, like the rest
    # of this workflow while enforcement is disabled -- and deliberately NOT a required-check
    # context, so tests/test_conductor.py's four-context agreement is untouched.
    #
    # SAME STAGED SET AS THE LOCAL HOOK SAW, by the `seal` job's own device: `git reset --soft`
    # to the range base makes `git diff --cached` the range's diff, and a bare `pre-commit run`
    # (no --all-files) runs on exactly that staged set. Safe only because this checkout is
    # ephemeral and nothing is pushed from it.
    #
    # SKIPPED, and stated: block-commit-on-main (a CI checkout is detached; block-ff-push keeps
    # the push-time half locally) and the two commit-msg hooks (a commit message is not a
    # staged file; per-commit replay is not built).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # audit.py health's journal_spine_anchor leg raised 'Not a valid object' on a checkout with no `main` ref.
      - name: Local `main` ref (audit-health needs one)
        run: git rev-parse --verify --quiet refs/heads/main >/dev/null 2>&1 || git branch main origin/main
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.19"
      - name: Sync the locked environment
        run: uv sync --locked
      - name: Run the moved commit-gate hooks over this range's staged set
        env:
          SKIP: block-commit-on-main,backlog-id-on-close,backlog-filing-backpressure
        run: |
          set +e
          # LANE-5B-7, widened by LANE-5B3-8's `worktree-*` trigger: a lane branch now runs
          # this job on its own push too, not only via a manual `workflow_dispatch`.
          # `github.event.before` does not exist on that event (empty on a branch's first
          # push; on any later one it is the branch's OWN prior tip, never main's), so
          # resolving BASE from it here judged nothing on a lane branch -- a vacuous pass on
          # exactly the run this gate exists to make real. A non-main ref is therefore judged
          # against its merge-base with `origin/main`: the diff a merge into `main` would
          # actually introduce, never the branch's own history. `main`'s own run stays on
          # `event.before` / the PR base sha -- that run is the integrator's evidence, not
          # this lane's, and is unchanged.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            BASE="${{ github.event.before }}"
          else
            git fetch origin main --quiet 2>/dev/null
            BASE=$(git merge-base HEAD origin/main 2>/dev/null)
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git merge-base --is-ancestor "$BASE" "HEAD" 2>/dev/null; then
            echo "::notice::no resolvable range (schedule, dispatch, or branch creation) -- commit gate skipped"
            exit 0
          fi
          git reset --soft "$BASE"
          start=$(date +%s)
          uv run --locked pre-commit run --hook-stage manual > commit-gate.out 2>&1
          rc=$?
          echo "wall_seconds=$(( $(date +%s) - start )) exit=$rc" >> commit-gate.out
          cat commit-gate.out
          {
            echo "## commit gate (moved hooks) — \`${{ github.sha }}\` exit \`$rc\`"
            echo
            echo '```'
            tail -n 80 commit-gate.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      - name: known-reds verdict on audit-health (LANE-5B2-17, [#802] evidence run 36099478580)
        # RAISES THE SIGNAL, NEVER LOWERS IT. The step above already ran every manual hook and
        # is `continue-on-error: true` at the JOB level (so a hook failure here never reds the
        # overall workflow run) -- this step adds nothing to that exit-code decision. What it
        # adds is the one thing a raw pre-commit summary cannot say: whether `audit-health`'s own
        # failure is a REGISTERED known-red (logs/KNOWN-REDS-REGISTRY.json's `hooks` section,
        # cause: a stock ephemeral runner has no armed git hooks, no registered repos, and none
        # of the operator's own PowerShell dispatch aliases -- see the registry entry for the
        # full account) or a genuine new one -- exactly the distinction the Value line names
        # ("a new red raises no alarm ... a REGISTERED entry carries its cause").
        if: always()
        run: |
          set +e
          uv run --locked pre-commit run audit-health --hook-stage manual > audit-health.out 2>&1
          audit_rc=$?
          uv run --locked python scripts/known_reds.py compare-hook \
            --hook-id audit-health --exit-code "$audit_rc" --hook-output audit-health.out \
            --out known-reds-hook.out
          verdict_rc=$?
          cat known-reds-hook.out
          {
            echo "## known-reds compare-hook — \`${{ github.sha }}\`"
            echo
            echo '```'
            cat known-reds-hook.out 2>/dev/null || echo "no known-reds-hook output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $verdict_rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: commit-gate-${{ github.sha }}
          path: |
            commit-gate.out
            audit-health.out
            known-reds-hook.out
          retention-days: 90
          if-no-files-found: warn

  terra:
    # REPORT-ONLY, AND THE ONE OF THE FOUR THAT IS NOT ARMABLE. §4 says "Codex review becomes
    # a job, never a paste", and this is that job -- except that it needs a provider
    # credential and this repo has NO Actions secrets at all (`gh api
    # .../actions/secrets` returns an empty list, 2026-09-11). A required check that can never
    # pass bricks the branch, so `terra` is deliberately ABSENT from the ruleset's context
    # list and this job reports the gap instead of faking a verdict. Arming it is two acts the
    # operator owns: add the credential, then add the context to the ruleset.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Report the terra-review gap
        run: |
          if [ -z "${{ secrets.CODEX_API_KEY }}" ] && [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "terra review NOT RUN -- no provider credential in this repo's Actions secrets."
            echo "This job is report-only and is NOT in the required-check set for that reason."
            {
              echo "## terra review — NOT RUN"
              echo
              echo "No provider credential is available to this workflow, so the §4 leg"
              echo '"Codex review becomes a job, never a paste" is DECLARED and UNARMED.'
              echo "Arming it is two operator acts: add the credential, then add the \`terra\`"
              echo "context to \`deploy/conductor-required-checks.ruleset.json\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::warning::a provider credential is present but no terra runner is wired here yet -- see [#689]'s end packet"

  # --- the phase gate + the §6 numbers --------------------------------------------------
  # NOT required checks, and not because they are less important: the phase clause is OPTIONAL
  # (311 rows, 1 phased today), so a required phase gate would gate on a field nobody has
  # adopted. It becomes a candidate for the required set when the `unphased` count it prints
  # has actually fallen -- which is the adoption measure, computed rather than asserted.
  phase-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.19"
      - name: Sync the locked environment
        run: uv sync --locked
      - name: Evaluate the phase gate over tasks/
        id: gate
        continue-on-error: true   # report before it blocks; promotion is the operator's act
        run: |
          set +e
          uv run --locked python scripts/conductor.py phase-gate 2>&1 | tee phase-gate.out
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: §6's evaluation numbers
        continue-on-error: true
        run: |
          set +e
          # --gh is passed: §6 number 1 names the Actions logs as its source, and the billing
          # leg is the fifth number AMEND-CONDUCTOR-DECISION-001 §3 added. GITHUB_TOKEN cannot
          # read user billing, so number 5 reports NOT COMPUTED with that reason rather than 0.
          # --transport is NOT passed: the operator transport is a Drive mount on his
          # workstation and is not reachable from a runner, so number 3 reports NOT COMPUTED
          # naming the flag -- which is the honest answer, not a zero.
          uv run --locked python scripts/conductor.py metrics --gh 2>&1 | tee metrics.out
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Write the record
        if: always()
        run: |
          {
            echo "## conductor — \`${{ github.sha }}\`"
            echo
            echo "phase gate exit: \`${{ steps.gate.outputs.exit }}\` (report-only until the"
            echo "\`unphased\` count falls — see the job's comment)"
            echo
            echo '```'
            cat phase-gate.out 2>/dev/null || echo "no gate output"
            echo '```'
            echo
            echo '```'
            cat metrics.out 2>/dev/null || echo "no metrics output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conductor-${{ github.sha }}
          path: |
            phase-gate.out
            metrics.out
          retention-days: 90
          if-no-files-found: warn

  handoff-manifest:
    # LANE-5B5-2 (B1): seat-release's CI leg (PROPOSAL-ADR-HANDOFF-SYSTEM-2026-09-26.md Part 2
    # rule 1: "CI verifies it on any docs/handoffs/** push"). Re-hashes every COMMITTED bundle's
    # files under docs/handoffs/** against its own HANDOFF_RECEIPT.json manifest, reusing (never
    # copying) verify_handoff_probes._rule_bd_manifest -- the same check moment:seat-release's
    # own `manifest` organ runs locally. A bundle cut before lane-handoff-min (Part A) carries no
    # manifest at all -- 126 of the 127 committed bundles at this lane's own landing -- and is
    # EXEMPT, not failed, the same era-boundary posture the retired handoff-verify.md's pre-v6 exemption
    # already uses: only a bundle that HAS a manifest and no longer matches it reds this job.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # the range check below needs the prior tip
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.19"
      - name: Sync the locked environment
        run: uv sync --locked
      - name: Did this push touch docs/handoffs/**? (an unresolvable range never skips)
        id: touch
        run: |
          set +e
          if [ "${{ github.event_name }}" != "push" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "changed=1" >> "$GITHUB_OUTPUT"   # schedule/dispatch: check every committed bundle
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "changed=1" >> "$GITHUB_OUTPUT"   # unresolvable range -- check every bundle, never skip
            exit 0
          fi
          if git diff --name-only "$BASE" "${{ github.sha }}" -- docs/handoffs/ | grep -q .; then
            echo "changed=1" >> "$GITHUB_OUTPUT"
          else
            echo "changed=0" >> "$GITHUB_OUTPUT"
          fi
      - name: BD-manifest over every committed, manifest-era bundle
        if: steps.touch.outputs.changed == '1'
        run: |
          set +e
          uv run --locked python -c "
          import json
          import re
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          import verify_handoff_probes as vhp
          root = Path('docs/handoffs')
          # The manifest feature shipped 2026-09-28 (docs/handoffs/2026-09-28-dev-knowledge-architect
          # is the one committed bundle that predates this job and already carries a manifest).
          # In-era is (the bundle's OWN directory-name date >= CUTOFF) OR (it carries a receipt
          # with a non-empty manifest.files) -- never receipt-presence alone (Codex terra
          # CRITICAL, 2026-09-29, docs/audits/2026-09-29-codex-seat-release-b1.md: that let a
          # post-cutoff bundle dodge the whole check by deleting/emptying its own manifest), and
          # never the name alone either (Codex terra CRITICAL, 2026-09-29,
          # docs/audits/2026-09-29-codex-seat-release-b1-followup.md: a bundle renamed to a
          # fake pre-cutoff-looking date would otherwise dodge the check while still carrying a
          # real, checkable receipt). A name with no parseable date is treated as in-era too:
          # fail-closed, not a third way to dodge the cutoff.
          CUTOFF = '2026-09-28'
          date_re = re.compile(r'^(\d{4}-\d{2}-\d{2})-')
          # A directory is a candidate BUNDLE iff it is date-prefixed OR carries a receipt
          # directly -- anything else (docs/handoffs/archive/, its nested archive/legacy/, any
          # future container) is not a bundle of any era and is RECURSED INTO, never a leaf
          # exemption and never a leaf failure (Codex terra CRITICAL, 2026-09-29,
          # docs/audits/2026-09-29-codex-seat-release-b1-followup.md: hardcoding container names
          # does not scale -- archive/legacy/ is a second, real, undated, receipt-less container
          # one level deeper than archive/ itself). A rename-only evasion (strip the date prefix,
          # keep the receipt) is still caught at any depth, since carrying a receipt alone makes
          # a directory a bundle.
          NOT_A_BUNDLE = {'.git', '.claude', 'node_modules', 'aborted', 'in-progress'}

          def iter_bundles(d):
              for p in sorted(x for x in d.iterdir() if x.is_dir()):
                  if p.name in NOT_A_BUNDLE:
                      continue
                  if date_re.match(p.name) or (p / vhp.RECEIPT_FILE).is_file():
                      yield p
                  else:
                      yield from iter_bundles(p)

          bad = []
          checked = 0
          for bundle in iter_bundles(root):
              m = date_re.match(bundle.name)
              looks_pre_cutoff = bool(m and m.group(1) < CUTOFF)
              receipt = bundle / vhp.RECEIPT_FILE
              has_receipt = receipt.is_file()
              if looks_pre_cutoff and not has_receipt:
                  continue  # pre-manifest-era bundle, by its own date -- exempt, not failed
              checked += 1
              if not has_receipt:
                  bad.append(bundle.name)
                  print(f'  fail  {bundle.name}  in-era bundle carries no {vhp.RECEIPT_FILE}')
                  continue
              try:
                  manifest = json.loads(receipt.read_text(encoding='utf-8')).get('manifest') or {}
                  files = manifest.get('files')
              except (OSError, ValueError) as exc:
                  bad.append(bundle.name)
                  print(f'  fail  {bundle.name}  {vhp.RECEIPT_FILE} unreadable: {exc}')
                  continue
              if not files:
                  bad.append(bundle.name)
                  print(f'  fail  {bundle.name}  bundle carries a receipt with an empty/absent manifest.files')
                  continue
              result = vhp._rule_bd_manifest(bundle)
              print(f'{result.status:>6}  {bundle.name}  {result.detail}')
              if result.status == 'fail':
                  bad.append(bundle.name)
          print(f'checked {checked} manifest-era bundle(s)')
          if bad:
              print(f'::error::{len(bad)} bundle(s) fail BD-manifest: ' + ', '.join(bad))
              sys.exit(1)
          " 2>&1 | tee handoff-manifest.out
          exit ${PIPESTATUS[0]}
      - name: Write the record
        if: always()
        run: |
          {
            echo "## handoff-manifest (B1 seat-release CI leg) — \`${{ github.sha }}\`"
            echo
            echo '```'
            cat handoff-manifest.out 2>/dev/null || echo "skipped -- no docs/handoffs/** change in this push"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: handoff-manifest-${{ github.sha }}
          path: handoff-manifest.out
          retention-days: 90
          if-no-files-found: warn

  # --- the one verdict --------------------------------------------------------------------
  # `gate` needs commit-gate, so it reads red on main until commit-gate is green (intended); it is not a required check today (no branch protection on main; the ruleset is `enforcement: disabled` and omits it).
  gate:
    # [#1560] (R155 OQ1): ONE always-run job that judges the whole run. `if: always()` because a
    # job skipped by `if:` reports Success to a required check (GitHub docs, troubleshooting
    # required status checks) and a workflow-level `paths:` filter would leave it Pending
    # forever -- so there is no path filter on any trigger and this job cannot be skipped by a
    # failed need. `needs` lists EVERY other job (tests/test_conductor_tier1_gate.py pins that,
    # so a job added later cannot be forgotten). alls-green is red on a failed, cancelled or
    # skipped need except the names in `allowed-skips`: on a lane push `pytest` (the full legs
    # are the integration run's), off a lane push `tier1`; `windows-nightly-triage` runs only
    # on `schedule` and is legitimately skipped on every push. Not in the ruleset's required
    # contexts: arming it is a separate, operator-owned act. (`startsWith(..., 'PUSH')` is the
    # case-insensitive spelling of `== 'push'`, so the quoted-list reader in the tests sees
    # only the two skip lists.)
    if: ${{ always() }}
    needs: [plan, pytest, windows-gate, windows-nightly-triage, ruff, tier1, seal, spine, anchor, commit-gate, terra, phase-gate, handoff-manifest]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Judge every job of this run
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: ${{ (startsWith(github.event_name, 'PUSH') && startsWith(github.ref, 'refs/heads/worktree-') && !startsWith(github.ref, 'refs/heads/worktree-integrate-')) && 'pytest, windows-nightly-triage' || 'tier1, windows-nightly-triage' }}
