# .github/workflows/conductor.yml
#
# CONDUCTOR E's RUNNER ([#689]). Decided by the §3 matrix of
# to-cc/DECLARE-CONDUCTOR-DECISION-2026-09-09.md (E weighted 58, against A 52, B 55, C 38,
# D 46) and built to §8's three steps. §4, verbatim on what this file is:
#
#   "Runner = GitHub Actions. .github/workflows/conductor.yml, on: push · pull_request ·
#    schedule · workflow_dispatch. It reads tasks/, evaluates the phase gate, performs the
#    phase action. Scheduling, durability, retries, logs, UI are GitHub's. The only custom
#    content is the phase table -- which is custom in every option because it is the process."
#
# THE PHASE TABLE IS NOT IN THIS FILE, deliberately. It is scripts/conductor.py, which
# tests/test_conductor.py exercises locally. A gate written in workflow shell is a gate no
# local test can run, and this repo's whole enforcement argument is that a gate nobody can
# exercise is decoration.
#
# "PERFORMS THE PHASE ACTION" IS NOT BUILT HERE, and that is a boundary, not an omission. The
# four delivery-loop transitions belong to [#669]; [#689] owns the field, the runner and the
# gate surface. Both rows' kill-candidates lines say so. This workflow EVALUATES and REPORTS;
# it moves no row.
#
# HOW THIS DIFFERS FROM report-only-wall.yml, so neither absorbs the other. The wall RECORDS
# what landed on main and blocks nothing, permanently and by design. This workflow produces the
# four CHECK CONTEXTS that deploy/conductor-required-checks.ruleset.json arms as required
# checks -- it exists to be a gate. Two organs, two roles, one directory.
#
# ------------------------------------------------------------------------------------------
# THREE PREMISES OF THE DECISION DOC THAT ARE NO LONGER TRUE, recorded here because the next
# reader of this file will otherwise re-derive them:
#
#  1. "the repo is private on the Free tier" (report-only-wall.yml, and
#     ecosystem/fleet-shape-spec.yaml's .github sanction comment). LIVE at 2026-09-11:
#     `gh api repos/rdwornik/dev-knowledge` returns private: false, visibility: public, and
#     `gh api user` returns plan: pro. The rulesets API returns [] at HTTP 200, not the 403
#     AMEND-CONDUCTOR-DECISION-001 §1 measured. Operator decision D2 ratified Pro for exactly
#     this purpose (to-browser/RATIFICATION-2026-09-10-architect.md).
#
#  2. `pull_request` IS VACUOUS TODAY, and is present because §4 names it. The wall's header
#     records why: "the repo merges locally with --no-ff and pushes, so a PR-triggered organ
#     would never fire -- the [#255] vacuity that retired the last .github/ organ." No PR is
#     opened by this repo's landing protocol. The trigger becomes live the day landing moves
#     to PRs, which is the same day required checks can actually gate anything (see 3).
#
#  3. ARMING REQUIRED CHECKS ON `main` AND THIS REPO'S LANDING PROTOCOL ARE MUTUALLY
#     EXCLUSIVE, and this is the decision the gate leg of E still owes. A ruleset's
#     required_status_checks rule refuses a direct push whose head commit has no passing
#     checks; a --no-ff merge commit created locally does not exist server-side before the
#     push, so its checks cannot have run. CLAUDE.md §4 and the block-ff-push / block-ff-push
#     pre-push hooks mandate exactly that local merge. So either landing moves to PRs (which
#     §4's `pull_request` trigger and its claude-code-action executor both presuppose) or the
#     gate leg stays report-only. E's RUNNER leg does not depend on the choice; E's GATE leg
#     IS the choice. The ruleset is therefore DECLARED as a file and NOT armed by this lane.
# ------------------------------------------------------------------------------------------

name: conductor

on:
  push:
    # LANE-5B3-8, O3 FIRST STEP: `worktree-*` added so a pushed lane branch gets its own
    # automatic run, not only `workflow_dispatch` by hand -- CI stops being main-only signal.
    # The existing jobs already carry non-main-ref logic (commit-gate's LANE-5B-7 comment,
    # seal's ancestry check) built anticipating exactly this trigger widening.
    # LANE-5B4-3 (L1, D1): widened from `worktree-*` to `worktree-**` (matches nested
    # worktree-slug refs too, and doubles as the integrator's own `worktree-integrate-...`
    # branches -- same prefix, same glob, no second pattern needed) plus `epic/**`, per the
    # proposal's trigger list ("push to main, worktree-**, epic/** and the integrator's
    # integration branches").
    branches: [main, "worktree-**", "epic/**"]
  pull_request:
    branches: [main]
  schedule:
    # 05:00 UTC daily. A schedule leg is what makes the runner a runner rather than a
    # push-reactor: §6 number 1 counts transitions Actions performed WITHOUT an operator act,
    # and a workflow that only fires when a human pushes can never move that number.
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read          # least privilege. This workflow reports; it writes no repo state.

concurrency:
  group: conductor-${{ github.ref }}
  cancel-in-progress: true    # unlike the wall, a superseded GATE result is worthless

jobs:
  # --- the four required-check contexts -------------------------------------------------
  # Job NAMES are the check CONTEXTS the ruleset names. Renaming a job silently disarms its
  # required check, so deploy/conductor-required-checks.ruleset.json and these four ids are
  # one fact in two files; tests/test_conductor.py asserts they agree.

  pytest:
    # LANE-5B4-3 (L1, D1): the OS matrix. `fail-fast: false` so a red on one leg never cancels
    # the other before ITS duration is known -- the whole point of this lane is measuring both.
    # Job id stays `pytest`; GitHub names the two check CONTEXTS `pytest (ubuntu-latest)` and
    # `pytest (windows-latest)` from the matrix automatically (RATIFICATION D3) -- renaming the
    # job id, not the matrix values, is what would disarm those contexts.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45      # the wall measures ~5m30s-6m with -n auto, 13m19s serial (Linux;
                             # the Windows leg's own duration is what this lane exists to measure)
    defaults:
      run:
        # D1: "shell: bash on both". Every `run:` step below is POSIX (set +e, PIPESTATUS,
        # $GITHUB_OUTPUT/$GITHUB_STEP_SUMMARY redirects) -- windows-latest's own default shell
        # is pwsh, which does not parse any of that. `shell: bash` resolves to the Git-for-
        # Windows bash the runner image already ships (T6: `shell: bash` is supported on
        # windows-latest), not a new dependency.
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # LOAD-BEARING, and the wall paid for this line: a shallow clone
                             # makes the graft root look like it created whole files, so
                             # canonical_freshness returns false FAILs and
                             # journal_spine_anchor raises a FAIL-class AnchorError.
      - name: Local `main` ref (D1 -- fixes the "main does not resolve" clone artefact, K2/T1)
        # `fetch-depth: 0` above fetches full history, but on a non-`main` ref it creates no
        # LOCAL `refs/heads/main` -- only the remote-tracking `origin/main`. Every spine-walking
        # instrument (`provision_legs.ref_resolves` et al.) looks up `refs/heads/main`
        # specifically (never the bare name, never the remote ref -- a bare `git rev-parse main`
        # would also match a tag), so those tests read a real, resolvable clone as broken. This
        # is the exact clone artefact the proposal names as 4 reds on a `workflow_dispatch`
        # checkout of a non-main ref; seeding the branch here removes it at the source.
        run: |
          git rev-parse --verify --quiet refs/heads/main >/dev/null 2>&1 || git branch main origin/main
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.19" # MUST equal pyproject.toml [tool.uv] required-version EXACTLY.
                             # Every command below runs `uv run --locked`; a mismatched uv
                             # fails each one on a version error before any real check runs.
      - name: Assert the toolchain pin is satisfied
        run: |
          uv --version
          grep -q 'required-version = "==0.11.19"' pyproject.toml \
            || { echo "::error::pyproject uv pin moved -- update this workflow in the same commit"; exit 1; }
      - name: Sync the locked environment
        run: uv sync --locked --group analytics   # without it, pandas is absent and the
                                                 # fleet_analytics tests fail on the import
      - name: pytest, pinned at -n 4 (logs/SUITE-BASELINE-FREEZE.md's comparison command)
        id: run
        continue-on-error: true   # judged by the known-reds compare below, not this raw exit
                                   # code -- main carries pre-existing failures today
        run: |
          set +e
          uv run --locked pytest -q --tb=short -n 4 2>&1 | tee pytest.out
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Judge the run against the frozen baseline, by node id ([#802])
        id: gate
        # REPORT-ONLY (LANE-5B3-8 repair 1): retired as this job's verdict -- the frozen
        # 87-member set has no path to admit the four permanent [#664] witnesses (deliberately
        # kept OUT of logs/SUITE-BASELINE-FREEZE.md so every run keeps reporting them), so a
        # gate keyed on that set alone can never go green while they exist. Kept running, and
        # kept under this exact step name, purely for the record: scripts/ci_verdict.py
        # (SUITE_GATE_STEP_NAME) parses this step's own name and log window, so renaming it
        # breaks that reader.
        run: |
          set +e
          uv run --locked python scripts/conductor.py suite-gate \
            --pytest-output pytest.out --workers 4 --pytest-exit "${{ steps.run.outputs.exit }}" \
            --out suite-gate.out
          rc=$?
          cat suite-gate.out
          echo "exit=$rc" >> "$GITHUB_OUTPUT"
      - name: Compare against the committed known-reds registry (LANE-5A-1, ADR-121 step 1)
        id: known_reds
        # THE JOB'S VERDICT (LANE-5B3-8 repair 1, retiring the [#802] frozen-baseline gate above
        # from that role): every failure this run reports outside the 87-member freeze is
        # already REGISTERED here -- 17 real known-reds plus the 4 permanent [#664] witnesses
        # (attribution `witness`), which `known_reds.compare` reports separately from a genuine
        # regression rather than folding them into either bucket. A report-only step is a
        # different step, not a softened verdict, so this one carries no `continue-on-error`.
        run: |
          set +e
          uv run --locked python scripts/known_reds.py compare \
            --pytest-output pytest.out --workers 4 --pytest-exit "${{ steps.run.outputs.exit }}" \
            --registry logs/KNOWN-REDS-REGISTRY.json --out known-reds-compare.out
          rc=$?
          cat known-reds-compare.out
          echo "exit=$rc" >> "$GITHUB_OUTPUT"
      - name: Write the record
        if: always()
        run: |
          {
            echo "## suite-baseline gate — \`${{ github.sha }}\`"
            echo
            echo '```'
            cat suite-gate.out 2>/dev/null || echo "no gate output"
            echo '```'
            echo
            echo "## known-reds compare (LANE-5A-1) — \`${{ github.sha }}\`"
            echo
            echo '```'
            cat known-reds-compare.out 2>/dev/null || echo "no known-reds output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          # matrix-scoped: v4 refuses two uploads with the same name in one run, and the
          # matrix now runs this job once per OS in every run.
          name: pytest-${{ matrix.os }}-${{ github.sha }}
          path: |
            pytest.out
            suite-gate.out
            known-reds-compare.out
          retention-days: 90
          if-no-files-found: warn
      - name: Fail the job on the known-reds compare's verdict, not the frozen-baseline gate's (LANE-5B3-8 repair 1)
        run: exit ${{ steps.known_reds.outputs.exit }}

  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.19"
      - name: Sync the locked environment
        run: uv sync --locked
      - name: ruff
        # `check`, never `check --fix`: a gate that edits the tree is not a gate.
        run: uv run --locked ruff check

  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # the range below must be resolvable
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.19"
      - name: Sync the locked environment
        run: uv sync --locked
      - name: ADR-101 tree seal over this range's ADDs
        run: |
          set -e
          # THE SEAL IS PROSPECTIVE, and running it with no staged adds is the vacuous pass
          # CLAUDE.md's anti-patterns name explicitly ("Running validators with no args").
          # validate_hermetization reads `git diff --cached --diff-filter=A`, which in a CI
          # checkout is EMPTY because the index already equals HEAD. `git reset --soft` to the
          # range's base restores exactly the staged-add set the local pre-commit hook would
          # have seen -- so CI measures what the hook measures, over the commits that landed.
          # Safe ONLY because this checkout is ephemeral and nothing is pushed from it.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null \
             || ! git merge-base --is-ancestor "$BASE" "HEAD" 2>/dev/null; then
            # ANCESTRY, not mere existence: after a force-push the old tip can still be
            # reachable via another ref, and a diff between unrelated histories reports every
            # file as added -- which would seal the whole tree and fail on all 137
            # grandfathered Rule-B items. An unresolvable range is a SKIP, not a verdict.
            echo "::notice::no resolvable range (schedule, dispatch, or branch creation) -- seal skipped"
            exit 0
          fi
          git reset --soft "$BASE"
          echo "staged adds in $BASE..${{ github.sha }}:"
          git diff --cached --diff-filter=A --no-renames --name-only
          uv run --locked python scripts/validate_hermetization.py

  spine:
    # LANE-5B4-8 (row L5, D4): the server-side equivalent of the local pre-push PREVENT gate
    # (scripts/block_ff_push.py, core-invariant #5) -- so a `git push --no-verify` no longer
    # erases it without a trace. REUSES the existing organ verbatim (never a copy), fed the
    # exact stdin shape a real `git push` supplies: `<local_ref> <local_sha> <remote_ref>
    # <remote_sha>`. This job and the local hook read one script, so they can never disagree
    # about what a violation IS.
    #
    # NO `continue-on-error` -- unlike the report-only legs elsewhere in this file, a seeded
    # FF / direct commit onto main's first-parent spine must turn THIS JOB red (row L5's
    # Done-when, verbatim: "...seeded FF onto the spine...turn the job red"). block_ff_push.py
    # itself scopes to pushes whose remote_ref is its own PROTECTED_REF (refs/heads/main), so
    # a `worktree-**` / `epic/**` push supplies a non-matching ref pair and the organ returns 0
    # -- the same no-op the local hook gives on those pushes, not a widened check.
    #
    # ARMING is not this job's act: `lane-arm-ci` (row L6) adds the `spine` context to
    # deploy/conductor-required-checks.ruleset.json once L0-L5 have merged and the landing
    # probe has picked a path (ruling k). This job only has to exist, name the real organ, and
    # be provably red on the seeded cases -- tests/test_conductor_governance_jobs.py.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # the organ's own range resolver walks the pushed history
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.19"
      - name: Sync the locked environment
        run: uv sync --locked
      - name: block_ff_push.py over this push's range (core-invariant #5, server-side)
        id: run
        run: |
          set +e
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "::notice::not a push event (pull_request/schedule/dispatch) -- spine check skipped"
            echo "exit=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Direct redirect, never a pipe into this script: a `... | uv run ... | tee` chain
          # makes the naive `$?`/`PIPESTATUS[0]` read the WRONG command's exit code (echo's,
          # always 0) -- exactly the shape that silently defeats a gate. `rc=$?` right after a
          # two-stage pipe still reads bash's LAST command, which here is `uv run` itself.
          printf '%s\n' "${{ github.ref }} ${{ github.sha }} ${{ github.ref }} ${{ github.event.before }}" \
            | uv run --locked python scripts/block_ff_push.py > spine.out 2>&1
          rc=$?
          cat spine.out
          echo "exit=$rc" >> "$GITHUB_OUTPUT"
      - name: Write the record
        if: always()
        run: |
          {
            echo "## spine (core-invariant #5, server-side) — \`${{ github.sha }}\`"
            echo
            echo '```'
            cat spine.out 2>/dev/null || echo "no output (skipped -- see the step above)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spine-${{ github.sha }}
          path: spine.out
          retention-days: 90
          if-no-files-found: warn
      - name: Fail the job on block_ff_push.py's own verdict
        run: exit ${{ steps.run.outputs.exit }}

  anchor:
    # LANE-5B4-8 (row L5, D4): the server-side equivalent of the ADR-85 HARD leg
    # (scripts/block_unanchored_push.py) -- the second of this lane's two governance gates.
    # report-only-wall.yml already runs this same organ, advisory only, as a STEP inside its
    # `record` job; this is the identical organ and stdin shape, promoted to its own JOB with
    # a real (gating) exit -- the whole point of row L5: the same check now has a server-side
    # leg `--no-verify` cannot erase. NO `continue-on-error`, for the same reason as `spine`.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # the organ reads JOURNAL.md at the pushed tip and walks the
                             # first-parent spine of the range -- both need full history
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.19"
      - name: Sync the locked environment
        run: uv sync --locked
      - name: block_unanchored_push.py over this push's range (ADR-85 §A5, server-side)
        id: run
        run: |
          set +e
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "::notice::not a push event (pull_request/schedule/dispatch) -- anchor check skipped"
            echo "exit=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${{ github.event.before }}" ] \
             || [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            # Unresolvable range (branch creation, or a force-push whose old tip this checkout
            # cannot see) is a SKIP, not a verdict -- report-only-wall.yml's own anchor step
            # takes the identical guard for the identical reason.
            echo "no resolvable push range -- anchor check skipped" | tee anchor.out
            echo "exit=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "${{ github.ref }} ${{ github.sha }} ${{ github.ref }} ${{ github.event.before }}" \
            | uv run --locked python scripts/block_unanchored_push.py > anchor.out 2>&1
          rc=$?
          cat anchor.out
          echo "exit=$rc" >> "$GITHUB_OUTPUT"
      - name: Write the record
        if: always()
        run: |
          {
            echo "## anchor (ADR-85 §A5, server-side) — \`${{ github.sha }}\`"
            echo
            echo '```'
            cat anchor.out 2>/dev/null || echo "no output (skipped -- see the step above)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anchor-${{ github.sha }}
          path: anchor.out
          retention-days: 90
          if-no-files-found: warn
      - name: Fail the job on block_unanchored_push.py's own verdict
        run: exit ${{ steps.run.outputs.exit }}

  commit-gate:
    # THE LOCAL COMMIT GATE, MOVED HERE 2026-09-17 (operator ruling, batch AB close). Every hook
    # in .pre-commit-config.yaml at `stages: [manual]` runs here over the pushed range; the
    # config header carries the before-numbers and what stayed local. REPORT-ONLY, like the rest
    # of this workflow while enforcement is disabled -- and deliberately NOT a required-check
    # context, so tests/test_conductor.py's four-context agreement is untouched.
    #
    # SAME STAGED SET AS THE LOCAL HOOK SAW, by the `seal` job's own device: `git reset --soft`
    # to the range base makes `git diff --cached` the range's diff, and a bare `pre-commit run`
    # (no --all-files) runs on exactly that staged set. Safe only because this checkout is
    # ephemeral and nothing is pushed from it.
    #
    # SKIPPED, and stated: block-commit-on-main (a CI checkout is detached; block-ff-push keeps
    # the push-time half locally) and the two commit-msg hooks (a commit message is not a
    # staged file; per-commit replay is not built).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.19"
      - name: Sync the locked environment
        run: uv sync --locked
      - name: Run the moved commit-gate hooks over this range's staged set
        env:
          SKIP: block-commit-on-main,backlog-id-on-close,backlog-filing-backpressure
        run: |
          set +e
          # LANE-5B-7, widened by LANE-5B3-8's `worktree-*` trigger: a lane branch now runs
          # this job on its own push too, not only via a manual `workflow_dispatch`.
          # `github.event.before` does not exist on that event (empty on a branch's first
          # push; on any later one it is the branch's OWN prior tip, never main's), so
          # resolving BASE from it here judged nothing on a lane branch -- a vacuous pass on
          # exactly the run this gate exists to make real. A non-main ref is therefore judged
          # against its merge-base with `origin/main`: the diff a merge into `main` would
          # actually introduce, never the branch's own history. `main`'s own run stays on
          # `event.before` / the PR base sha -- that run is the integrator's evidence, not
          # this lane's, and is unchanged.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            BASE="${{ github.event.before }}"
          else
            git fetch origin main --quiet 2>/dev/null
            BASE=$(git merge-base HEAD origin/main 2>/dev/null)
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git merge-base --is-ancestor "$BASE" "HEAD" 2>/dev/null; then
            echo "::notice::no resolvable range (schedule, dispatch, or branch creation) -- commit gate skipped"
            exit 0
          fi
          git reset --soft "$BASE"
          start=$(date +%s)
          uv run --locked pre-commit run --hook-stage manual > commit-gate.out 2>&1
          rc=$?
          echo "wall_seconds=$(( $(date +%s) - start )) exit=$rc" >> commit-gate.out
          cat commit-gate.out
          {
            echo "## commit gate (moved hooks) — \`${{ github.sha }}\` exit \`$rc\`"
            echo
            echo '```'
            tail -n 80 commit-gate.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      - name: known-reds verdict on audit-health (LANE-5B2-17, [#802] evidence run 36099478580)
        # RAISES THE SIGNAL, NEVER LOWERS IT. The step above already ran every manual hook and
        # is `continue-on-error: true` at the JOB level (so a hook failure here never reds the
        # overall workflow run) -- this step adds nothing to that exit-code decision. What it
        # adds is the one thing a raw pre-commit summary cannot say: whether `audit-health`'s own
        # failure is a REGISTERED known-red (logs/KNOWN-REDS-REGISTRY.json's `hooks` section,
        # cause: a stock ephemeral runner has no armed git hooks, no registered repos, and none
        # of the operator's own PowerShell dispatch aliases -- see the registry entry for the
        # full account) or a genuine new one -- exactly the distinction the Value line names
        # ("a new red raises no alarm ... a REGISTERED entry carries its cause").
        if: always()
        run: |
          set +e
          uv run --locked pre-commit run audit-health --hook-stage manual > audit-health.out 2>&1
          audit_rc=$?
          uv run --locked python scripts/known_reds.py compare-hook \
            --hook-id audit-health --exit-code "$audit_rc" --hook-output audit-health.out \
            --out known-reds-hook.out
          verdict_rc=$?
          cat known-reds-hook.out
          {
            echo "## known-reds compare-hook — \`${{ github.sha }}\`"
            echo
            echo '```'
            cat known-reds-hook.out 2>/dev/null || echo "no known-reds-hook output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $verdict_rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: commit-gate-${{ github.sha }}
          path: |
            commit-gate.out
            audit-health.out
            known-reds-hook.out
          retention-days: 90
          if-no-files-found: warn

  ship-gate:
    # O3 FIRST STEP (LANE-5B3-8): the R9 ADVISORY leg of "audit.py ship-gate" as its own job,
    # so a lane branch gets one shown on every push -- never the lane's own self-check
    # obligation (R9 keeps that as `audit.py health` + targeted tests; the integrator still
    # runs the real ship-gate on the MERGED tree, which stays the verdict). ADVISORY ONLY:
    # `continue-on-error: true` at job level, so a ship-gate FAIL never reds this workflow run
    # or blocks anything -- no existing verdict step anywhere in this file gained
    # `continue-on-error`, and this job is not in `deploy/conductor-required-checks.ruleset.json`.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.19"
      - name: Sync the locked environment
        run: uv sync --locked --group analytics
      - name: audit.py ship-gate (advisory)
        run: |
          set +e
          start=$(date +%s)
          uv run --locked python scripts/audit.py ship-gate > ship-gate.out 2>&1
          rc=$?
          echo "wall_seconds=$(( $(date +%s) - start )) exit=$rc" >> ship-gate.out
          cat ship-gate.out
          {
            echo "## ship-gate (advisory) — \`${{ github.sha }}\` exit \`$rc\`"
            echo
            echo '```'
            tail -n 120 ship-gate.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ship-gate-${{ github.sha }}
          path: ship-gate.out
          retention-days: 90
          if-no-files-found: warn

  terra:
    # REPORT-ONLY, AND THE ONE OF THE FOUR THAT IS NOT ARMABLE. §4 says "Codex review becomes
    # a job, never a paste", and this is that job -- except that it needs a provider
    # credential and this repo has NO Actions secrets at all (`gh api
    # .../actions/secrets` returns an empty list, 2026-09-11). A required check that can never
    # pass bricks the branch, so `terra` is deliberately ABSENT from the ruleset's context
    # list and this job reports the gap instead of faking a verdict. Arming it is two acts the
    # operator owns: add the credential, then add the context to the ruleset.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Report the terra-review gap
        run: |
          if [ -z "${{ secrets.CODEX_API_KEY }}" ] && [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "terra review NOT RUN -- no provider credential in this repo's Actions secrets."
            echo "This job is report-only and is NOT in the required-check set for that reason."
            {
              echo "## terra review — NOT RUN"
              echo
              echo "No provider credential is available to this workflow, so the §4 leg"
              echo '"Codex review becomes a job, never a paste" is DECLARED and UNARMED.'
              echo "Arming it is two operator acts: add the credential, then add the \`terra\`"
              echo "context to \`deploy/conductor-required-checks.ruleset.json\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::warning::a provider credential is present but no terra runner is wired here yet -- see [#689]'s end packet"

  # --- the phase gate + the §6 numbers --------------------------------------------------
  # NOT required checks, and not because they are less important: the phase clause is OPTIONAL
  # (311 rows, 1 phased today), so a required phase gate would gate on a field nobody has
  # adopted. It becomes a candidate for the required set when the `unphased` count it prints
  # has actually fallen -- which is the adoption measure, computed rather than asserted.
  phase-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.19"
      - name: Sync the locked environment
        run: uv sync --locked
      - name: Evaluate the phase gate over tasks/
        id: gate
        continue-on-error: true   # report before it blocks; promotion is the operator's act
        run: |
          set +e
          uv run --locked python scripts/conductor.py phase-gate 2>&1 | tee phase-gate.out
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: §6's evaluation numbers
        continue-on-error: true
        run: |
          set +e
          # --gh is passed: §6 number 1 names the Actions logs as its source, and the billing
          # leg is the fifth number AMEND-CONDUCTOR-DECISION-001 §3 added. GITHUB_TOKEN cannot
          # read user billing, so number 5 reports NOT COMPUTED with that reason rather than 0.
          # --transport is NOT passed: the operator transport is a Drive mount on his
          # workstation and is not reachable from a runner, so number 3 reports NOT COMPUTED
          # naming the flag -- which is the honest answer, not a zero.
          uv run --locked python scripts/conductor.py metrics --gh 2>&1 | tee metrics.out
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Write the record
        if: always()
        run: |
          {
            echo "## conductor — \`${{ github.sha }}\`"
            echo
            echo "phase gate exit: \`${{ steps.gate.outputs.exit }}\` (report-only until the"
            echo "\`unphased\` count falls — see the job's comment)"
            echo
            echo '```'
            cat phase-gate.out 2>/dev/null || echo "no gate output"
            echo '```'
            echo
            echo '```'
            cat metrics.out 2>/dev/null || echo "no metrics output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conductor-${{ github.sha }}
          path: |
            phase-gate.out
            metrics.out
          retention-days: 90
          if-no-files-found: warn
