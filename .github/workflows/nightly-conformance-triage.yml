name: Nightly Conformance Triage

# Auto-manages the morning handling of nightly conformance PRs.
# A cloud Routine (user token) opens a PR on branch claude/conformance-YYYY-MM-DD
# adding exactly one digest file and never auto-merges. This Action:
#   - diff-guards the PR (exactly one ADDED digest file, nothing else),
#   - DIVERTS the digest onto the `automation/conformance-digest` branch
#     (commit-tree plumbing; ADR-84/Q9 — the digest is ISOLATED from `main`,
#     never merged in) and CLOSES the PR (does not merge),
#   - opens `nightly-triage` Issues when survivors > 0, on guard failure,
#     on an unparseable digest, or on a failed branch push.
#
# NOTE on the trigger: pull_request.branches filters the BASE (target) branch,
# which is `main`. Head-branch narrowing (claude/conformance-*) therefore happens
# at the JOB level via `if: startsWith(github.head_ref, ...)`.
#
# Same-repo PRs (these originate from a branch in this repo, not a fork) run with
# a read-write GITHUB_TOKEN even on a private repo.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

# Least privilege: only what gh needs to merge, label, and open issues.
permissions:
  contents: write          # push automation/conformance-digest + delete PR head branch
  pull-requests: write     # gh pr close
  issues: write            # gh issue create + gh label create

concurrency:
  # One triage run per PR; cancel superseded runs on new pushes.
  group: nightly-triage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  triage:
    # Head-branch narrowing: only fire on actual nightly conformance PRs.
    if: startsWith(github.head_ref, 'claude/conformance-')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
    steps:
      - name: Checkout PR head with full history
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0   # three-dot diff needs both endpoints reachable

      - name: Ensure nightly-triage label exists (idempotent)
        run: |
          gh label create nightly-triage \
            --color FBCA04 \
            --description "Nightly conformance PR triage" \
            || true

      - name: Diff guard - exactly one ADDED digest file
        id: guard
        run: |
          set -euo pipefail

          # Make sure both endpoints are present for the diff.
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || true

          DIFF="$(git diff --no-renames --name-status "$BASE_SHA"..."$HEAD_SHA")"
          echo "----- raw diff -----"
          echo "$DIFF"
          echo "--------------------"

          LINE_COUNT="$(printf '%s\n' "$DIFF" | grep -c . || true)"
          STATUS="$(printf '%s\n' "$DIFF" | awk 'NR==1{print $1}')"
          FILE="$(printf '%s\n' "$DIFF" | awk 'NR==1{print $2}')"

          PASS=false
          if [ "$LINE_COUNT" = "1" ] \
             && [ "$STATUS" = "A" ] \
             && printf '%s' "$FILE" | grep -Eq '^docs/audits/[0-9]{4}-[0-9]{2}-[0-9]{2}-conformance-nightly-digest\.md$'; then
            PASS=true
          fi

          {
            echo "pass=$PASS"
            echo "file=$FILE"
            echo "diff<<__DIFF_EOF__"
            echo "$DIFF"
            echo "__DIFF_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: On guard FAIL - open anomaly issue and stop
        if: steps.guard.outputs.pass != 'true'
        env:
          # Route untrusted step outputs through env (never inline ${{ }} into the
          # script source) so a hostile filename/diff cannot inject shell commands.
          # ${VAR} parameter expansion is not re-scanned for command substitution.
          GUARD_FILE: ${{ steps.guard.outputs.file }}
          GUARD_DIFF: ${{ steps.guard.outputs.diff }}
        run: |
          set -euo pipefail
          DATE="$(printf '%s' "$GUARD_FILE" \
                  | grep -Eo '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -n1 || true)"
          [ -n "$DATE" ] || DATE="$(date -u +%F)"

          BODY="$(cat <<EOF
          Automated guard for the nightly conformance PR **failed**: the PR did not
          consist of exactly one ADDED \`docs/audits/*-conformance-nightly-digest.md\` file.

          **PR:** ${PR_URL}
          **Base:** \`${BASE_SHA}\`
          **Head:** \`${HEAD_SHA}\`

          **Changed files (git diff --name-status base...head):**
          \`\`\`
          ${GUARD_DIFF}
          \`\`\`

          Nothing was merged. A human must review this PR.
          EOF
          )"

          gh issue create \
            --title "Anomalous nightly PR ${DATE} — guard failed" \
            --label nightly-triage \
            --body "$BODY"

          echo "::error::Diff guard failed — opened triage issue, refusing to merge."
          exit 1

      - name: On guard PASS - parse survivors, merge, conditionally triage
        if: steps.guard.outputs.pass == 'true'
        env:
          # Route the step output through env (never inline ${{ }} into the script
          # source). Guard already validated FILE against the strict digest regex,
          # but keep the no-inline discipline uniform across the workflow.
          GUARD_FILE: ${{ steps.guard.outputs.file }}
        run: |
          set -euo pipefail
          FILE="$GUARD_FILE"

          DATE="$(printf '%s' "$FILE" | grep -Eo '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -n1)"

          # Counts contract (C): read ONLY the code-owned machine-readable marker
          # that conformance-hub.js writes from digestSchema.counts. The agent's
          # free-rendered prose (table one night, inline prose the next) is NEVER
          # parsed. Marker format: <!-- counts: raw=N survived=N killed=N -->
          #
          # The trailing `|| true` is load-bearing: a no-match grep exits 1, and
          # under `set -euo pipefail` that previously aborted this whole step
          # BEFORE the fail-closed issue-create below could run -- making the
          # safety net unreachable (silent hard-fail). `|| true` lets the command
          # substitution succeed with an empty MARKER; the explicit emptiness
          # check then FIRES the fail-closed path.
          MARKER="$(grep -oE '<!-- counts: raw=[0-9]+ survived=[0-9]+ killed=[0-9]+ -->' "$FILE" | head -n1 || true)"

          if [ -z "$MARKER" ]; then
            echo "::error::No machine-readable counts marker in $FILE (expected '<!-- counts: raw=N survived=N killed=N -->')."
            gh issue create \
              --title "Nightly triage ${DATE} — unparseable digest" \
              --label nightly-triage \
              --body "Guard passed but no machine-readable counts marker (\`<!-- counts: raw=N survived=N killed=N -->\`) was found in \`${FILE}\`. The digest count contract is code-owned (conformance-hub.js); its absence means the generator/renderer broke the contract. PR: ${PR_URL}. NOT merged."
            exit 1
          fi

          SURV="$(printf '%s' "$MARKER" | sed -E 's/.*survived=([0-9]+).*/\1/')"

          # Defence in depth: the grep already required survived=[0-9]+, but keep
          # an explicit integer check so a future regex change cannot silently let
          # a non-integer through to the merge.
          if ! printf '%s' "$SURV" | grep -Eq '^[0-9]+$'; then
            echo "::error::Counts marker present but 'survived' is not an integer in $FILE (marker: $MARKER)."
            gh issue create \
              --title "Nightly triage ${DATE} — unparseable digest" \
              --label nightly-triage \
              --body "Counts marker found but the survived count could not be parsed as an integer from \`${FILE}\` (marker: \`${MARKER}\`). PR: ${PR_URL}. NOT merged."
            exit 1
          fi

          echo "date=$DATE marker=$MARKER survivors=$SURV"

          # ADR-84 / Q9: the digest is ISOLATED from main. Divert it onto the
          # automation/conformance-digest branch (never merged into main) via
          # commit-tree plumbing (accumulates prior digests; no working-tree
          # switch), then CLOSE the PR without merging — the inverse of the
          # former squash-merge.
          AUTO_BRANCH=automation/conformance-digest
          IDX="$RUNNER_TEMP/q9-digest-idx"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BLOB="$(git hash-object -w "$FILE")"
          LS="$(git ls-remote --heads origin "$AUTO_BRANCH" || true)"
          rm -f "$IDX"
          if [ -n "$LS" ]; then
            git fetch --no-tags origin "$AUTO_BRANCH"
            PARENT_SHA="$(git rev-parse FETCH_HEAD)"
            GIT_INDEX_FILE="$IDX" git read-tree "$PARENT_SHA"
          else
            PARENT_SHA=""   # first run → orphan, output-only root
          fi
          GIT_INDEX_FILE="$IDX" git update-index --add --cacheinfo "100644,$BLOB,$FILE"
          TREE="$(GIT_INDEX_FILE="$IDX" git write-tree)"
          MSG="chore(routine/conformance-digest): $DATE digest"
          if [ -n "$PARENT_SHA" ]; then
            COMMIT="$(printf '%s\n' "$MSG" | git commit-tree "$TREE" -p "$PARENT_SHA")"
          else
            COMMIT="$(printf '%s\n' "$MSG" | git commit-tree "$TREE")"
          fi

          # Loud-fail on branch protection / non-fast-forward, mirroring the old merge path.
          if ! git push origin "$COMMIT:refs/heads/$AUTO_BRANCH"; then
            echo "::error::push to $AUTO_BRANCH failed (branch protection / non-fast-forward?)."
            gh issue create \
              --title "Nightly triage ${DATE} — digest branch push failed" \
              --label nightly-triage \
              --body "Guard PASSED (survivors=${SURV}) but pushing the digest to \`${AUTO_BRANCH}\` failed — likely branch protection or a non-fast-forward. PR left open: ${PR_URL}"
            exit 1
          fi

          # Digest is safely on the automation branch; close the PR (do NOT merge
          # to main) and delete its head branch. Loud-fail if the close fails AFTER
          # the push: the digest is already recorded, so surface the open PR for a
          # manual close rather than exiting silently.
          if ! gh pr close "$PR_NUMBER" --delete-branch; then
            echo "::error::gh pr close failed after the digest was pushed to $AUTO_BRANCH."
            gh issue create \
              --title "Nightly triage ${DATE} — PR close failed (digest already recorded)" \
              --label nightly-triage \
              --body "The ${DATE} digest was pushed to \`${AUTO_BRANCH}\` (commit ${COMMIT}), but \`gh pr close --delete-branch\` failed — PR ${PR_URL} is still OPEN. Close it manually; do NOT merge it to \`main\`."
            exit 1
          fi

          if [ "$SURV" -gt 0 ]; then
            # Link the digest at its recorded commit on the automation branch
            # (a commit SHA is unambiguous; a slash-bearing branch ref in a blob
            # URL is not).
            DIGEST_URL="https://github.com/${GITHUB_REPOSITORY}/blob/${COMMIT}/${FILE}"

            # Two-pass extraction: pull the "Findings" and "Next Actions" blocks
            # SEPARATELY. The real generator (docs/audits/2026-06-05-conformance-
            # nightly-digest.md) emits LEVEL-2 headings "## Findings (PROPOSALS
            # ONLY)" and "## Next Actions (proposals for operator)", with
            # ### High/Med/Low subsections INSIDE Findings. So capture from the
            # level-2 heading to the NEXT level-2 "## " heading or "---" rule --
            # NOT the next "### ", which would stop at "### High" and capture
            # nothing (the bug this fixes). Stopping at the next "## " also keeps
            # "## Killed Findings" out of the survivor issue. Fail-soft: a missing
            # section becomes a placeholder line, never an empty/dead body.
            FINDINGS="$(awk '
              /^## Findings/ {cap=1; print; next}
              cap && /^## / {exit}
              cap && /^---[[:space:]]*$/ {exit}
              cap {print}
            ' "$FILE")"
            [ -n "$FINDINGS" ] || FINDINGS="_(Findings section not found in the digest — see ${FILE}.)_"

            NEXTACT="$(awk '
              /^## Next Actions/ {cap=1; print; next}
              cap && /^## / {exit}
              cap && /^---[[:space:]]*$/ {exit}
              cap {print}
            ' "$FILE")"
            [ -n "$NEXTACT" ] || NEXTACT="_(Next Actions section not found in the digest — see ${FILE}.)_"

            BODY="$(cat <<EOF
          The nightly conformance digest for **${DATE}** reported **${SURV} survivor(s)**.
          The digest has been recorded on the \`automation/conformance-digest\` branch (it is the record; never merged to \`main\`, per ADR-84):

          ${DIGEST_URL}

          ---

          ${FINDINGS}

          ${NEXTACT}
          EOF
          )"

            gh issue create \
              --title "Nightly triage ${DATE} — ${SURV} survivor(s)" \
              --label nightly-triage \
              --body "$BODY"
          else
            echo "0 survivors — merged, no triage issue needed."
          fi
