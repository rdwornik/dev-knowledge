# organ-registry.yaml -- the DECLARED half of the [#132] organ index.
#
# WHY THIS FILE EXISTS (the [#132] "absorbs #248" clause, resolved)
# -----------------------------------------------------------------
# `scripts/generate_organ_index.py` derives every organ it can from committed repo
# state: .claude/{agents,commands,skills,workflows,rules}, .claude/settings.json,
# .pre-commit-config.yaml, and the tier1-lifecycle plugin manifest. Those are facts in
# the tree, so the generated index is a pure function of the commit and its
# regen-and-diff freshness gate is portable across machines.
#
# The USER-LEVEL organs (global `~/.claude`, Ch2 layer `L0`) are not in the tree. A
# generator that walked `~/.claude` live would emit a different index on every machine,
# and the freshness gate -- which compares regenerated bytes against the committed file
# -- would then red on any host but the one that last regenerated. That is a gate no
# consumer and no CI runner could hold green, so the L0 rows are DECLARED here instead
# and rendered from this committed file.
#
# #248 stated the fork: "build a hub-local registry to generate them, or accept the
# hand-authored + freshness-gated boundary". This file takes the first arm for the shape
# and the second for the honesty:
#
#   * the rows below are hand-authored, so the index cannot notice an L0 organ that was
#     added or removed on the operator's machine; and
#   * `generate_organ_index.py --probe-user-level` is the diagnostic that closes that
#     loop on demand -- it reads `~/.claude` read-only, diffs the live inventory against
#     these rows, prints the drift, and exits 0 without writing anything. It is wired
#     into no gate, deliberately: a machine-dependent reading has no place inside a
#     deterministic check.
#
# So the boundary is real and it is stated rather than hidden: a stale row here is
# invisible to the commit gate and visible to `--probe-user-level`.
#
# FIELD CONTRACT -- every row carries all six index columns, verbatim:
#   name          the organ as an operator refers to it
#   class         one of generate_organ_index.ORGAN_CLASSES
#   trigger       what fires it (ARCHITECTURE Ch2 Trigger vocabulary)
#   source        its locator; `~/...` marks an off-repo path
#   distribution  ARCHITECTURE Ch2 Layer vocabulary -- L0 for these rows
#   status        ARCHITECTURE Ch2 Status vocabulary -- ARMED / RETIRED / RULED-UNBUILT
#
# Rows render in the order written. Adding, editing or removing one changes the
# generated index, so the `organ-index-freshness` pre-commit hook fires on this file.

registry_version: "1.0.0"

organs:
  # --- commands (operator-invoked, global) ---------------------------------------
  - name: "/session-summary"
    class: command
    trigger: operator-invoke
    source: "~/.claude/commands/session-summary.md"
    distribution: L0
    status: ARMED

  - name: "/codex-review"
    class: command
    trigger: operator-invoke
    source: "~/.claude/commands/codex-review.md"
    distribution: L0
    status: ARMED

  # --- skills (model-invoked) ----------------------------------------------------
  - name: gotchas
    class: skill
    trigger: "model-invoke (consulted before edits)"
    source: "~/.claude/skills/gotchas/"
    distribution: L0
    status: ARMED

  # --- agents (subagent dispatch) ------------------------------------------------
  - name: ecosystem-snapshot
    class: agent
    trigger: subagent-dispatch
    source: "~/.claude/agents/ecosystem-snapshot.md"
    distribution: L0
    status: ARMED

  - name: report-generator
    class: agent
    trigger: subagent-dispatch
    source: "~/.claude/agents/report-generator.md"
    distribution: L0
    status: ARMED

  # --- rules (always-on context) -------------------------------------------------
  - name: core-invariants
    class: rule
    trigger: "context-load (every session)"
    source: "~/.claude/rules/core-invariants.md"
    distribution: L0
    status: ARMED

  # --- session hooks (global settings.json) --------------------------------------
  # The P0 exclusion-zone guard. ARCHITECTURE Ch2 carries its failure posture
  # (fail-closed); this index carries its trigger and reach.
  - name: "PreToolUse: block-onedrive.ps1"
    class: session-hook
    trigger: "PreToolUse (Bash|PowerShell|Edit|Write|NotebookEdit|Read)"
    source: "~/.claude/hooks/block-onedrive.ps1"
    distribution: L0
    status: ARMED

  # The L0 half of the ADR-70 Tier-1 closure loop: the plugin's Stop hook proposes,
  # this one surfaces the proposals at the next session start (the #73 5c convergence).
  - name: "SessionStart: surface-closures.ps1"
    class: session-hook
    trigger: SessionStart
    source: "~/.claude/hooks/surface-closures.ps1"
    distribution: L0
    status: ARMED

  - name: "Stop: claude-notify.ps1"
    class: session-hook
    trigger: Stop
    source: "~/.claude/claude-notify.ps1"
    distribution: L0
    status: ARMED

  - name: "Notification: claude-notify.ps1"
    class: session-hook
    trigger: Notification
    source: "~/.claude/claude-notify.ps1"
    distribution: L0
    status: ARMED
