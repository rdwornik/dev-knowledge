# Fleet parity-surfaces manifest -- the #328 versioned parity contract (FR-1/FR-2).
#
# ONE machine-readable contract: surfaces x role-tiers x one probe each, consuming the
# A0-SETTLED template (docs/intake/2026-07-11-tech-ownership-manifest.md, intake #12,
# SETTLED 2026-07-12 incl. the section-9a ruling: the hub is a fleet MEMBER, not an
# implicit exception). Consumed by scripts/fleet_parity.py (read-only, WARN-only v1,
# zero blocking gates -- section 9b / ADR-85 hardening pattern).
#
# Version line below is nudge-parseable (validate_reconciliation._VERSION_LINE_RE,
# IGNORECASE): bump it when surface semantics change.
version: 1.4.0
#
# GRAMMAR
#   fleet:      the ADR-104 DECLARATION, not the deployment registry -- all nine
#               declared members appear here ([#490]). Every
#               ecosystem/deployed-versions.yaml registry key MUST appear (cross-checked
#               both directions by the checker; mismatch = refusal finding), with ONE
#               narrow exception: a `pre-deploy` member absent from deployed-versions may
#               stand if it carries a non-empty `reason:` -- declared absence. A
#               reason-less one still refuses, and the escape is role-scoped, so a WALKED
#               repo (hub/consumer) missing from the registry refuses regardless.
#               role: hub | consumer | pre-deploy. pre-deploy repos are rendered
#               "skipped (pre-deploy)" carrying that reason -- never silently absent.
#   surfaces[]: id                 -- canonical id (FR-2): stable, independent of local
#                                     filename / hook id / byte shape. Where a live
#                                     .methodology.yaml declaration exists 1:1, the id
#                                     EQUALS the declared component id.
#               kind               -- path | precommit-hook | settings-hook-block |
#                                     claude-subtree | command | gitignore-effect |
#                                     tombstone-join | doc-marker | roster
#               tier:              -- map keyed by ROLE or REPO-ID (repo-id overrides
#                                     role; a key absent = surface not in that repo's
#                                     template -> falls to the sweep branches).
#                                     Tokens: MUST | SHOULD | LOCAL | IGNORE | INVERSE
#                                     | TOMBSTONE (intake #12 severity model).
#               probe:             -- effect-probe spec (FR-6: assert the EFFECT where
#                                     semantics exist -- git check-ignore for ignore
#                                     rules, installed+armed stages for hooks,
#                                     tag-ancestry for pinned revs; never text-grep
#                                     where an effect probe exists).
#               waivable:          -- may a repo's .methodology.yaml declaration flip a
#                                     divergence to PASS-declared? default: true for
#                                     SHOULD/LOCAL/TOMBSTONE + sweep hits, false for
#                                     MUST/INVERSE (a necessary condition cannot be
#                                     waived away in v1; hardening may revisit).
#               waiver_component:  -- the declaration component id that matches this
#                                     row (default = id). UNIQUE across rows: one
#                                     declaration can never suppress two concerns
#                                     (disposition-register grammar, one-per-concern).
#               local_names:       -- repo-id -> local name/token (FR-2 / d1: one
#                                     canonical id, N local names; identity never
#                                     rests on filename or byte shape).
#               declared_by:       -- "intake-12" on Tier-3 rows whose divergence the
#                                     SETTLED template itself enumerates: template
#                                     membership IS the declaration of record until
#                                     the per-repo .methodology.yaml migration (P6).
#               declared_divergence: -- repo-id -> short text: a BEHAVIORAL divergence
#                                     the template EXPECTS that repo to declare (the
#                                     d1 corp skip-set class). A valid declaration on
#                                     such a row is PASS-declared, never stale.
#               pending_migration: -- representation ONLY of a ruled-but-not-executed
#                                     coordinated migration ({to, ticket}); the checker
#                                     annotates, never verdicts on it (#334 seed).
#               join:              -- tombstone-join rows: {manifest_component: <id>}.
#                                     AUTHORITY for removed-status stays the deploy
#                                     manifest component (status: removed); the checker
#                                     cross-checks and REFUSES on mismatch/ambiguity
#                                     (FR-5; never an action proposal).
#               ownership:         -- ADR-103: MANDATORY on EVERY row (loader refuses a
#                                     missing/malformed block). A SINGLE per-row wrapper
#                                     (ownership is hub-authoritative, not per-consumer --
#                                     contrast repo-keyed gate_rev_ahead): {value, reason
#                                     (MANDATORY non-blank), provenance (MANDATORY list of
#                                     {kind, repo, ref})}. value is the CLOSED enum
#                                     {methodology-generic | project | conditional}
#                                     (reconciled from #316 + the 2026-07-16 census; ADR-102's
#                                     bare "methodology" aside is non-normative). Shares the
#                                     ADR-102 value/reason/provenance grammar VERBATIM via
#                                     the one _declaration_bad predicate (no fork). #329
#                                     renders a VIEW mapping FROM these tokens.
#               gate_rev_ahead:    -- ADR-102: precommit_remote MUST rows only. repo-id ->
#                                     {gate_tag, reason (MANDATORY), provenance (MANDATORY
#                                     list of {kind, repo, ref})}. "declared" = a HUB
#                                     manifest expectation, NOT a .methodology.yaml waiver.
#                                     REFINES the MUST fidelity predicate (the enforcement
#                                     gate is legitimately ahead of the deployed corpus
#                                     source_tag): a proven strict-descendant gate ->
#                                     GATE_AHEAD_DECLARED; it NEVER waives the MUST. No
#                                     review_date -- self-invalidating (corpus catch-up ->
#                                     inert decl surfaces STALE_DECLARATION). The reusable
#                                     value/reason/provenance grammar #316 adopts (its
#                                     ownership enum is #316 scope, not defined here).
#                                     waivable: true on a MUST/INVERSE row is a loader
#                                     REFUSAL (a necessary condition is never waivable).
#
# The intake-#12 nightly decision tree is the verdict algorithm; verdict vocabulary =
# register grammar: AT-PARITY | PASS-declared | WARN-undeclared | MUST-absent |
# tombstone-violated (+ advisory-rewarn | stale-declaration | refused | unavailable |
# skipped-pre-deploy | tracked-ephemera | gate-ahead-declared). WARN-only v1: severity
# labels are REPORT labels; the checker never blocks and never mutates (ADR-28/36
# Layer-2 posture). gate-ahead-declared (ADR-102) is an at-parity-FAMILY info state --
# a proven enforcement-gate-ahead split, NOT a PASS-declared/waiver outcome.

fleet:
  .dev-knowledge: {role: hub}
  ai-council: {role: consumer}
  corp-monorepo: {role: consumer}
  corp-ops: {role: pre-deploy}
  corp-sca-time-automation: {role: pre-deploy}
  # [#490] -- the four ADR-104-declared members that carry no deploy record. They are
  # listed here so the fleet map equals the DECLARATION (9/9), not the deployment
  # registry (5/9): until this arc they were absent from the manifest entirely, so
  # `membership_agreement` reported parity-surfaces 5/9 and every "fleet parity GREEN"
  # verdict was a claim about five repos wearing the word "fleet".
  #
  # `reason:` is load-bearing, not commentary: resolve_fleet REFUSES a pre-deploy member
  # that is absent from deployed-versions.yaml and states no reason, and the reason is
  # rendered into the repo's skipped-pre-deploy finding, so absence is declared rather
  # than silent. Each reason below is the repo's own registry.md status line -- observed, not
  # inferred. A repo onboards by gaining a deployed-versions.yaml entry, at which point
  # its role flips to `consumer` and the reason: is dropped.
  demo-prep: {role: pre-deploy,
    reason: "registered, methodology-unonboarded (ecosystem/registry.md); no deploy record -- nothing to hold at parity yet"}
  life-architect: {role: pre-deploy,
    reason: "registered, methodology-unonboarded (ecosystem/registry.md); full gate set ruled but not yet deployed (satellite-onboarding-rulings.yaml)"}
  terminal-setup: {role: pre-deploy,
    reason: "registered 2026-08-01 ([#462]), unonboarded; no VISION.md, no CLAUDE.md, no deploy record (ecosystem/registry.md)"}
  win-tooling: {role: pre-deploy,
    reason: "registered, unonboarded (ecosystem/registry.md); not listed in deployed-versions.yaml (ADR-91)"}

surfaces:
  # ---- Tier-1: the 7 canonical docs (every fleet repo) --------------------------------
  - id: canonical-doc-vision
    kind: path
    tier: {hub: MUST, consumer: MUST}
    probe: {type: path_tracked, path: VISION.md}
    ownership:
      value: methodology-generic
      reason: "VISION.md -- one of the 7 canonical living docs, the methodology corpus every fleet repo carries (MUST both); hub-authoritative, not repo-local content."
      provenance: &own-prov
        - {kind: backlog, repo: .dev-knowledge, ref: "#316"}
        - {kind: adr, repo: .dev-knowledge, ref: ADR-103}
        - {kind: audit, repo: .dev-knowledge, ref: docs/audits/2026-07-16-technical-fleet-structure-census.md}
  - id: canonical-doc-architecture
    kind: path
    tier: {hub: MUST, consumer: MUST}
    probe: {type: path_tracked, path: ARCHITECTURE.md}
    ownership:
      value: methodology-generic
      reason: "ARCHITECTURE.md -- canonical living doc mandated MUST fleet-wide; methodology-owned structural map."
      provenance: *own-prov
  - id: canonical-doc-claude
    kind: path
    tier: {hub: MUST, consumer: MUST}
    probe: {type: path_tracked, path: CLAUDE.md}
    ownership:
      value: methodology-generic
      reason: "CLAUDE.md -- canonical session-contract doc mandated MUST fleet-wide; methodology-owned (Form-A owner markers, #312)."
      provenance: *own-prov
  - id: canonical-doc-contributing
    kind: path
    tier: {hub: MUST, consumer: MUST}
    probe: {type: path_tracked, path: CONTRIBUTING.md}
    ownership:
      value: methodology-generic
      reason: "CONTRIBUTING.md -- canonical living doc mandated MUST fleet-wide; methodology-owned commit/branch/gate contract."
      provenance: *own-prov
  - id: canonical-doc-journal
    kind: path
    tier: {hub: MUST, consumer: MUST}
    probe: {type: path_tracked, path: JOURNAL.md}
    ownership:
      value: methodology-generic
      reason: "JOURNAL.md -- canonical append-only session record mandated MUST fleet-wide; methodology-owned format (newest-first, SHA-anchored)."
      provenance: *own-prov
  - id: canonical-doc-lessons
    kind: path
    tier: {hub: MUST, consumer: MUST}
    probe: {type: path_tracked, path: LESSONS.md}
    ownership:
      value: methodology-generic
      reason: "LESSONS.md -- canonical append-only lessons record mandated MUST fleet-wide; methodology-owned institutional record."
      provenance: *own-prov
  - id: canonical-doc-backlog
    kind: path
    tier: {hub: MUST, consumer: MUST}
    probe: {type: path_tracked, path: BACKLOG.md}
    ownership:
      value: methodology-generic
      reason: "BACKLOG.md -- canonical living work-tracker mandated MUST fleet-wide; methodology-owned (story-map schema, ADR-66)."
      provenance: *own-prov

  # ---- Tier-1: governance shape docs/{audits,decisions,intake,archive} ----------------
  - id: docs-genre-audits
    kind: path
    tier: {hub: MUST, consumer: MUST}
    probe: {type: dir_tracked, path: docs/audits}
    ownership:
      value: methodology-generic
      reason: "docs/audits -- methodology-mandated governance genre (MUST both, ADR-101 sealed set); the evidence spine every fleet repo carries."
      provenance: *own-prov
  - id: docs-genre-decisions
    kind: path
    tier: {hub: MUST, consumer: MUST}
    probe: {type: dir_tracked, path: docs/decisions}
    ownership:
      value: methodology-generic
      reason: "docs/decisions -- methodology-mandated ADR genre (MUST both, ADR-101 sealed set); fleet-wide governance record."
      provenance: *own-prov
  - id: docs-genre-intake
    kind: path
    tier: {hub: MUST, consumer: MUST}
    probe: {type: dir_tracked, path: docs/intake}
    ownership:
      value: methodology-generic
      reason: "docs/intake -- methodology-mandated intake genre (MUST both, ADR-98/101); fleet-wide request-to-change-state pipeline."
      provenance: *own-prov
  - id: docs-genre-archive
    kind: path
    tier: {hub: MUST, consumer: MUST}
    probe: {type: dir_tracked, path: docs/archive}
    ownership:
      value: methodology-generic
      reason: "docs/archive -- methodology-mandated archive genre (MUST both, ADR-101 sealed set); fleet-wide retired-content home."
      provenance: *own-prov

  # ---- Tier-1: root config files -------------------------------------------------------
  - id: root-gitignore
    kind: path
    tier: {hub: MUST, consumer: MUST}
    probe: {type: path_tracked, path: .gitignore}
    ownership:
      value: methodology-generic
      reason: ".gitignore -- root config the methodology mandates present fleet-wide (MUST both); the presence mandate is methodology-owned though contents vary."
      provenance: *own-prov
  - id: root-gitattributes
    kind: path
    tier: {hub: MUST, consumer: MUST}
    probe: {type: path_tracked, path: .gitattributes}
    ownership:
      value: methodology-generic
      reason: ".gitattributes -- root config mandated present fleet-wide (MUST both); methodology-owned presence mandate (line-ending/encoding hygiene)."
      provenance: *own-prov
  - id: root-pyproject
    kind: path
    tier: {hub: MUST, consumer: MUST}
    probe: {type: path_tracked, path: pyproject.toml}
    ownership:
      value: methodology-generic
      reason: "pyproject.toml -- root config mandated present fleet-wide (MUST both); methodology-owned presence mandate (ruff floor, tooling)."
      provenance: *own-prov
  - id: root-precommit-config
    kind: path
    tier: {hub: MUST, consumer: MUST}
    probe: {type: path_tracked, path: .pre-commit-config.yaml}
    ownership:
      value: methodology-generic
      reason: ".pre-commit-config.yaml -- root config mandated present fleet-wide (MUST both); methodology-owned (carries the deployed hook corpus)."
      provenance: *own-prov
  - id: root-uv-lock
    kind: path
    tier: {hub: MUST, consumer: LOCAL}
    probe: {type: path_tracked, path: uv.lock}
    ownership:
      value: conditional
      reason: "uv.lock -- the committed uv dependency lockfile (ADR-106, [#432]): MUST at the hub now; consumer adoption is per-repo GATED rollout (ADR-106 pt 7), so consumer stays LOCAL until each repo's own uv arc flips its row to MUST."
      provenance: *own-prov
  - id: root-python-version
    kind: path
    tier: {hub: MUST, consumer: LOCAL}
    probe: {type: path_tracked, path: .python-version}
    ownership:
      value: conditional
      reason: ".python-version -- the uv interpreter pin (ADR-106, [#432]): MUST at the hub now; consumer adoption is per-repo GATED rollout (ADR-106 pt 7), so consumer stays LOCAL until each repo's own uv arc flips its row to MUST."
      provenance: *own-prov
  - id: root-tasks
    kind: path
    tier: {hub: MUST, consumer: LOCAL}
    probe: {type: dir_tracked, path: tasks}
    ownership:
      value: conditional
      reason: "tasks/ -- the DERIVED per-task tree emitted from BACKLOG.md ([#433] strangler STEP 1-2, ADR-101 amendment 2026-07-27): MUST at the hub while the strangler runs (BACKLOG.md stays source of truth until the flip arc); consumer stays LOCAL until the restructure ADR rules fleet adoption."
      provenance: *own-prov
  - id: root-code-workspace
    kind: path
    tier: {hub: MUST, consumer: MUST}
    probe: {type: glob_tracked, glob: "*.code-workspace"}
    ownership:
      value: methodology-generic
      reason: "*.code-workspace -- root config mandated present fleet-wide (MUST both); methodology-owned presence mandate for the editor workspace."
      provenance: *own-prov
  # [#430](a) -- root conftest.py: PERMITTED FLEET-WIDE, MANDATED NOWHERE (operator
  # ruling 2026-08-07, discharging the 2026-07-26 UNRULED marker the disposition
  # register carried). LOCAL on both roles is that sentence in the tier model: present
  # -> AT-PARITY, absent -> AT-PARITY. Before this row the consumer template had no
  # entry for it at all, so ai-council's guard fell to the root-SWEEP and reported
  # WARN-undeclared -- a template rejecting standard pytest practice.
  #
  # The CLASS is ruled once rather than kept as a per-repo exception ledger: a root
  # conftest as checkout-identity guard becomes a fleet-wide pattern as per-worktree
  # venvs land ([#429] leg b, whose stated failure mode is a worktree pytest importing
  # the PRIMARY checkout's source and going GREEN about the wrong tree).
  #
  # declared_by makes template membership the declaration of record -- without it a
  # consumer that HAS one would still owe a .methodology.yaml entry, which is exactly
  # the per-repo ledger the ruling rejects.
  - id: root-conftest
    kind: path
    tier: {hub: LOCAL, consumer: LOCAL}
    declared_by: ruling-2026-08-07-root-conftest
    probe: {type: path_tracked, path: conftest.py}
    ownership:
      value: conditional
      reason: "conftest.py at the repo root -- standard pytest practice, and in ai-council a checkout-identity guard that fails collection when the package resolves outside the checkout under test. Permitted fleet-wide, mandated nowhere: LOCAL both roles, so carrying one is AT-PARITY and not carrying one is AT-PARITY. Ruled 2026-08-07 ([#430](a))."
      provenance: *own-prov

  # ---- Tier-1: shape-only dirs (contents role-dependent) ------------------------------
  - id: shape-dir-tests
    kind: path
    tier: {hub: MUST, consumer: MUST}
    probe: {type: dir_exists, path: tests}
    ownership:
      value: methodology-generic
      reason: "tests/ -- shape dir the methodology mandates present fleet-wide (MUST both); the shape mandate is methodology-owned though contents are role-dependent."
      provenance: *own-prov
  - id: shape-dir-scripts
    kind: path
    tier: {hub: MUST, consumer: MUST}
    probe: {type: dir_exists, path: scripts}
    ownership:
      value: methodology-generic
      reason: "scripts/ -- shape dir mandated present fleet-wide (MUST both); methodology-owned shape mandate (Layer-2: validators only here)."
      provenance: *own-prov
  - id: shape-dir-logs
    kind: path
    tier: {hub: MUST, consumer: MUST}
    probe: {type: dir_exists, path: logs}
    ownership:
      value: methodology-generic
      reason: "logs/ -- shape dir mandated present fleet-wide (MUST both); methodology-owned shape mandate for append-only records."
      provenance: *own-prov
  - id: shape-dir-config
    kind: path
    tier: {hub: MUST, consumer: MUST}
    probe: {type: dir_exists, path: config}
    ownership:
      value: methodology-generic
      reason: "config/ -- shape dir mandated present fleet-wide (MUST both); methodology-owned shape mandate though contents are role-dependent."
      provenance: *own-prov

  # ---- Tier-1: .claude floor set (consumers; hub = origin, no replica) ----------------
  - id: claude-floor-file
    kind: path
    tier: {consumer: MUST}
    probe: {type: file_exists, path: .claude/CLAUDE-FLOOR.md}
    ownership:
      value: methodology-generic
      reason: ".claude/CLAUDE-FLOOR.md -- the methodology floor (hash-guarded replica, ADR-78/93); the hub is origin, consumers carry it MUST. Pure methodology."
      provenance: *own-prov
  - id: claude-floor-sidecar
    kind: path
    tier: {consumer: MUST}
    probe: {type: file_exists, path: .claude/CLAUDE-FLOOR.md.sha256}
    ownership:
      value: methodology-generic
      reason: ".claude/CLAUDE-FLOOR.md.sha256 -- the floor's integrity sidecar (ADR-78/93); methodology-owned, consumer MUST."
      provenance: *own-prov
  - id: claude-floor-import
    kind: doc-marker
    tier: {consumer: MUST}
    probe: {type: file_contains, path: CLAUDE.md, token: "@.claude/CLAUDE-FLOOR.md"}
    ownership:
      value: methodology-generic
      reason: "The CLAUDE.md @-import of the floor -- methodology-owned wiring (consumer MUST); binds the hash-guarded floor into the consumer's session contract."
      provenance: *own-prov
  - id: command-override
    kind: command
    tier: {hub: MUST, consumer: MUST}
    probe: {type: command_present, file: override.md}
    ownership:
      value: methodology-generic
      reason: "/override -- a deployed methodology command (ADR-85 gate bypass, logged); MUST fleet-wide, methodology-owned."
      provenance: *own-prov
  - id: claude-md-form-a-markers
    kind: doc-marker
    tier: {hub: MUST, consumer: MUST}
    probe: {type: file_contains, path: CLAUDE.md, token: "<!-- methodology:start"}
    ownership:
      value: methodology-generic
      reason: "CLAUDE.md Form-A owner markers -- the methodology boundary machinery (#312); MUST fleet-wide, methodology-owned by construction."
      provenance: *own-prov
    # intake #12 Tier-1: CLAUDE.md carries Form-A owner markers + the human-visible
    # boundary note (machine map = markers, #312). Presence probe only -- per-region
    # fidelity/diff is owned by the #312 boundary reporter (scripts/boundary_report.py),
    # never duplicated here (FR-12).

  # settings.json hub-carried hook blocks (W3-07 hook-block ownership, MUST half)
  - id: settings-floor-guard
    kind: settings-hook-block
    tier: {consumer: MUST}
    probe: {type: settings_hook, event: SessionStart, token: check_floor_hash}
    ownership:
      value: methodology-generic
      reason: "SessionStart floor-hash guard hook block -- methodology-shipped enforcement organ (consumer MUST); methodology-owned."
      provenance: *own-prov
  - id: settings-precommit-arm
    kind: settings-hook-block
    tier: {hub: MUST, consumer: MUST}
    probe: {type: settings_hook, event: SessionStart, token: pre_commit install}
    local_names: {.dev-knowledge: arm_hooks.py}
    ownership:
      value: methodology-generic
      reason: "SessionStart pre-commit-arm hook block -- methodology-shipped self-arm organ (MUST both); methodology-owned (RF-2 hub self-arm)."
      provenance: *own-prov
  - id: settings-stop-backpressure
    kind: settings-hook-block
    tier: {hub: MUST, consumer: MUST}
    probe: {type: settings_hook, event: Stop, token: session_end_backpressure}
    ownership:
      value: methodology-generic
      reason: "Stop session-end-backpressure hook block -- methodology-shipped deterministic gate (MUST both, ADR-85); methodology-owned."
      provenance: *own-prov
  - id: settings-plugin-tier1
    kind: settings-hook-block
    tier: {hub: MUST, consumer: MUST}
    probe: {type: plugin_enabled, token: tier1-lifecycle}
    ownership:
      value: methodology-generic
      reason: "tier1-lifecycle plugin enablement -- the methodology-shipped Tier-1 closure loop (MUST both, ADR-70); methodology-owned."
      provenance: *own-prov

  # settings.json LOCAL-owned hook blocks (W3-07 hook-block ownership, local half):
  # any hook command matching neither a MUST-block token above nor this owned map WARNs.
  - id: settings-local-blocks
    kind: settings-hook-block
    tier: {hub: MUST, consumer: MUST}
    probe:
      type: settings_local_blocks
      owned:
        .dev-knowledge: [fleet_health.py, surface_triage.ps1, billing_leak_sentinel.ps1,
                         changelog_sentinel.py, block_immutable_edits.py]
        corp-monorepo: [surface-conformance.ps1]
    ownership:
      value: methodology-generic
      reason: "The local-hook-block ownership BOUNDARY (W3-07, MUST both) -- methodology-owned governance rule; it enumerates each repo's LOCAL hooks but the boundary mechanism itself is methodology. [borderline: the enumerated hooks are repo-local; sol/terra to confirm methodology-generic vs conditional.]"
      provenance: *own-prov

  # hub pre-commit block fidelity: consumers pin rdwornik/dev-knowledge to the TAG their
  # deployed-versions record says was deployed (present != carried; effect probe =
  # rev equality vs source_tag + tag existence/ancestry in the hub repo itself), AND
  # the block must carry the required hook IDS (intake #12: fidelity = rev + hook ids).
  # required set = the universal floor both consumers carry per manifest v1.3.1; the
  # toc pair is consumer-variable via declared waivers (hub-toc-hooks), so not required.
  - id: precommit-hub-block
    kind: precommit-hook
    tier: {consumer: MUST}
    probe: {type: precommit_remote, repo_token: dev-knowledge,
            expected_rev_from: deployed-versions, ancestry: true,
            required_hook_ids: [backlog-id-on-close, block-ff-push]}
    # gate_rev_ahead (ADR-102): the enforcement gate is legitimately uplifted AHEAD of
    # the deployed corpus source_tag. A hub-owned expectation (NOT a .methodology.yaml
    # waiver) -- a REFINEMENT of the MUST fidelity predicate, never a waiver. Blessed to
    # GATE_AHEAD_DECLARED only when the pin is a proven STRICT DESCENDANT of the corpus
    # tag (C ancestor-of G, G ancestor-of hub HEAD, G != C) carrying the required hook
    # ids; anything else (absent / behind / broken / undeclared) stays the MUST error.
    gate_rev_ahead:
      corp-monorepo:
        gate_tag: v1.3.1
        reason: >-
          Enforcement gate uplifted ahead of corpus: block-ff-push +
          backlog-id-on-close (#318/#319 range-reconstruction fixes) landed in
          corp's dev-knowledge hub-block pin, while corp's corpus body stays at
          v1.2.0 -- a full redeploy would re-append the codemap-freshness hook
          corp removed (#276 unlanded), and record-stamping v1.3.1 would
          over-claim a corpus that was never deployed. Strictly ahead of corpus,
          not a pin-revert.
        provenance:
          - {kind: git-tag, repo: .dev-knowledge, ref: v1.3.1}
          - {kind: git-commit, repo: corp-monorepo, ref: efe5bd1}
          - {kind: backlog, repo: .dev-knowledge, ref: "#336"}
    ownership:
      value: methodology-generic
      reason: "The consumer hub-block pin -- the methodology enforcement gate every consumer carries MUST (rev + required hook ids); methodology-owned by construction."
      provenance: *own-prov

  # ---- Tier-1: consumer-only MUSTs + inverse rules -------------------------------------
  - id: install-md
    kind: path
    tier: {consumer: MUST, hub: INVERSE}
    probe: {type: path_tracked, path: INSTALL.md}
