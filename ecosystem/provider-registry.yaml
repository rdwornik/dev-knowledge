  #
  # THE PRICE IS THE SAME CARD AS ITS THREE SIBLINGS -- Anthropic first-party list prices, the
  # `claude-api` skill's cached "Current Models" table, cache date 2026-06-24, which is this
  # file's `rate_card.as_of`. So no per-model `rates.source` is carried: the card's own source
  # already covers it, and adding one would claim a second provenance for one fact.
  #
  # WHAT THIS ROW DOES NOT DO, recorded here so nobody files a false defect against it. Pricing
  # haiku flips the baseline's partial flag and does NOT reconcile this repo's measured
  # $0.217038 with the vendor-reported $0.2915 for the same sweep. The 959-token side-call is
  # worth $0.000959-$0.004795 depending on the input/output split -- 1.3%-6.4% of the $0.0745
  # gap. The residual is UNATTRIBUTED, most plausibly cache-token accounting, and it stays an
  # open question rather than a closed one.
  claude-haiku-4-5-20251001:
    provider: anthropic
    tier: S
    # Holds no role here: which CLI runs which role is `ecosystem/routing-table.yaml`'s
    # authority (Z-G3 A2) and the ordered ranking is `roles:` above. The row exists so the id
    # the CLI actually emits is addressable, resolvable and priceable.
    roles: []
    rates:
      input: 1.0
      output: 5.0
    pinned_at: []

  gpt-5.6-terra:
    provider: openai
    # The doctrinal review lane (PLAYBOOK). The PIN lives at L0
    # (`~/.claude/bin/codex-review.ps1`, S19) and is therefore NOT asserted from this repo —
