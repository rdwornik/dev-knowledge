# ===========================================================================================
# ROLES -- `[#691]`'s THIRD collection, and the one the row says is "a third thing, not a
# field rename". `models[].roles` is a per-model membership SET answering "which roles does
# this model hold"; this collection is role-keyed and ORDERED, answering "who answers for this
# role, in what order, and who answers when the first is ineligible". Both survive.
#
# THE THREE LEGS `[#691]` NAMES, and where each one lands:
#   (a) ORDER      -- list position in `order:`. A set cannot express a fallback chain; this can.
#   (b) ADMISSION  -- each entry's `admission:` block. ABSENT MEANS `unevaluated`, WHICH MEANS
#                     NOT ADMITTED -- silence does not read as permission. That equation is the
#                     whole Half A / Half B boundary: every non-Claude entry below is LISTED,
#                     addressable and trip-testable while holding no admission at all. The rule
#                     itself lives where it is enforced, in `scripts/provider_registry.is_admitted`
#                     and `ecosystem/schema/provider_registry.RoleEntry`.
#   (c) LICENCE    -- each provider's `licence:` block above. The schema refuses to mark an
#                     entry `admitted` under a non-`permitted` licence.
#
# LISTED IS NOT ELIGIBLE, and the distinction is deliberate rather than a loophole. `[#691]`'s
# Done-when says only admitted, licence-permitting providers "may appear on it" -- but this
# lane's contract REQUIRES agy, Grok 4.6, Copilot Enterprise and Codex terra to appear as
# NOT ADMITTED entries, precisely so the router's two refusals can be trip-tested against real
# rows rather than against fixtures. Both are satisfied by separating the two acts: a provider
# is LISTABLE under any state, and only an `admitted` + `permitted` + on-the-repo-allowlist
# entry is ROUTABLE. `scripts/provider_router.py` is where that is enforced; nothing here
# routes anything.
#
# THE ORDER BELOW IS DECLARED, NOT EARNED -- AX21-2's distinction, and stating it here is the
# point. `provider_router.rerank()` reorders these lists by MEASURED pass rate per cost over
# the `genai_spans` tally; until a role has measured calls the declared order stands, and the
# router says so rather than presenting an unmeasured list as a measured one. AX22-1's expected
# steady state on the implement role is Copilot -> Grok -> Sonnet, and it is deliberately NOT
# written below, because writing it would be the "fixed list wearing a router's name" failure
# AX21-2 exists to name. Until admission, implement order is SONNET FIRST.
# ===========================================================================================
roles:

  orchestrate:
    description: >-
      Decide what the other roles do. AX21-1: "orchestrate / plan -> Opus only". Opus-5 is what
      a lane actually dispatches at; the registry's `claude-opus-4-8` row is the id this file
      already carries, and the entry pins the PROVIDER rather than a model string this registry
      has not verified on a live surface.
    # AX21-1's one line that is NOT subject to re-ranking. The clause is quoted verbatim, and
    # enforced, on `Role.rerankable` in `ecosystem/schema/provider_registry.py`; the effect here
    # is that a cheap model scoring well on pass-rate-per-cost stays out of the seat that
    # decides what the expensive ones do -- such a promotion would be the metric's artefact
    # rather than its finding.
    rerankable: false
    routing_table_role: null   # routing-table.yaml has no orchestration row; it is CC's own seat
    order:
      - provider: anthropic
        model: claude-opus-4-8
        note: "Opus only (AX21-1). No fallback -- a degraded orchestrator is worse than a stopped one."
        admission:
          verdict: admitted
          decided_by: operator
          decided_on: "2026-09-11"
          evidence: docs/audits/2026-09-11-technical-batch-x-manifest.md
  plan:
    description: >-
      Design before build. Shares orchestrate's constraint verbatim (AX21-1 names the two
      together: "orchestrate / plan -> Opus only") and shares its reason: a plan is the artifact
      every other role executes against.
    rerankable: false
    routing_table_role: null
    order:
      - provider: anthropic
        model: claude-opus-4-8
        note: "Opus only (AX21-1), same clause and same reason as orchestrate."
        admission:
          verdict: admitted
          decided_by: operator
          decided_on: "2026-09-11"
          evidence: docs/audits/2026-09-11-technical-batch-x-manifest.md
  implement:
    description: >-
      Produce code and artifacts. AX21-1's declared target order is Copilot Enterprise (bounded,
      small) -> Grok 4.6 (multi-step, long-horizon) -> Sonnet -- but AX22-1 overrides it UNTIL
      ADMISSION: "Implement order until admission: Sonnet first." That is what is encoded here.
    routing_table_role: producer
    order:
      - provider: anthropic
        model: claude-sonnet-5
        note: >-
          FIRST, per AX22-1, and this position is a measurement gate rather than a preference:
          it holds until Copilot and Grok clear the >= 8-of-10 bar, at which point AX21-2's
          re-rank -- not a hand edit -- moves them.
        admission:
          verdict: admitted
          decided_by: operator
          decided_on: "2026-09-11"
          evidence: docs/audits/2026-09-11-technical-batch-x-manifest.md
      - provider: copilot-enterprise
        note: >-
          NOT ADMITTED and NOT LICENCE-CLEARED -- two independent blocks. Listed so the router's
          refusals are trip-tested against a real row. AX21-1 would place it first on bounded
          work once both clear; neither has.
        admission:
          verdict: unevaluated
          floors: ["AX22-1"]
      - provider: xai
        model: grok-4.6
        note: >-
          NOT ADMITTED for this role. Its only recorded verdict is a REFUSED fan-out (a
          different role, 2026-08-23, floors G1+G2) and that refusal is not transferred here --
          admission is per role. AX21-3 adds a hard precondition for Half B to clear first: a
          CLI that cannot enforce a token ceiling by flag is not ordered, and grok's flags are
          unverified.
        admission:
          verdict: unevaluated
          floors: ["AX22-1", "AX21-3"]
  review:
    description: >-
      Judge a diff before merge. AX21-1 routes this to Codex terra and excludes the producing
      provider; the clause is quoted verbatim, and enforced, on `Role.excludes_producer` in
      `ecosystem/schema/provider_registry.py`.
    # AX22-2, "Reviewer != producer, always" -- the registry ENCODES the exclusion (this flag),
    # the router enforces it before dispatch, and the tally records both roles. The fallback
    # order below is AX22-2's own: "Codex terra reviews unless Codex produced; then the reviewer
    # is Grok (after admission) or Sonnet."
    excludes_producer: true
    routing_table_role: reviewer
    order:
      - provider: openai
        model: gpt-5.6-terra
        note: >-
          The standing reviewer (`ecosystem/routing-table.yaml` reviewer row, the AUTHORITY for
          role -> CLI under Z-G3 A2) and NOT ADMITTED, which is not a contradiction and is worth
          stating because it reads like one. Half A's contract names Codex terra among the four
          entries whose admission state is recorded NOT ADMITTED; AX22-1's >= 8-of-10 bar has
          measured no non-Claude provider, Codex included. The reason it stays ROUTABLE anyway
          is that the router's admission refusal is scoped to the IMPLEMENT role by this lane's
          done-contract item 1 -- "REFUSES a non-admitted provider in the implement role" -- so
          an unadmitted REVIEWER is refused by nothing. Admission and routability are separate
          questions here, and only the implement role couples them.
        admission:
          verdict: unevaluated
          floors: ["AX22-1"]
      - provider: xai
        model: grok-4.6
        note: "AX22-2's named fallback when Codex produced -- 'after admission', which has not happened."
        admission:
          verdict: unevaluated
          floors: ["AX22-1"]
      - provider: anthropic
        model: claude-sonnet-5
        note: >-
          AX22-2's terminal fallback, and the only one that is live today. Admitted, licensed,
          and subject to the same producer exclusion as every other entry -- Sonnet does not
          review a diff Sonnet produced.
        admission:
          verdict: admitted
          decided_by: operator
          decided_on: "2026-09-11"
          evidence: docs/audits/2026-09-11-technical-batch-x-manifest.md
  read:
    description: >-
      Locate and quote. AX21-1: "read / scan -> agy -> Copilot Enterprise -> Sonnet (locator +
      verbatim; CC verifies)". The "CC verifies" half is not a courtesy -- it is why a
      not-yet-admitted reader is still a coherent idea: a locator can be re-checked, so the
      failure mode is a wasted call rather than a false record.
    routing_table_role: null   # routing-table.yaml's fan_out is retrieval-only multi-head, a different shape
    order:
      - provider: antigravity
        note: >-
          NOT ADMITTED. Licence permits (operator's own subscription) but no admission
          measurement exists -- `[#627]` records a single `analysis` admission, which is a
          different role. AX21-1 ranks it first here; the ranking is declared, not earned.
        admission:
          verdict: unevaluated
          floors: ["AX22-1"]
      - provider: copilot-enterprise
        note: "NOT ADMITTED and licence unknown -- the same two independent blocks as on implement."
        admission:
          verdict: unevaluated
          floors: ["AX22-1"]
      - provider: anthropic
        model: claude-sonnet-5
        note: "The live terminal fallback."
        admission:
          verdict: admitted
          decided_by: operator
          decided_on: "2026-09-11"
          evidence: docs/audits/2026-09-11-technical-batch-x-manifest.md
  verify:
    description: >-
      Confirm the work holds. AX21-1: "verify -> Sonnet + the lane's RED-first tests." The tests
      are the load-bearing half and they are not a provider, which is why this role has exactly
      one entry rather than a chain: if the tests do not pass, no fallback model changes that.
    routing_table_role: null
    order:
      - provider: anthropic
        model: claude-sonnet-5
        note: "Sonnet, alongside the lane's RED-first tests (AX21-1)."
        admission:
          verdict: admitted
          decided_by: operator
          decided_on: "2026-09-11"
          evidence: docs/audits/2026-09-11-technical-batch-x-manifest.md

models:
  claude-sonnet-5:
    provider: anthropic
    # The M rung of the ADR-70 t-shirt pins. Held here as a STRING only: the tier pins
    # themselves are doctrine seams (S15/S16) and stay where they are ruled.
    tier: M
    roles: [subagent-default, workflow-verifier]
    # The three formats R2 §3.3 names. `format` is what the checker has to parse.
    pinned_at:
      - path: .claude/agents/artifact-reader.md
        seam: S9
        format: md-frontmatter
      - path: .claude/workflows/conformance-hub.js
        seam: S10
        format: js-object-literal
      - path: protocols/PLAYBOOK.md
        seam: S17
        format: md-prose

  claude-opus-4-8:
    provider: anthropic
    tier: L
    # Named in the artifact-reader model note as the documented escalation target.
    roles: [upgrade-path]
    pinned_at: []

  gpt-5.6-terra:
    provider: openai
    # The doctrinal review lane (PLAYBOOK). The PIN lives at L0
    # (`~/.claude/bin/codex-review.ps1`, S19) and is therefore NOT asserted from this repo —
    # the id is registered so a provenance attribution naming it resolves.
    roles: [reviewer]
    pinned_at: []

  gpt-5.6-sol:
    provider: openai
    roles: [provenance]
    attribution_token: "gpt-5.6-sol"
    pinned_at:
      - path: ecosystem/satellite-onboarding-rulings.yaml
        seam: S29
        format: yaml-provenance

  grok-l5:
    provider: xai
    roles: [provenance]
    # The on-disk attribution is the prose form `grok L5`, not the id.
    attribution_token: "grok L5"
    pinned_at:
      - path: pyproject.toml
        seam: S30
        format: comment-provenance

  # --- the two 2026-08-23 admission candidates -------------------------------------------
  # Both are REFUSED for the fan-out role and both are CONFIGURED here anyway. That is the
  # point, not an oversight: the refusal governs role eligibility and nothing else. Each id
  # below is the string the provider ACTUALLY SERVED, re-recorded on every scored round of the
  # local run — standing ruling Q9 makes that substitution probe a hard precondition, after a
  # client quietly serving `grok-4.5` cost a window ([#492]).

  grok-4.6:
    provider: xai
    # Holds no role: the fan-out candidacy it was run for was refused. The row exists so the
    # id is addressable, resolvable and in the vocabulary regardless.
    roles: []
    role_admission:
      fan-out:
        verdict: refused
        decided_by: architect
        decided_on: "2026-08-23"
        # `G1 v2 = (a) AND (b) AND (c)  ...  grok FAIL` (evidence section 7.1), and G2 fails
        # separately — the mitigated-rerun analysis records "G2 still fails on grok".
        floors: ["G1", "G2"]
        evidence: docs/audits/2026-08-23-technical-lane-562-local-admission.md
        rerun_carrier: "[#578]"
    pinned_at: []

  gemini-3.7-flash:
    provider: google
    roles: []
    role_admission:
      fan-out:
        verdict: refused
        decided_by: architect
        decided_on: "2026-08-23"
        # `G1 v2 = (a) AND (b) AND (c)  gemini FAIL` (evidence section 7.1). G2 was not the
        # leg it failed on, so it is not claimed here.
        floors: ["G1"]
        evidence: docs/audits/2026-08-23-technical-lane-562-local-admission.md
        rerun_carrier: "[#578]"
    pinned_at: []
