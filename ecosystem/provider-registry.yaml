  # tidy-up. `claude-opus-5` is the model this repo actually runs on: every one of batch Y's
  # six lanes is dispatched at `opus` EXPLICITLY (the manifest's own words — "`opusplan`
  # appears nowhere"), and it is the model named on effectively every assistant turn in the
  # session transcripts. The registry's stated job is "every model string the repo's LIVE
  # surface names", and it was missing the one the live surface names most. The gap surfaced
  # here because a rate has to hang off a row: there was nothing to price.
  #
  # `roles: []` and `pinned_at: []` are deliberate, on the precedent `grok-4.6` sets two
  # screens down — the row exists so the id is addressable, resolvable and in the vocabulary.
  # Which CLI runs which role is `ecosystem/routing-table.yaml`'s authority (Z-G3 A2) and the
  # ordered ranking is `roles:` below; claiming a role here would be this lane legislating on
  # a surface it does not own.
  claude-opus-5:
    provider: anthropic
    tier: L
    roles: []
    rates:
      input: 5.0
      output: 25.0
    pinned_at: []

  claude-opus-4-8:
    provider: anthropic
    tier: L
    # Named in the artifact-reader model note as the documented escalation target.
    roles: [upgrade-path]
    rates:
      input: 5.0
      output: 25.0
    pinned_at: []

  # ADDED 2026-09-23 (`lane-provider-registry`, WAVE5A, S1 of POSTWAVE-CHAIN-2026-09-22). Claude
  # Code 2.1.280 shipped `claude-opus-5-5` as the new DEFAULT Opus model -- and, per the
  # `roles.orchestrate`/`roles.plan` alias-drift note below, the bare `opus` alias a dispatch
  # line names now resolves here instead of to `claude-opus-4-8`. The row exists so the id this
  # repo's live surface can now emit is addressable, resolvable and priceable; it grants NO ROLE
  # (`roles: []`, `pinned_at: []`, same precedent as `claude-opus-5`/`grok-4.6`). Moving the
  # `orchestrate`/`plan` PIN itself to this id is explicitly OUT OF SCOPE for this lane (its
  # contract: "The orchestrate/plan pin is unchanged; the operator rules after the A/B") --
  # that pin stays `claude-opus-4-8` above.
  #
  # PRICE, from the same card as its siblings (`rate_card.as_of` covers list-price provenance
  # generally) but with its OWN `rates.source`, because $4/$20/Mtok and $0.20/Mtok cache reads
  # were not in the 2026-06-24 cache the shared card cites -- they are Claude Code 2.1.280's own
  # release content, read via `docs/audits/2026-09-23-changelog-review.md` (landing this wave
  # from branch `worktree-postwave-changelog`; at authoring time this row's citation is ahead of
  # that branch's merge to `main`, which the same wave's integrator step closes).
  #
  # `cache_read: 0.20` is an EXPLICIT OVERRIDE, not the card's derived `input * 0.1` (which would
  # read $0.40) -- Anthropic quotes this model's cache-read price outright rather than as a
  # multiple, the documented case `ModelRates.cache_read` exists for. `cache_write` carries no
  # override: no outright cache-write figure is in the source cited above, so it resolves to the
  # card's derived `input * 1.25` ($5.00), the honest default for a number nobody has quoted
  # differently.
  claude-opus-5-5:
    provider: anthropic
    tier: L
    roles: []
    rates:
      input: 4.0
      output: 20.0
      cache_read: 0.20
      source: >-
        Claude Code 2.1.280 release content ("now the default Opus model: 1M context, $4/$20
        per Mtok, $0.20/Mtok cache reads"), read via `docs/audits/2026-09-23-changelog-
        review.md` Part C / `A5`, not the shared card's 2026-06-24 cache.
    pinned_at: []

  # ADDED 2026-09-15 BY `[#787]`, AND IT IS THE ROW EVERY OTHER PROVIDER'S COMPARABILITY WAS
  # WAITING ON. `provider_bench.comparability` computes
  # `comparable = my_usd is not None and base_usd is not None and not my_gap and not base_gap`,
  # where `base_gap` is the BASELINE's own partial-pricing reason. The claude baseline bills a
  # small `claude-haiku-4-5-20251001` bookkeeping side-call on four of its ten runs (959 tokens
  # in the scored set), that id was undeclared, `price()` carried it as an unpriced remainder,
  # and `usd_is_partial` therefore went true on the baseline. So `usd_comparable` read FALSE on
  # all six rows of `logs/PROVIDER-VERDICTS.json` UNCONDITIONALLY -- not one of them for a
  # reason about that provider. No other provider could be fixed first.
  #
  # KEYED ON THE CLI-EMITTED STRING, dated suffix and all. `provider_registry.resolve_rate`
  # looks the attested id up RAW and this registry has no alias field, so a row keyed on the
  # marketing id `claude-haiku-4-5` would resolve nothing and leave the gap exactly where it
