  # PERSISTED SETTING, not a per-invocation flag — after a refused pin, later calls kept
  # using the stored id while the error pointed elsewhere, which makes a mis-pinned run
  # look like a correctly-pinned one. Plan-gated OUT of lane use until the plan is upgraded.
  # The two causes are independent: fixing PATH does not clear this one.
  # Evidence: docs/audits/2026-08-26-technical-provider-surface-v2.md
  #
  # Owner: OPERATOR. PATH is host-level state and is not the hub's to mutate; the hub tracks
  # the entry. This declares no provider and adds no key.

  deepseek:
    display_name: DeepSeek
    council_alias: deepseek
    # No CLI on this surface (`deepseek` is not on PATH) and no API client in this repo —
    # DeepSeek reaches the fleet only as an `ai-council` panel member, whose model string
    # lives in that child repo's config and is therefore not this repo's to declare — the
    # Layer-2 boundary at `CLAUDE.md` section 5 rule 4, quoted in the lane artifact.
    #
    # NO MODEL ROW, and the absence is the honest state rather than an oversight: no model id
    # for this provider is verified anywhere on this repo's live surface. The ids that appear
    # in `docs/decisions/ADR-31` / `ADR-68` (`deepseek-v4-pro`) are 2026-04/06 council-panel
    # records, unverified since, and registering a stale id is worse than registering none.
    # The operator's 2026-08-23 ask — DeepSeek through the admission pipeline — is the act
    # that produces a served, probe-verified id (standing ruling Q9 makes the substitution
    # probe a hard precondition), and the id lands with it.
    #
    # THREE INDEPENDENT ABSENCES, measured 2026-08-25. Operator-dictated correction A4, ruling
    # of 2026-08-25, applied at batch-1 integration 2026-08-26. They are recorded as three
    # separate findings and are deliberately NOT collapsed into one line: each rules out a
    # different surface, and a single merged sentence would let one surface's recovery read as
    # if it restored the provider.
    #   (1) NO OFFICIAL VENDOR CLI EXISTS. Not "not installed here" — none is published.
    #   (2) DSH CANNOT INSTALL ON THIS MACHINE. Measured, not assumed: an npm resolver
    #       livelock. The third-party path is therefore closed on this host too.
    #   (3) NOT VISIBLE IN VS CODE. No IDE extension present, so the editor surface is empty
    #       as well.
    #
    # DeepSeek is not a provider of this fleet on any surface today.
    cli: null
    version_command: null
    licence:
      status: not-applicable
      reason: >-
        Not a provider of this fleet on any surface (three independent absences measured
        2026-08-25: no official vendor CLI exists, DSH cannot install on this machine, not
        visible in VS Code). There is no route for a licence to govern.
      decided_by: operator
      decided_on: "2026-08-25"

# ===========================================================================================
# ROLES -- `[#691]`'s THIRD collection, and the one the row says is "a third thing, not a
# field rename". `models[].roles` is a per-model membership SET answering "which roles does
# this model hold"; this collection is role-keyed and ORDERED, answering "who answers for this
# role, in what order, and who answers when the first is ineligible". Both survive.
#
# THE THREE LEGS `[#691]` NAMES, and where each one lands:
#   (a) ORDER      -- list position in `order:`. A set cannot express a fallback chain; this can.
#   (b) ADMISSION  -- each entry's `admission:` block. ABSENT MEANS `unevaluated`, WHICH MEANS
#                     NOT ADMITTED -- silence does not read as permission. That equation is the
#                     whole Half A / Half B boundary: every non-Claude entry below is LISTED,
#                     addressable and trip-testable while holding no admission at all. The rule
#                     itself lives where it is enforced, in `scripts/provider_registry.is_admitted`
#                     and `ecosystem/schema/provider_registry.RoleEntry`.
#   (c) LICENCE    -- each provider's `licence:` block above. The schema refuses to mark an
#                     entry `admitted` under a non-`permitted` licence.
#
# LISTED IS NOT ELIGIBLE, and the distinction is deliberate rather than a loophole. `[#691]`'s
# Done-when says only admitted, licence-permitting providers "may appear on it" -- but the
# `[#691]` lane's contract REQUIRED agy, Grok 4.6, Copilot Enterprise and Codex terra to appear
# as NOT ADMITTED entries at THAT time, precisely so the router's two refusals could be
# trip-tested against real rows rather than against fixtures. Both were satisfied by separating
# the two acts: a provider is LISTABLE under any state, and only an `admitted` + `permitted` +
# on-the-repo-allowlist entry is ROUTABLE. `scripts/provider_router.py` is where that is
# enforced; nothing here routes anything.
#
# UPDATE 2026-09-23 (`lane-provider-registry`, WAVE5A): copilot-enterprise's `implement`-role
# entry moved to `admitted` (see that entry, and its licence above) -- so the NOT-ADMITTED
# roster this paragraph describes is now agy, Grok 4.6 and Codex terra, plus
# copilot-enterprise's OWN entries on every role other than `implement` (e.g. `read`, below).
# The trip-tests this paragraph names still pass: `tests/test_provider_router.py`'s allowlist
# and admission refusals now exercise xai/agy/Codex-terra rows instead of copilot-enterprise's,
# and a new test exercises copilot-enterprise's admitted `implement` row instead.
#
# THE ORDER BELOW IS DECLARED, NOT EARNED -- AX21-2's distinction, and stating it here is the
# point. `provider_router.rerank()` reorders these lists by MEASURED pass rate per cost over
# the `genai_spans` tally; until a role has measured calls the declared order stands, and the
# router says so rather than presenting an unmeasured list as a measured one. AX22-1's expected
# steady state on the implement role is Copilot -> Grok -> Sonnet, and it is deliberately NOT
# written below, because writing it would be the "fixed list wearing a router's name" failure
# AX21-2 exists to name. Until admission, implement order is SONNET FIRST.
#
# ALIAS DRIFT, MADE VISIBLE -- RECORDED 2026-09-23 (`lane-provider-registry`, WAVE5A, citing
# `docs/audits/2026-09-23-changelog-review.md` Part C / `A5`). Claude Code 2.1.280 made
# `claude-opus-5-5` the DEFAULT Opus model, which means the bare `opus` alias a dispatch line's
# `--model` flag names now RESOLVES to `claude-opus-5-5`, not to `claude-opus-4-8` -- the id this
# file's `orchestrate`/`plan` entries pin below. That is a silent repoint: nothing in this
# registry moved and nothing in a lane contract that says `--model opus` changed, yet the model
# actually served underneath it did. THIS REGISTRY STAYED CLEAR OF THAT DRIFT, and the reason
# is the discipline already practised below: every `order[].model` in this file names the
# VERSIONED id (`claude-opus-4-8`, `claude-sonnet-5`, `grok-4.6`, ...), not a bare CLI alias --
# so no entry here silently repointed when the alias did.
# `tests/test_provider_router.py::test_every_role_entry_pins_a_versioned_model_id_not_a_bare_alias`
# guards that this stays true. THE ORCHESTRATE/PLAN PIN ITSELF IS UNCHANGED by this lane --
# `claude-opus-4-8` stays the pinned id below; moving it to `claude-opus-5-5` is a fresh
# admission ceremony (the A/B `docs/audits/2026-09-23-changelog-review.md` Part C proposes),
# ruled by the operator on that A/B's result, not an automatic inherit from the alias moving.
# ===========================================================================================
roles:

  orchestrate:
    description: >-
      Decide what the other roles do. AX21-1: "orchestrate / plan -> Opus only". Opus-5 is what
      a lane actually dispatches at; the registry's `claude-opus-4-8` row is the id this file
      already carries, and the entry pins the PROVIDER rather than a model string this registry
      has not verified on a live surface.
    # AX21-1's one line that is NOT subject to re-ranking. The clause is quoted verbatim, and
    # enforced, on `Role.rerankable` in `ecosystem/schema/provider_registry.py`; the effect here
    # is that a cheap model scoring well on pass-rate-per-cost stays out of the seat that
    # decides what the expensive ones do -- such a promotion would be the metric's artefact
    # rather than its finding.
    rerankable: false
    routing_table_role: null   # routing-table.yaml has no orchestration row; it is CC's own seat
    order:
      - provider: anthropic
        model: claude-opus-4-8
        note: "Opus only (AX21-1). No fallback -- a degraded orchestrator is worse than a stopped one."
        admission:
          verdict: admitted
          decided_by: operator
          decided_on: "2026-09-11"
          evidence: docs/audits/2026-09-11-technical-batch-x-manifest.md
  plan:
    description: >-
      Design before build. Shares orchestrate's constraint verbatim (AX21-1 names the two
      together: "orchestrate / plan -> Opus only") and shares its reason: a plan is the artifact
      every other role executes against.
    rerankable: false
    routing_table_role: null
    order:
      - provider: anthropic
        model: claude-opus-4-8
        note: "Opus only (AX21-1), same clause and same reason as orchestrate."
        admission:
          verdict: admitted
          decided_by: operator
          decided_on: "2026-09-11"
          evidence: docs/audits/2026-09-11-technical-batch-x-manifest.md
  implement:
    description: >-
      Produce code and artifacts. AX21-1's declared target order is Copilot Enterprise (bounded,
      small) -> Grok 4.6 (multi-step, long-horizon) -> Sonnet -- but AX22-1 overrides it UNTIL
      ADMISSION: "Implement order until admission: Sonnet first." That is what is encoded here.
      2026-09-23: copilot-enterprise's ADMISSION verdict flipped to `admitted` (operator ruling
      O-3, on in-repo evidence -- see its order entry below), which is a DIFFERENT clearance
      than AX22-1's >= 8-of-10 measurement bar. ORDER stays Sonnet-first: the position swap
      AX21-1 declares is gated on that measurement specifically, not on admission in general,
      and AX21-2 makes the swap a re-rank's job, not a hand edit.
    routing_table_role: producer
    order:
      - provider: anthropic
        model: claude-sonnet-5
        note: >-
          FIRST for now. AX22-1's measurement gate ("it holds until Copilot and Grok clear the
          >= 8-of-10 bar, at which point AX21-2's re-rank -- not a hand edit -- moves them") is
          UNCHANGED by copilot-enterprise's 2026-09-23 admission below: that admission is an
          operator ruling on demonstrated fact, not the >= 8-of-10 measurement, so it does not
          itself clear this bar or move this position.
        admission:
          verdict: admitted
          decided_by: operator
          decided_on: "2026-09-11"
          evidence: docs/audits/2026-09-11-technical-batch-x-manifest.md
      - provider: copilot-enterprise
        note: >-
          ADMITTED 2026-09-23 by operator ruling O-3 (`RATIFICATION-2026-09-23-copilot.md`,
          transport-only; cited for date/author only, not as the evidence itself). The evidence is
          IN-REPO: `JOURNAL.md` lines 962 and 1113, merge `88dc48f4`, and the ab-828/ab-832
          receipts (`HANDBACK.json`, `copilot-usage.json`), which existed only on the transport
          and are committed with a provenance header at
          `docs/audits/2026-09-23-technical-copilot-admission-evidence.md`. Those two lanes were
          Copilot-produced (served `gpt-5.6-luna`) and Codex-terra-reviewed on 2026-09-16.
          THE ADMITTED INVOCATION IS THE TRANSPORT SCRIPT `run-lane-copilot.ps1`, not an in-repo
          producer verb -- that moves in-repo in wave 5b. This is an OPERATOR admission on
          demonstrated fact, not an AX22-1 >= 8-of-10 measurement: AX22-1's bar is still
          Half B's to clear, and clearing it is what would move this entry ahead of Sonnet per
          AX21-2's re-rank (not a hand edit -- position is UNCHANGED by this lane).
        admission:
          verdict: admitted
          decided_by: operator
          decided_on: "2026-09-23"
          evidence: docs/audits/2026-09-23-technical-copilot-admission-evidence.md
      - provider: xai
        model: grok-4.6
        note: >-
          NOT ADMITTED for this role. Its only recorded verdict is a REFUSED fan-out (a
          different role, 2026-08-23, floors G1+G2) and that refusal is not transferred here --
          admission is per role. AX21-3 adds a hard precondition for Half B to clear first: a
          CLI that cannot enforce a token ceiling by flag is not ordered, and grok's flags are
          unverified.
        admission:
          verdict: unevaluated
          floors: ["AX22-1", "AX21-3"]
  review:
    description: >-
      Judge a diff before merge. AX21-1 routes this to Codex terra and excludes the producing
      provider; the clause is quoted verbatim, and enforced, on `Role.excludes_producer` in
      `ecosystem/schema/provider_registry.py`.
    # AX22-2, "Reviewer != producer, always" -- the registry ENCODES the exclusion (this flag),
    # the router enforces it before dispatch, and the tally records both roles. The fallback
    # order below is AX22-2's own: "Codex terra reviews unless Codex produced; then the reviewer
    # is Grok (after admission) or Sonnet."
    excludes_producer: true
    routing_table_role: reviewer
    order:
      - provider: openai
        model: gpt-5.6-terra
        note: >-
          The standing reviewer (`ecosystem/routing-table.yaml` reviewer row, the AUTHORITY for
          role -> CLI under Z-G3 A2) and NOT ADMITTED, which is not a contradiction and is worth
          stating because it reads like one. Half A's contract names Codex terra among the four
          entries whose admission state is recorded NOT ADMITTED; AX22-1's >= 8-of-10 bar has
          measured no non-Claude provider, Codex included. The reason it stays ROUTABLE anyway
          is that the router's admission refusal is scoped to the IMPLEMENT role by this lane's
          done-contract item 1 -- "REFUSES a non-admitted provider in the implement role" -- so
          an unadmitted REVIEWER is refused by nothing. Admission and routability are separate
          questions here, and only the implement role couples them.
        admission:
          verdict: unevaluated
          floors: ["AX22-1"]
      - provider: xai
        model: grok-4.6
        # AX22-2 conditions THIS ENTRY on admission -- "the reviewer is Grok (AFTER ADMISSION)
        # or Sonnet" -- while leaving the review role itself ungated, which is what keeps Codex
        # terra routable here despite being NOT ADMITTED. A role-level gate could not express
        # the pair; this flag is where the clause actually puts the condition.
        requires_admission: true
        note: >-
          AX22-2's named fallback when Codex produced, and it is conditional on an admission
          that has not happened. So the review chain skips this position today and lands on
          Sonnet -- which is AX22-2's own terminal fallback, reached by the route the clause
          describes rather than by an edit.
        admission:
          verdict: unevaluated
          floors: ["AX22-1"]
      - provider: anthropic
        model: claude-sonnet-5
        note: >-
          AX22-2's terminal fallback, and the only one that is live today. Admitted, licensed,
          and subject to the same producer exclusion as every other entry -- Sonnet does not
          review a diff Sonnet produced.
        admission:
          verdict: admitted
          decided_by: operator
          decided_on: "2026-09-11"
          evidence: docs/audits/2026-09-11-technical-batch-x-manifest.md
  read:
    description: >-
      Locate and quote. AX21-1: "read / scan -> agy -> Copilot Enterprise -> Sonnet (locator +
      verbatim; CC verifies)". The "CC verifies" half is not a courtesy -- it is why a
      not-yet-admitted reader is still a coherent idea: a locator can be re-checked, so the
      failure mode is a wasted call rather than a false record.
    routing_table_role: null   # routing-table.yaml's fan_out is retrieval-only multi-head, a different shape
    order:
      - provider: antigravity
        note: >-
          NOT ADMITTED. Licence permits (operator's own subscription) but no admission
          measurement exists -- `[#627]` records a single `analysis` admission, which is a
          different role. AX21-1 ranks it first here; the ranking is declared, not earned.
        admission:
          verdict: unevaluated
          floors: ["AX22-1"]
      - provider: copilot-enterprise
        note: "NOT ADMITTED and licence unknown -- the same two independent blocks as on implement."
        admission:
          verdict: unevaluated
          floors: ["AX22-1"]
      - provider: anthropic
        model: claude-sonnet-5
        note: "The live terminal fallback."
        admission:
          verdict: admitted
          decided_by: operator
          decided_on: "2026-09-11"
          evidence: docs/audits/2026-09-11-technical-batch-x-manifest.md
  verify:
    description: >-
      Confirm the work holds. AX21-1: "verify -> Sonnet + the lane's RED-first tests." The tests
      are the load-bearing half and they are not a provider, which is why this role has exactly
      one entry rather than a chain: if the tests do not pass, no fallback model changes that.
    routing_table_role: null
    order:
      - provider: anthropic
        model: claude-sonnet-5
        note: "Sonnet, alongside the lane's RED-first tests (AX21-1)."
        admission:
          verdict: admitted
          decided_by: operator
          decided_on: "2026-09-11"
          evidence: docs/audits/2026-09-11-technical-batch-x-manifest.md

models:
  claude-sonnet-5:
    provider: anthropic
    # The M rung of the ADR-70 t-shirt pins. Held here as a STRING only: the tier pins
    # themselves are doctrine seams (S15/S16) and stay where they are ruled.
    tier: M
    roles: [subagent-default, workflow-verifier]
    rates:
      input: 2.0
      output: 10.0
    # The three formats R2 §3.3 names. `format` is what the checker has to parse.
    pinned_at:
      - path: .claude/agents/artifact-reader.md
        seam: S9
        format: md-frontmatter
      - path: .claude/workflows/conformance-hub.js
        seam: S10
        format: js-object-literal
      - path: protocols/PLAYBOOK.md
        seam: S17
        format: md-prose

