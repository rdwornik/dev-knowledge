    # by the checker rather than duplicated by hand.
    changelog_tool_key: claude-code
    changelog_source_url: "https://raw.githubusercontent.com/anthropics/claude-code/main/CHANGELOG.md"
    # S26 — the absolute host path `.claude/settings.json` `extraKnownMarketplaces` pins.
    # A HOST seam, not a provider seam (R2 flags it as such); recorded here because it is a
    # hardcoded absolute path in committed agent config, and the registry is where a string
    # like that gets one home and one checker.
    marketplace_id: dev-knowledge-methodology
    marketplace_source_path: 'C:\Users\1028120\Documents\Dev\.dev-knowledge'
    # `[#691]` leg (c) — the licence field the row measured as absent entirely ("grepped: zero
    # hits for licence/license/terms"). Every value below is the OPERATOR's own account status
