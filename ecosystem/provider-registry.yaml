# provider-registry.yaml — the declared source of truth for every provider, CLI and model
# string the repo's LIVE surface names.
#
# Cut from `docs/audits/2026-08-21-fresh-eyes-cloud-r2-universalization.md` §3.3, which found
# `claude-sonnet-5` hardcoded in THREE different file formats (`.md` frontmatter, a `.js`
# object literal, `.md` prose) with nothing asserting they agree. This file is that
# assertion's data.
#
# SHAPE — mirrors `ecosystem/tool-versions.yaml`, deliberately (library-first: the repo
# already has a two-key `<collection>: <id>: <fields>` ecosystem-state shape and this does not
# invent a second one). Two collections:
#   providers:  a vendor, the CLI that reaches it, and the host-side config that pins it
#   models:     every model string the repo names, with the role and the sites that pin it
#
# HOW IT IS READ:
#   - sites that CAN read YAML at runtime read it via `scripts/provider_registry.py`
#     (today: `scripts/changelog_sentinel.py`);
#   - sites that CANNOT (frontmatter, a JS object literal, committed prose, a JSON config)
#     are held in agreement with it by `scripts/check_provider_registry.py`, exercised by
#     `tests/test_provider_registry.py`.
# A checker is the honest mechanism for the second class: repointing a `.md` frontmatter key
# at a YAML file is not possible, so the registry becomes the value's home and the checker
# becomes the coupling.
#
# SCOPE, stated so this file is not read as more than it is. It covers the NINE table-edit
# seams R2 §3.2 enumerates — S7, S8, S9, S10, S11, S17, S26, S29, S30. The TWELVE doctrine
# seams (S1, S12, S15, S16, S18, S19, S20, S21, S22, S23, S28, S17-partial) and the TEN code
# seams (S2, S3, S4, S5, S13, S14, S24, S25, S27, S6-for-a-third-provider) are out of scope by
# construction: the first are ADR / recorded-ruling surfaces, the second are real ports.
#
# ROUTING IS NOT HERE. R2 §3.3 records that the canonical model-routing table is
# `~/.claude/ROUTING.md` — at L0, outside this repository — as are the reviewer pin
# (`~/.claude/bin/codex-review.ps1`) and the Codex config (`~/.codex/config.toml`). That
# boundary is an open operator decision, restated in
# `docs/audits/2026-08-22-fresh-eyes-cloud-4v2.md`. This registry records model IDENTITY, not
# which model gets routed to which job.
#
# S11 is a canonical-DOC seam, not a model seam: the verifier scan list in
# `.claude/workflows/conformance-hub.js` names VISION.md/ARCHITECTURE.md/CLAUDE.md/
# CONTRIBUTING.md/protocols/ESSENTIALS.md. It is repointed at the sibling canonical-doc-name
# registry (`scripts/canonical_docs.py`) and asserted by `tests/test_canonical_docs.py`.

# SCHEMA — declared, as of LANE L1 (2026-08-23), in `ecosystem/schema/provider_registry.py`
# (pydantic; the sibling of `ecosystem/schema/desired_state.py`). `scripts/provider_registry.py`
# validates through it on every load, so the sentinel, the checker and the suite all parse this
# file against one contract instead of against whichever accessor happens to read a key.
# `extra="forbid"`: a key not in that module is a BLOCKED commit, not inert data.
#
# CONFIGURATION IS NOT GATED ON ADMISSION. A provider that failed an admission floor is still
# configured here, still addressable, still in the closed vocabulary — it simply holds no role.
# `role_admission:` records WHY a role is not held; it is optional, and a row carrying none is
# exactly as valid as one that does. The governing record, with the ADR-98 section 3 test, is
# `docs/audits/2026-08-23-technical-lane-provider-config.md` section 6.

providers:
  anthropic:
    display_name: Anthropic
    council_alias: claude
    cli: claude
    # Local, no-network version probe. Read by scripts/changelog_sentinel.py (S7).
    version_command: ["claude", "--version"]
    # S8 — the key this provider's CLI carries in ecosystem/tool-versions.yaml, and the
    # changelog source that file records. tool-versions.yaml stays the DURABLE
    # last-reviewed record (ADR-80 §3); this is the identity half of it, held in agreement
    # by the checker rather than duplicated by hand.
    changelog_tool_key: claude-code
    changelog_source_url: "https://raw.githubusercontent.com/anthropics/claude-code/main/CHANGELOG.md"
    # S26 — the absolute host path `.claude/settings.json` `extraKnownMarketplaces` pins.
    # A HOST seam, not a provider seam (R2 flags it as such); recorded here because it is a
    # hardcoded absolute path in committed agent config, and the registry is where a string
    # like that gets one home and one checker.
    marketplace_id: dev-knowledge-methodology
    marketplace_source_path: 'C:\Users\1028120\Documents\Dev\.dev-knowledge'

  openai:
    display_name: OpenAI
    council_alias: openai
    cli: codex
    version_command: ["codex", "--version"]
    changelog_tool_key: codex
    changelog_source_url: "https://github.com/openai/codex/releases"

  copilot-enterprise:
    display_name: GitHub Copilot Enterprise
    # NOT a council panellist -- it is a reviewer / adversarial / analysis provider, so the
    # alias is null rather than a name the council roster does not carry.
    council_alias: null
    cli: copilot
    version_command:
      - copilot
      - --version
  # copilot-enterprise operational doctrine is NOT stored here -- this registry is a thin
  # provider/CLI identity surface and its schema forbids the extra fields. The measured
  # capability profile (284.3k context floor, the 75% payload gate, sonnet-5 default vs
  # opus-5 reserved, gpt-5-mini as the only cross-vendor model) and the BILLING VERDICT live
  # in `~/.claude/ROUTING.md`, which is L0 and outside this repo.
  #
  # Billing, ratified by the operator 2026-08-29 after a witness test: consumption is metered
  # to the ENTERPRISE ORG SEAT (org BY-Product-Development) and is visible ONLY on that org's
  # Copilot billing page, which needs `admin:org`. A zero on the user premium-requests meter
  # is CORRECT and is not a routing defect -- that meter tracks Copilot INDIVIDUAL
  # subscriptions and neither account holds one. NO FURTHER PROBING from our side.
  xai:
    display_name: xAI
    council_alias: grok
    # PRESENCE REPAIRED 2026-08-25 (lane RL, presence-only truth-up). The 2026-08-23 note
    # this replaces recorded `cli: null` on the basis that `grok` was "not on PATH"; that is
    # no longer the state of this host, and the entry contradicted it.
    #   BASIS, re-measured on this host 2026-08-25 rather than transcribed:
    #     Get-Command grok  ->  Application  C:\Users\1028120\.grok\bin\grok.exe
    #     grok --version    ->  `grok 1.0.5 (5115b46bc9) [stable]`  (exit 0)
    # PRESENCE ONLY. This repairs what the registry says is INSTALLED. It grants no role,
    # revisits no admission verdict, and says nothing about which route the 2026-08-20/23
    # A/B runs actually used (those reached xAI over raw HTTPS) — roles are R3's.
    #
    # POISONED NAME — `agent` is an un-pinnable token, and this is the entry recording why.
    # `C:\Users\1028120\.grok\bin\agent.exe` is BYTE-IDENTICAL to `grok.exe`:
    #     SHA256(grok.exe) == SHA256(agent.exe)
    #       == 4B924DAA801663EA20E96382408B1F2B5BA39EFAD62C14D20D88618A9EB0BE64
    #   (Get-FileHash over both files, this host, 2026-08-25.)
    # A registry row, probe or doc naming the bare token `agent` therefore names a binary
    # whose identity is indistinguishable from grok's by name alone. Only unambiguous names
    # are pinned here; `agent` is recorded as un-pinnable rather than left to be rediscovered.
    #
    # COST REGIME — MEASURED, and it is the fact that governs how this provider may be
    # used at all (2026-08-26, provider surface v2). `grok` is **PAY-PER-CALL, not a
    # subscription**: one small test cost **$0.037**, with the credential proven by a
    # server round-trip. Consequence, recorded because it is a shape constraint and not a
    # preference: POINT-USE ONLY; fan-out is outside this route's envelope. A review lane or
    # a judge panel multiplies a per-call price by its width, so a fan-out shape gets costed
    # BEFORE dispatch, not after. This is a cost fact about the route; it grants no role.
    # CLAUDE.md-NATIVE, measured by execution 2026-08-26 (probe #42): `grok` picks
    # CLAUDE.md over a planted AGENTS.md — the opposite of `agy` and codex, which is why
    # ADR-115's criterion is met on a SPLIT field rather than a uniform one.
    # Evidence: docs/audits/2026-08-26-technical-provider-surface-v2.md
    cli: grok
    version_command: ["grok", "--version"]

  google:
    display_name: Google
    council_alias: gemini
    # STATUS CORRECTED 2026-08-25 (lane RL). The note this replaces said "the CLI is live on
    # this surface". That conflated two different facts, and the registry asserted the
    # stronger one. Both halves, each re-measured on this host today:
    #   BINARY PRESENT — `gemini` resolves on PATH
    #     (C:\Users\1028120\AppData\Roaming\npm\gemini.ps1) and `gemini --version` prints
    #     `0.56.0` at exit 0. This is why `cli:` below stays `gemini`: the probe the
    #     SessionStart sentinel runs is a local version read, and it still works.
    #   SERVED ROUTE DEAD on this tier — a real model call refuses before any token is
    #     spent. Measured 2026-08-25 with `GEMINI_API_KEY` stripped:
    #       gemini -p "say ok"
    #       -> Error authenticating: IneligibleTierError: This client is no longer
    #          supported for Gemini Code Assist for individuals ... migrate to the
    #          Antigravity suite   (reasonCode: UNSUPPORTED_CLIENT, tierId: free-tier)
    #     This is a SERVER refusal of the client, not an expired token, so re-authenticating
    #     does not clear it. The only documented way past it is an API key, which the
    #     standing auth ruling forbids.
    # RETIRED BY OPERATOR RULING (2026-08-26, provider surface v2). The gemini CLI is
    # retired for this fleet's use. The distinction that makes it a retirement rather than
    # a wait: `UNSUPPORTED_CLIENT` is the SERVER refusing this CLIENT, not a tier refusing
    # a request — so no amount of re-auth, quota or patience clears it, and the only
    # documented way past it is an API key the standing auth ruling forbids. `agy` is the
    # channel to Google models and it carries the operator's own subscription.
    # The `cli:`/`version_command:` pair below STAYS: the SessionStart probe is a local
    # version read and it still exits 0, and deleting a working probe to express a policy
    # would make the sentinel blind rather than make the ruling true.
    # Evidence: docs/audits/2026-08-26-technical-provider-surface-v2.md
    # PRESENCE/BASIS/DATE ONLY — this records what the host does, grants no role and
    # revisits no admission verdict. The live route to this vendor's models is the separate
    # `antigravity` provider below; whether that route may be USED is not this file's call.
    #
    # NO `changelog_tool_key` / `changelog_source_url`, deliberately and with the discharge
    # path named. Those two keys are the S8 half of `ecosystem/tool-versions.yaml`, whose rows
    # carry `last_reviewed_version` + `reviewed_date` — an ADR-80 DURABLE record of a review
    # the OPERATOR performed. Writing a row here would either fabricate that act or seed a row
    # the sentinel is structurally silent on (`parse_version("") -> None -> is_newer False`).
    # Discharge: run `/changelog-review` against the gemini CLI once; the tool-versions row and
    # these two keys then land together, and the S8 check begins asserting on the same commit.
    cli: gemini
    version_command: ["gemini", "--version"]

  antigravity:
    display_name: Antigravity (Google)
    # NOT PANELLED — `protocols/AI_COUNCIL_PROCESS.md` names no Antigravity seat, and
    # `council_alias: null` is the declaration for that (check_s31_council_panel).
    council_alias: null
    # REGISTERED PRESENT 2026-08-25 (lane RL) — a live, authenticated, first-on-PATH runtime
    # that was entirely unregistered while the registry described the host. Every fact below
    # was re-derived on this host today with the command shown; none is transcribed.
    #   PRESENT   Get-Command agy -> Application
    #             C:\Users\1028120\AppData\Local\agy\bin\agy.exe
    #   VERSION   agy --version -> `1.1.20` (exit 0)
    #   VERSION   1.1.21 as re-measured 2026-08-26 (provider surface v2). The 1.1.20
    #             reading above is kept as the 2026-08-25 basis rather than overwritten.
    #   AGENTS.md-NATIVE, measured by EXECUTION 2026-08-26 (intake #42, probe #42):
    #             planted `AGENTS-4711` / `CLAUDE-8822` probe files settled instruction-
    #             file precedence by running the CLI, not by reading its docs. `agy`
    #             picks AGENTS.md. This is the measured half of ADR-115's criterion C01.
    #             Evidence: docs/audits/2026-08-26-technical-provider-surface-v2.md
    #   AUTH      `agy models` exits 0 having FETCHED the roster from the server. That
    #             round-trip is the auth evidence, and it is deliberately the only auth
    #             claim made here: agy's own status/envelope `status` field is known to
    #             report ERROR while carrying a complete answer, so it is not evidence.
    #   PATH      entry 19 of 39 — AHEAD of C:\Users\1028120\.grok\bin (20),
    #             AppData\Roaming\npm (28, gemini + codex) and .local\bin (29).
    #             First on PATH among the vendor agent CLIs on this host.
    #   SERVED    families returned by `agy models`, 2026-08-25:
    #             gemini-3.7-flash-{high,medium,low} · gemini-3.6-flash-{high,medium,low} ·
    #             gemini-3.5-flash-{high,medium,low} · gemini-3.1-pro-{high,low} ·
    #             claude-sonnet-4-6 · claude-opus-4-6-thinking · gpt-oss-120b-medium
    #
    # NO ROLE, AND THE CONSEQUENCE IS NAMED RATHER THAN ACTED ON. Admitting `agy` would give
    # the REFUSED `gemini-3.7-flash` family a SECOND route to this fleet — the served list
    # above carries it directly. That is a `[#578]` RERUN QUESTION, not a registry act: this
    # row records that the route exists and stops there. R3 owns roles; nothing here admits,
    # refuses, or re-opens an admission verdict.
    #
    # NO `changelog_tool_key` / `changelog_source_url`, for the reason the `google` row above
    # states in full: those are the S8 half of `ecosystem/tool-versions.yaml`, whose rows
    # record an OPERATOR review that has not happened for this CLI. Discharge is one
    # `/changelog-review` run, after which both land together.
    cli: agy
    version_command: ["agy", "--version"]

  # CURSOR — BLOCKED-WITH-CAUSE (was: ABSENT). Operator-dictated correction A5, ruling of
  # 2026-08-25, applied at batch-1 integration 2026-08-26; the content is the operator's, not
  # the integrator's.
  #
  # The earlier ABSENT reading was wrong in kind, not merely in degree: cursor is not missing,
  # it is SHADOWED. The cause is the poisoned-name collision — Grok owns `agent` on this PATH
  # (`agent.exe` is byte-identical to `grok.exe` by SHA256), and PATH index 19 shadows a
  # correct install at index 28. Operator-confirmed in practice, not inferred.
  #
  # Remedy, named so the entry is actionable rather than merely accurate: PATH reordering, or
  # pinning `cursor-agent` only.
  #
  # SECOND, INDEPENDENT CAUSE — PLAN-GATED (measured 2026-08-26, provider surface v2).
  # Even with the PATH collision resolved, `cursor-agent` answers but CANNOT carry a lane:
  # on the free plan it refuses every named model (`Named models unavailable — Free plans
  # can only use Auto`). "Auto" is a SELECTION MODE, not a model, and Cursor does not
  # disclose what served a call — so an undisclosed model is an UNREPRODUCIBLE RESULT, and
  # a lane whose result cannot be reproduced is not evidence. Also measured: `--model` is a
  # PERSISTED SETTING, not a per-invocation flag — after a refused pin, later calls kept
  # using the stored id while the error pointed elsewhere, which makes a mis-pinned run
  # look like a correctly-pinned one. Plan-gated OUT of lane use until the plan is upgraded.
  # The two causes are independent: fixing PATH does not clear this one.
  # Evidence: docs/audits/2026-08-26-technical-provider-surface-v2.md
  #
  # Owner: OPERATOR. PATH is host-level state and is not the hub's to mutate; the hub tracks
  # the entry. This declares no provider and adds no key.

  deepseek:
    display_name: DeepSeek
    council_alias: deepseek
    # No CLI on this surface (`deepseek` is not on PATH) and no API client in this repo —
    # DeepSeek reaches the fleet only as an `ai-council` panel member, whose model string
    # lives in that child repo's config and is therefore not this repo's to declare — the
    # Layer-2 boundary at `CLAUDE.md` section 5 rule 4, quoted in the lane artifact.
    #
    # NO MODEL ROW, and the absence is the honest state rather than an oversight: no model id
    # for this provider is verified anywhere on this repo's live surface. The ids that appear
    # in `docs/decisions/ADR-31` / `ADR-68` (`deepseek-v4-pro`) are 2026-04/06 council-panel
    # records, unverified since, and registering a stale id is worse than registering none.
    # The operator's 2026-08-23 ask — DeepSeek through the admission pipeline — is the act
    # that produces a served, probe-verified id (standing ruling Q9 makes the substitution
    # probe a hard precondition), and the id lands with it.
    #
    # THREE INDEPENDENT ABSENCES, measured 2026-08-25. Operator-dictated correction A4, ruling
    # of 2026-08-25, applied at batch-1 integration 2026-08-26. They are recorded as three
    # separate findings and are deliberately NOT collapsed into one line: each rules out a
    # different surface, and a single merged sentence would let one surface's recovery read as
    # if it restored the provider.
    #   (1) NO OFFICIAL VENDOR CLI EXISTS. Not "not installed here" — none is published.
    #   (2) DSH CANNOT INSTALL ON THIS MACHINE. Measured, not assumed: an npm resolver
    #       livelock. The third-party path is therefore closed on this host too.
    #   (3) NOT VISIBLE IN VS CODE. No IDE extension present, so the editor surface is empty
    #       as well.
    #
    # DeepSeek is not a provider of this fleet on any surface today.
    cli: null
    version_command: null

models:
  claude-sonnet-5:
    provider: anthropic
    # The M rung of the ADR-70 t-shirt pins. Held here as a STRING only: the tier pins
    # themselves are doctrine seams (S15/S16) and stay where they are ruled.
    tier: M
    roles: [subagent-default, workflow-verifier]
    # The three formats R2 §3.3 names. `format` is what the checker has to parse.
    pinned_at:
      - path: .claude/agents/artifact-reader.md
        seam: S9
        format: md-frontmatter
      - path: .claude/workflows/conformance-hub.js
        seam: S10
        format: js-object-literal
      - path: protocols/PLAYBOOK.md
        seam: S17
        format: md-prose

  claude-opus-4-8:
    provider: anthropic
    tier: L
    # Named in the artifact-reader model note as the documented escalation target.
    roles: [upgrade-path]
    pinned_at: []

  gpt-5.6-terra:
    provider: openai
    # The doctrinal review lane (PLAYBOOK). The PIN lives at L0
    # (`~/.claude/bin/codex-review.ps1`, S19) and is therefore NOT asserted from this repo —
    # the id is registered so a provenance attribution naming it resolves.
    roles: [reviewer]
    pinned_at: []

  gpt-5.6-sol:
    provider: openai
    roles: [provenance]
    attribution_token: "gpt-5.6-sol"
    pinned_at:
      - path: ecosystem/satellite-onboarding-rulings.yaml
        seam: S29
        format: yaml-provenance

  grok-l5:
    provider: xai
    roles: [provenance]
    # The on-disk attribution is the prose form `grok L5`, not the id.
    attribution_token: "grok L5"
    pinned_at:
      - path: pyproject.toml
        seam: S30
        format: comment-provenance

  # --- the two 2026-08-23 admission candidates -------------------------------------------
  # Both are REFUSED for the fan-out role and both are CONFIGURED here anyway. That is the
  # point, not an oversight: the refusal governs role eligibility and nothing else. Each id
  # below is the string the provider ACTUALLY SERVED, re-recorded on every scored round of the
  # local run — standing ruling Q9 makes that substitution probe a hard precondition, after a
  # client quietly serving `grok-4.5` cost a window ([#492]).

  grok-4.6:
    provider: xai
    # Holds no role: the fan-out candidacy it was run for was refused. The row exists so the
    # id is addressable, resolvable and in the vocabulary regardless.
    roles: []
    role_admission:
      fan-out:
        verdict: refused
        decided_by: architect
        decided_on: "2026-08-23"
        # `G1 v2 = (a) AND (b) AND (c)  ...  grok FAIL` (evidence section 7.1), and G2 fails
        # separately — the mitigated-rerun analysis records "G2 still fails on grok".
        floors: ["G1", "G2"]
        evidence: docs/audits/2026-08-23-technical-lane-562-local-admission.md
        rerun_carrier: "[#578]"
    pinned_at: []

  gemini-3.7-flash:
    provider: google
    roles: []
    role_admission:
      fan-out:
        verdict: refused
        decided_by: architect
        decided_on: "2026-08-23"
        # `G1 v2 = (a) AND (b) AND (c)  gemini FAIL` (evidence section 7.1). G2 was not the
        # leg it failed on, so it is not claimed here.
        floors: ["G1"]
        evidence: docs/audits/2026-08-23-technical-lane-562-local-admission.md
        rerun_carrier: "[#578]"
    pinned_at: []
