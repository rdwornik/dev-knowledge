# provider-registry.yaml — the declared source of truth for every provider, CLI and model
# string the repo's LIVE surface names.
#
# Cut from `docs/audits/2026-08-21-fresh-eyes-cloud-r2-universalization.md` §3.3, which found
# `claude-sonnet-5` hardcoded in THREE different file formats (`.md` frontmatter, a `.js`
# object literal, `.md` prose) with nothing asserting they agree. This file is that
# assertion's data.
#
# SHAPE — mirrors `ecosystem/tool-versions.yaml`, deliberately (library-first: the repo
# already has a two-key `<collection>: <id>: <fields>` ecosystem-state shape and this does not
# invent a second one). Two collections:
#   providers:  a vendor, the CLI that reaches it, and the host-side config that pins it
#   models:     every model string the repo names, with the role and the sites that pin it
#
# HOW IT IS READ:
#   - sites that CAN read YAML at runtime read it via `scripts/provider_registry.py`
#     (today: `scripts/changelog_sentinel.py`);
#   - sites that CANNOT (frontmatter, a JS object literal, committed prose, a JSON config)
#     are held in agreement with it by `scripts/check_provider_registry.py`, exercised by
#     `tests/test_provider_registry.py`.
# A checker is the honest mechanism for the second class: repointing a `.md` frontmatter key
# at a YAML file is not possible, so the registry becomes the value's home and the checker
# becomes the coupling.
#
# SCOPE, stated so this file is not read as more than it is. It covers the NINE table-edit
# seams R2 §3.2 enumerates — S7, S8, S9, S10, S11, S17, S26, S29, S30. The TWELVE doctrine
# seams (S1, S12, S15, S16, S18, S19, S20, S21, S22, S23, S28, S17-partial) and the TEN code
# seams (S2, S3, S4, S5, S13, S14, S24, S25, S27, S6-for-a-third-provider) are out of scope by
# construction: the first are ADR / recorded-ruling surfaces, the second are real ports.
#
# ROUTING IS NOT HERE — AMENDED 2026-09-12 BY `[#691]`, AND THE AMENDMENT IS NARROW.
#
# What this paragraph said, and why it was right when written: R2 §3.3 recorded the canonical
# model-routing table as `~/.claude/ROUTING.md`, at L0, outside this repository — as were the
# reviewer pin (`~/.claude/bin/codex-review.ps1`) and the Codex config (`~/.codex/config.toml`).
# Two things have happened since. Register ruling **Z-G3 amendment A2** moved the authoritative
# role -> CLI table IN-REPO, to `ecosystem/routing-table.yaml`; and `[#691]`'s frozen Done-when
# requires THIS file to gain "a role entry with an ORDERED fallback list".
#
# So there are now two role-keyed surfaces, and they are NOT rivals — the distinction is what
# keeps this from becoming the four-rival-dispatch-commands disease in a new costume:
#
#   `ecosystem/routing-table.yaml`   role -> CLI. FOUR coarse roles (producer, reviewer,
#                                    adversarial, fan_out), one CLI each. The AUTHORITY for
#                                    which CLI runs a role (Z-G3 A2), and the surface
#                                    `check_routing_agreement` holds against the L0 copy.
#   `roles:` BELOW                   role -> ORDERED provider list, with per-entry admission,
#                                    the reviewer-not-producer exclusion and re-rankability.
#                                    SIX fine-grained AX21-1 roles. This is a RANKING, not an
#                                    authority over which CLI a role runs on.
#
# The vocabularies deliberately differ (4 coarse vs 6 fine) because they answer different
# questions, and collapsing them would make one of the two lie. Where a correspondence is real
# it is declared in `routing_table_role:` and ASSERTED by `check_provider_registry`; where it is
# not real the field is null, because a lossy mapping written to fill a field manufactures
# exactly the drift the link exists to detect.
#
# STILL NOT HERE: model-tier doctrine. That remains L0 (ARCHITECTURE Ch3, ruled 2026-08-22).
# This registry records model IDENTITY and, as of `[#691]`, ROLE RANKING — not tier doctrine.
#
# S11 is a canonical-DOC seam, not a model seam: the verifier scan list in
# `.claude/workflows/conformance-hub.js` names VISION.md/ARCHITECTURE.md/CLAUDE.md/
# CONTRIBUTING.md/protocols/ESSENTIALS.md. It is repointed at the sibling canonical-doc-name
# registry (`scripts/canonical_docs.py`) and asserted by `tests/test_canonical_docs.py`.

# SCHEMA — declared, as of LANE L1 (2026-08-23), in `ecosystem/schema/provider_registry.py`
# (pydantic; the sibling of `ecosystem/schema/desired_state.py`). `scripts/provider_registry.py`
# validates through it on every load, so the sentinel, the checker and the suite all parse this
# file against one contract instead of against whichever accessor happens to read a key.
# `extra="forbid"`: a key not in that module is a BLOCKED commit, not inert data.
#
# CONFIGURATION IS NOT GATED ON ADMISSION. A provider that failed an admission floor is still
# configured here, still addressable, still in the closed vocabulary — it simply holds no role.
# `role_admission:` records WHY a role is not held; it is optional, and a row carrying none is
# exactly as valid as one that does. The governing record, with the ADR-98 section 3 test, is
# `docs/audits/2026-08-23-technical-lane-provider-config.md` section 6.

# RATES — ADDED 2026-09-14 BY `[#751]`, AND THE ROSTER'S PREMISE IS CORRECTED HERE.
#
# Until this block existed there was NO machine-readable rate, price or USD field anywhere in
# this file. Its only cost content was prose: the measured `$0.037` test call recorded under
# the `grok` provider's COST REGIME. `[#751]`'s roster line read as though the rates were here
# to be read; they were not, so the lane AUTHORS them. That correction is recorded rather than
# quietly absorbed, because a lane that silently rewrites a premise leaves nothing for the next
# reader to check.
#
# WHERE A PRICE LIVES, and why it is in two places that are not two homes for one fact:
#
#   `rate_card:` BELOW      the currency, the unit, the DATE the card was true on, its
#                           provenance, and the two cache multipliers. ONE fact about the whole
#                           card, declared once. Repeating it on every model row would be the
#                           restated-constant defect this file exists to end.
#   `models.<id>.rates:`    what THAT model costs. A property of the model, so it sits on the
#                           model's own row: adding a model cannot leave its price somewhere
#                           else to be forgotten, and deleting one cannot orphan a price.
#
# A MODEL WITH NO `rates:` BLOCK IS UNPRICED, AND UNPRICED IS NOT FREE. `provider_registry.
# resolve_rate` raises `RateUnavailable` naming the model rather than returning zero, and every
# report built on it carries the unpriced spend as its own line instead of folding it into a
# total. That is deliberate and it is the whole safety property: a rate of 0.0 meets any budget
# spectacularly and means nothing — the same failure `merge_receipt` records for a 0.0-minute
# receipt. The five non-Anthropic ids below are unpriced for the honest reason: no per-token
# rate for them has been established in this repo. `grok`'s one MEASURED datum is a whole-call
# price ($0.037 for one small call), not a per-token rate, and inflating it into one would
# manufacture a number rather than record one.
#
# CACHE TOKENS ARE MULTIPLIERS, NOT SEPARATE QUOTES, because that is the shape the published
# rates actually have: a cache write is a stated multiple of the input rate and a cache read
# another. So the two multipliers are declared once here and `cache_write` / `cache_read` on a
# model row are OVERRIDES, present only where a vendor quotes the number outright instead of as
# a multiple. Today none is overridden. This matters more than it looks: on this repo's own
# transcripts cache reads outnumber fresh input tokens by orders of magnitude, so a reader that
# priced them at the input rate — or at nothing — would be wrong by more than the bill.
#
# THE `as_of` DATE IS PART OF THE FACT. These are list prices as carried by the `claude-api`
# skill's cached model table, whose own header states the cache date; that date is reproduced
# below rather than today's, because a card stamped with the day it was COPIED tells a reader
# it is current when it is not. A rate that has moved since is a re-read of the source, not a
# re-stamp of this file.
rate_card:
  currency: USD
  unit: per_million_tokens
  as_of: "2026-06-24"
  basis: list-price
  source: >-
    Anthropic first-party API list prices, as carried by the `claude-api` skill's cached
    "Current Models" table (cache date 2026-06-24, reproduced in `as_of`). Partner-operated
    routes (Bedrock, Vertex) price separately and are NOT covered by this card.
  # A cache write costs 1.25x the input rate; a cache read 0.1x. Declared here once and applied
  # by `provider_registry.resolve_rate` — nothing in `scripts/lane_cost.py` knows either number,
  # which is what makes an edit to this file move every dollar figure the repo reports.
  cache_write_multiplier: 1.25
  cache_read_multiplier: 0.1

