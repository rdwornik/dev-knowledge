# Tool changelog-review state — ADR-80 DURABLE record (COMMITTED).
#
# This is NOT the gitignored mutable `ecosystem/<repo>/state.yaml` pointer. It
# records a DURABLE operator decision: the last tool version whose changelog the
# operator has actually reviewed (per tool). It changes only when /changelog-review
# runs after a real review (#113) — low-churn, audit-worthy → committed (ADR-80 §3
# mutable/durable split).
#
# Read LOCALLY (no network) by the SessionStart sentinel
# (scripts/changelog_sentinel.py): if an installed version is NEWER than its
# last_reviewed_version, the sentinel nudges the operator to run /changelog-review.
# The changelog FETCH itself happens only inside the operator-invoked
# /changelog-review command (push trigger — never scheduled, never automatic).
#
# Seed (2026-06-07): claude-code = 2.1.167 (last full review = the audit-trio), codex
# = 0.136.0. Installed at seed time: claude 2.1.168, codex 0.136.0 — so the sentinel
# fires for claude-code (gap) and is silent for codex (current).
tools:
  claude-code:
    # 2.1.205-2.1.281 reviewed 2026-09-23 (digest: docs/audits/2026-09-23-changelog-review.md);
    # installed 2.1.281. 3 ADOPT (/skill-doctor, /doctor CLAUDE.md-trim check, omitClaudeMd
    # agent frontmatter -- SEED doc docs/intake/2026-09-23-changelog-review-seeds.md,
    # intake-id 105), 0 OBSOLETES, 0 STALE-NAMES (TaskOutput removal and codex --full-auto
    # removal both checked against live repo files -- no drift), 3 VERIFY (V1 Task/Todo tools
    # gated off Sonnet 5/Opus 5.5 unless CLAUDE_CODE_ENABLE_TODO_TOOLS=1; V2 Monitor persistent
    # option removed, now a hard deadline; V3 a worktree-isolation Bash false positive hit live
    # in this session, not one of the documented fixed shapes), ~2000+ entries across 77
    # versions mostly NOISE (background/worktree/Windows reliability fixes land free; VSCode,
    # Claude Tag, Claude Code on the web, enterprise-gateway features are out of scope for our
    # stack). This review closed a 2.5-month gap (previous review 2026-07-09) -- the operator's
    # own standing request had gone unactioned, per the same neglect pattern RATIFICATION notes
    # for Copilot. Prior: 2.1.204 reviewed 2026-07-09.
    last_reviewed_version: "2.1.281"
    reviewed_date: "2026-09-23"
    source_url: "https://raw.githubusercontent.com/anthropics/claude-code/main/CHANGELOG.md"
  codex:
    # 0.156.1 (last stable in range) reviewed 2026-09-23 (digest:
    # docs/audits/2026-09-23-changelog-review.md); reviewed AHEAD of whatever is installed is
    # intended. ~30 stable releases (0.144.0-0.156.1) all NOISE for our /codex-review-only usage
    # -- dominated by the "Guardian" automatic-approval-review subsystem, a new voice mode and
    # fullscreen TUI, and further Windows sandbox hardening, none of which touches our narrow
    # non-interactive `codex exec` reviewer usage. The `codex exec --full-auto` flag removal
    # (~0.144.0) was checked against live repo files -- appears only in immutable historical
    # audits, no drift. Alphas/pre-releases skipped throughout. Prior: 0.143.0 reviewed
    # 2026-07-09.
    last_reviewed_version: "0.156.1"
    reviewed_date: "2026-09-23"
    source_url: "https://github.com/openai/codex/releases"
