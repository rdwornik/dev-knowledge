# Deployed methodology-corpus version per repo — ADR-91 DURABLE record (COMMITTED).
#
# This is NOT the gitignored ecosystem/<repo>/state.yaml (mutable audit pointer) and NOT
# the derived ecosystem/index.yaml (audit.py::regenerate_index overwrites it WHOLESALE each
# run — a field written there is clobbered). It records a DURABLE per-repo fact: which
# methodology-corpus release (the ADR-91 git tag vMAJOR.MINOR.PATCH) is deployed to each repo.
# Modeled 1:1 on the ecosystem/tool-versions.yaml pattern: committed · written-by-command ·
# read-by-a-check — same pattern, a new axis (repo-keyed deployed-corpus-version, not
# tool-keyed reviewed-changelog-version), so a dedicated file, not a fold.
#
# WRITE-CONTRACT: the fields are written by the DEPLOY-RUNBOOK (`deploy/tool.py --execute`)
# at deploy time. The runbook sets `deployed_methodology_version` to the corpus release it
# deployed, `deployed_date` to the deploy date, and `source_tag` to the hub git tag (e.g.
# v1.0.0). Do NOT hand-fabricate a value: a value cannot precede its release. Baseline
# v1.0.0 is tagged and the runbook is built + proven on n=1 — `ai-council` is populated
# below (deploy run #1); the hub and the not-yet-deployed repos stay `null` (pre-deploy).
#
# READ: audit.py::check_deployed_methodology_version reads THIS file (per repo, by repo dir
# name) and reports status — `n/a` while null (no release deployed yet), `pass` with the
# version once set — surfaced per-repo through scripts/fleet_health.py.
#
# Layer-2 read-only, yaml.safe_load, one concern per file (the doc-code-edge.yaml /
# tool-versions.yaml precedent). Keyed by repo directory name (the audit's repo id).
repos:
  .dev-knowledge:
    # The hub IS the methodology source; its entry = the release the hub itself is at.
    deployed_methodology_version: null
    deployed_date: null
    source_tag: null
  ai-council:
    deployed_methodology_version: "1.3.1"
    deployed_date: "2026-07-11"
    source_tag: "v1.3.1"
  corp-monorepo:
    # Stays 1.2.0 BY DESIGN — corp's hub-block pin v1.3.1 is an enforcement-gate carrier
    # repoint (2 hooks), not a corpus deploy; modeled as ADR-102 gate_rev_ahead in
    # parity-surfaces.yaml. #336/ADR-102 (Accepted 2026-07-17) ruled NOT to bump,
    # superseding corp JOURNAL:937's owed-bump note. Do not "fix" to 1.3.1.
    deployed_methodology_version: "1.2.0"
    deployed_date: "2026-07-07"
    source_tag: "v1.2.0"
  corp-ops:
    deployed_methodology_version: null
    deployed_date: null
    source_tag: null
  corp-sca-time-automation:
    deployed_methodology_version: null
    deployed_date: null
    source_tag: null
  terminal-setup:
    # ADMITTED pre-deploy, 2026-08-29 ([#604] fold) — same shape and same reason as the
    # win-tooling admission below carried before its deploy: the registry key is a
    # PRECONDITION (`deploy/tool.py` refuses an unregistered repo before it reads a
    # manifest), not a claim that anything was deployed. All three fields stay null.
    # terminal-setup is a declared fleet member (ADR-104, registered 2026-08-01 [#462])
    # that is methodology-unonboarded: 2 commits, no VISION.md, no CLAUDE.md, no deploy
    # record. Its onboarding PROFILE is ruled separately in
    # ecosystem/satellite-onboarding-rulings.yaml. This key does NOT flip the parity role
    # — `ecosystem/parity-surfaces.yaml` keeps terminal-setup `pre-deploy` until a deploy
    # actually lands, which is exactly the correction [#604] exists to preserve.
    deployed_methodology_version: null
    deployed_date: null
    source_tag: null
  win-tooling:
    # DEPLOYED 2026-08-29 — release v1.4.0, the wave-3 first slice ([#606]). Admitted
    # pre-deploy 2026-08-26 with all fields null (evidence:
    # docs/audits/2026-08-26-technical-w3prep-recon.md, blocker B2, step 2); this is the
    # deploy that earns the values. Written by the lane rather than by
    # `deploy/tool.py --execute` because the RULING-W shape binds the deploy to a consumer
    # WORKTREE and the tool resolves the consumer as `hub_root.parent / repo` with no
    # override — so the lane drove the tool's own carriers against the worktree and writes
    # the record here. The value does not precede its release: v1.4.0 resolves both locally
    # and on origin at c57ac188. Witness: docs/audits/2026-08-28-technical-nb2-a-packet.md.
    deployed_methodology_version: "1.4.0"
    deployed_date: "2026-08-29"
    source_tag: "v1.4.0"
