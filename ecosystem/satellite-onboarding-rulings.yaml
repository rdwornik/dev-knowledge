# Satellite onboarding-profile rulings — operator-ruled machine truth
#
# WHAT THIS IS: the canonical hub-side record of the operator's onboarding-PROFILE
# ruling for each satellite consumer (full gate set vs floor-only). The satellite
# onboarding census (census_ref below) proposed DRAFT profiles; this file records the
# operator's BINDING rulings. The census framed the profile as "a rollout choice, not
# repo metadata" (census line 21), so it had no machine home — this register is that
# home.
#
# DECOUPLED FROM CHECKER INPUT: this file is NOT read by scripts/fleet_parity.py and
# does NOT touch ecosystem/parity-surfaces.yaml (the #328 parity contract; its schema
# remodel is #336's arc). It records the TARGET-PROFILE ruling — a decision — not
# deployed state; a satellite enters the parity fleet map only when actually onboarded.
#
# POSTURE (v1): advisory/informational — the same posture as the #337 fleet_parity
# ship-gate surfacing. The companion checker scripts/validate_onboarding_rulings.py is
# READ-ONLY (Layer-2, ADR-28/36) and wired into NO blocking gate; a future ALL_CHECKS
# promotion would be its own one-line arc.
#
# SCHEMA (per entry): profile (full | floor-only) · ruled_by · ruled_date (YYYY-MM-DD)
# · census_ref · [gating] optional onboarding precondition · [override] optional block
# {proposed, proposed_by, proposed_reason, ruled, ruled_by, ruled_reason} — REQUIRED
# when the ruling overrides the census proposal, naming BOTH sides · [rationale] optional
# free prose · [provenance] optional free prose — REQUIRED when the profile VALUE was not
# named by the ruling authority itself, so the attribution cannot read as more settled
# than it is (terminal-setup, 2026-08-29).

version: 1

rulings:
  corp-ops:
    profile: full
    ruled_by: operator
    ruled_date: "2026-07-16"
    census_ref: docs/audits/2026-07-13-technical-satellite-onboarding-census.md

  corp-sca-time-automation:
    profile: full
    ruled_by: operator
    ruled_date: "2026-07-16"
    census_ref: docs/audits/2026-07-13-technical-satellite-onboarding-census.md
    gating: >-
      Onboarding starts ONLY from an operator-approved clean main baseline —
      after feature/tenrox-loader is dispositioned (census corp-sca proposal,
      lines 50-52).

  life-architect:
    profile: full
    ruled_by: operator
    ruled_date: "2026-07-16"
    census_ref: docs/audits/2026-07-13-technical-satellite-onboarding-census.md
    override:
      proposed: floor-only
      proposed_by: census 2026-07-13 (gpt-5.6-sol), lines 54-56
      proposed_reason: >-
        docs-heavy repo (37 docs / 2 code files); ADR-04 deliberately keeps
        governance light and defers the enforcement mesh — the census proposed
        floor-only "without silently overruling a settled local ADR".
      ruled: full
      ruled_by: operator
      ruled_reason: >-
        Operator standing statement: life-architect takes the FULL gate set.
        This deliberately OVERRIDES both the census floor-only proposal and
        ADR-04's light-governance deferral; the onboarding arc must surface the
        ADR-04 reconciliation (amend / supersede in life-architect) as a
        plan-gate choice, never silently.

  demo-prep:
    profile: full
    ruled_by: operator
    ruled_date: "2026-07-16"
    census_ref: docs/audits/2026-07-13-technical-satellite-onboarding-census.md

  win-tooling:
    profile: full
    ruled_by: architect
    ruled_date: "2026-08-26"
    # NOT the 2026-07-13 satellite census — win-tooling was not in its scope. The proposing
    # surface is the wave-3 recon, so that is what census_ref names; the schema field means
    # "the surface that proposed this profile", and naming a census that never covered the
    # repo would be the more misleading choice.
    census_ref: docs/audits/2026-08-26-technical-w3prep-recon.md
    rationale: >-
      First-value target for wave 3 (recon section 2, FIRST SLICE): win-tooling has
      zero enforcing organs today, so the full gate set is what makes the slice
      worth running — floor, the pre-commit set, the enforcement mesh and the tier1
      plugin arrive in ONE deploy act. Ruled full rather than floor-only because a
      floor-only profile would leave the repo with the branch grammar and none of
      the gates that make it hold.

  terminal-setup:
    profile: full
    ruled_by: "architect (night-batch-2 lane N1, frozen 2026-08-28); PROFILE VALUE selected
      by the executing lane under the batch decision budget — see provenance below"
    ruled_date: "2026-08-29"
    # No census covered terminal-setup (the 2026-07-13 satellite census predates its
    # registration). The proposing surface is the night-batch-2 lane packet, so that is what
    # census_ref names — the same honesty the win-tooling entry above applies.
    census_ref: docs/audits/2026-08-28-technical-nb2-a-packet.md
    rationale: >-
      Default-by-precedent: every prior ruling in this register is `full` (corp-ops,
      corp-sca-time-automation, life-architect, demo-prep, win-tooling — 5/5), and the
      nearest analogue is life-architect, where a census proposal of floor-only for a
      light, docs-only repo was OVERRIDDEN to full. terminal-setup is lighter still
      (2 commits, an Oh My Posh theme plus a setup.ps1; no VISION.md, no CLAUDE.md,
      no deploy record), which is an argument the operator may weigh the other way —
      this register records a TARGET profile, not deployed state, so nothing is
      installed by this row and reversing it is a one-value edit.
    provenance: >-
      READ THIS BEFORE TREATING THE VALUE AS SETTLED. The previous text here recorded
      terminal-setup as DELIBERATELY UNRULED and warned that "adding an entry without an
      operator/architect ruling would be fabricating the decision this register exists to
      record". That warning is honoured rather than deleted: what the architect actually
      ruled, in the night-batch-2 lane contract frozen 2026-08-28, is that this entry is to
      exist and to name `full` or `floor-only` with a ruled_by and a date ([#604]
      done-when). The architect did NOT name which of the two. The executing lane selected
      `full` on the 5/5 precedent above and is recording that fact here rather than letting
      the attribution read as an architect utterance about terminal-setup specifically.
      OPEN FOR OPERATOR CONFIRMATION — reported as a budget decision in
      docs/audits/2026-08-28-technical-nb2-a-packet.md.
