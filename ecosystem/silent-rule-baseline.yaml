# silent-rule-baseline.yaml -- the committed baseline for the [#436] silent-rule ratchet.
#
# READ THIS BEFORE CHANGING THE NUMBER
# ------------------------------------
# `baseline` may be LOWERED or held. It may NOT be raised. `scripts/audit.py`
# check_silent_rule_ratchet compares the previous committed value against this one and
# FAILs on an increase (scripts/silent_rule_detector.py::validate_transition). There is no
# code path that raises it: lowering is a reviewed commit, raising is an operator ruling.
#
# DATA MODEL (deliberate, per the D4 adoption note): a NUMBER plus the DETECTOR ID that
# produced it -- never a parse of the silent-rule ledger. The ledger cannot serve as this
# data: parsing its sections A-D yields 182 anchors against a stated 176, because section C
# lists 21 entries under a heading claiming 15. That is not a ledger defect (the census
# stated 176 as a floor), but it does mean the ledger has no single machine-readable count
# to key a gate on. See docs/audits/2026-07-27-census-silent-rule-ratchet-arm-measurement.md.
#
# The detector id is load-bearing. Counts from two different detector contracts are not
# commensurable; the check refuses to compare them rather than silently reporting drift.

detector_id: silent-rule-v4
baseline: 441
measured_at: 2026-07-30
measured_at_sha: 3cd4417a
measured_files: 56

provenance: |
  RAISE 428 -> 441, operator-RULED 2026-07-30 (the intake #18 ratification arc, [#435]):
  the ruled-verbatim adopted texts (A4 checklist, A2/A9/A6/A10 staged paragraphs, U3
  statement, A3 template extract) add exactly +14 normative-token occurrences over the
  pre-arc live 427; line-by-line attribution + the ruling's four conditions:
  docs/audits/2026-07-30-technical-intake18-ratification-record.md ("Silent-rule ratchet"
  section). Until that arc merges, the branch-side check reads raise-rejected vs
  origin/main (428) -- expected, self-healing at merge.
  Prior baseline: 428 @ 2026-07-27 (sha 527958fbf89311610bd3be65fbfcb77df1f5fe29).
  Baseline semantics: detector-measured at arm time. Architect-proposed 2026-07-27,
  operator-adopted (D4), subject to revision after live testing. Historical ruling
  reference: 176 @ 2026-07-26; floor >= 179 per
  docs/audits/2026-07-27-census-silent-rule-ratchet-arm-measurement.md.

# What the number is NOT, so a later reader does not mistake it for a census figure:
#   * It is not the census's N_silent (176). That was a human judgment pass over ~1000
#     candidate lines, produced by a detector whose regex and file filter were never
#     recorded, and is therefore not reproducible by code.
#   * It is not a count of RULES. It counts normative-keyword OCCURRENCES, and it
#     cannot distinguish an enforced rule from a mention of one in an example.
#   * It is therefore a PROXY for the size of the pool. Only its movement against a
#     baseline measured by the same detector is load-bearing.
#
# Detector contract summary (authoritative text: scripts/silent_rule_detector.py):
#   corpus    git ls-files for PATHS + git cat-file for CONTENT; never the working
#             tree -- re-opening a path hands the bytes back to the host (smudge
#             filters, aliases, NFC/NFD) (v3->v4, terra HIGH 2026-07-27). Never a
#             filesystem walk --
#             a walk inherits the host's case semantics, so the same commit could
#             measure differently per platform (v2->v3, terra HIGH 2026-07-27)
#   scope     protocols/*.md - templates/**/*.{md,tmpl} - ecosystem/*.yaml
#   excluded  **/archive/** - this file - ecosystem/parity-surfaces.yaml (its MUST tokens
#             are tier: enum values read by fleet_parity, i.e. enforced by construction;
#             in scope they were 120 of 148 candidate lines and would have made the
#             ratchet fire when someone ADDED enforcement)
#   token     \b(?:must|shall|never)\b, case-insensitive, one count per OCCURRENCE
#             (not per line -- a per-line count moves under pure reflow: joining two
#             rule lines lowers it without removing a rule, rewrapping one raises it
#             without adding one. v1->v2 correction, terra HIGH 2026-07-27.)
#   decoding  UTF-8 explicit; a decode error raises rather than degrading the count
