# Doc->code edge declaration-doc registry -- #194 Phase-2 (ADR-89 OQ1 naming convention).
#
# The `doc_code_edge` advisory check (audit.py::check_doc_code_edge) discovers every
# `<!-- rule: ID -->` annotation in the DECLARATION DOCS listed here and resolves each to its
# `# rule: ID` code annotation under scripts/ (rule-ID identity, path+AST resolution -- move-safe
# per the e22e883 spike). It is likewise the doc-side scope for the #194 L1 structural-integrity
# scan + rebuildable index (validate_doc_code_edge.scan_structural_integrity / build_edge_index,
# which also flags a code_orphan = a `# rule:` declared in no doc). This file is the doc-side scan
# scope: an include-list, NOT an exclude-list. The scan reads ONLY these files, so illustrative `<!-- rule: <domain>-<slug> -->`
# tokens anywhere else (immutable design records, teaching sections, the test fixtures) are never
# live edges. (Belt-and-braces: teaching tokens also use the angle-bracket placeholder form, whose
# `<`/`>` fall outside the rule-ID charset and never match.)
#
# AUTHORITATIVE DECLARATION SOURCES ONLY (ADR-89 OQ1). Each entry is a doc that AUTHORITATIVELY
# declares an enforced rule -- declare a rule at its source, NEVER in a summary (e.g.
# `seal-journal-anchor` is declared in DEFINITION_OF_DONE.md, ADR-85's single-source, NOT in the
# ESSENTIALS one-line summary of it). EXTENSIBLE, mirroring the domain namespace: a doc joins this
# list when it first authoritatively declares an enforced rule -- a one-row append, no ADR rewrite.
#
# Mirrors the ecosystem/disposition-register.yaml precedent: hand-edited, durable, yaml.safe_load,
# one concern per file. Read-only (Layer-2 invariant). Paths are repo-relative, forward slashes.
#
# Fail-mode (ADVISORY this arc): the loader is fail-soft -> [] (a missing/malformed file renders the
# check inert and passes). FORWARD-FLAG (ADR-89 OQ1; hard-gate promotion arc, OQ3): switch to
# WARN-on-missing/malformed-config so a lost config cannot silently disable a live gate.

declaration_docs:
  - protocols/PLAYBOOK.md            # canonical-freshness, coherence-spec-reconciled, governance-*, coherence-doc-*
  - protocols/DEFINITION_OF_DONE.md  # seal-journal-anchor (ADR-85 single-source)
  - protocols/HANDOFF_PROCESS.md     # handoff-probes-bind (§5 probe-gate, ADR-82)

# Coverage scope -- #194 Arc 1 (TEST-FIRST). The in-scope enforced rule-IDs the doc->code
# rollout must drive to 100% resolved. tests/test_doc_code_edge.py::
# test_coverage_all_in_scope_rules_resolve asserts each resolves (xfail-strict until complete) --
# its failing list IS the rollout inventory. CURATED list (FALLBACK mechanism): the enforcement
# universe is heterogeneous (ALL_CHECKS + standalone validators + the seal Stop-hook +
# commit-msg/pre-push gates), with no single auto-enumerable list. Drift cost: a new enforced
# rule not appended here escapes the coverage test; reviewed when new enforcement lands.
#
# Breadth: every member has an authoritative declaration AND its `# rule:`-able enforcement
# site(s). Originally token-only / single-site (operator ruling 2026-06-22); ADR-90
# (resolver-allows-N, #201) extended this to N declared organs per rule via `multi_site:` below,
# so a multi-organ rule is no longer held out.
#
# RESOLVED -- two-organ trap (#201 / ADR-90 resolver-allows-N): a rule legitimately enforced in
#   N `# rule:`-able code organs declares its expected count in `multi_site:` below; the resolver
#   then resolves it at EXACTLY that count instead of `ambiguous`. All three now resolve and are
#   in coverage_scope (counts shown):
#     governance-no-ff         (3): validate_no_ff.py (detect) + block_ff_push.py (prevent) + audit.py::check_no_ff_merges (adapter)
#     governance-child-floor   (2): audit.py::check_floor_integrity (detect) + generate_floor.py::validate (emit-gate)
#     governance-backlog-leave (3): validate_backlog.py (in-file marker) + validate_git_backlog.py (git drift) + audit.py::check_git_backlog_drift (adapter)
# RESOLVED -- Tier-3 (#202): authoritative declarations authored (PLAYBOOK Ch6 doc-claims/-rot/
#   -structure sections + HANDOFF_PROCESS §5 for probes); each adapter (audit.py check_*) + logic
#   module annotated, in coverage_scope + multi_site (count 2). All four resolve:
#     coherence-doc-claims    (2): audit.py::check_doc_claims + validate_doc_claims.py::reconcile
#     coherence-doc-rot       (2): audit.py::check_doc_rot + validate_doc_rot.py::scan
#     coherence-doc-structure (2): audit.py::check_doc_structure + validate_doc_structure.py::scan
#     handoff-probes-bind     (2): audit.py::check_handoff_probes + verify_handoff_probes.py::verify
# EXEMPT -- structural/presence infra, not a declared behavioral rule (no edge): the baseline
#   checks (vision_md, claude_md, adr38_baseline, canonical_md_visibility, canonical_structure,
#   dot_prefix, mermaid_theme, workspace_settings, handoff_bundle/tag/version_stamp,
#   no_sibling_orphans) + check_doc_code_edge itself (self-referential).
coverage_scope:
  - seal-journal-anchor        # DONE    -- DEFINITION_OF_DONE.md -> session_end_backpressure.py
  - canonical-freshness        # DONE    -- PLAYBOOK.md -> audit.py::check_canonical_freshness
  - coherence-spec-reconciled  # DONE 2-site (ADR-90) -- PLAYBOOK.md -> validate_reconciliation.py + audit.py::check_reconciled_versions
  - coherence-amendment        # DONE    -- PLAYBOOK.md #895 -> audit.py::check_amendment_coherence
  - governance-backlog-schema  # DONE    -- PLAYBOOK.md #2766 -> validate_backlog.py::validate
  - governance-backlog-story-id # DONE   -- PLAYBOOK.md (Schema §Rules) -> validate_backlog.py::validate ([S<n>] grammar, #286)
  - governance-no-ff           # DONE 3-site (ADR-90/#201) -- PLAYBOOK.md -> validate_no_ff.py + block_ff_push.py + audit.py::check_no_ff_merges
  - governance-child-floor     # DONE 2-site (ADR-90/#201) -- PLAYBOOK.md -> audit.py::check_floor_integrity + generate_floor.py::validate
  - governance-backlog-leave   # DONE 3-site (ADR-90/#201) -- PLAYBOOK.md -> validate_backlog.py + validate_git_backlog.py + audit.py::check_git_backlog_drift
  - coherence-doc-claims       # DONE 2-site (#202) -- PLAYBOOK.md -> audit.py::check_doc_claims + validate_doc_claims.py
  - coherence-doc-rot          # DONE 2-site (#202) -- PLAYBOOK.md -> audit.py::check_doc_rot + validate_doc_rot.py
  - coherence-doc-structure    # DONE 2-site (#202) -- PLAYBOOK.md -> audit.py::check_doc_structure + validate_doc_structure.py
  - handoff-probes-bind        # DONE 2-site (#202) -- HANDOFF_PROCESS.md §5 -> audit.py::check_handoff_probes + verify_handoff_probes.py
  - handoff-boot-budget        # DONE 2-site ([#446] R4) -- HANDOFF_PROCESS.md §4 -> assemble_paste.py (WARN emitter) + audit.py::check_boot_byte_budget (FAIL gate)
  - seal-journal-spine-anchor  # DONE 2-site (ADR-85 amend. 2026-08-03) -- DEFINITION_OF_DONE.md -> block_unanchored_push.py (pre-push teeth) + audit.py::check_journal_spine_anchor (FAIL backstop)

# Multi-site expected code-site counts -- ADR-90 (resolver-allows-N), the #201 resolution. A rule
# legitimately enforced in N `# rule:`-able code organs maps `rule-ID -> N` here; the resolver
# (validate_doc_code_edge.resolve_edge) resolves it at EXACTLY that count + a single doc site,
# instead of the strict 1:1 duplicate-guard's `ambiguous`. ANY other code count (incl. this count
# +/-1) still flags `ambiguous` -- the guard keeps its teeth for the declared organs too. A rule
# ABSENT from this map keeps the strict 1:1 guard. Fail-soft -> {} (audit._load_multi_site): a
# missing/malformed map degrades every rule to the strict 1:1 guard (can only narrow, never widen).
multi_site:
  coherence-spec-reconciled: 2   # validate_reconciliation.py + audit.py::check_reconciled_versions
  governance-no-ff: 3            # validate_no_ff.py (detect) + block_ff_push.py (prevent) + audit.py::check_no_ff_merges (adapter)
  governance-child-floor: 2      # audit.py::check_floor_integrity (detect) + generate_floor.py::validate (emit-gate)
  governance-backlog-leave: 3    # validate_backlog.py (in-file marker) + validate_git_backlog.py (git drift) + audit.py::check_git_backlog_drift (adapter)
  coherence-doc-claims: 2        # audit.py::check_doc_claims (adapter) + validate_doc_claims.py::reconcile (logic)
  coherence-doc-rot: 2           # audit.py::check_doc_rot (adapter) + validate_doc_rot.py::scan (logic)
  coherence-doc-structure: 2     # audit.py::check_doc_structure (adapter) + validate_doc_structure.py::scan (logic)
  handoff-probes-bind: 2         # audit.py::check_handoff_probes (adapter) + verify_handoff_probes.py::verify (logic)
  handoff-boot-budget: 2         # assemble_paste.py (WARN emitter) + audit.py::check_boot_byte_budget (FAIL gate) -- the [#446] split-site enforcement, both organs declared
  seal-journal-spine-anchor: 2   # block_unanchored_push.py (pre-push TEETH, exit 1/2) + audit.py::check_journal_spine_anchor (FAIL backstop) -- the ADR-85 amendment 2026-08-03 split: an organ that refuses at the boundary, and an organ that keeps the `--no-verify` escape visible afterwards. Both are declared, or the pair reads as a duplicate ID.

# Coverage drift-guard exempt-list -- #203. The ALL_CHECKS members that are NOT declared
# doc->code behavioral rules and so owe no `# rule:` annotation: the structural/presence baseline
# checks + the two self-referential meta-checks (doc_code_edge, doc_code_coverage_drift). Entries
# are CHECK NAMES (a Finding `check_name` = `fn.__name__` minus the `check_` prefix).
# `audit.py::check_doc_code_coverage_drift` (in ALL_CHECKS, FAIL-class) FAILs when an ALL_CHECKS
# member is neither annotated with a `coverage_scope` `# rule:` marker NOR listed here -- so a
# NEW enforced rule that lands as an ALL_CHECKS check cannot silently escape the curated
# coverage_scope. Append a check here ONLY when it is genuinely a structural/presence/self check
# with no behavioral doc->code rule (the deliberate decision the drift cost asks for).
exempt:
  - vision_md
  - adr38_baseline
  - claude_md
  - dot_prefix_discipline
  - canonical_md_visibility
  - workspace_settings
  - mermaid_theme_directive
  - handoff_bundle_structure
  - no_sibling_orphans
  # [#505] batch hygiene. PERMANENT, on the no_sibling_orphans precedent directly above: both
  # are worktree-leftover presence assertions against `git worktree list`, not declared
  # doc->code behavioural rules. The batch protocol IS written (PLAYBOOK Ch8), but what this
  # organ asserts is the presence/absence of a directory, and the doctrine it backstops is
  # carried by the /lane-integrate checklist rather than by a rule-ID an edge could bind.
  - stale_worktrees
  - canonical_structure
  - handoff_version_stamp
  - doc_code_edge              # self-referential (the doc->code edge check itself)
  - safe_removal              # code->code removal gate (#195) -- not a doc->code rule
  # [#483] R3 advisory leg. PERMANENT exemption, not a temporary one: it reads BACKLOG row
  # syntax (a `kill-candidates:` field value) against BACKLOG row liveness -- both sides are the
  # same generated artifact, so there is no doc->code rule for an edge to bind. The doctrine it
  # enforces lives in the ruling record, which is an immutable audit artifact rather than a
  # living doc a `# rule:` marker could point at.
  - preflight_backlog_ids
  # [#480] P3 advisory review-artifact coverage leg. **TEMPORARY -- expires with [#499]**
  # (the hard-flip arc): you cannot hard-gate an unwritten rule; the rule lands in PLAYBOOK
  # there, this entry then converts to coverage_scope and the `# rule:` marker is
  # reinstated. Operator ruling 2026-08-05 (option A), riders R1/R2.
  #
  # DISTINCT from the PERMANENT preflight_backlog_ids row above: that leg has no behavioral
  # doc->code rule to write (both its sides are the same generated artifact). This one DOES
  # embody a rule -- 'a code-impact merge carries a linked review artifact' -- which the hard
  # flip writes. Hence temporary, hence bound to a row rather than to memory (ADR-81 (d);
  # the ARC-5 precedent below is the same shape: enforcement ahead of its written rule runs
  # only under a named, expiring exemption).
  - review_artifact_coverage
  # ARC-5 residual-completeness gate. TEMPORARY exemption, distinct from the permanent rows
  # above, and BOUND TO [#365] -- an undeclared temporary exemption is exactly the silent
  # category ARC-5 exists to eliminate, so it carries a ticket rather than a hope.
  #
  # The doc-side half is now DONE: the rule IS written, at protocols/HANDOFF_PROCESS.md
  # "Residual completeness -- the FILL-IN contract (ARC-5)", verified claim-by-claim against
  # the check's actual behaviour (7/7 match, 2026-07-19). The gate is no longer enforcement
  # without a written rule.
  #
  # It stays exempt because coverage_scope needs a RESOLVABLE EDGE, which needs BOTH halves:
  # a `<!-- rule: handoff-residual-filled -->` marker in the doc AND a `# rule:` marker in
  # scripts/. Adding the doc marker alone was WITNESSED (2026-07-19) to produce
  # `broken_edge (doc sites=1, code sites=0)` -- a WARN, which would push the ship-gate to
  # RED at 15. The code half could not be added in the lane that wrote the rule because
  # scripts/ was outside its file boundary. [#365] adds both markers in one commit.
  - residual_completeness
  - deployed_methodology_version  # ADR-91 status reporter -- reads deployed-versions.yaml per repo; not a doc->code behavioral rule
  - enforcement_coverage      # Informant Organ reporter (Stage-2 enforcement-transfer) -- read-only per-consumer coverage; not a doc->code behavioral rule
  - undeclared_edges          # #179 undeclared-edge scan (Fable consult #1 ruling #2) -- coherence DISCOVERY reporter surfacing prose refs lacking reconciled_with; not a doc->code behavioral rule
  - hooks_armed               # RF-2 git-hook arming check (Fable architecture review 2026-07-04 §4) -- per-checkout presence/arming assertion (.git/hooks pre-commit-managed); not a doc->code behavioral rule
  - doc_code_coverage_drift   # self-referential (this drift-guard)
  - import_edges              # #249 @import target-exists check -- structural presence of the CLAUDE.md @import graph; not a doc->code behavioral rule
  - fleet_parity              # [#337] #328 fleet-parity gate -- manifest-driven (ecosystem/parity-surfaces.yaml), like enforcement_coverage/deployed_methodology_version; not a doc->code behavioral rule
  - silent_rule_ratchet       # [#436] D4 ratchet -- gates the GROWTH of the silent-rule pool against a committed baseline. Its rule is declared in the detector module + baseline file (scripts/silent_rule_detector.py, ecosystem/silent-rule-baseline.yaml), not in a `declaration_docs` file, so it sits outside the #194 doc->code scope as configured -- same shape as routine_consumers below.
  - task_tree_coherence       # [#433] C1 -- arms gen_task_tree --check as a gate. A derived-artifact coherence gate (regen-and-diff), the same class as codemap-freshness / the generated-index gates; not a doc->code behavioral rule.
  - intake_tree_coherence     # [#383] wave 1 -- arms gen_intake_tree --check as a gate (ADR-109 section 4's generality proof). Same class as task_tree_coherence directly above: a derived-artifact coherence gate (regen-and-diff) over the docs/intake/ residue carrier; not a doc->code behavioral rule.
  - fleet_audit_replication   # [#460] -- ADR-80 durable-record replication alarm. Its rule is declared in ADR-80 (the durable record must be durable), NOT in a `declaration_docs` file, so it sits outside the #194 doc->code scope as configured -- the same shape as routine_consumers directly below, whose rule lives in ADR-105. Admitting either would mean adding those ADRs to declaration_docs, which is a separate ruling and not a side effect of landing a check.
  - membership_agreement      # [#462] -- the ADR-104 fleet declaration diffed against every repo-keyed machine surface. Its rule is declared in ADR-104 (the fleet is these 9 repos), NOT in a `declaration_docs` file, so it sits outside the #194 doc->code scope as configured -- the same shape as fleet_audit_replication above (ADR-80) and routine_consumers below (ADR-105). Admitting it would mean adding ADR-104 to declaration_docs, a separate ruling and not a side effect of landing a check.
  - routine_consumers         # [#419]/ADR-105 activation gate -- the rule is declared in ADR-105, NOT in a `declaration_docs` file (PLAYBOOK/DEFINITION_OF_DONE/HANDOFF_PROCESS), so it sits outside the #194 doc->code scope as configured. It IS single-site (audit.py::check_routine_consumers alone), so it would QUALIFY for coverage_scope on the one-enforcement-site rule -- admitting it needs ADR-105 added to declaration_docs, which is a separate ruling, not a side effect of landing the check.
