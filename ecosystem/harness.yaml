# ecosystem/harness.yaml -- the spine as DATA (DECLARE-SPINE-AND-B3 s4-5; ADR-97 invariant 5: the contract is the artifact).
# One row per stage: the argv that realises it, the contract field it fills, deterministic|judgement.
# NO logic here. `command: null` means the stage does not exist -- dodo.py STOPS the run at it and
# names it. Placeholders (str.replace, not format): {kind} {subject} {lane} {batch} {contract} {handback}
# {changed} {receipts} {merge} {session_file} <- HARNESS_KIND / HARNESS_SUBJECT / HARNESS_LANE / ... ({contract} defaults to the stage-4 draft).
# The spine PREPARES A CONTRACT. It moves no row through a phase (that is [#669] / [#689]).
# RECEIPTS (DECLARE-NIGHT N2): every stage and organ runs through `telemetry_emit.py wrap` and writes one
# receipt under logs/receipts/ (gitignored). The receipt is the doit target: a row is up to date when its
# receipt records exit 0 and the input hash it would compute now. `always: true` + `reason:` exempts a row
# that reads live state. Moments (below) are where organs fire; one lane owns THIS FILE at a time (L1, then W3-A) -- a wave-2 lane
# builds the command a moment already declares (`optional: true` until it exists -> SKIPPED-NOT-BUILT, N4).
stages:
  - {stage: 1, name: kind-subject, field: subject, kind: judgement, command: [git, --no-pager, grep, -n, -F, -e, "| {subject} |", --, protocols/BUILD-LIST.md]}
  - {stage: 2, name: prior-art, field: prior-art, kind: deterministic, command: [uv, run, --locked, python, scripts/stage_prior_art.py, emit, --subject, "{subject}"]}
  - {stage: 3, name: carrier-row, field: carrier, kind: deterministic, always: true, reason: "reads the live task tree, which a lane edits between runs", command: [uv, run, --locked, python, scripts/gen_task_tree.py, --check]}
  - {stage: 4, name: change-kind, field: kind, kind: judgement, command: [uv, run, --locked, python, scripts/gen_lane_contract.py, distill, --kind, "{kind}", --subject, "{subject}", --stdout]}
  - {stage: 5, name: dependencies, field: dependencies, kind: deterministic, command: [uv, run, --locked, python, scripts/file_purpose_graph.py, stats]}
  - {stage: 6, name: library-first, field: library-first, kind: deterministic, command: [uv, run, --locked, python, scripts/stage_library_first.py, emit]}
  - {stage: 7, name: substrate, field: substrate, kind: deterministic, command: [uv, run, --locked, python, scripts/validate_substrate.py, "{contract}"]}
  - {stage: 8, name: provider-model-version, field: model, kind: judgement, command: [uv, run, --locked, python, scripts/routing_agreement.py]}
  - {stage: 9, name: organs, field: organs, kind: deterministic, always: true, reason: "checks the generated organ index against the live scripts/ tree", command: [uv, run, --locked, python, scripts/generate_organ_index.py, --check]}
  - {stage: 10, name: impacted-tests, field: tests, kind: deterministic, always: true, reason: "selects from the live diff against main", command: [uv, run, --locked, python, scripts/impacted_tests.py, select, --ref, main]}
  - {stage: 11, name: token-cap, field: token-cap, kind: deterministic, command: [uv, run, --locked, python, scripts/dispatch.py, plan, "{contract}", --slug, spine-plan, --token-cap, "1000000000000"]}
  - {stage: 12, name: contract, field: contract, kind: deterministic, command: [uv, run, --locked, python, scripts/gen_lane_contract.py, distill, --kind, "{kind}", --subject, "{subject}", --stdout]}
# Stage 7 validates {contract}. Stage 11 FILLS the cap field (N3: a record, set out of any lane's reach); it runs `plan`, not `govern`.
# moments: `doit -f scripts/dodo.py moment:<name>`. Six moments, in the order a lane lives them:
#   pre-launch  the LAUNCHER, before it spawns a lane        (R-W3-1: is the slug taken / integrator live / routing agrees)
#   lane-start  INSIDE the lane, at its first turn           (in-lane organs only)
#   lane-end    the Stop hook, once, when the lane has written its HANDBACK line   (R-W3-3)
#   merge       the integrator, right after each local `git merge --no-ff`
#   teardown    the integrator, after merge and push
#   batch-close the integrator, after the LAST merge of the batch                  (R-W3-3)
# Until the four native triggers are wired (wave 3 B and D, and the integrator command) every organ carries
# `manual_until` (a date; after it the organ is armed or re-dated). An organ's `receipt` is UPPERCASE-KEBAB, undated.
# Keys a moment / organ may carry beyond L1's:
#   precondition          {file, matches, receipt, reason} -- the runner looks for a line of `file` that matches `matches` (a regex); with none it writes
#                         line found, the moment writes ONE `SKIPPED-PRECONDITION` receipt and runs no organ. {session_file} is the
#                         lane's SESSION-<lane>.md on the transport (HARNESS_SESSION_FILE overrides it).
#   strict_inputs         `optional` then means only "not built yet": once the command exists, an unset input STOPs the moment
#                         (go_reader is a refusal gate, so a batch left unset stops the moment instead of skipping the check).
#   continue_on_failure   an organ whose failure is RECORDED in its receipt but does not stop the organs after it;
#                         the moment still exits non-zero naming it (the failure is ordered last, and stays visible in the exit code).
# {merge} is HARNESS_MERGE, else HEAD (the integrator merges, then runs the moment). {batch} names the batch.
moments:
  - name: pre-launch
    trigger: "the launcher (`dispatch.py launch`), before it spawns the lane -- run from OUTSIDE the lane"
    organs:
      - {id: worktree_occupancy, receipt: MOMENT-PRE-LAUNCH-WORKTREE-OCCUPANCY.json, manual_until: 2026-10-04, optional: true, always: true, reason: "reads live worktrees and sessions", command: [uv, run, --locked, python, scripts/worktree_occupancy.py, "{lane}"]}
      - {id: seat_refusals.refuse_no_live_integrator, receipt: MOMENT-PRE-LAUNCH-NO-LIVE-INTEGRATOR.json, manual_until: 2026-10-04, always: true, reason: "reads the live seat registry", command: [uv, run, --locked, python, scripts/seat_refusals.py, no-live-integrator, --batch, "{batch}"]}
      - {id: routing_agreement, receipt: MOMENT-PRE-LAUNCH-ROUTING-AGREEMENT.json, manual_until: 2026-10-04, command: [uv, run, --locked, python, scripts/routing_agreement.py]}
  - name: lane-start
    trigger: "the lane's own first turn, inside the lane (the in-lane organs only; the launcher's checks are `pre-launch`)"
    organs:
      - {id: single_flight, receipt: MOMENT-LANE-START-SINGLE-FLIGHT.json, manual_until: 2026-10-04, always: true, reason: "reads the live lock ref", command: [uv, run, --locked, python, scripts/single_flight.py, inspect, "{lane}", --local-only]}
  - name: merge
    trigger: "integrator command, immediately after each local `git merge --no-ff` of a handback (HEAD is the merge commit)"
    organs:
      - {id: merge_receipt.open, receipt: MOMENT-MERGE-OPEN.json, manual_until: 2026-10-04, always: true, reason: "opens the lane's live receipt when none is open yet (idempotent: a no-op when lane-integrate.md already opened one -- caught by exception, not a separate exists() check, so there is no gap between the read and the write for a second caller to land in; R-W4-4), so a caller that runs only this moment does not stop at models", command: [uv, run, --locked, python, -c, "import os, sys, contextlib; sys.path.insert(0, 'scripts'); import merge_receipt as m; from pathlib import Path; root = Path(os.environ.get('MERGE_RECEIPT_ROOT', '.')); slug = '{lane}';\nwith contextlib.suppress(m.MergeReceiptError):\n    m.open_receipt(root, slug=slug, batch='{batch}')"]}
      - {id: merge_receipt.models, receipt: MOMENT-MERGE-MODELS.json, manual_until: 2026-10-04, always: true, reason: "reads the lane's live transcript", command: [uv, run, --locked, python, scripts/merge_receipt.py, models, --slug, "{lane}", --contract, "{contract}"]}
      - {id: go_reader, receipt: MOMENT-MERGE-GO-READER.json, manual_until: 2026-10-05, optional: true, strict_inputs: true, owner: lane-merge-truth, always: true, reason: "reads the operator's live GO file", command: [uv, run, --locked, python, scripts/go_reader.py, --batch, "{batch}"]}
      - {id: review_packet, receipt: MOMENT-MERGE-REVIEW-PACKET.json, manual_until: 2026-10-04, optional: true, always: true, reason: "packs the live merge commit", command: [uv, run, --locked, python, scripts/review_packet.py, --lane, "{lane}", --contract, "{contract}", --merge, "{merge}", --handback, "{handback}", --out, "{receipts}/MOMENT-MERGE-REVIEW-PACKET.md"]}
      - {id: gates, receipt: MOMENT-MERGE-GATES.json, manual_until: 2026-10-04, optional: true, always: true, reason: "runs the gates against the live tree", command: [uv, run, --locked, python, scripts/gates.py, run, --lane, "{lane}"]}
      - {id: test_pairing, receipt: MOMENT-MERGE-TEST-PAIRING.json, manual_until: 2026-10-04, optional: true, always: true, reason: "pairs the live red set against the merge-base", command: [uv, run, --locked, python, scripts/test_pairing.py, --lane, "{lane}"]}
  - name: teardown
    trigger: "integrator command, after merge and push, when the worktree and both its branches are removed"
    organs:
      - {id: no_leftovers, receipt: MOMENT-TEARDOWN-NO-LEFTOVERS.json, manual_until: 2026-10-04, optional: true, always: true, reason: "verifies removal against the live worktree and branch lists", command: [uv, run, --locked, python, scripts/no_leftovers.py, verify, --lane, "{lane}"]}
  - name: lane-end
    trigger: "Claude Code Stop hook, once: at the first turn end after the lane wrote its HANDBACK line (a turn end before it runs nothing)"
    precondition: {file: "{session_file}", matches: '^HANDBACK\s+\S+\s+@\s+\S+', receipt: MOMENT-LANE-END-PRECONDITION.json, reason: "a lane has finished only when its closing HANDBACK line is in its session file"}
    organs:
      - {id: lane_cost, receipt: MOMENT-LANE-END-LANE-COST.json, manual_until: 2026-10-04, always: true, reason: "reads the lane's live transcript", command: [uv, run, --locked, python, scripts/lane_cost.py, lane, --slug, "{lane}"]}
      - {id: fleet_health.seat_health_line, receipt: MOMENT-LANE-END-SEAT-HEALTH.json, manual_until: 2026-10-04, always: true, reason: "reads the live seat registry", command: [uv, run, --locked, python, -c, "import sys; sys.path.insert(0, 'scripts'); import fleet_health as f; from pathlib import Path; print(f.seat_health_line(Path('.')) or '[seats] empty registry')"]}
      - {id: transport_report, receipt: MOMENT-LANE-END-TRANSPORT-REPORT.json, manual_until: 2026-10-04, optional: true, continue_on_failure: true, always: true, reason: "reads the live transport drive", command: [uv, run, --locked, python, scripts/transport_report.py, --lane, "{lane}"]}
  - name: batch-close
    trigger: "integrator command, after the last merge of the batch has landed (one digest for the batch, not one per lane)"
    organs:
      - {id: digest, receipt: MOMENT-BATCH-CLOSE-DIGEST.json, manual_until: 2026-10-05, optional: true, always: true, reason: "digests the live receipts of the batch", command: [uv, run, --locked, python, scripts/lane_digest.py, --lane, "{batch}", --receipts-dir, "{receipts}"]}
# fates (R-W3-4; DECLARE-WAVE3 2026-09-21): the organs no moment, spine stage, pre-commit hook or conductor job called when
# W3-A ran the census (`graph_queries.py moments`: declared nowhere AND wired by no other surface). Each has EXACTLY ONE
# recorded fate: `moment: <name>` (it is declared at that moment), `manual_until: <date>` with a one-line `reason`
# (operator- or seat-invoked until then; after the date it is armed, re-dated or retired), or `retire_candidate: true`
# with a `reason` (retirement is the operator's GO, decided outside this file). A fate is a RECORD -- it arms, disarms, deletes
# and narrows nothing, and no organ is dropped from the roster. The reasons cite `ORPHAN_DISPOSITIONS`
# (scripts/graph_queries.py) where the census already ruled on the same absence.
fates:
  - {path: .claude/commands/boot-session.md, manual_until: 2026-10-05, reason: "on-demand by the operator (act: sitting); no event fires a command (ORPHAN_DISPOSITIONS)"}
  - {path: .claude/commands/changelog-review.md, manual_until: 2026-10-05, reason: "push trigger only: a SessionStart sentinel nudges it and a nudge is not a trigger (ORPHAN_DISPOSITIONS, V+1 list)"}
  - {path: .claude/commands/handoff-verify.md, manual_until: 2026-10-05, reason: "on-demand by the operator (act: seat release); run by /handoff at the cut (ORPHAN_DISPOSITIONS)"}
  - {path: .claude/commands/handoff.md, manual_until: 2026-10-05, reason: "on-demand by the operator (act: seat release) (ORPHAN_DISPOSITIONS)"}
  - {path: .claude/commands/lane-boot.md, manual_until: 2026-10-05, reason: "on-demand by the operator (act: GO); the seat boots one lane by invoking it (ORPHAN_DISPOSITIONS)"}
  - {path: .claude/commands/lane-integrate.md, manual_until: 2026-10-05, reason: "on-demand by the operator (act: GO); the integrator's walk of the merge queue (ORPHAN_DISPOSITIONS)"}
  - {path: .claude/commands/preflight.md, manual_until: 2026-10-05, reason: "self-declared wired into no gate; an adoption-first read-only helper (ORPHAN_DISPOSITIONS, V+1 list)"}
  - {path: .claude/commands/save.md, manual_until: 2026-10-05, reason: "convenience wrapper, not one of the operator's seven acts (ORPHAN_DISPOSITIONS, V+1 list)"}
  - {path: .claude/commands/spine.md, manual_until: 2026-10-05, reason: "runs the stage table by hand (`doit spine`); no census row yet -- its caller is a seat until the loop's launcher runs the spine"}
  - {path: .claude/commands/why.md, manual_until: 2026-10-05, reason: "read on demand before editing an unfamiliar file; whether a fresh session calls it unprompted is [#924]'s measurement -- no census row yet"}
  - {path: .claude/skills/check-against-spec/SKILL.md, manual_until: 2026-10-05, reason: "no event fires a skill; coherence-nudge flags the spec change but a seat invokes it (ORPHAN_DISPOSITIONS, V+1 list)"}
  - {path: .claude/skills/verify/SKILL.md, manual_until: 2026-10-05, reason: "no event fires a skill; its mandate becomes a hook rather than a graph row ([#664]; ORPHAN_DISPOSITIONS, V+1 list)"}
  - {path: plugins/tier1-lifecycle/commands/review-closures.md, manual_until: 2026-10-05, reason: "on-demand by the operator (act: ratification) (ORPHAN_DISPOSITIONS)"}
  - {path: plugins/tier1-lifecycle/commands/ship.md, manual_until: 2026-10-05, reason: "on-demand by the operator (act: destructive acts) (ORPHAN_DISPOSITIONS)"}
  - {path: plugins/tier1-lifecycle/scripts/review_closures.py, manual_until: 2026-10-05, reason: "the plugin copy /review-closures invokes (act: ratification); no event fires it and none should (ORPHAN_DISPOSITIONS)"}
  - {path: scripts/actions_verdict.py, manual_until: 2026-10-05, reason: "imported by merge_receipt.py and invoked by the lane-integrate command, neither a surface the census reads; [#664] owns whether a command is a trigger"}
  - {path: scripts/codespace_regime.py, manual_until: 2026-10-05, reason: "temporarily unwired, not retired: its settings.json hook is off since 2026-09-17 and returns when [#863] lands"}
  - {path: scripts/codespace_state.py, manual_until: 2026-10-05, reason: "unwired by directive until intake 102 settles who observes; its adopter is that ratification (ORPHAN_DISPOSITIONS)"}
