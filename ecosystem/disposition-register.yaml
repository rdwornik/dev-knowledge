  # legacy on-main digest, so this WARN no longer surfaces. Removed to avoid a
  # stale-disposition decoration (ADR-75).

  # (cleared 2026-06-25, #134 n=2 groom) warn-doc-rot-backlog-{164,134,77} — the 3 #140
  # grandfather loci were condensed below threshold (ADR-65/49 condense-preserving), so the
  # dispositions matched no live WARN and were removed to avoid stale-disposition decoration (ADR-75).

