  # validate_doc_rot.py the backlog predicate is `>= _BACKLOG_DATED_BLOCKS (3) dated blocks AND
  # > _BACKLOG_LONG_CHARS (700)` OR `> _BACKLOG_GROSS_CHARS (1200)`. Its date scan counts (a) date
  # OCCURRENCES, not DISTINCT DAYS, and (b) dates appearing inside path-like tokens. So #422 — a
  # single-day filing citing `docs/handoffs/2026-07-25-ai-council-architect/` plus two prose mentions
  # of the same 2026-07-25 — registers as "3 dated blocks" and trips the ACCRETION predicate although
  # no history has accreted. Counting distinct days, and excluding dates inside path-like tokens,
  # would make the accretion predicate mean what its name says. Both rows below would still WARN on
  # the gross-chars leg, which is the honest signal.
