      state: ACTIONED needs a landed conclusion, FILED needs a row, REJECTED needs a ruling,
      SUPERSEDED needs a successor. Batch T is OPEN -- this lane is one of its wave-1 lanes and
      is writing this entry from inside it. The ruling's own tie-break governs: *"a wrong
      ACTIONED is worse than an honest PENDING"*. The disposition lands in the close packet's
      ledger at dawn, with the batch's outcome as its evidence locator.

  # ---- substrate_declaration: the three batch-T CLOUD lanes (2026-09-06) ----
  # ALSO OUTSIDE THIS LANE'S FROZEN 36 and reported as a deviation -- these arrived with the same
  # `c004ac8c` dispatch merge. Recorded here rather than left blocking, because the underlying
  # fact is already ruled and the gap is in the CHECK's regex, not in the contracts.
  #
  # THE BRANCH PREFIX IS IN THE RATIFIED ENUM. CLAUDE.md §4 and AGENTS.md both state the closed
  # enum of branch prefixes as four machine-produced lane forms: `worktree-<name>`, `epic/<slug>`,
  # `claude/<slug>`, `automation/<slug>`. A cloud lane's branch is minted `claude/<slug>` by the
  # cloud harness -- the lane does not choose it. `validate_substrate`'s `LANE_BRANCH_RE` matches
  # only the `worktree-lane-*` form, so it reports every cloud lane as invisible to the teardown
  # enum and the ADR-110 exemption. The check's own evidence line ends "[OVERRIDDEN -- recorded
  # deviation]": the contracts DID record it, and the WARN fires anyway.
  #
  # WHAT IS NOT CLAIMED: that the teardown/exemption coverage question is answered. It is not.
  # `claude/<slug>` lanes really are outside both iterations, and that is worth a row -- it is
  # simply not a defect in these three contracts, which did the one thing available to them.

  - id: warn-substrate-cloud-branch-lane-t-000-aj-research
    organ: substrate_declaration
    match: "LANE-t-000-aj-research.md: WARN substrate-teardown-enum-coverage"
    ref: "CLAUDE.md §4 / AGENTS.md branch-prefix enum (`claude/<slug>` is a ratified machine-produced lane prefix); ADR-116; scripts/validate_substrate.py LANE_BRANCH_RE"
    review_date: 2026-10-06
    reason: >-
      THE CHECK'S REGEX IS NARROWER THAN THE RATIFIED ENUM -- a detection gap, not a contract
      defect. `LANE-t-000-aj-research.md` pairs to `claude/<slug>`, which is one of the four machine-produced lane
      prefixes the closed enum admits; `LANE_BRANCH_RE` matches only `worktree-lane-*`, so every
      CLOUD lane trips this leg by construction and no cloud contract can ever pass it. The
      contract already recorded the deviation -- the check prints "[OVERRIDDEN -- recorded
      deviation]" in the same evidence string it WARNs with. The substantive half of the finding
      IS real and stays open: a `claude/<slug>` branch genuinely is invisible to the batch
      teardown enum and to the ADR-110 exemption, and that wants a row against
      `validate_substrate` rather than a disposition. Keyed on the contract path AND the rule
      name, so a DIFFERENT substrate finding on the same contract re-surfaces and blocks.

