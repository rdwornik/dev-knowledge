  # ---- doc_rot backlog-accretion: the groom's work, on a groom cadence (2026-09-06) ----
  # R5 B5, operator-declared in to-cc/R5-DECLARED.md, ruled `doc_rot` ARM 2 into ONE corpus
  # Finding (landed; `warn-row-length-corpus-trend` above dispositions it). ARM 1 --
  # history-accretion -- still emits one Finding PER ROW, and these five are what it emits.
  #
  # ACCRETION IS WHAT A GROOM REMOVES, AND THE GROOM IS THE UNIT OF WORK. ADR-41 sets the cadence
  # and ADR-49/65 set the condense-preserving form. Condensing a row's dated history is a judgement
  # about which of its dates still carry meaning -- the operator's call on the groom sheet, not a
  # lane's edit in passing. §3.6 directs these five to that Finding rather than to five separate
  # fixes, and this is that direction executed.
  #
  # PRECISION, stated honestly: keyed on `backlog-accretion BACKLOG#<id>`, which is the ROW, not
  # the row's current measurements. The char counts and date spans move every time the row is
  # edited, so keying on them would decorate stale within a day and teach that this register rots
  # -- the failure `warn-review-artifact-coverage-advisory-deferred-499` records for the same
  # reason. The cost is real and bounded: a NEW accretion defect on one of these five rows is
  # absorbed by its entry rather than re-surfacing. A sixth row crossing the threshold is not.

