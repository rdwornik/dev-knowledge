  # "declare reconciled_with only for coupled+current refs" a stale/structural declaration is worse
  # than none, and two of the six (VISION.md, ESSENTIALS.md) are canonical_freshness-gated so a
  # declaration would force a re-stamp (a genuine re-read) — not landable unilaterally. So each is
  # dispositioned as a known pre-existing edge and the per-doc adjudication (declare the genuinely
  # version-coupled refs e.g. PLAYBOOK/SESSION_SETUP vs permanently defer the analogy/ticket refs)
  # is tracked by [#241]. Keyed on the specific "<doc> -> handoff-process" pair (NOT a bare id) per
  # precision-over-recall: a 7th doc, or an edge to a DIFFERENT spec, re-surfaces and blocks; when a
  # doc declares its edge the candidate disappears and the entry decorates stale (ADR-75).
  - id: warn-undeclared-backlog-handoff-process
