      core-invariants #5 but immutable-as-history; ratified as-is (operator, 2026-06-26).
      Keyed on the 9-char sha per precision-over-recall — any future no_ff violation
      re-surfaces and blocks. RECURRENCE: 3 instances (2026-06-20 x2, 2026-06-26 x1) make
      this a structural gap, not a one-off — tracked for a standing path-scoped rule by [#210]
      (per-instance disposition -> rule). Does not auto-clear.
  - id: warn-doc-claims-pytest-collected-architecture
    organ: doc_claims
    match: "pytest_collected@ARCHITECTURE.md"
    ref: 690d478
    reason: >-
      Real but PRE-EXISTING count drift (ARCHITECTURE claims a stale `**N collected**`;
      main already carried it before this arc's +11 tests — actual outran the claim
      independent of what is shipping, the #234 validator patch + the ai-council bundle).
      NOT paper-over: the count-bump fix forces a "reviewed & accurate" `last_reviewed`
      re-stamp on ARCHITECTURE.md, which [#223] already flags STALE (it omits the ADR-91/92
      deploy subsystem) — so the stamp would be doubly false (the #222 count-vs-freshness
      anti-pattern). The honest fix is the #222/#223 arc: a genuine end-to-end re-read PLUS
      moving the volatile count to a generated fragment so a count bump stops forcing a
      freshness re-stamp. Keyed on the claim id (not the specific numbers) so any pytest
      count drift on this claim stays covered until #222 relocates it.
    auto_clearable_by: "#222"
  - id: warn-handoff-probes-p5-crossrepo-ai-council-2026-07-02
    organ: handoff_probes
    match: "P5 skipped in 2026-07-02-ai-council-architect"
    ref: 690d478
    reason: >-
      Honest-partial cross-repo probe (ADR-36/41; operator Option-3 ruling 2026-07-02). The
      first cross-repo handoff bundle's floor-guard probe P5 binds to the TARGET repo's
      `.claude/check_floor_hash.py`; the resolve-only validator excludes `.claude/` from
      resolution, so it degrades to WARN (skipped) rather than a fake-FAIL or fake-PASS.
      Accepted as honest-partial pending [#234] (harden `.claude/` cross-repo targets to full
      FAIL teeth). Keyed to this bundle+probe; goes stale (surfaced, ADR-75) once a newer
      handoff supersedes it as the latest bundle.
    auto_clearable_by: "#234"
  - id: warn-handoff-probes-p7-crossrepo-ai-council-2026-07-02
    organ: handoff_probes
    match: "P7 skipped in 2026-07-02-ai-council-architect"
    ref: 690d478
    reason: >-
      Honest-partial cross-repo probe (ADR-36/41; operator Option-3 ruling 2026-07-02). The
      first cross-repo handoff bundle's ADR-index probe P7 binds to the TARGET repo's
      `docs/decisions/README.md` via an ambiguous bare basename (`README.md`), which the
      resolve-only validator cannot disambiguate, so it degrades to WARN (skipped) rather
