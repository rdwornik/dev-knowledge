# Known-WARN disposition register — #147 pre-ship verification-organ gate.
#
# `audit.py ship-gate` runs the verification organs against the feature arc and BLOCKS
# /ship on red. The awareness organs (git_backlog_drift #90a, doc_claims #89,
# canonical_freshness A1) exit 0 even on drift, so the gate reads Finding.status, not
# exit codes (F1). A WARN BLOCKS unless an entry here dispositions it as expected/benign.
#
# Each entry suppresses ONE awareness-organ WARN:
#   id     — stable handle (named in the gate's verdict output)
#   organ  — the check whose WARN this dispositions (== Finding.check_name)
#   match  — a substring that must appear in the WARN's evidence. KEY ON THE SPECIFIC
#            BENIGN SIGNATURE (e.g. the commit sha), NOT a bare id, so a DIFFERENT future
#            drift on the same id re-surfaces and blocks (precision-over-recall).
#   ref    — the commit / ADR establishing why the WARN is benign
#   reason — the human disposition
#   auto_clearable_by — (optional) the item that will later compute this disposition,
#            flipping the entry's source manual -> computed (a one-row data change).
#
# Whole-Finding contract: an entry suppresses an ENTIRE Finding (match = substring of its
# evidence). A dispositioned organ must emit one Finding PER concern, else one matched token
# would wave through unrelated drift bundled in the same finding (Codex CRITICAL 2026-06-10).
# git_backlog_drift emits one Finding per drifted id for exactly this reason.
#
# Decoration rule (ADR-75): an entry that matches NO live WARN on a run is SURFACED as
# stale in the gate's output (awareness — it does not block); the register is not allowed
# to silently rot into paper suppressions. Curated data with a reason per entry — the
# "kept-as-manifest with a reason" form #146 explicitly blesses, not a hidden hardcode.

dispositions:
  - id: warn-77-voided-closure
    organ: git_backlog_drift
    match: "77e5d7d"
    ref: 77e5d7d
    reason: >-
      Voided closure (ADR-65). Merge 77e5d7d carried `closes [#77]` but shipped
      different work — #77 was re-scoped, not done, so it legitimately remains open
      (corrected 2026-06-09, commit 9639597). Direction-(a) #90a cannot tell a
      misattributed closure from a real one; only arc-content inspection (#139) can.
    auto_clearable_by: "#139"

  # (retired 2026-06-13, ADR-84/Q9) warn-61c5b50-nightly-digest-writer — the
  # nightly digest no longer commits to main (it diverts to
  # automation/conformance-digest), and the no_ff_merges baseline bumped past the
  # legacy on-main digest, so this WARN no longer surfaces. Removed to avoid a
  # stale-disposition decoration (ADR-75).

  # ---- #140 doc-rot grandfather-baseline (filed with the detector arc, refs #140) ----
  # The new `doc_rot` checker (ADR-88 FC4 enforcement) surfaces PRE-EXISTING history-accretion
  # debt on its first run. This arc introduces the DETECTOR, not the debt — so the existing
  # loci are grandfathered here (standard linter-onboarding baseline) while NEW accretion
  # blocks going forward (an unmatched locus = RED). Concern unit = the LOCUS (a worse count
  # later is the same "known debt" concern, not new drift), so each match keys on the locus
  # token + " (". Each auto-clears (-> [stale], ADR-75) when the locus is condensed below
  # threshold — condense-preserving grooming (ADR-65/49), done by a human, never the detector.
  - id: warn-doc-rot-backlog-164
    organ: doc_rot
    match: "BACKLOG#164 ("
    ref: "#140"
    reason: >-
      Pre-existing inline bloat on the #164 task line (gross length). Surfaced, not introduced,
      by the detector; tracked for condensation under #134 (backlog grooming review).
  - id: warn-doc-rot-backlog-134
    organ: doc_rot
    match: "BACKLOG#134 ("
    ref: "#140"
    reason: >-
      Pre-existing inline-history accretion on the #134 task line. Surfaced, not introduced;
      tracked for condensation under #134 (backlog grooming review) per ADR-65.
  - id: warn-doc-rot-backlog-77
    organ: doc_rot
    match: "BACKLOG#77 ("
    ref: "#140"
    reason: >-
      Pre-existing inline-history accretion on the #77 task line. Surfaced, not introduced;
      tracked for condensation under #134 (backlog grooming review) per ADR-65.
  - id: warn-doc-rot-backlog-10
    organ: doc_rot
    match: "BACKLOG#10 ("
    ref: "#140"
    reason: >-
      Pre-existing inline-history accretion on the #10 task line. Surfaced, not introduced;
      tracked for condensation under #134 (backlog grooming review) per ADR-65.
  - id: warn-doc-rot-claude-section-history
    organ: doc_rot
    match: "CLAUDE.md#section-history"
    ref: "#140"
    reason: >-
      Pre-existing CLAUDE.md §12 Section-history block (20 entries) — the ADR-49 retired-inline-
      changelog class. Surfaced, not introduced; condensation-to-git is the same class as #77's
      PLAYBOOK Section-history stripping (the nearest tracked grooming item).

  # ---- pre-existing 2026-06-19 direct-to-main commits (operator-ratified 2026-06-20) ----
