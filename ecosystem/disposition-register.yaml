  # -- i.e. it explicitly declares NOTHING closed. But CLOSES_RE
  # (`\b(?:closes?|closed|fixes?|fixed)\s+\[#(\d+)\]`) has no way to see the leading "0" --
  # it pattern-matches the bare adjacency "closed [#505]" and fires regardless of the
  # negating qualifier three words earlier. (`[#430]` in the same subject does NOT
  # double-fire: it isn't itself preceded by a closes-word, only by `[#505] `.) Re-derived
  # against the commit body, which is unambiguous: "NOT DONE, deliberately: ... nothing
  # closed on [#505]/[#502]". [#505] correctly stays OPEN -- this is not a case of "done item
  # never left the file" (ADR-65), it is the checker's own precision lever (quoted-context
  # stripping) not covering a plain-English negation adjacent to the trigger word. Reconciled
  # to reality by disposition, not by editing the [#505] row (which is already accurate) --
  # same shape as the reconciled_versions/[#335] template false-positive above. Keyed on the
  # specific id+sha evidence pair per precision-over-recall, so a REAL future closes-and-still-
  # open drift on a different id (or a different commit) re-surfaces and blocks.
