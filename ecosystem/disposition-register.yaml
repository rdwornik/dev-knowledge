  # DEPENDS-ON. `scan_undeclared_edges.py` matches the path string; `reconciled_with` declares a
  # version coupling. There is no third thing to say, so every doc that merely *names* a registered
  # spec must either lie (declare a coupling it does not have — the stale-edge risk the decision
  # sheet §4 item D flagged) or buy a hand-written register row. Twenty rows in, that is the measured
  # price of the ambiguity, and it now scales with any policy that files source documents verbatim:
  # a verbatim filing cannot be rephrased around the scanner by construction, so intake-by-intake
  # this class inflates on its own. The fix is a mentions-vs-depends distinction in the edge
  # vocabulary itself (the RF-4 family — CoupledSet granularity, or a `mentions:` declaration form),
