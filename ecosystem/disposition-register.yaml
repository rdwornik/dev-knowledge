  # ---- the NINTH, and this arc created it (2026-08-09, ARC-2 Phase A) ----
  # The block above says, of the eight: "a NINTH referencing doc re-surfaces and blocks." One did,
  # within the same arc, and it was written BY this arc. Ratifying intake #25 needed a `decided-by:`
  # erratum explaining why the flip was a correction rather than a decision, and the honest
  # explanation names where the intake's already-governing content is quoted — which put the literal
  # string `templates/prompt-template.md` into an actionable doc and minted a tier-1 edge.
  #
  # REPHRASING WAS REFUSED ON THE MERITS. Dropping the path (saying "the work-lane card") would have
  # cleared the WARN and left the note's meaning intact — and that is exactly the move the
  # [#492] doc_rot entry refused two paragraphs up: "rephrasing the date games the detector".
  # The same principle binds here. An edge is discharged by declaring it or dispositioning it, never
  # by writing around the scanner. So it is dispositioned, under #241, on its merits.
  #
  # It is also the cheapest possible evidence for the 17-WARN finding recorded above: the corpus
