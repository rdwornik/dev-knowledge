# quality-requirements.yaml -- the technical quality requirements, as data ([#765], AN2-1).
#
# WHY THIS FILE EXISTS. Technical requirements used to live in a paste. AMEND-NIGHT-PLAN-001
# wrote six of them as instructions to a session, and an instruction is a request where a
# mechanism is a guarantee: a session that does not read the paste is not in breach of
# anything, and the next window re-pastes or forgets. This register is the same content
# with a different ontology -- each requirement names the ORGAN that enforces it, the METRIC
# that says whether it holds, and the TRIP-TEST that proves the organ refuses.
#
# THE HONESTY MECHANISM IS THE STATUS FIELD, and it inverts the usual failure. A register
# whose entries all claim enforcement is worse than no register, because a reader trusts it.
# So:
#
#   status: measured    carries `organ` AND `trip_test`. The organ resolves to a file that
#                       exists; the trip-test exists, PASSES against the live organ, and
#                       goes RED when the organ is neutered. That last leg is what separates
#                       a proof from a decoration -- a trip-test that passes unconditionally
#                       is refused by `tests/test_quality_requirements.py`, not accepted.
#   status: candidate   carries NEITHER field, and the schema refuses it if it tries to.
#                       A requirement with no organ is a real requirement with no
#                       enforcement, which is a fact worth recording rather than hiding.
#
# So the register cannot name an enforcement it does not have. That is what makes it safe to
# seed from prose: an un-enforced line lands as a candidate and stays visible as one.
#
# THE COMMENTS HERE DESCRIBE RATHER THAN COMMAND, deliberately. `ecosystem/*.yaml` is inside
# `silent_rule_detector`'s scope, so a `#` comment in this file is scored exactly like
# doctrine prose against the silent-rule ratchet. The rules live in the data below and in
# the validator that reads it; the header explains and does not legislate.
#
# TRIGGER: the `quality-requirements-freshness` pre-commit hook, which regenerates the
# ARCHITECTURE section from this file and refuses a commit where the two disagree, and
# `tests/test_quality_requirements.py`, which runs the schema and the trip-test legs. The
# lane-5 log-review routine becomes the second trigger when it lands (AN2-3): a breach it
# finds is filed as a row rather than noted.
# CONSUMERS: the generated ARCHITECTURE section "Quality requirements", and the methodology
# floor, whose declared tier for this register is the `floor:` block below.
#
# FIELD CONTRACT -- every entry carries, in this order:
#   id          QR-<ATTRIBUTE-CODE>-<NNN>; stable once written, so a citation survives a
#               re-ordering of the file
#   attribute   one of the four AN2-2 quality attributes (the `attributes:` enum below)
#   status      measured | candidate
#   statement   the requirement, in the smallest number of words that stay checkable
#   metric      what a reader measures to decide whether it holds
#   incident    the measured event behind it -- every entry here has one, which is why the
#               register is small
#   source      where the requirement was stated
#   organ       measured entries only: the repo-relative path of the thing that enforces it
#   trip_test   measured entries only: `<test file>::<test function>`, the proof it refuses
#   note        optional: a correction or a limit the entry would otherwise imply away

register_version: "1.0.0"

# The floor declaration for this component, as DATA rather than as prose about data. `tier`
# takes a value from the fleet tier vocabulary that `ecosystem/parity-surfaces.yaml` already
# uses and `scripts/fleet_parity.py` already reads, so one component cannot hold two floors.
# AN2-1 rules the tier; the reason records why the tier is the one it is.
floor:
  tier: MUST
  reason: >-
    Every consumer repo inherits the register (AN2-1). What travels is the DISCIPLINE -- a
    requirement carries the organ that enforces it, the metric, and the trip-test that proves
    the organ refuses; a requirement with no organ is filed as a candidate rather than
    dressed as enforcement. A consumer inheriting only the hub's entries would inherit a
    report; inheriting the discipline lets it register its own.
  declared_in: templates/child-methodology-floor.md.tmpl

# The four quality attributes AN2-2 names, each with the short code its ids use. The set is
# closed; widening it is an operator act, because a fifth attribute with one entry in it is
# how a bounded register becomes a backlog.
attributes:
  performance: PERF
  availability: AVAIL
  resource-control: RES
  observability: OBS

requirements:

  # ---- performance ------------------------------------------------------------------
  - id: QR-PERF-001
    attribute: performance
    status: measured
    statement: >-
      A commit that changes a `scripts/*.py` file selecting ZERO tests is refused, and the
      refusal names the RED-first witness to write.
    metric: >-
      In-scope zero-selection sources at commit tier: 0. The grandfathered set is a ratchet
      that only shrinks -- 4 of 140 scripts at arm time, measured 2026-09-11.
    incident: >-
      Five OOM-killed full-suite attempts on the workstation at 1.4 GB free of 28 GB. With
      no full local suite available, the impacted set for the changed file is the only local
      proof there is, so a changed script that selects nothing is an unproven change.
    source: AMEND-NIGHT-PLAN-002 AN2-2 (performance); the organ is [#278] leg b
    organ: scripts/impacted_tests.py
    trip_test: tests/test_quality_requirement_trips.py::test_qr_perf_001_uncovered_script_is_refused

  - id: QR-PERF-002
    attribute: performance
    status: candidate
    statement: >-
      No seat runs the full suite on the workstation; locally a seat runs the impacted set
      for the changed file, and the full suite runs once, at integration.
    metric: >-
      Full-suite attempts on the workstation: 0. Peak RSS of a full-suite run against free
      memory at dispatch, sampled before the run rather than after it.
    incident: >-
      Five attempts OOM-killed at 1.4 GB free of 28 GB. The suite is not merely slow on this
      box; it does not complete.
    source: AMEND-NIGHT-PLAN-002 AN2-2 (performance)
    note: >-
      A candidate because nothing reads free memory or refuses a full-suite invocation. The
      rule is live in `CLAUDE.md` and in every lane contract as prose, which is precisely the
      state this register exists to distinguish from enforcement.

  - id: QR-PERF-003
    attribute: performance
    status: candidate
    statement: >-
      A heavy commit-tier gate carries a measured wall-time and memory budget; above it the
      gate moves to CI or becomes incremental.
    metric: >-
      Per-gate wall seconds and peak RSS, re-measured on a quiet box. Measured 2026-09-15:
      graph-rebuild 14.5 s and 13.6 s wall at 50 MB peak; audit-health 16.0 s and 16.5 s
      wall at 768 MB peak.
    incident: >-
      The four-hook graph chain was reported at ~21.9 s end to end when it armed, which is
      the figure ADR-118's flip-condition 2 keys on. Nothing re-measures it.
    source: AMEND-NIGHT-PLAN-002 AN2-2 (performance)
    note: >-
      A CORRECTION TO THE PREMISE, recorded rather than absorbed. AMEND-NIGHT-PLAN-001 AN1-3
      named graph-rebuild AND audit-health together as the heaviest local operation. On wall
      time they are within 2.5 s of each other; on memory they are not comparable --
      audit-health peaks at 768 MB against graph-rebuild's 50 MB, about 15x. Only one of the
      two is memory-heavy, and on a box whose binding constraint is memory rather than time
      that is the difference that decides which gate to move.

  - id: QR-PERF-004
    attribute: performance
    status: candidate
    statement: >-
      A test that spawns a shell per case is marked, and the marked set is routed to Actions
      rather than run locally.
    metric: >-
      Wall time of the marked set locally against on Actions. Observed: 32 cases in 39m46s.
    incident: >-
      A 32-case shell-per-case set took 39m46s in one local run -- longer than the batch
      window it was running inside.
    source: AMEND-NIGHT-PLAN-002 AN2-2 (performance)
    note: >-
      A candidate because no marker exists and no routing reads one. `pyproject.toml` carries
      no such mark and nothing in `.github/workflows/` selects on it.


  - id: QR-PERF-005
    attribute: performance
    status: candidate
    statement: >-
      A session's per-turn cost is read against its OWN running median, and a seat whose cost
      is rising while its work class is unchanged reclaims context at its next file-backed
      checkpoint rather than running on.
    metric: >-
      Turns at or above 1.30x the seat's own running median, sustained 5 consecutive turns.
      Derived 2026-09-15 over 681 hub-slug transcripts and 92,743 priced turns: the trigger
      fires in 52.4% of sessions at 1.30x (84.4% at 1.10x, 0.9% at 2.00x), median first fire
      at turn 68 / 43 minutes. 1.30x is the knee, not a preference -- a trigger that fires in
      84% of sessions is the normal curve and one that fires in 0.9% never runs.
    incident: >-
      Per-turn cost rises 0.701 -> 1.247 x own median across turn-index bands while median
      context per call rises 100,662 -> 350,757 tokens. Nothing reads either figure, so a
      seat that has become expensive is indistinguishable from one that is merely busy.
    source: >-
      batch AA lane aa-14, frozen contract section 1; derivation in
      docs/audits/2026-09-15-technical-lane-aa-14-resource-lifecycle.md sections 2.1 and 3.1
    note: >-
      THE CONFOUND IS RECORDED RATHER THAN ABSORBED. The statement says "while the work class
      is unchanged" and work class is NOT controlled for -- no transcript field carries it.
      What makes the number survivable is the held leg: with turn index held in the band
      50-100, an eight-fold spread in elapsed time moves cost only 0.915 -> 1.003, which is
      what context accumulation predicts and what a work-class explanation does not.

  - id: QR-PERF-006
    attribute: performance
    status: candidate
    statement: >-
      UPSTREAM, NOT OURS. A long-running session degrades over roughly 30 minutes of use,
      accumulating CPU and memory; a restart carrying the same context restores its speed.
    metric: >-
      Per-turn latency against the session's own median, by session age. **THIS METRIC IS
      FALSIFIED AS A PROXY FOR THIS REQUIREMENT AND MUST NOT BE PRESCRIBED AGAIN.** It was
      specified in the aa-14 frozen contract as the way to detect session degradation. It
      cannot detect it: the ratio is flat to three decimal places across every age band (see
      `incident`), so there is no rise for any threshold to sit on. It is retained here, struck
      rather than deleted, because a proxy that is quietly removed gets re-proposed by the next
      person who reasons their way to it -- which is how it was proposed this time.
    incident: >-
      Publicly reported upstream against Claude Code and carried into this repo by
      DIGEST-2026-09-15-unrecorded-findings.md section 1. **MEASURED HERE AND NOT
      REPRODUCED:** taking latency as the gap between a tool_result record and the assistant
      record answering it, the ratio to own median is 0.995 / 1.001 / 0.999 / 0.994 / 0.999 /
      1.041 / 1.025 across the 0-15, 15-30, 30-60, 60-120, 120-240, 240-480 and 480+ minute
      bands -- flat at median, p75 and p90 alike over 92,743 turns.
    source: >-
      UPSTREAM: anthropics/claude-code issue #22968, "High CPU usage and memory leak in
      long-running sessions" (CLOSED as not planned) --
      https://github.com/anthropics/claude-code/issues/22968 -- which reports degradation over
      "~30 minutes of use", 823 MB RSS against ~360 MB on a fresh session, 414 minutes of CPU
      on a mostly-idle overnight session, and 25-72% CPU while idle, and states that "killing
      and resuming the session (same conversation context) immediately restores normal
      performance, which rules out context window size as the cause". Relayed to this repo by
      DIGEST-2026-09-15-unrecorded-findings.md section 1; the non-reproduction is
      docs/audits/2026-09-15-technical-lane-aa-14-resource-lifecycle.md section 3.2
    note: >-
      TWO LIMITS, BOTH LOAD-BEARING. (1) The instrument sees MODEL response latency; if the
      degradation is client-side -- UI, the whole-file transcript read of QR-RES-003, tool
      dispatch -- this measurement cannot see it, so the honest claim is "no server-side
      latency degradation with session age", not "no degradation". (2) THE UPSTREAM FIGURES
      IN `source` ARE THEIRS, NOT OURS, and no threshold in this repo is set against them.
      #22968's 823 MB against ~360 MB fresh was measured on someone else's macOS box; ours
      measured 413.3 MB per seat and a ~385 MB plateau on this one. The two must never be
      averaged, compared as if commensurable, or used interchangeably, and the upstream number
      being larger is not evidence about this machine. **CITATION SUPPLIED 2026-09-15**, after
      the entry was first filed with the number missing: the digest this lane was given carried
      five reports and no issue numbers, and the entry recorded the gap rather than inventing
      one. The issue was then opened and its body read before being cited here.

  # ---- availability / reliability ---------------------------------------------------
  - id: QR-AVAIL-001
    attribute: availability
    status: measured
    statement: >-
      A seat does not end its turn on a wait. A wait is written as a loop carrying an
      interval, a bound and a predicate read from the file surface, or it is refused.
    metric: >-
      Wait-intentions in a seat document with no `<!-- WAIT: ... -->` declaration within
      `seat_refusals._WAIT_WINDOW` lines (10 at the time of writing): 0. Declarations
      missing an interval, a bound or a predicate: 0.
    incident: >-
      The integrator waited a day on a session that no longer existed. A turn that ends on an
      intention has no next tick, so nothing wakes the session and the wait is unbounded in
      practice even where it reads as bounded in prose.
    source: AMEND-NIGHT-PLAN-002 AN2-2 (availability); the organ is PLAYBOOK Ch8, as code
    organ: scripts/seat_refusals.py
    trip_test: tests/test_quality_requirement_trips.py::test_qr_avail_001_sleeping_poll_is_refused

  - id: QR-AVAIL-002
    attribute: availability
    status: candidate
    statement: >-
      A lane that ends without handing back is detected from git rather than waited on.
    metric: >-
      Time between a lane's last commit and the integrator learning the lane is gone. A
      detection that reads git is bounded by the poll interval; one that reads a promised
      handback is unbounded.
    incident: >-
      The integrator waited a day on a session that no longer existed. The lane's branch had
      carried the answer the whole time.
    source: AMEND-NIGHT-PLAN-002 AN2-2 (availability)
    note: >-
      Distinct from QR-AVAIL-001 and filed separately on purpose. `seat_refusals` refuses the
      WAIT; nothing yet performs the git-side DETECTION that would make the wait unnecessary.
      Refusing a bad answer and supplying the good one are two organs.

  - id: QR-AVAIL-003
    attribute: availability
    status: candidate
    statement: >-
      A Codespace lane runs attached; a detached one is refused at dispatch.
    metric: >-
      Work produced by detached Codespace lanes. Observed across two nights: zero commits
      from two detached lanes.
    incident: >-
      Two separate nights dispatched Codespace lanes detached and both produced no work at
      all -- not partial work, none.
    source: AMEND-NIGHT-PLAN-002 AN2-2 (availability); restated in DECLARE-NIGHT-PLAN-2026-09-15-FINAL
    note: >-
      A candidate because the attach/detach choice reaches no flag any gate reads. This is
      the same shape [#752] found one column over: a declared field that no code resolves
      into a launcher argument is a decision the tree records and does not make.

  - id: QR-AVAIL-004
    attribute: availability
    status: candidate
    statement: >-
      A process that outlives its lane is killed at teardown, and the teardown verifies the
      kill rather than assuming it.
    metric: >-
      Processes surviving a teardown: 0. Worst observed: one orphan alive 53 hours at
      roughly 10 cores.
    incident: >-
      A 53-hour orphan at ~10 cores was found by looking, not by a check. It had been costing
      the box the whole time the window was reporting itself as quiet.
    source: AMEND-NIGHT-PLAN-002 AN2-2 (availability)

  - id: QR-AVAIL-005
    attribute: availability
    status: measured
    statement: >-
      Killing a job kills its process tree; a surviving descendant is reported rather than
      left running.
    metric: >-
      Seconds between a reap and the last descendant exiting. Observed: about 8 minutes.
    incident: >-
      Job 100297d3 recorded `reapedMidWorkAt 2026-09-14T22:43:32Z` in its `state.json`. The
      subtree outlived the reap by roughly 8 minutes, and a GRANDCHILD outlived the parent
      that had just been killed -- so the kill reached one generation and stopped.
    source: measured 2026-09-14, batch Z night; carried by AMEND-NIGHT-PLAN-002 AN2-5
    organ: scripts/resource_lifecycle.py
    trip_test: tests/test_quality_requirement_trips.py::test_qr_avail_005_a_surviving_grandchild_is_refused
    note: >-
      PROMOTED 2026-09-15 by batch AA lane aa-14 ([#792]). `resource_lifecycle.teardown_tree`
      snapshots the tree BEFORE killing the root -- on POSIX an orphan is reparented to init
      the instant its parent dies, so a walk taken after the kill finds nothing and a teardown
      built that way reaps nothing while reporting success -- kills descendants before the
      root, and REPORTS survivors. The last of those three is what makes this entry's metric
      checkable at all: "seconds between a reap and the last descendant exiting" cannot be
      read from a teardown that returns nothing. The witness is a real spawned grandchild
      that survives a naive parent kill and is then reaped, and it asserts the grandchild was
      TARGETED rather than merely dead -- a test that only checked the parent died would pass
      against the behaviour we already have, which is the whole defect.

  - id: QR-AVAIL-006
    attribute: availability
    status: candidate
    statement: >-
      Terminating a background session deregisters it; a session the daemon can rehydrate is
      not reclaimed.
    metric: >-
      Sessions alive under the same session-id after a kill: 0. Observed: 1, at `attempt: 2`.
    incident: >-
      SIGKILL on a background session does not reclaim it. The daemon rehydrates the session
      from `~/.claude/daemon/roster.json` under the SAME session-id with `attempt: 2`,
      witnessed twice on 2026-09-15. `claude stop <id>` is the only verb that deregisters, so
      a seat that kills a process has freed nothing and does not learn so.
    source: measured 2026-09-15, batch Z night; carried by AMEND-NIGHT-PLAN-002 AN2-5
    note: >-
      This is the reason a memory-floor arithmetic (QR-RES-001) cannot be built on process
      kills alone: the resource a kill appears to free comes back.

  - id: QR-AVAIL-007
    attribute: availability
    status: candidate
    statement: >-
      A session whose worktree was torn down refuses to write rather than resolving to the
      primary checkout.
    metric: >-
      Writes into a torn-down worktree after teardown: 0. Writes redirected to the primary
      checkout by a session that believed it was isolated: 0.
    incident: >-
      A Stop hook resolved its repo root to an already-torn-down worktree and WROTE there --
      `logs/2026-09/DETECTOR-ERROR-2026-09-13.md`, preserved in this batch's manifest. The
      hook's own error text names the condition it detected and it wrote anyway.
    source: measured 2026-09-13, batch Z night; carried by AMEND-NIGHT-PLAN-002 AN2-5
    note: >-
      [#726] and [#748] own the two halves of this. Filed here as a candidate because the
      quality attribute outlives whichever row closes first: the requirement is that
      isolation FAILS LOUDLY, and a row that fixes one resolver does not establish that.

  - id: QR-AVAIL-008
    attribute: availability
    status: candidate
    statement: >-
      A substrate whose provisioning failed reports the failure; a silently substituted
      environment is refused rather than used.
    metric: >-
      Lanes whose gates were vacuous because the environment lacked them: 0. A vacuous gate
      and an absent gate are different facts and the metric reads the first.
    incident: >-
      A Codespace whose devcontainer build fails is silently replaced by a bare recovery
      container. The lane then runs with none of the declared tooling, so its gates pass by
      not existing -- a green that reports nothing.
    source: measured 2026-09 batch Z window; carried by AMEND-NIGHT-PLAN-002 AN2-5
    note: >-
      The failure mode this entry names is the dangerous one in the set: every other entry
      here describes work that did not happen, and this one describes work that reported
      itself as done.


  - id: QR-AVAIL-009
    attribute: availability
    status: candidate
    statement: >-
      UPSTREAM, NOT OURS. A process spawned through the Bash tool is reparented and runs
      indefinitely after its session ends; the fix requested upstream is whole-process-TREE
      teardown rather than killing the top-level PID.
    metric: >-
      Descendants alive after a session ends: 0. A teardown that reaches one generation and
      stops scores the same as no teardown, so the metric counts descendants and never the
      parent.
    incident: >-
      Publicly reported upstream and REPRODUCED HERE TWICE, which is why it is filed rather
      than merely relayed: a 46.8-hour bash poller still running against the deleted lane
      `lane-x-689-conductor-e-proof` (job d14f5e04, 2026-09-14T22:58Z, found among 18 orphans
      holding 688.6 MB), and a grandchild that outlived the parent kill by roughly 8 minutes
      (QR-AVAIL-005).
    source: >-
      UPSTREAM: anthropics/claude-code issue #43944, "Background processes started by Bash tool
      are not cleaned up on session exit" (CLOSED as not planned) --
      https://github.com/anthropics/claude-code/issues/43944 -- whose body states "the spawned
      Node processes get reparented to PID 1 (launchd on macOS) and continue running
      indefinitely" and asks that cleanup "include the full process tree, not just the
      top-level PID", which is the requested fix this entry names. Relayed by
      DIGEST-2026-09-15-unrecorded-findings.md section 1; the two local reproductions are
      QR-AVAIL-004 and QR-AVAIL-005
    note: >-
      DISTINCT FROM QR-AVAIL-004 AND QR-AVAIL-005, and filed separately on purpose. Those two
      record what WE measured on this box; this one records that the defect is upstream,
      acknowledged, and has a named requested fix. The distinction decides what we build: a
      defect that is ours is fixed, one that is upstream is WORKED AROUND and the workaround
      is removed when the upstream fix lands. Conflating them produces a permanent workaround
      nobody remembers to retire. **CITATION SUPPLIED 2026-09-15** (see `source`), after the
      entry was first filed with the number missing. Note the upstream issue is CLOSED AS NOT
      PLANNED: the workaround's retirement condition therefore does not exist yet, so
      `scripts/resource_lifecycle.py teardown` is load-bearing indefinitely rather than until a
      fix lands, and the "remove the workaround when upstream fixes it" clause above has no
      trigger to wait for. That is a reason to keep it, not a reason to stop recording it as a
      workaround.

  # ---- resource control --------------------------------------------------------------
  - id: QR-RES-001
    attribute: resource-control
    status: measured
    statement: >-
      A memory floor below which the dispatcher refuses another local lane and reports the
      refusal -- arithmetic, rather than a judgement call at dispatch time.
    metric: >-
      Free memory read at dispatch against a declared floor, with the lane count derived from
      the reading. Refusals reported: all of them.
    incident: >-
      Five OOM-killed full-suite attempts at 1.4 GB free of 28 GB, plus the 53-hour orphan at
      ~10 cores that nothing accounted for. The lane count was set from an estimate of what
      the box could hold rather than from a reading of what it had.
    source: AMEND-NIGHT-PLAN-002 AN2-2 (resource control)
    organ: scripts/resource_lifecycle.py
    trip_test: tests/test_quality_requirement_trips.py::test_qr_res_001_over_ceiling_dispatch_is_refused
    note: >-
      THIS WAS THE REGISTER'S FIRST FINDING ABOUT ITSELF, and it is recorded rather than
      erased by the promotion. The attribute the operator described as the least
      discretionary -- "automatic arithmetic, not a judgement call" -- was the one with no
      organ at all. `scripts/seat_refusals.py` carries `lane-ceiling`, which is ADR-110's 4-6
      lane COUNT and reads no memory; `--check-worktrees` reads the live worktree list, also
      a count. **PROMOTED 2026-09-15 by batch AA lane aa-14 ([#792]):**
      `resource_lifecycle.admit` reads free memory and a computed ceiling and REFUSES. It
      refused on its first live run -- 28 seats against a ceiling of 26 and 2.98 GB free
      against a 3.00 GB reserve. `seat_refusals.lane-ceiling` is NOT replaced and both stay
      live: a count ceiling and a memory ceiling answer different questions, and the box was
      over on both legs at the same moment. THE CEILING'S INPUTS, so no seat re-derives them:
      total 27.67 GB, non-Claude 13.52 GB, reserve 3.00 GB, per seat 413.3 MB (287.0 session
      + 126.3 helper, from an exact 31/31 process split) -> 27 seats. The integer is NOT the
      record; the inputs are, because the ceiling moves whenever the non-Claude load does
      and was observed moving 27 -> 26 -> 25 within one session.


  - id: QR-RES-002
    attribute: resource-control
    status: candidate
    statement: >-
      UPSTREAM, NOT OURS. An idle session grows without bound, and the growth is NOT context:
      it is time-based.
    metric: >-
      Resident memory of a session process against its age, with context size held.
    incident: >-
      Publicly reported upstream: four idle sessions reached roughly 15 GB each over 18 hours
      with no interaction while the debug log showed context CONSTANT at 6,664 chars; the
      combined 60 GB triggered the OS OOM killer. **MEASURED HERE 2026-09-15 AND NOT
      REPRODUCED AT THAT MAGNITUDE:** across 62 live claude processes the largest was 393.9 MB
      and the oldest (11.83 h) was at 161.6 MB. What IS reproduced is the DIRECTION -- the
      session-process class rises 255.6 MB under 0.5 h to 383.0 MB at 0.5-1 h (r = 0.440,
      21.4 MB/h under 4.5 h) and then plateaus.
    source: >-
      UPSTREAM: anthropics/claude-code issue #18859, "[BUG] Memory leak in long-running idle
      Claude Code sessions" (**OPEN** -- the only one of this lane's five that is) --
      https://github.com/anthropics/claude-code/issues/18859 -- reporting 4 idle sessions at
      ~15 GB each over ~18 hours, ~60 GB combined against 24 GB of RAM, killed by macOS
      jetsam, with the debug log showing context CONSTANT at 6,664 chars from
      2026-01-15T00:30:45 to 2026-01-16T02:14:31. Relayed by
      DIGEST-2026-09-15-unrecorded-findings.md section 1; the local measurement is
      docs/audits/2026-09-15-technical-lane-aa-14-resource-lifecycle.md sections 2.2 and 2.3
    note: >-
      THIS ENTRY IS THE REGISTER'S RECORD OF A THESIS, not only of a defect. Because the
      growth is time-based and the COST growth measured beside it is context-based (see
      QR-PERF-005), clearing context does not free process memory and retiring a session does
      not reclaim a cache that was not the problem. They are two mechanisms, and building one
      for both is why neither works. The 15 GB figure is deliberately NOT the number any
      local threshold is set against -- the measured plateau is, and a threshold set against
      an unreproduced magnitude would refuse nothing here.

      **AN UPSTREAM REPORT IS NOT A MEASUREMENT OF THIS BOX. THIS ENTRY IS THE RULE'S CASE
      LAW.** The 15 GB figure entered this lane's contract as a fact about our machine and is
      not one: it is issue #18859's reporter's observation on a 24 GB macOS host, and the
      largest process we could find here was 393.9 MB -- roughly 38x smaller. Had the contract's
      premise been carried through, a retirement threshold would have been set at a magnitude
      nothing on this box ever reaches, and the mechanism would have refused nothing while
      appearing fully armed. **THE RULE, stated so it binds the next entry and not just this
      one: an upstream report is recorded AS A REPORT, with its source and its own figures kept
      as the reporter's; every threshold this repo enforces rests only on a measurement taken
      here.** What travels from a report is the DIRECTION and the MECHANISM -- #18859's
      constant 6,664-char context while memory grew is exactly the context-vs-memory separation
      this lane built two modules around, and that part reproduced. The magnitude did not, and
      the two are recorded separately on purpose. **CITATION SUPPLIED 2026-09-15** (see
      `source`), after the entry was first filed with the number missing.

  - id: QR-RES-003
    attribute: resource-control
    status: candidate
    statement: >-
      UPSTREAM, NOT OURS, AND LOAD-BEARING FOR US. A session transcript is read whole, with
      no streaming read and no size safeguard, so a large one exhausts the client's memory.
    metric: >-
      Largest transcript any reader opens, against a declared bound. Measured across the
      whole local store 2026-09-15: 3,036 transcripts, 2,422 MiB total, max 28.19 MiB,
      p99 6.42 MiB, median 0.34 MiB. Over 50 MiB: 0. Over 25 MiB: 3.
    incident: >-
      Publicly reported upstream: a 102 MB `.jsonl` consumed 90% of available RAM and froze
      the client. **LOAD-BEARING FOR US BECAUSE WE ARE ALSO A READER:** `scripts/lane_cost.py`
      reads transcripts to price a lane, so our own cost instrument was a second client on the
      same wall. Our largest today is 28.19 MiB, 3.6x below the reported freeze point --
      headroom, not immunity, and the corpus grows monotonically. **OUR HALF IS NOW FIXED
      (2026-09-15, commit 9227bc9a):** `read_transcript_usage` streams line by line instead of
      `read_text()` + `.splitlines()`, which had held the whole file as a str AND as a list of
      str at once, inside a module `scripts/fleet_health.py` imports and therefore runs at
      SESSION START. Peak is now bounded by the longest LINE (1.360 MB measured) rather than by
      the file, and `lane_cost.MAX_TRANSCRIPT_LINE_BYTES` (8 MiB, ~6x the largest real line)
      bounds even that, WARNING rather than silently dropping. The UPSTREAM half is untouched
      and this entry stays a candidate for it. Note the corpus moved measurably within the
      filing day itself -- a re-scan hours later gave 3,108 transcripts, 2.55 GB, max
      29.56 MB -- which is the monotonic growth this entry warns about, observed.
    source: >-
      UPSTREAM: anthropics/claude-code issue #21022, "[BUG] Claude Code hangs when accessing
      large session files (>50MB)" (CLOSED as not planned) --
      https://github.com/anthropics/claude-code/issues/21022 -- reporting a 102 MB / 8,366-line
      `.jsonl` at 90% RAM causing a full freeze requiring force-kill, the client having "loaded
      the entire file into memory synchronously". Its sibling #22365 asks for a size threshold
      above which a session file is skipped with a warning. Relayed by
      DIGEST-2026-09-15-unrecorded-findings.md section 1; the local corpus measurement is
      docs/audits/2026-09-15-technical-lane-aa-14-resource-lifecycle.md section 5
    note: >-
      THE ARCHIVE PATH HAS A MEASURED TRAP AND IT IS NAMED HERE SO THE NEXT LANE DOES NOT
      WALK INTO IT. Archiving out of the scan path is the right shape -- archive, never
      delete, because the cost history IS the corpus -- but reusing `scripts/logs_retention.py`
      relocates a dated file into `logs/YYYY-MM/`, whose `.gitignore` patterns are `.md`-only
      (`.gitignore` lines 34-35), so a relocated `.json`/`.jsonl` lands untracked and leaves
      the tree permanently dirty; `scripts/validate_hermetization.py` then refuses that home
      as unallowlisted. Two hub organs disagree about where a dated `logs/` artifact lives.
      `[#785]` already records the disagreement. Transcripts live OUTSIDE the repo
      (`~/.claude/projects/`), so a transcript bound must not route through `logs/` retention
      at all -- which is how this entry routes around the trap rather than resolving it.

