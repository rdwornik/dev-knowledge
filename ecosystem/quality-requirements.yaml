  - id: QR-RES-002
    attribute: resource-control
    status: candidate
    statement: >-
      A codespace is STOPPED at handback once its receipt is in hand, so compute is not billed
      after the work has landed. Stopping is never deleting.
    metric: >-
      Paid compute minutes accrued after a lane's last useful work, per batch. Codespaces left
      running at batch close: 0.
    incident: >-
      The dispatcher's success path prints "the codespace is STILL RUNNING and still billing" and
      stops there; teardown is a manual verb nobody types. The never-delete doctrine is sound --
      deleting a machine that may hold work is not a call a transport wrapper gets to make -- but
      it over-applied by one verb: stopping preserves saved changes and `/workspaces` and only
      ends compute billing.
    source: operator directive 2026-09-15 (Phase 3), Phase 2 finding D6
    note: >-
      CANDIDATE, and it OVERLAPS lane aa-14 (`LANE-aa-14-resource-lifecycle.md`, frozen), whose
      section 3 rules the same idle policy -- "attached while a lane runs, torn down at handback,
      never left warm" -- and which also lands entries in this register. Flagged for the
      integrator rather than double-landed: if aa-14 files its own codespace-idle entry, this one
      is superseded by it and should be withdrawn, not merged alongside. The organ is also
      cross-repo, per QR-AVAIL-009's note. ONE CORRECTION IS OWED TO aa-14 WHICHEVER WAY THAT
      GOES, and it is the reason this row is not simply withdrawn in advance: that lane's
      section 3 says the container is "torn down at handback", and torn down is the verb the
      operator ruled 2026-09-15 to be the over-application -- "the doctrine over-applied by one
      verb". STOPPING ends compute billing and preserves /workspaces and every saved change;
      DELETING destroys work a lane may not have pushed, and the 2026-09-06 batch T record has
      an instance of exactly that risk (45 turns of uncommitted work whose only copy was inside
      a stopped codespace on a 24h retention clock). aa-14 should implement STOP, not teardown.
      Verified 2026-09-15 against LANE-aa-14-resource-lifecycle.md line 85.
      RESOLVED 2026-09-16 BY OPERATOR RULING: STOP, NOT DELETE. aa-14 landed with the
      teardown verb in QR-RES-005 and in `codespace_regime.idle_verdict`; the integrator
      corrected both in aa-14's own merge, so the correction owed above is discharged. This
      entry is NOT withdrawn despite the conditional above: it owns the DISPATCHER's
      stop-at-handback verb and its compute-minutes metric, QR-RES-005 owns the idle policy
      and the uptime receipt, and after the correction the two agree rather than overlap.

  - id: QR-AVAIL-010
    attribute: availability
    status: candidate
    statement: >-
      A dispatched lane keeps its codespace alive for as long as it is working. No lane may rely
      on a substrate whose documented reaping condition its own design holds true for the entire
      run.
    metric: >-
      Lanes reaped by the platform's idle timer while still working: 0. Secondary: the gap
      between a lane's longest expected silent interval and the codespace's configured
      --idle-timeout, which must stay positive.
    incident: >-
      A detached lane produces ZERO terminal output for its whole run, and the codespace is
      created with --idle-timeout 30m, so the platform stops the machine at thirty minutes of
      wall clock no matter how much inference is happening inside it. Derived 2026-09-15 from
      four facts in our own source -- create passes --idle-timeout 30m
      ($script:CodespaceDefaultIdle); the runner starts the agent as `claude -p ...
      --output-format stream-json --verbose > "$RUN_LOG" 2>&1 &`, both streams into a file; the
      detach path re-execs under `setsid nohup ... </dev/null >>...log 2>&1 &` and the parent
      exits, so the ssh session ends and no terminal remains; the fuse loop's only printf goes to
      a file -- against the platform's documented rule that activity is "Terminal activity,
      either input or output", whose own worked example is a still-running process timing out for
      want of it. This is a SUFFICIENT mechanism for "a detached lane produced zero work" -- the
      machine is stopped mid-run, receipt.json is never written and dies with the container, and
      the stopped state is indistinguishable from an orderly finish -- but see the note: that it
      is the ACTUAL cause of the recorded instances is not established, and one recorded reap
      does not fit it.
    source: operator directive 2026-09-15 (Phase 3 measurement mandate); derived in-repo, not yet
      observed live
    note: >-
      CANDIDATE on two counts, and both are honest limits rather than hedges. (1) The finding is
      DERIVED -- read out of our source and the platform's docs -- not yet watched happening; the
      one billable proof run is instructed to observe it (intake 102 amendment). (2) The organ is
      cross-repo: the runner and the --idle-timeout flag both live in win-tooling
      DispatchHelpers.psm1, and this register resolves organ paths in THIS repo, so a trip-test
      here cannot bite the thing that would violate it -- the same limit QR-AVAIL-009 records.
      It is also UPSTREAM of intake 102 rather than part of it: none of that intake's options A,
      B or C prevents the reap, because a git push or an API call from inside the container is
      not terminal output either. Observability and keep-alive are two decisions, and this is the
      one nobody had noticed was open. (3) WHAT THE RECORD SAYS, both ways, swept 2026-09-15. FOR:
      the -Detach/idle-timeout interaction was filed as explicitly UNMEASURED three separate times
      and never closed -- "whether GitHub counts a background process as activity was not
      measured" (win-tooling 2026-09-01 lane-632 arc packet; repeated in the batch F close packet
      and in boot-session.md's residual-risk line) -- so the code and the risk note have sat
      adjacent for two weeks with nobody connecting them. Lane 3.9 of batch T is the best-fitting
      recorded instance: 45 turns of real work, "cut off mid-sentence waiting on a background
      test", nothing committed, total loss. AGAINST: the one documented reap ran 75 minutes on an
      ATTACHED lane against a 30-minute timer, which a simple reading of this mechanism does not
      explain. NEITHER: batch W's zero-work pair went quiet ~14 minutes after the pre-dispatch
      manifest commit, which is about when ssh detaches -- consistent with the mechanism but not
      evidence for it, because gh's lastUsedAt semantics (last activity, or the stop itself?) are
      themselves undocumented. That is a fourth UNKNOWN the proof run should settle. This row is a
      contribution to open row [#697], whose Done-when is exactly "the -Detach / idle-timeout
      cause is identified and fixed with the measurement recorded"; it does not close it, because
      the measurement is the half still missing. (4) OPERATOR RULING 2026-09-15, recorded here
      because this register is where a later seat checks the claim's standing: "this is a
      SUFFICIENT MECHANISM, not an established cause, and [#697] stays open with the identified
      half recorded -- do not let a later seat promote it." A seat that finds this row must NOT
      restate it as the cause of the zero-work lanes, must NOT close [#697] on it, and must NOT
      action the 2026-08-20 audit's "set 15 min" recommendation, which is superseded in place by
      a flush-left marker on that file. What moves this row to measured is ONE instrumented run:
      --idle-timeout at its documented 5-minute minimum, a detached lane sleeping past it, and the
      state transition recorded with its timestamp. [#697] carries the same guard in its own body,
      compressed -- that row is under narration relief (tasks/archive/697.md) and its body is
      byte-capped, which is why the full ledger lives here and in the intake amendment rather
      than in the row.
