# quality-requirements.yaml -- the technical quality requirements, as data ([#765], AN2-1).
#
# WHY THIS FILE EXISTS. Technical requirements used to live in a paste. AMEND-NIGHT-PLAN-001
# wrote six of them as instructions to a session, and an instruction is a request where a
# mechanism is a guarantee: a session that does not read the paste is not in breach of
# anything, and the next window re-pastes or forgets. This register is the same content
# with a different ontology -- each requirement names the ORGAN that enforces it, the METRIC
# that says whether it holds, and the TRIP-TEST that proves the organ refuses.
#
# THE HONESTY MECHANISM IS THE STATUS FIELD, and it inverts the usual failure. A register
# whose entries all claim enforcement is worse than no register, because a reader trusts it.
# So:
#
#   status: measured    carries `organ` AND `trip_test`. The organ resolves to a file that
#                       exists; the trip-test exists, PASSES against the live organ, and
#                       goes RED when the organ is neutered. That last leg is what separates
#                       a proof from a decoration -- a trip-test that passes unconditionally
#                       is refused by `tests/test_quality_requirements.py`, not accepted.
#   status: candidate   carries NEITHER field, and the schema refuses it if it tries to.
#                       A requirement with no organ is a real requirement with no
#                       enforcement, which is a fact worth recording rather than hiding.
#
# So the register cannot name an enforcement it does not have. That is what makes it safe to
# seed from prose: an un-enforced line lands as a candidate and stays visible as one.
#
# THE COMMENTS HERE DESCRIBE RATHER THAN COMMAND, deliberately. `ecosystem/*.yaml` is inside
# `silent_rule_detector`'s scope, so a `#` comment in this file is scored exactly like
# doctrine prose against the silent-rule ratchet. The rules live in the data below and in
# the validator that reads it; the header explains and does not legislate.
#
# TRIGGER: the `quality-requirements-freshness` pre-commit hook, which regenerates the
# ARCHITECTURE section from this file and refuses a commit where the two disagree, and
# `tests/test_quality_requirements.py`, which runs the schema and the trip-test legs. The
# lane-5 log-review routine becomes the second trigger when it lands (AN2-3): a breach it
# finds is filed as a row rather than noted.
# CONSUMERS: the generated ARCHITECTURE section "Quality requirements", and the methodology
# floor, whose declared tier for this register is the `floor:` block below.
#
# FIELD CONTRACT -- every entry carries, in this order:
#   id          QR-<ATTRIBUTE-CODE>-<NNN>; stable once written, so a citation survives a
#               re-ordering of the file
#   attribute   one of the four AN2-2 quality attributes (the `attributes:` enum below)
#   status      measured | candidate
#   statement   the requirement, in the smallest number of words that stay checkable
#   metric      what a reader measures to decide whether it holds
#   incident    the measured event behind it -- every entry here has one, which is why the
#               register is small
#   source      where the requirement was stated
#   organ       measured entries only: the repo-relative path of the thing that enforces it
#   trip_test   measured entries only: `<test file>::<test function>`, the proof it refuses
#   note        optional: a correction or a limit the entry would otherwise imply away

register_version: "1.0.0"

# The floor declaration for this component, as DATA rather than as prose about data. `tier`
# takes a value from the fleet tier vocabulary that `ecosystem/parity-surfaces.yaml` already
# uses and `scripts/fleet_parity.py` already reads, so one component cannot hold two floors.
# AN2-1 rules the tier; the reason records why the tier is the one it is.
floor:
  tier: MUST
  reason: >-
    Every consumer repo inherits the register (AN2-1). What travels is the DISCIPLINE -- a
    requirement carries the organ that enforces it, the metric, and the trip-test that proves
    the organ refuses; a requirement with no organ is filed as a candidate rather than
    dressed as enforcement. A consumer inheriting only the hub's entries would inherit a
    report; inheriting the discipline lets it register its own.
  declared_in: templates/child-methodology-floor.md.tmpl

# The four quality attributes AN2-2 names, each with the short code its ids use. The set is
# closed; widening it is an operator act, because a fifth attribute with one entry in it is
# how a bounded register becomes a backlog.
attributes:
  performance: PERF
  availability: AVAIL
  resource-control: RES
  observability: OBS

requirements:

  # ---- performance ------------------------------------------------------------------
  - id: QR-PERF-001
    attribute: performance
    status: measured
    statement: >-
      A commit that changes a `scripts/*.py` file selecting ZERO tests is refused, and the
      refusal names the RED-first witness to write.
    metric: >-
      In-scope zero-selection sources at commit tier: 0. The grandfathered set is a ratchet
      that only shrinks -- 4 of 140 scripts at arm time, measured 2026-09-11.
    incident: >-
      Five OOM-killed full-suite attempts on the workstation at 1.4 GB free of 28 GB. With
      no full local suite available, the impacted set for the changed file is the only local
      proof there is, so a changed script that selects nothing is an unproven change.
    source: AMEND-NIGHT-PLAN-002 AN2-2 (performance); the organ is [#278] leg b
    organ: scripts/impacted_tests.py
    trip_test: tests/test_quality_requirement_trips.py::test_qr_perf_001_uncovered_script_is_refused

  - id: QR-PERF-002
    attribute: performance
    status: candidate
    statement: >-
      No seat runs the full suite on the workstation; locally a seat runs the impacted set
      for the changed file, and the full suite runs once, at integration.
    metric: >-
      Full-suite attempts on the workstation: 0. Peak RSS of a full-suite run against free
      memory at dispatch, sampled before the run rather than after it.
    incident: >-
      Five attempts OOM-killed at 1.4 GB free of 28 GB. The suite is not merely slow on this
      box; it does not complete.
    source: AMEND-NIGHT-PLAN-002 AN2-2 (performance)
    note: >-
      A candidate because nothing reads free memory or refuses a full-suite invocation. The
      rule is live in `CLAUDE.md` and in every lane contract as prose, which is precisely the
      state this register exists to distinguish from enforcement.

  - id: QR-PERF-003
    attribute: performance
    status: candidate
    statement: >-
      A heavy commit-tier gate carries a measured wall-time and memory budget; above it the
      gate moves to CI or becomes incremental.
    metric: >-
      Per-gate wall seconds and peak RSS, re-measured on a quiet box. Measured 2026-09-15:
      graph-rebuild 14.5 s and 13.6 s wall at 50 MB peak; audit-health 16.0 s and 16.5 s
      wall at 768 MB peak.
    incident: >-
      The four-hook graph chain was reported at ~21.9 s end to end when it armed, which is
      the figure ADR-118's flip-condition 2 keys on. Nothing re-measures it.
    source: AMEND-NIGHT-PLAN-002 AN2-2 (performance)
    note: >-
      A CORRECTION TO THE PREMISE, recorded rather than absorbed. AMEND-NIGHT-PLAN-001 AN1-3
      named graph-rebuild AND audit-health together as the heaviest local operation. On wall
      time they are within 2.5 s of each other; on memory they are not comparable --
      audit-health peaks at 768 MB against graph-rebuild's 50 MB, about 15x. Only one of the
      two is memory-heavy, and on a box whose binding constraint is memory rather than time
      that is the difference that decides which gate to move.

  - id: QR-PERF-004
    attribute: performance
    status: candidate
    statement: >-
      A test that spawns a shell per case is marked, and the marked set is routed to Actions
      rather than run locally.
    metric: >-
      Wall time of the marked set locally against on Actions. Observed: 32 cases in 39m46s.
    incident: >-
      A 32-case shell-per-case set took 39m46s in one local run -- longer than the batch
      window it was running inside.
    source: AMEND-NIGHT-PLAN-002 AN2-2 (performance)
    note: >-
      A candidate because no marker exists and no routing reads one. `pyproject.toml` carries
      no such mark and nothing in `.github/workflows/` selects on it.

  # ---- availability / reliability ---------------------------------------------------
  - id: QR-AVAIL-001
    attribute: availability
    status: measured
    statement: >-
      A seat does not end its turn on a wait. A wait is written as a loop carrying an
      interval, a bound and a predicate read from the file surface, or it is refused.
    metric: >-
      Wait-intentions in a seat document with no `<!-- WAIT: ... -->` declaration within
      `seat_refusals._WAIT_WINDOW` lines (10 at the time of writing): 0. Declarations
      missing an interval, a bound or a predicate: 0.
    incident: >-
      The integrator waited a day on a session that no longer existed. A turn that ends on an
      intention has no next tick, so nothing wakes the session and the wait is unbounded in
      practice even where it reads as bounded in prose.
    source: AMEND-NIGHT-PLAN-002 AN2-2 (availability); the organ is PLAYBOOK Ch8, as code
    organ: scripts/seat_refusals.py
    trip_test: tests/test_quality_requirement_trips.py::test_qr_avail_001_sleeping_poll_is_refused

  - id: QR-AVAIL-002
    attribute: availability
    status: candidate
    statement: >-
      A lane that ends without handing back is detected from git rather than waited on.
    metric: >-
      Time between a lane's last commit and the integrator learning the lane is gone. A
      detection that reads git is bounded by the poll interval; one that reads a promised
      handback is unbounded.
    incident: >-
      The integrator waited a day on a session that no longer existed. The lane's branch had
      carried the answer the whole time.
    source: AMEND-NIGHT-PLAN-002 AN2-2 (availability)
    note: >-
      Distinct from QR-AVAIL-001 and filed separately on purpose. `seat_refusals` refuses the
      WAIT; nothing yet performs the git-side DETECTION that would make the wait unnecessary.
      Refusing a bad answer and supplying the good one are two organs.

  - id: QR-AVAIL-003
    attribute: availability
    status: candidate
    statement: >-
      A Codespace lane runs attached; a detached one is refused at dispatch.
    metric: >-
      Work produced by detached Codespace lanes. Observed across two nights: zero commits
      from two detached lanes.
    incident: >-
      Two separate nights dispatched Codespace lanes detached and both produced no work at
      all -- not partial work, none.
    source: AMEND-NIGHT-PLAN-002 AN2-2 (availability); restated in DECLARE-NIGHT-PLAN-2026-09-15-FINAL
    note: >-
      A candidate because the attach/detach choice reaches no flag any gate reads. This is
      the same shape [#752] found one column over: a declared field that no code resolves
      into a launcher argument is a decision the tree records and does not make.

  - id: QR-AVAIL-004
    attribute: availability
    status: candidate
    statement: >-
      A process that outlives its lane is killed at teardown, and the teardown verifies the
      kill rather than assuming it.
    metric: >-
      Processes surviving a teardown: 0. Worst observed: one orphan alive 53 hours at
      roughly 10 cores.
    incident: >-
      A 53-hour orphan at ~10 cores was found by looking, not by a check. It had been costing
      the box the whole time the window was reporting itself as quiet.
    source: AMEND-NIGHT-PLAN-002 AN2-2 (availability)

  - id: QR-AVAIL-005
    attribute: availability
    status: candidate
    statement: >-
      Killing a job kills its process tree; a surviving descendant is reported rather than
      left running.
    metric: >-
      Seconds between a reap and the last descendant exiting. Observed: about 8 minutes.
    incident: >-
      Job 100297d3 recorded `reapedMidWorkAt 2026-09-14T22:43:32Z` in its `state.json`. The
      subtree outlived the reap by roughly 8 minutes, and a GRANDCHILD outlived the parent
      that had just been killed -- so the kill reached one generation and stopped.
    source: measured 2026-09-14, batch Z night; carried by AMEND-NIGHT-PLAN-002 AN2-5

  - id: QR-AVAIL-006
    attribute: availability
    status: candidate
    statement: >-
      Terminating a background session deregisters it; a session the daemon can rehydrate is
      not reclaimed.
    metric: >-
      Sessions alive under the same session-id after a kill: 0. Observed: 1, at `attempt: 2`.
    incident: >-
      SIGKILL on a background session does not reclaim it. The daemon rehydrates the session
      from `~/.claude/daemon/roster.json` under the SAME session-id with `attempt: 2`,
      witnessed twice on 2026-09-15. `claude stop <id>` is the only verb that deregisters, so
      a seat that kills a process has freed nothing and does not learn so.
    source: measured 2026-09-15, batch Z night; carried by AMEND-NIGHT-PLAN-002 AN2-5
    note: >-
      This is the reason a memory-floor arithmetic (QR-RES-001) cannot be built on process
      kills alone: the resource a kill appears to free comes back.

  - id: QR-AVAIL-007
    attribute: availability
    status: candidate
    statement: >-
      A session whose worktree was torn down refuses to write rather than resolving to the
      primary checkout.
    metric: >-
      Writes into a torn-down worktree after teardown: 0. Writes redirected to the primary
      checkout by a session that believed it was isolated: 0.
    incident: >-
      A Stop hook resolved its repo root to an already-torn-down worktree and WROTE there --
      `logs/2026-09/DETECTOR-ERROR-2026-09-13.md`, preserved in this batch's manifest. The
      hook's own error text names the condition it detected and it wrote anyway.
    source: measured 2026-09-13, batch Z night; carried by AMEND-NIGHT-PLAN-002 AN2-5
    note: >-
      [#726] and [#748] own the two halves of this. Filed here as a candidate because the
      quality attribute outlives whichever row closes first: the requirement is that
      isolation FAILS LOUDLY, and a row that fixes one resolver does not establish that.

  - id: QR-AVAIL-008
    attribute: availability
    status: candidate
    statement: >-
      A substrate whose provisioning failed reports the failure; a silently substituted
      environment is refused rather than used.
    metric: >-
      Lanes whose gates were vacuous because the environment lacked them: 0. A vacuous gate
      and an absent gate are different facts and the metric reads the first.
    incident: >-
      A Codespace whose devcontainer build fails is silently replaced by a bare recovery
      container. The lane then runs with none of the declared tooling, so its gates pass by
      not existing -- a green that reports nothing.
    source: measured 2026-09 batch Z window; carried by AMEND-NIGHT-PLAN-002 AN2-5
    note: >-
      The failure mode this entry names is the dangerous one in the set: every other entry
      here describes work that did not happen, and this one describes work that reported
      itself as done.

  # ---- resource control --------------------------------------------------------------
  - id: QR-RES-001
    attribute: resource-control
    status: candidate
    statement: >-
      A memory floor below which the dispatcher refuses another local lane and reports the
      refusal -- arithmetic, rather than a judgement call at dispatch time.
    metric: >-
      Free memory read at dispatch against a declared floor, with the lane count derived from
      the reading. Refusals reported: all of them.
    incident: >-
      Five OOM-killed full-suite attempts at 1.4 GB free of 28 GB, plus the 53-hour orphan at
      ~10 cores that nothing accounted for. The lane count was set from an estimate of what
      the box could hold rather than from a reading of what it had.
    source: AMEND-NIGHT-PLAN-002 AN2-2 (resource control)
    note: >-
      THIS IS THE REGISTER'S FIRST FINDING ABOUT ITSELF. The attribute the operator described
      as the least discretionary -- "automatic arithmetic, not a judgement call" -- is the one
      with no organ at all. `scripts/seat_refusals.py` carries `lane-ceiling`, which is
      ADR-110's 4-6 lane COUNT and reads no memory; `--check-worktrees` reads the live
      worktree list, also a count. Nothing in the tree reads free memory before a dispatch.
      Filed as a candidate under the register's own rule rather than attached to the
      count-ceiling organ, which would have been the available lie.

  # ---- observability -----------------------------------------------------------------
  - id: QR-OBS-001
    attribute: observability
    status: measured
    statement: >-
      Every merge records its own wall time. A merge with no receipt, or with a receipt that
      is not a usable measurement, is refused.
    metric: >-
      Merges in the integrator's range with a COMPLETE `kind=merge` receipt: all of them.
      Receipts that time nothing and still discharge a merge: 0.
    incident: >-
      Before [#750] the receipt was opened once per BATCH and carried no merge SHA, so "how
      long did this merge take" had no answer and an unrecorded step read exactly like a fast
      one.
    source: AMEND-NIGHT-PLAN-002 AN2-2 (observability); the organ is [#750]
    organ: scripts/merge_receipt.py
    trip_test: tests/test_quality_requirement_trips.py::test_qr_obs_001_unreceipted_merge_is_refused

  - id: QR-OBS-002
    attribute: observability
    status: measured
    statement: >-
      A model with no declared rate is reported as UNPRICED with a reason. It is not priced
      at zero and is not summed into a total.
    metric: >-
      Cost rows carrying a fabricated zero: 0. Unpriced models carrying a stated reason: all
      of them.
    incident: >-
      Cost per lane and per model was recorded by hand or not at all. An unpriced model
      silently summed as zero makes a batch look cheaper the less the tree knows about it --
      the error grows with the ignorance.
    source: AMEND-NIGHT-PLAN-002 AN2-2 (observability); the organ is [#751]
    organ: scripts/provider_registry.py
    trip_test: tests/test_quality_requirement_trips.py::test_qr_obs_002_unpriced_model_is_refused

  - id: QR-OBS-003
    attribute: observability
    status: candidate
    statement: >-
      An organ not invoked in 30 days surfaces, so an unused mechanism is visible rather than
      merely maintained.
    metric: >-
      Days since the last recorded invocation, per organ, against a 30-day bar.
    incident: >-
      ADR-119 ruled that a command file counts as a wiring surface only while invocations are
      recorded -- adoption decays and is not conferred. The ruling landed; the standing
      surfacing did not.
    source: AMEND-NIGHT-PLAN-002 AN2-2 (observability)
    note: >-
      `ecosystem/organ-index.md` renders what exists and what triggers it, which is a
      different question from what has actually run. A candidate until an invocation record
      exists to read.

  - id: QR-OBS-004
    attribute: observability
    status: measured
    statement: >-
      A codespace that came up as a RECOVERY container is named as one, from the platform's own
      creation log, with the matched line quoted as evidence.
    metric: >-
      Recovery containers identified by that name rather than by a downstream symptom: all of
      them. Verdicts issued without quoted evidence: 0. An absent or unrecognised log reads
      INDETERMINATE, never OURS.
    incident: >-
      On 2026-09-14 23:37Z `postCreateCommand` failed, GitHub substituted a recovery container,
      and the platform reported the codespace live throughout. Nothing read the creation log, so
      for a month the symptom was treated instead of the cause -- a retired call, then a
      provenance marker, then a heartbeat -- while the dispatcher's exit-91 guard reported
      "claude is not installed in this devcontainer", which is what a recovery container looks
      like downstream while naming the wrong thing.
    source: operator directive 2026-09-15 (Phase 3); platform facts in DIGEST-2026-09-15-codespaces-reference.md
    organ: scripts/codespace_state.py
    trip_test: tests/test_quality_requirement_trips.py::test_qr_obs_004_recovery_container_is_named
    note: >-
      The marker table is MEASURED IN THIS REPO, not anticipated -- every entry was emitted by
      GitHub into this repository's own creation log and is transcribed in the [#746] amendment;
      each marker carries its provenance from a closed set. Honest limit: validated against ONE
      recovery event, so it names the failure shape that killed us and is not a proof that every
      recovery container announces itself with these strings. Unmatched logs fail toward
      INDETERMINATE rather than toward a false green.

  - id: QR-OBS-005
    attribute: observability
    status: measured
    statement: >-
      A codespace lane's state is a cross of the container's platform state with the age of the
      lane's own progress signal. `Available` alone is never reported as working.
    metric: >-
      Lanes reported WORKING on the strength of the platform state alone: 0. Container-up with a
      stale progress signal is reported HUNG, not WORKING; container-down is DIED.
    incident: >-
      Twice a detached Codespace lane produced zero work and nobody noticed, because the only
      signal consulted was the platform's, and the platform reports the MACHINE rather than the
      workload -- GitHub documents no job-status API, no completion callback and no progress
      stream for work inside a codespace, and there is no codespace webhook of any kind.
    source: operator directive 2026-09-15 (Phase 3); DIGEST-2026-09-15-codespaces-reference.md section g
    organ: scripts/codespace_state.py
    trip_test: tests/test_quality_requirement_trips.py::test_qr_obs_005_available_alone_is_not_working
    note: >-
      Deliberately a PURE CROSS and not a poller. Which mechanism supplies the progress signal --
      polling from outside, the lane pushing from inside, or both -- is the open architectural
      question filed as intake #102 and routed to the decision engine; building the observer here
      would have decided it in a diff.

  - id: QR-OBS-006
    attribute: observability
    status: candidate
    statement: >-
      A Codespace lane that dies mid-work becomes a filed row without a human looking, within a
      bounded detection latency.
    metric: >-
      Time from a lane's death to a filed row. Silent zeros per batch -- lanes that produced no
      work and generated no signal -- against a bar of 0.
    incident: >-
      Today a dispatched Codespace lane is known to have failed only when someone looks. Twice a
      detached one produced zero work with nobody noticing; the substrate itself died at one
      commit on 2026-09-14 and went unnoticed for two weeks because nothing ran there.
    source: operator directive 2026-09-15 (Phase 3)
    note: >-
      CANDIDATE, and the reason is structural rather than unfinished work: the mechanism that
      supplies the signal is intake #102's open question (poll / push / both / not-on-Codespaces),
      and naming an organ here before the engine rules would be this register's own failure mode.
      QR-OBS-005's classifier is the part that does not depend on the ruling and is already
      measured. Promote this entry when #102 is ratified.

  - id: QR-AVAIL-009
    attribute: availability
    status: candidate
    statement: >-
      A dispatched codespace's identity is recorded durably at dispatch, not reconstructed
      afterwards.
    metric: >-
      Dispatched codespaces whose name is written to a durable register at dispatch: all of them.
      Identities recovered by matching display names after the fact: 0.
    incident: >-
      The dispatcher prints the codespace name to the console and returns it in a result object,
      and writes it nowhere. Once the session ends the only way to find a lane's codespace is to
      list and pattern-match a display name -- which is also why nothing can poll it. Separately,
      the name was being reconstructed by a list-delta across several hundred lines of PowerShell,
      solving a problem the platform does not have: `gh codespace create` prints the name to
      stdout.
    source: operator directive 2026-09-15 (Phase 3), Phase 2 finding D3
    note: >-
      CANDIDATE because the organ is `Start-DispatchCodespace` in the win-tooling repo, and this
      register's `organ` field is a path in THIS repo that the schema resolves -- a cross-repo
      organ cannot be declared measured here without the validator being unable to check it. That
      is a real limit of the register for transport-layer requirements, recorded rather than
      fudged by pointing at a hub file that does not do the work.

  - id: QR-RES-002
    attribute: resource-control
    status: candidate
    statement: >-
      A codespace is STOPPED at handback once its receipt is in hand, so compute is not billed
      after the work has landed. Stopping is never deleting.
    metric: >-
      Paid compute minutes accrued after a lane's last useful work, per batch. Codespaces left
      running at batch close: 0.
    incident: >-
      The dispatcher's success path prints "the codespace is STILL RUNNING and still billing" and
      stops there; teardown is a manual verb nobody types. The never-delete doctrine is sound --
      deleting a machine that may hold work is not a call a transport wrapper gets to make -- but
      it over-applied by one verb: stopping preserves saved changes and `/workspaces` and only
      ends compute billing.
    source: operator directive 2026-09-15 (Phase 3), Phase 2 finding D6
    note: >-
      CANDIDATE, and it OVERLAPS lane aa-14 (`LANE-aa-14-resource-lifecycle.md`, frozen), whose
      section 3 rules the same idle policy -- "attached while a lane runs, torn down at handback,
      never left warm" -- and which also lands entries in this register. Flagged for the
      integrator rather than double-landed: if aa-14 files its own codespace-idle entry, this one
      is superseded by it and should be withdrawn, not merged alongside. The organ is also
      cross-repo, per QR-AVAIL-009's note.

  - id: QR-AVAIL-010
    attribute: availability
    status: candidate
    statement: >-
      A dispatched lane keeps its codespace alive for as long as it is working. No lane may rely
      on a substrate whose documented reaping condition its own design holds true for the entire
      run.
    metric: >-
      Lanes reaped by the platform's idle timer while still working: 0. Secondary: the gap
      between a lane's longest expected silent interval and the codespace's configured
      --idle-timeout, which must stay positive.
    incident: >-
      A detached lane produces ZERO terminal output for its whole run, and the codespace is
      created with --idle-timeout 30m, so the platform stops the machine at thirty minutes of
      wall clock no matter how much inference is happening inside it. Derived 2026-09-15 from
      four facts in our own source -- create passes --idle-timeout 30m
      ($script:CodespaceDefaultIdle); the runner starts the agent as `claude -p ...
      --output-format stream-json --verbose > "$RUN_LOG" 2>&1 &`, both streams into a file; the
      detach path re-execs under `setsid nohup ... </dev/null >>...log 2>&1 &` and the parent
      exits, so the ssh session ends and no terminal remains; the fuse loop's only printf goes to
      a file -- against the platform's documented rule that activity is "Terminal activity,
      either input or output", whose own worked example is a still-running process timing out for
      want of it. This is the mechanism behind "a detached lane produced zero work": the machine
      is stopped mid-run, receipt.json is never written and dies with the container, and the
      stopped state is indistinguishable from an orderly finish.
    source: operator directive 2026-09-15 (Phase 3 measurement mandate); derived in-repo, not yet
      observed live
    note: >-
      CANDIDATE on two counts, and both are honest limits rather than hedges. (1) The finding is
      DERIVED -- read out of our source and the platform's docs -- not yet watched happening; the
      one billable proof run is instructed to observe it (intake 102 amendment). (2) The organ is
      cross-repo: the runner and the --idle-timeout flag both live in win-tooling
      DispatchHelpers.psm1, and this register resolves organ paths in THIS repo, so a trip-test
      here cannot bite the thing that would violate it -- the same limit QR-AVAIL-009 records.
      It is also UPSTREAM of intake 102 rather than part of it: none of that intake's options A,
      B or C prevents the reap, because a git push or an API call from inside the container is
