  - id: QR-RES-004
    attribute: resource-control
    status: candidate
    statement: >-
      Where a heap cap is the known workaround, it is EMITTED BY THE GENERATOR into the
      executable launch line and never set in a paste.
    metric: >-
      Launch lines carrying the declared cap: all of them. Declared values that reach no
      executable line: 0.
    incident: >-
      `NODE_OPTIONS="--max-old-space-size=..."` is the workaround upstream names for the
      growth in QR-RES-006. The reason it has to be generator-emitted is MEASURED and local:
      `SEAT_MODELS` carried the integrator's model split from 2026-09-11 and rendered into an
      HTML COMMENT while the boot's actual launch line was a bare `claude`, so batch Z ran
      100% Opus under a header claiming a split. A second instance of declared enforcement
      without enforcement is the thing to avoid here.
    source: >-
      UPSTREAM: anthropics/claude-code issue #56693, "V8 OOM: Claude Code CLI leaks memory
      until laptop crashes (113GB observed)" (CLOSED as not planned) --
      https://github.com/anthropics/claude-code/issues/56693 -- whose body states that setting
      `NODE_OPTIONS="--max-old-space-size=4096"` in a shell profile "caps V8 heap and prevents
      the machine crash, but doesn't fix the underlying leak", which is the whole reason this
      entry specifies WHERE the cap is emitted rather than whether to use one. Relayed by
      DIGEST-2026-09-15-unrecorded-findings.md section 1; the render defect is that digest's
      section 5 and is owned by `[#789]`
    note: >-
      NOT APPLIED BY THE LANE THAT FILED THIS ENTRY, and the reason is file ownership rather
      than difficulty. `scripts/gen_seat_boot.py` is `[#789]`'s sole-owned file and `[#789]`
      is rewriting that exact render surface so a declared value cannot reach a comment.
      Opening it from batch AA lane aa-14 would be a second undeclared claim on a module
      under restructure -- the disposition `scripts/lane_cost.py` records against
      `scripts/merge_receipt.py`. Filed as a candidate so the requirement is visible while
      the surface that has to satisfy it belongs to another row. FOLDED FROM WITHDRAWN LANE
      aa-13 (operator ruling 2026-09-16, ruling 1 -- aa-14 survives, aa-13's commits reviewed
      for what aa-14 lacks): THE METRIC AS WRITTEN IS UNSATISFIABLE FOR THE TOP-LEVEL CLI.
      win-tooling `scripts/dispatch/Invoke-Dispatch.ps1` `Assert-ClaudeCommand` pins the head
      token of a launch line to `claude`, and dispatch executes `& $command @argv` as an argv
      array, so no position in a dispatched launch line can carry an environment assignment
      such as `NODE_OPTIONS=...`. "Launch lines carrying the declared cap: all of them" cannot
      be met by editing the line; the cap has to reach the process through the dispatcher's
      environment (or a wrapper the head-token check admits), and this entry cannot be
      promoted past candidate until that route is chosen. Found by aa-13 (`01c446f7`), not
      measured by aa-14; locators to be re-verified by whichever row takes the emission.

  - id: QR-RES-005
    attribute: resource-control
    status: candidate
    statement: >-
      A Codespace lane is attached while it runs and STOPPED at handback -- not deleted, and
      not left running; and its receipt records uptime MINUTES alongside tokens.
    metric: >-
      Codespaces still RUNNING (`Available`) past one batch: 0. Codespaces deleted by policy: 0.
      Receipts for a Codespace lane
      carrying an uptime figure: all of them. Measured 2026-09-15: zero receipts carry any
      uptime or minutes key, and one codespace (`suite-baseline-2026-09-08`) had been sitting
      Shutdown for 7 days with `retentionPeriodDays: 30`.
    incident: >-
      The cloud regime is a METER, not a ceiling, and nothing reads it. Tokens alone price the
      wrong resource here: a container that sits attached and idle burns budget while its
      token count stays flat, which makes an idle lane look like a cheap one.
    source: >-
      batch AA lane aa-14, frozen contract section 3; figures in
      docs/audits/2026-09-15-technical-lane-aa-14-resource-lifecycle.md section 6
    note: >-
      THE THRESHOLDS IN THIS ENTRY SHARE NO CONSTANT WITH THE LOCAL ONES, deliberately. Local
      is a fixed ceiling allocated against; cloud is a meter run down. A single number tuned
      for one is wrong for the other, and a mechanism that treats them as one resource is why
      neither is managed today. STOP, NOT DELETE -- operator ruling 2026-09-16, which
      REVERSES this entry as the lane filed it (teardown at handback in place of a stop, with a
      metric counting Shutdown codespaces as breaches) and resolves its contradiction with
      QR-RES-002. Stopping ends compute billing and preserves `/workspaces` and every saved
      change; deleting destroys them, and batch T's lane with 45 uncommitted turns inside a
      stopped machine is why that loss is not acceptable. Stopped is still not free -- a
      Shutdown codespace bills storage for up to its retention period -- and that storage is
      the accepted, reported cost of the rule, not a breach of it. The lane's measured
      `suite-baseline-2026-09-08`, Shutdown for 7 days, is compliant under the ruling.

