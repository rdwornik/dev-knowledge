# Carrier manifest — methodology corpus v1.0.0 (ADR-92 Decision 7).
#
# Declares the COMPLETE carrier set + order + per-carrier target state that a
# fully-deployed repo meets at methodology release v1.0.0. The deploy tool (C2,
# not built yet) reads this to "full-reconcile-to-target" (Decision 5) a single
# consumer repo per invocation.
#
# Versioned WITH the methodology (Decision 2): deploying vX uses vX's manifest +
# carrier set, so the deploy logic for a release is exactly what that release
# shipped. The git tag is recorded in source_tag; ADR-91 proposes v1.0.0 as the
# baseline corpus release.
#
# CARRIER STATUS: all four carriers are DECLARED here (this is the spec). Three are
# IMPLEMENTED — global-config (deploy/carrier_globalconfig.py, ADR-92 C3), precommit
# (deploy/carrier_precommit.py, C1) and floor (deploy/carrier_floor.py, C4). Only
# `tier1-plugin` carries `implemented: false`: it shells out to the `claude plugin
# install` CLI and needs a real-install smoke-test, so it lands in its own slice.

methodology_version: "1.0.0"
source_tag: v1.0.0

# Ordered carrier set. `order` is the apply sequence the tool walks; `id` matches
# each carrier's `carrier_id`. `implemented` says whether a carrier module exists
# yet (do-not-build-is-doctrine, ADR-88 — the unbuilt three are declared edges).
carriers:
  - id: global-config
    order: 1
    implemented: true
    description: >
      ARCHITECTURE's user-layer L0 carrier (#1, ARCHITECTURE.md Ch4 L460) — the fleet-wide
      ~/.claude / ~/.codex baseline. This carrier IMPLEMENTS only ONE of that carrier's
      payloads: the global Codex reviewer config (ADR-54) — the hub's canonical codex/AGENTS.md
      reconciled to the user-level ~/.codex/AGENTS.md. USER-machine scoped — apply()
      copies the hub source to ~/.codex/AGENTS.md (the consumer repo_root is unused);
      verify() independently re-confirms byte-identity. A copied file has no rev, so
      only ABSENT / PRESENT_CORRECT / PRESENT_DRIFTED (no PRESENT_WRONG_VERSION). The
      user-config base is injectable (param / CODEX_HOME) so the real ~/.codex/ is
      never touched in tests. implemented:true does NOT imply the whole L0 layer is
      managed — carrier #1 is a bundle; its other payloads are declared in l0_scope below
      (deferred deployables + conventions enforced by other organs), so this entry
      under-claims nothing (no-silent-omission).
    adr: [ADR-54]
    target:
      source_path: codex/AGENTS.md      # hub canonical source (relative to the hub root)
      target_filename: AGENTS.md        # written to <user-config-base>/AGENTS.md (~/.codex/)
    # ARCHITECTURE Ch4 carrier #1 (user-layer ~/.claude, L460) is a BUNDLE; implemented:true
    # above covers ONLY codex/AGENTS.md. The remaining L0 payloads are declared here so the
    # entry is honest about scope (no-silent-omission). NONE is built by this slice — they are
    # declared edges (ADR-88 do-not-build-is-doctrine), not omissions.
    l0_scope:
      implemented:                # the one payload this carrier deploys + verifies
        - payload: codex-config
          target: '~/.codex/AGENTS.md'
          adr: ADR-54
      deferred_deployables:       # live L0 ~/.claude files this deploy tool does NOT yet manage
        - payload: surface-closures
          target: '~/.claude SessionStart hook (surface-closures.ps1)'
          adr: ADR-70
          status: 'live, fleet-deployed; candidate for future L0-payload coverage'
        - payload: block-onedrive
          target: '~/.claude PreToolUse hook (block-onedrive.ps1), fail-closed P0 guard'
          adr: ADR-75
          status: 'live, fleet-deployed; candidate for future L0-payload coverage'
        - payload: gotchas
          target: '~/.claude/skills/gotchas/ (user-level skill)'
          adr: global
          status: 'live; candidate for future L0-payload coverage'
        - payload: routing
          target: '~/.claude/ROUTING.md'
          adr: global
          status: 'live; candidate for future L0-payload coverage'
      enforced_elsewhere:         # carrier #1 payloads that are conventions, NOT L0 deployable files
        - payload: no-ff-rule
          rule: 'branch then --no-ff merge is universal (core-invariants #5)'
          enforced_by: 'pre-commit carrier (#3) hub hooks block-ff-push / validate_no_ff, plus /ship'
          adr: core-invariants

  - id: tier1-plugin
    order: 2
    implemented: false
    description: >
      The tier1-lifecycle CC plugin enabled at project scope in the consumer.
      apply() shells out to `claude plugin install ... --scope project`; verify()
      reads the consumer's .claude/settings.json enabledPlugins block (the one
      non-scriptable carrier — VERIFY@BUILD finding (a), confirmed at the CLI
      surface; a real-install assertion closes at this carrier's build).
    adr: [ADR-70]
    target:
      plugin: tier1-lifecycle@dev-knowledge-methodology
      marketplace: dev-knowledge-methodology
      scope: project

  # The reference carrier implemented in this slice. Pure-file (no shell-out, no
  # user-path) and it closes the observed deploy gap: a prior deploy to ai-council
  # left the Tier-1 ruff lint gate unapplied. The required pin is the LIVE one read
  # from assets/ruff-pre-commit.yaml — repo/rev/hook verbatim.
  - id: precommit
    order: 3
    implemented: true
    description: >
      Pinned pre-commit hooks in the consumer's .pre-commit-config.yaml. Two gated
      requirements: (1) the Tier-1 ruff lint gate (ADR-71 pinned-rev pattern),
      merged ALONGSIDE the plugin (a CC plugin cannot ship a
      .pre-commit-config.yaml); (2) the .dev-knowledge hub-hooks entry rev-pinned
      to the methodology version tag (the version-coupling anchor).
    adr: [ADR-71]
    target:
      config_path: .pre-commit-config.yaml
      # Each required repo-pin: the carrier classifies the consumer config against
      # this set (detect), merges any missing/drifted entry in (apply), and
      # independently re-confirms (verify). Match key is the `repo` string.
      required_repos:
        - repo: https://github.com/astral-sh/ruff-pre-commit
          rev: v0.15.5
          hooks:
            - id: ruff
              name: Ruff lint gate (Tier-1, pinned rev; blocks on violations)
              args: []  # gate mode: `ruff check` (no --fix) so violations surface
      # The hub-hooks rev-pin — the version-coupling anchor. The consumer's
      # .dev-knowledge hook-source entry must be pinned at rev = the methodology
      # version tag, so its pre-commit rev EQUALS deployed_methodology_version (a
      # second visible version anchor, consistent with ecosystem/deployed-
      # versions.yaml). rev = the v1.0.0 git tag (annotated + resolvable as a
      # pre-commit rev; readable + stable).
      hub_hooks:
        rev: v1.0.0
        # PATH-INDEPENDENT identification: the consumer's hub-hooks entry is the
        # repo whose hook ids intersect these hub-published ids (read live from
        # .pre-commit-hooks.yaml); its `repo:` path is consumer-local (local clone
        # path vs URL) and is NOT matched. An existing entry is rev-bumped in
        # place; `repo`/`hooks` below are used only to CREATE an absent entry.
        marker_hook_ids:
          - codemap-freshness
          - codemap-generate
          - toc-freshness
          - toc-generate
          - backlog-id-on-close
        repo: https://github.com/rdwornik/dev-knowledge  # canonical hub source (create-only)
        hooks:
          - id: codemap-freshness
          - id: toc-freshness

  - id: floor
    order: 4
    implemented: true
    description: >
      The per-repo methodology floor (ADR-78) — .claude/CLAUDE-FLOOR.md + its .sha256
      content-integrity sidecar. apply() REUSES generate_floor.py's importable building
      blocks (render_floor / floor_sha256 / validate) to write ONLY the consumer tree;
      it never refreshes the hub canonical SHA anchor (the CLI's --out-dir side-effect a
      consumer carrier must not cause). detect/verify classify the consumer floor against
      the freshly-generated corpus floor: ABSENT / PRESENT_CORRECT (floor + sidecar both
      hash to corpus) / PRESENT_DRIFTED (the sidecar is content-integrity, not a version
      anchor — so no PRESENT_WRONG_VERSION).
    adr: [ADR-78]
    target:
      floor_path: .claude/CLAUDE-FLOOR.md
      sidecar_path: .claude/CLAUDE-FLOOR.md.sha256
