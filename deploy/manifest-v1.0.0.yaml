# Carrier manifest — methodology corpus v1.0.0 (ADR-92 Decision 7).
#
# Declares the COMPLETE carrier set + order + per-carrier target state that a
# fully-deployed repo meets at methodology release v1.0.0. The deploy tool (C2,
# not built yet) reads this to "full-reconcile-to-target" (Decision 5) a single
# consumer repo per invocation.
#
# Versioned WITH the methodology (Decision 2): deploying vX uses vX's manifest +
# carrier set, so the deploy logic for a release is exactly what that release
# shipped. The git tag is recorded in source_tag; ADR-91 proposes v1.0.0 as the
# baseline corpus release.
#
# SLICE SCOPE (C1): all four carriers are DECLARED here (this is the spec), but
# only `precommit` is IMPLEMENTED in this slice (deploy/carrier_precommit.py).
# The other three carry `implemented: false` and a descriptive target; their
# carrier modules land in later steps.

methodology_version: "1.0.0"
source_tag: v1.0.0

# Ordered carrier set. `order` is the apply sequence the tool walks; `id` matches
# each carrier's `carrier_id`. `implemented` says whether a carrier module exists
# yet (do-not-build-is-doctrine, ADR-88 — the unbuilt three are declared edges).
carriers:
  - id: global-config
    order: 1
    implemented: false
    description: >
      Global L0 ~/.claude config surfacing (SessionStart hooks, surface-closures).
      Operator-machine scoped, not a per-repo file write — its target/verify model
      is deferred to its own build step.
    adr: [ADR-70, ADR-73]
    target: {}

  - id: tier1-plugin
    order: 2
    implemented: false
    description: >
      The tier1-lifecycle CC plugin enabled at project scope in the consumer.
      apply() shells out to `claude plugin install ... --scope project`; verify()
      reads the consumer's .claude/settings.json enabledPlugins block (the one
      non-scriptable carrier — VERIFY@BUILD finding (a), confirmed at the CLI
      surface; a real-install assertion closes at this carrier's build).
    adr: [ADR-70]
    target:
      plugin: tier1-lifecycle@dev-knowledge-methodology
      marketplace: dev-knowledge-methodology
      scope: project

  # The reference carrier implemented in this slice. Pure-file (no shell-out, no
  # user-path) and it closes the observed deploy gap: a prior deploy to ai-council
  # left the Tier-1 ruff lint gate unapplied. The required pin is the LIVE one read
  # from assets/ruff-pre-commit.yaml — repo/rev/hook verbatim.
  - id: precommit
    order: 3
    implemented: true
    description: >
      Pinned pre-commit hooks in the consumer's .pre-commit-config.yaml. The gated
      requirement is the Tier-1 ruff lint gate (ADR-71 pinned-rev pattern), merged
      ALONGSIDE the plugin (a CC plugin cannot ship a .pre-commit-config.yaml).
    adr: [ADR-71]
    target:
      config_path: .pre-commit-config.yaml
      # Each required repo-pin: the carrier classifies the consumer config against
      # this set (detect), merges any missing/drifted entry in (apply), and
      # independently re-confirms (verify). Match key is the `repo` string.
      required_repos:
        - repo: https://github.com/astral-sh/ruff-pre-commit
          rev: v0.15.5
          hooks:
            - id: ruff
              name: Ruff lint gate (Tier-1, pinned rev; blocks on violations)
              args: []  # gate mode: `ruff check` (no --fix) so violations surface
      # NOTE (resolved at C2, not gated here): the hub doc-tooling hook-source pin
      # (codemap-freshness / toc-freshness, ADR-71 / .pre-commit-hooks.yaml) is the
      # other pre-commit-borne element, but its `repo:` value is CONSUMER-LOCAL
      # (the live .pre-commit-hooks.yaml literally writes `<path-or-url-to-.dev-
      # knowledge>` — a per-machine path/URL, not a fixed manifest string), and it
      # is not evidenced as a universal per-repo requirement. It is therefore
      # documented here but NOT added to required_repos in v1.0.0; the deploy tool
      # resolves the hub pin per consumer when that requirement is ratified.

  - id: floor
    order: 4
    implemented: false
    description: >
      The per-repo methodology floor — .claude/CLAUDE-FLOOR.md + .sha256 sidecar +
      the floor-hash-verify local hook (ADR-78). apply() is the existing
      generate_floor.py --out-dir write precedent; verify() re-hashes the floor
      against its sidecar.
    adr: [ADR-78]
    target:
      floor_path: .claude/CLAUDE-FLOOR.md
      sidecar_path: .claude/CLAUDE-FLOOR.md.sha256
