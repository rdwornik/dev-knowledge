# templates/ruff-config-block.toml
# =============================================================================
# CANONICAL FLEET RUFF SHAPE + PYTEST FLOOR — copy-paste material (ARC 4 leg 1).
# =============================================================================
# This is REPLICATION MATERIAL, not a whole-file carrier: a consumer's
# pyproject.toml is repo-authored and carries much else, so these blocks are
# MERGED BY HAND into the consumer's pyproject under the RULING-W discipline
# (worktree/branch -> report), never file-copied over an existing pyproject.
#
# RULING-S (2026-07-18): every governed file gets reader-visible sections
# separating methodology-UNIVERSAL keys from REPO-PERSONAL ones. Keep the
# `=== UNIVERSAL ===` / `=== REPO-PERSONAL ===` header comments verbatim so a
# human reading any repo's pyproject sees the same split.
#
# The three UNIVERSAL ruff keys + the pytest `minversion` floor are gated by the
# `fleet_parity` check. Any repo that must differ declares the divergence in its
# `.methodology.yaml` (the #328 mechanism); an undeclared divergence WARNs.
#
# Fleet values (ARC 4, 2026-07-18):
#   ruff required-version = ">=0.15.5"  (== pinned pre-commit ruff rev v0.15.5)
#   ruff target-version   = "py311"     (RULING-PY baseline; newest-Python = #351)
#   ruff line-length      = 120         (ARC 4 D1)
#   pytest minversion     = "9.0"       (ARC 4 D2; lowest shared 9.0.x line)
# =============================================================================

[tool.ruff]
# === UNIVERSAL (fleet methodology) ===========================================
# Do not diverge from these three keys without a `.methodology.yaml` declaration.
required-version = ">=0.15.5"   # floor == pinned pre-commit ruff rev (v0.15.5)
target-version = "py311"        # RULING-PY baseline; "always newest Python" lift = #351
line-length = 120               # agreed fleet line-length (ARC 4 D1)

# === REPO-PERSONAL (this repo's lint posture — may differ; declared) ==========
# Each repo keeps its own select / ignore / per-file-ignores / format. The hub's own
# posture (below) is a live worked example, hand-merged into consumers under RULING-W —
# not a value every consumer inherits verbatim.
#   corp:       select = ["E", "F", "I"]; ignore = ["E501"]
#   ai-council: select = ["E", "F", "I", "W"]; [tool.ruff.format] quote-style = "double"
[tool.ruff.lint]
# select = [...]   # repo-personal
#
# hub posture, lane-python-standard-1 (2026-09-25): first code-standard tool, traced to
# to-browser/SESSION-lane-research-python-standard.md (C3). Candidate universe was C3's
# proposed families (B,SIM,C90,PL,RET,PERF,FURB,PTH,N,UP,ARG,ERA,TRY,FBT,RUF), measured
# tree-wide (6797 violations @ da11291b), auto-fixed with a plain `--fix` pass (unsafe
# fixes stay off) only under scripts/+tests/ files no other WAVE5B-N2 lane owns, then
# re-measured. Not whole rule families — per-code selection, since most C3 families
# still carry violations this lane cannot touch (owned by other lanes) or cannot
# auto-fix. Kept identical to pyproject.toml's `[tool.ruff.lint]` by hand (RULING-W);
# tests/test_fleet_parity.py::test_ruff_extend_select_identical_in_pyproject_and_template
# gates this specific list's identity directly (parses both TOML files, asserts the
# `extend-select` sets are equal); the universal required-version / target-version /
# line-length keys above are gated separately, via ecosystem/parity-surfaces.yaml.
# lane-python-standard-2 (2026-09-29, this redo): re-measured on today's main. Three of
# the original ten codes dropped here because a sibling-owned file (already merged/live at
# render, this lane may not touch it) still carries a violation, so enabling the code
# tree-wide would leave `ruff check` red on every lane's commit — SIM300 (6 instances:
# tests/test_decision_coverage.py, sibling-owned per this lane's contract done-item 4;
# tests/test_fleet_shape_spec_readers.py and tests/test_routing_telemetry.py, owned by
# lane-runtime-data-home-2), RET501 and PLR1711 (1 instance each, both
# tests/test_decision_coverage.py:_EmptyStore.node). These seven codes are the only ones
# that reach ZERO violations tree-wide on the current merged tree; every other candidate
# code (including the three just dropped, and PLE2515 / RUF010 below) is
# measured-not-enforced — see this lane's session file for the full before/after table and
# ROWS-OWED. PLE2515 and RUF010 were dropped in Repair 1 of lane-python-standard-1
# (integrator refusal, to-browser/REFUSED-lane-python-standard-1.md): their sole remaining
# tree-wide instances live inside scripts/audit_checks/check_routine_consumers.py and
# scripts/conductor.py, both owned by LANE-5B2-17-ci-signal.md — still true on today's main.
# NOTE: RUF100 (unused-noqa) stays excluded from a NARROWED `--select ... --fix`
# pass — its "unused noqa" check is evaluated against whatever rules are active in that
# specific invocation, so a select that omits e.g. E402 makes RUF100 misjudge every
# `# noqa: E402` as dead and delete it. Keep RUF100 out of a scoped fix pass, or
# use the real full config.
extend-select = [
    "FURB122",  # for-loop-writes
    "RUF019",   # unnecessary-key-check
    "SIM905",   # split-static-string
    "SIM910",   # dict-get-with-none-default
    "UP012",    # unnecessary-encode-utf8
    "UP033",    # lru-cache-with-maxsize-none
    "UP034",    # extraneous-parentheses
]

[tool.pytest.ini_options]
# === UNIVERSAL (fleet methodology) ===========================================
minversion = "9.0"   # declared fleet pytest floor (ARC 4 D2)
# === REPO-PERSONAL (markers / addopts / testpaths / asyncio_mode — may differ) =
