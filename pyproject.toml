# Environment-isolation toolchain (ADR-106, [#432], operator ruling 2026-07-26):
# this repo resolves, installs and runs its gate set through uv — the committed
# uv.lock + .python-version declare the environment; `uv sync --locked` rebuilds
# it reproducibly from a clean checkout. SUPERSEDES the #257 no-venv policy
# (2026-07-05): its system-interpreter rationale inverted once the enforcement
# surfaces (pre-commit hook entries, session hooks, verify cadence) moved onto
# `uv run --locked`, which resolves interpreter + deps per invocation.
#   uv sync --locked                     (dev group; the gate environment)
#   uv sync --locked --group analytics   (adds the L5a pandas lane)

[project]
name = "dev-knowledge"
version = "0.1.0"
description = "Universal LLM-driven development methodology hub (Layer 2 — markdown governance + read-only validators)"
requires-python = ">=3.12"

[tool.uv]
# Not a package: flat-layout governance repo, never built or installed — uv syncs
# only the dependency groups (also sidesteps the setuptools flat-layout trap).
package = false
# uv itself is PINNED EXACTLY (ADR-106): uv is pre-1.0 and ships ~every three days
# with behavioural drift in point releases (the 2026-07-23 release changed `--locked`
# semantics). A uv upgrade is its OWN gated change — bump this pin and regenerate
# uv.lock in a dedicated reviewed commit, never incidentally mid-arc.
required-version = "==0.11.19"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-xdist>=3.8",   # /ship pre-flight parallel runs (-n auto), #256
    "ruff==0.15.5",        # EXACT == the pinned pre-commit rev (v0.15.5) so the venv ruff and the hook ruff render one verdict; [tool.ruff] required-version stays the fleet floor
    "pre-commit>=4.5",
    "pyyaml>=6.0",         # scripts/ validators (audit.py etc.)
    "click>=8.0",          # audit.py CLI (was only in config/requirements-dev.txt)
    "rich>=13.0",          # deploy/tool.py console output (was undeclared — global-site-packages only)
    "pydantic>=2.0,<3",    # ADR-109 desired-state schema v1 (ecosystem/schema/, [#382] W2) — named by the operator-ratified intake #22 §E; <3 bound: StrictStr/extra semantics must not move under us (grok L5)
    "packaging>=24.0",     # PEP 440 version compare in scripts/fleet_parity.py (intake #23 library-first) — was already resolved transitively via pytest and present in uv.lock; declared explicitly so the gate does not depend on a transitive edge. NO ecosystem/dependency-baseline.yaml row: fleet_parity is hub-only, so this is not a dep consumers need to operate a methodology mechanism (the pandas/analytics precedent)
    "markdown-it-py>=4.0",  # CommonMark heading/fence identification in scripts/normalize_headers.py (library-first) — same shape as packaging above: already resolved transitively (via rich) and present in uv.lock, declared explicitly so a REWRITING hook does not ride a transitive edge. NO ecosystem/dependency-baseline.yaml row: normalize-dated-headers is HUB-ONLY — it is absent from .pre-commit-hooks.yaml and from the deploy manifest hook roster, so no consumer needs it to operate a methodology mechanism
    # rustworkx — the file-purpose graph (FPG-1, scripts/file_purpose_graph.py). This is the
    # NAMED CONSUMER standing ruling R-A reserved: "if a consumer is ever named, the library is
    # rustworkx, not networkx". AUTHORIZATION is the operator's A3 mandate, verbatim: "a real
    # graph library, not more hand-rolled traversal" — a dependency change is never incidental
    # (ADR-106), so it is declared here, locked, and committed with the mandate quoted in the
    # commit body rather than arriving as a side effect of a feature.
    #
    # MEASURED, not assumed (2026-08-29, this worktree, uv 0.11.19 / CPython 3.12.10 /
    # win_amd64): rustworkx 0.18.1 resolves and installs from a PREBUILT wheel
    # (`rustworkx-0.18.1-cp310-abi3-win_amd64.whl`, pinned by hash in uv.lock) — no Rust
    # toolchain, no sdist build. That was R-A's MEASUREMENT-OWED-LOCAL half and it PASSED, so
    # the recorded sqlite/stdlib fallback was NOT taken. The `>=0.16` floor is the release
    # carrying the `PyDiGraph` payload/attribute surface this module relies on; no upper pin,
    # since a graph kernel with no persisted artifact carries no cross-version compatibility
    # surface here.
    #
    # TRANSITIVE COST, stated rather than left to be discovered: rustworkx requires numpy. numpy
    # was ALREADY in uv.lock (via pandas), so the lock gains one package, not two — but numpy
    # moves from the opt-in `analytics` group into the DEFAULT `dev` group, so a plain
    # `uv sync --locked` now installs it where it previously did not. That is the real price of
    # the library-first call and it is on the record rather than in a diff nobody reads.
    #
    # NO ecosystem/dependency-baseline.yaml row — the pandas/packaging/markdown-it-py
    # precedent, applied for the same stated reason: the file-purpose graph is HUB-ONLY (it
    # reads this repo's own governance surfaces and ships in no carrier and no deploy-manifest
    # component roster), so it is not a dep a consumer needs to operate a methodology mechanism.
    "rustworkx>=0.16",
    # pytest-timeout — the UNATTENDED suite path's wedge guard ([#643] leg e, operator-approved
    # 2026-09-08). An unattended run has nobody watching it: a test that hangs does not fail, it
    # occupies the machine until someone notices, and the five OOM-killed suite attempts of
    # 2026-09-07/08 are what "nobody notices for hours" costs. A per-test ceiling converts a
    # hang into a named FAIL with a traceback.
    #
    # THE VALUE IS CITED, NOT INVENTED, and it is passed on the unattended command line rather
    # than written into `addopts` (see the [tool.pytest.ini_options] block below — the
    # INTERACTIVE path is deliberately untouched). `--timeout=900` reuses
    # `gen_handoff.SHIP_GATE_TIMEOUT_S = 900`, this repo's ONE already-declared ceiling for its
    # most expensive subprocess, whose own comment states the principle a second number would
    # be free to disagree with: "a ceiling tighter than the gate's real cost would manufacture
    # refusals rather than detect them". The heaviest legitimate tests here are the ship-gate
    # and pre-commit subprocess spawns; 900 s sits above them and far below "wedged forever".
    #
    # NO ecosystem/dependency-baseline.yaml row — the pandas / packaging / markdown-it-py
    # precedent, for the reason that surface states: it governs deps required to OPERATE
    # METHODOLOGY MECHANISMS fleet-wide. The unattended suite path is HUB-ONLY, ships in no
    # carrier and in no deploy-manifest component, so no consumer needs it. (Contrast
    # pytest-xdist, which DOES carry a row: `/ship`'s parallel pre-flight is a deployed
    # mechanism, and #332 witnessed a consumer silently degrading to serial without it.)
    "pytest-timeout>=2.3",
    # doit (PyPI `doit`; the pydoit project) -- the spine's task runner: `dodo.py` generates one task
    # per `harness.yaml` stage, and a stage with no command FAILS its task, so the run STOPS there.
    # AUTHORIZATION: batch night-wave2 payload s1 ("pydoit ... APPROVED"), conditional on a live run
    # -- the STOP output is in the wave2-spine handback. WHY: library-first (DECLARE-SPINE-AND-B3 s3
    # decision matrix: native STOP on a missing action, ordering via task_dep, ~70 lines of adapter vs
    # ~200 hand-rolled). REJECTED: hand-written runner (no library-first), invoke (no stop/skip
    # semantics, YAML not native), GitHub Actions (not runnable locally; [#689] owns that leg),
    # pre-commit (wrong moment). WHERE: a LEAF -- doit 0.37.0 adds no transitive package to uv.lock;
    # the dev group only, imported by `dodo.py` alone. NO ecosystem/dependency-baseline.yaml row: the
    # spine is HUB-ONLY (the pandas/analytics precedent).
    "doit>=0.37.0",
    # deptry -- stage 6 (library-first) of the spine, DECLARE-SPINE-AND-B3 §9 item 4, operator-
    # approved 2026-09-19 UNDER THE CONDITION that it is run live over this repo before it is
    # committed: it was (deptry 0.25.1, `uv run --locked --with deptry deptry .` -> 336 raw
    # issues; clean via `scripts/stage_library_first.py deptry`, which adds the first-party
    # sibling list the [tool.deptry] table below cannot hold; the report is in the L5 handback).
    #   WHY: it answers "is every import declared, and is every declaration used?" from the
    #   import graph, so a library added without being declared (or declared and never imported)
    #   is a finding instead of a memory. REJECTED: a hand-written import scanner (the exact
    #   library-first violation the DECLARE records against the architect); ruff's `TID`/`I`
    #   import rules (they police import STYLE and banned modules, not declared-vs-imported);
    #   `pip check` / `uv pip check` (they verify installed metadata consistency, never source
    #   imports). WHERE: leaf of the dev group, no reverse dependents. `uv lock` measured: 3
    #   packages added (deptry 0.25.1, requirements-parser 0.13.1, tomli 2.4.1); its click,
    #   packaging and colorama edges were already in uv.lock.
    "deptry>=0.25",
    # psutil -- scripts/memory_admission_gate.py (LANE-5A-3, D7: "8+ reaps, 2 lanes lost to
    # OOM, `-n` set by hand -- no admission control"). AUTHORIZATION: the frozen contract
    # itself (LANE-5A-3, "Owns" line) names this dependency's addition to pyproject.toml/
    # uv.lock as the lane's deliverable, dispatched under DECLARE-NIGHT-AUTONOMY mechanism 1
    # ("Libraries: psutil for memory and process trees ... established; neither is new code")
    # -- the operator's paste of the batch order is the confirmation P0's "no new deps
    # without confirmation" asks for.
    #   LIBRARY-FIRST, STATED SO THE PRIOR CALL IS NOT SILENTLY REVERSED: resource_lifecycle.py
    #   (this repo, [#792]) explicitly declined psutil for the SAME free-memory question,
    #   citing stdlib-first (WMI via PowerShell / `/proc/meminfo`) plus the no-new-deps rule.
    #   That call stands for that module. This module reverses it ONLY for itself, on this
    #   contract's explicit direction, because psutil also answers this gate's SECOND question
    #   (workers computed from free memory) with one cross-platform call instead of two
    #   platform-specific parsers, and pytest-xdist worker sizing has no existing in-repo
    #   reader to reuse. The two modules therefore read memory through two different
    #   instruments on purpose; unifying them is future work, not a defect this lane owes.
    # NO ecosystem/dependency-baseline.yaml row -- the pandas/packaging/doit precedent: the
    # gate wraps HUB-ONLY organs (test_pairing.py, gates.py), ships in no carrier and no
    # deploy-manifest component, so no consumer needs it to operate a methodology mechanism.
    "psutil>=6.0",
    # filelock -- scripts/memory_admission_gate.py's machine-wide SLOT (the same contract and
    # DECLARE-NIGHT-AUTONOMY mechanism as psutil above). LIBRARY-FIRST: filelock was ALREADY
    # resolved transitively (pre-commit -> virtualenv -> filelock, uv.lock) but UNDECLARED --
    # this follows the packaging/markdown-it-py precedent above: a dependency this module
    # relies on directly must not ride a transitive edge it does not own. NOT the same
    # mechanism as scripts/single_flight.py's git-ref lock: that guard is explicitly built for
    # racers that may not share a filesystem (research evidence T2), which is a stronger and
    # more expensive property this gate does not need -- every slot-holder here already shares
    # one machine by construction (LANE-5A-3's own "machine-wide slot"), so a filesystem lock
    # is the right-sized tool and the distributed one would be solving a problem this gate
    # does not have. NO ecosystem/dependency-baseline.yaml row -- same reasoning as psutil.
    "filelock>=3.32",
]
# L5a descriptive analytics lane ([#384], intake #16 section 3). Separate group: the lane is
# HUB-ONLY (it mines siblings read-only but runs here), so a consumer never needs it and it
# deliberately carries NO row in ecosystem/dependency-baseline.yaml -- that surface governs
# deps required to OPERATE METHODOLOGY MECHANISMS fleet-wide, which this is not.
# pandas was already installed (2.3.3) but UNDECLARED; declaring it here fixes that real
# parity defect. PyDriller is deliberately absent -- see the D1 deviation note in
# scripts/fleet_analytics.py.
#   uv sync --locked --group analytics
analytics = [
    "pandas>=2.0",
]

[tool.mutmut]
# [#502] mutation-testing PILOT — CI-ONLY, scoped to the fleet_analytics slice.
#
# WHY CI-ONLY: mutmut requires fork(). Verbatim from its docs: "Mutmut must be run on a
# system with `fork` support. This means that if you want to run on windows, you must run
# inside WSL." This repo is Windows-developed, so the pilot CANNOT run on the operator's
# host — it is hosted by the [#501] report-only wall's `mutation-pilot` job. Do not try to
# run it locally on Windows; it will not work, and that is a tool constraint, not a defect.
#
# WHY SCOPED: the suite is 2400+ tests. An unscoped run over `scripts/` is not a slow pilot,
# it is an impractical one — module scoping is a precondition, not an optimization. The
# verdict this pilot owes is about ONE evidence class ([#392]), not a global mutation score.
#
# The calibration case, verified live: tests/test_fleet_analytics.py's
# `test_canonical_path_survives_a_cycle` asserts `canonical_path("a", {"a":"b","b":"a"})`
# is in {"a","b"}. Against the real implementation (scripts/fleet_analytics.py — a `.get()`
# chase, not dict iteration) the call returns "b" DETERMINISTICALLY, so the assertion passes
# for either member of the cycle and cannot catch a regression that flips which one comes
# back. Crash-safety landed; correctness did not. A mutant that changes WHICH node is
# returned should survive today — that surviving mutant is the pilot's calibration signal.
#
# Key names verified against mutmut 3.7.0's own `configuration.py` this session, NOT assumed:
# 3.x renamed `paths_to_mutate` -> `source_paths` and `tests_dir` ->
# `pytest_add_cli_args_test_selection` (both still accepted, both emit DeprecationWarnings).
#
# WHERE THE MODULE NAME COMES FROM, and why it is NOT settable here ([#502] lane E,
# 2026-08-18). mutmut names every mutant from the source file's path relative to the repo
# root: `mutmut/utils/format_utils.py::get_mutant_name` does
# `str(rel_path)[:-len(suffix)].replace(os.sep, ".")` and then strips exactly one hardcoded
# prefix, `src.`. So with `source_paths = ["scripts"]` the keys are, verbatim from CI run
# 32127150367, `scripts.fleet_analytics.x_main__mutmut_39`. The trampoline that records which
# tests reach a function instead records `f"{orig_func.__module__}.{fn}"` -- the name PYTHON
# knows the module by, chosen by whatever loads it. Attribution happens only where those two
# agree. Enumerated against mutmut 3.7.0's `Config` dataclass field-by-field, there is NO
# module-naming key on this surface, so this table cannot close such a gap; the alignment
# belongs to the loader. That is why the [#502] repair landed in
# `tests/test_fleet_analytics.py::_load` (which now loads under `scripts.fleet_analytics`)
# and this table is functionally UNCHANGED -- its scoping was already correct.
source_paths = ["scripts"]
only_mutate = ["*fleet_analytics.py"]           # fnmatch, not glob; must end .py or *
pytest_add_cli_args_test_selection = ["tests/test_fleet_analytics.py"]
# CRITICAL INTERACTION: [tool.pytest.ini_options] addopts is `-n auto` (parallel by default
# since 2026-08-06). mutmut already forks one subprocess PER MUTANT, so letting each of those
# spawn a full xdist worker pool is a fork bomb in slow motion. Force serial inside mutmut.
#
# `-n 0` and NOT `-p no:xdist` (corrected 2026-08-06 by the batch-1 night audit, measured
# twice). Unloading the plugin ALSO unloads the `-n` option that `addopts` already supplies,
# so every mutant's pytest exits 4 on `unrecognized arguments: -n` before collecting a single
# test. Local repro: `pytest -p no:xdist --collect-only tests/test_fleet_analytics.py` ->
# usage error. CI repro: run 31127625224 job `mutation-pilot` — `mutmut exit: 1` with all 84
# mutants reported `not checked`, i.e. a pilot that measures nothing while looking green.
# `-n 0` keeps xdist loaded and runs in-process; addopts is PREPENDED, so the later `-n 0`
# wins over `-n auto` and the serial intent holds.
#
# THAT FIX WAS REAL BUT NOT SUFFICIENT, and the correction is recorded rather than quietly
# overwritten. `-n 0` cured the exit-4 cause of "all mutants not checked" (every mutant's
# pytest died on `unrecognized arguments: -n` before collecting). A SECOND, independent cause
# of the same visible symptom survived it and produced the 2291-mutant / 0-checked phase-0
# result: the module-name mismatch documented above. Two different defects presenting as one
# indistinguishable output is why the 84-mutant and 2291-mutant scopes both read as "green but
# measuring nothing" -- the symptom was never diagnostic of its cause.
pytest_add_cli_args = ["-n", "0"]

[tool.pytest.ini_options]
# === UNIVERSAL (fleet methodology — ARC 4 leg 1, 2026-07-18; RULING-S split) ===
minversion = "9.0"   # declared fleet pytest floor (ARC 4 D2; live: hub/corp 9.0.2, ai-council 9.0.3)
# === REPO-PERSONAL (this repo's markers / ship tiering — may differ) ===========
# Diff-shaped ship pre-flight tiering (#256/#260). `live_repo` marks the tests that
# assert against the LIVE repo tree (markdown/docs) — the only tests a docs-only
# diff can break. Docs-only pre-flight: `pytest -m live_repo` + `audit.py ship-gate`.
markers = [
    "live_repo: test asserts against the live repo tree (docs/config), not a tmp_path fixture",
    "slow: opt-in slow test (subprocess / pre-commit / real-git spawns) — the #317 marker tier; the E2E consumer-lifecycle gauntlet gates additionally on RUN_E2E=1",
]
# === IMPORT SUBSTRATE — Shape B ([#521]; STANDING_RULINGS H4; ADR-106 env) =====
# This is the repo's import convention, RULED on measurement and rolled out here.
# It replaces the per-file `sys.path.insert(...)` bootstrap that used to open 73 of
# the test modules: pytest puts these roots on sys.path for the whole session, so a
# test file imports `audit` / `tool` / `carrier_precommit` by bare name and needs no
# preamble of its own.
#
# WHY THREE ROOTS AND NOT `["."]`. `scripts/` and `deploy/` carry NO `__init__.py`
# (only their `codemap`/`toc`/`lived_sandbox` subpackages do), so tests import bare
# module names, not dotted paths — and bare names are unreachable from the repo root
# alone. Measured, not argued (`23198aae`;
# docs/audits/2026-08-08-technical-502-pythonpath-measurement.md): `["."]` failed
# isolated collection on 67 of 99 test files, every failure a plain
# `ModuleNotFoundError` across 39 distinct modules, with ZERO real coupling and ZERO
# flake; `[".", "scripts", "deploy"]` failed 0 of 99 and was outcome-identical to
# baseline. `["."]` is the measurement of a SPELLING, not of the shape.
#
# WHY NOT src-layout (Shape C): it reverses the recorded `package = false` stance
# above and is excluded absent an ADR. Root `conftest.py` (Shape A) stays
# permitted-not-mandated ([#430](a), STANDING_RULINGS F5) — none exists in this repo.
#
# HONEST LIMIT — this reaches pytest and nothing else. The 24 non-test insertions
# (`scripts/` 18, `deploy/` 6) fire when a git hook or CLI runs a script directly,
# with no pytest in the process; they are DECLARED RESIDUAL, exempted with reasons at
# STANDING_RULINGS H4. Verified live before this line landed: zero of the 74 module
# names these roots expose shadow a stdlib module or an installed package.
pythonpath = [".", "scripts", "deploy"]
# PARALLEL BY DEFAULT — adopted on measurement, 2026-08-06 (intake #27 §A item 33,
# ARC-2 S-batch). Same tree, same day, 2362 tests collected:
#   serial          1785.61s  (29m45s)
#   -n auto  run 1   358.77s  (5m59s)   run 2   330.15s  (5m30s)   => ~5.2x
# Counts were IDENTICAL across all three runs — 2 failed / 2357 passed / 3 skipped, both
# failures the known [#457] legs, and no divergence between the two parallel runs. That
# is the evidence for making -n auto the standard path rather than an opt-in flag.
# The previous note here claimed "~9m42s wall, 2026-07-05 profile" for the serial suite;
# the measured cost is ~3x that, so the claim is corrected rather than left to be trusted.
addopts = "-n auto"
# Full SERIAL suite — still the on-demand sweep (#256 S3), now reached by OVERRIDING the
# default above. It exists to catch what parallelism can mask (xdist worker crashes,
# test-ordering coupling, load-sensitive timing):
#   uv run pytest -n 0 -q            (full serial; 1785.61s / 29m45s measured 2026-08-06)
# Run it when xdist behavior is itself suspect, or as a nightly sweep (no cron wired yet
# — deliberate; a documented invocation is the current contract).
#
# === THE UNATTENDED SUITE PATH ([#643] leg e) ================================
# THE INVOCATION, and every part of it is load-bearing:
#
#   uv run --locked --group analytics pytest -o addopts= -n 2 --timeout=900 -q -rf
#
# `--group analytics` — THIS IS THE 44-vs-28 DIFFERENCE, and it is not a preference.
#   Measured 2026-09-08 on Codespaces at 08c35b9c, same tree, four minutes apart:
#     uv sync --locked                   -> 44 failed, 5327 passed, 19 skipped (184.74s)
#     uv sync --locked --group analytics -> 28 failed, 5345 passed, 17 skipped (172.33s)
#   The sixteen extra REDs are `tests/test_fleet_analytics.py` ModuleNotFoundError on pandas.
#   An unattended run that omits the group does not measure a worse tree; it manufactures
#   sixteen failures and hands back a number nobody can act on. 28 is the baseline to compare
#   against — never zero, and never 44.
#
# `-o addopts=` — the run must be STRUCTURALLY unable to inherit `-n auto`, not merely
#   override it. A trailing `-n 2` would win by ordering alone, which is a property of how
#   pytest happens to prepend addopts rather than a guarantee; clearing the key removes the
#   inheritance itself. `pythonpath`, `markers` and `minversion` live in their own ini keys and
#   are untouched. THE INTERACTIVE PATH IS NOT CHANGED — `addopts = "-n auto"` above stays
#   exactly as it is, because an operator watching a run wants every core.
#
# `-n 2` — bounded on purpose. `-n auto` OOM-KILLED five consecutive suite attempts on the
#   operator's host (2026-09-07/08: 3.2 GB free of 28 GB, the rest held by OneDrive, VS Code
#   and Chrome), and an OOM kill is the one failure that produces no report at all. An
#   unattended run trades wall-clock for a result that exists.
#
# `--timeout=900` — pytest-timeout; the per-test wedge guard. The value is
#   `gen_handoff.SHIP_GATE_TIMEOUT_S`, reused rather than re-derived — see the dependency
#   comment in [dependency-groups] above for why that is the citable ceiling.
#
# `-rf` — the FAILED list is the artifact. A bare `-q` tail gives a count; the reconciliation
#   that says "28, and they are these 28" needs the names.
#
# WHERE IT RUNS, measured rather than assumed (2026-09-09, lane v-643). The 28-RED baseline was
# taken on the CODESPACES substrate (4 cores, 16 GB, `nproc 4`), which is where the 2026-08-20
# substrate ruling already puts this workload. On the operator's Windows host the run does NOT
# complete AT ANY WORKER COUNT while OneDrive, VS Code and Chrome hold the RAM: at ~2.8 GB free
# of 28 GB, `-n 2` was killed at 17 % (~13 min) and `-n 0` at 2 % (~7 min), both by the
# system's low-memory reaper, with no MemoryError and no partial report. THE INVOCATION IS NOT
# THE CAUSE — serial died sooner than parallel — so `-n 2` stands as the bounded choice against
# `-n auto`'s sixteen workers, and the constraint to fix is the host, not this line. A run that
# is killed produces no number at all, which is the one outcome an unattended sweep must not
# have; this is the third independent witness of that failure, after the five attempts recorded
# in DECLARE-PREFLIGHT-SHIPGATE-ROW-2026-09-08.

[tool.deptry]
# Stage 6 (library-first). Measured 2026-09-19 over this repo, deptry 0.25.1: 336 raw issues =
# 247 DEP001 + 88 DEP004 + 1 DEP003. Each waiver below is a MEASURED false positive, not a
# silence:
#  * first-party siblings (DEP001, 247 of 247 bar structlog): `scripts/` and `deploy/` are
#    sys.path roots, so `import gen_handoff` is a sibling import deptry cannot know. Not
#    listed here -- `scripts/stage_library_first.py` derives them from the tree at run time,
#    so the list cannot drift.
#  * DEP004 (88): every dependency lives in the `dev` group by design ("Not a package: ...
#    only the dependency groups", [tool.uv] above), so every third-party import is "a dev
#    dependency used by prod code". The distinction has no meaning in a repo with no
#    [project.dependencies].
#  * DEP003 tomli (1): `scripts/codemap/generator.py` falls back to tomli only on the
#    ImportError of stdlib tomllib, which cannot occur on requires-python >= 3.12.
#  * DEP001 structlog (1): `scripts/telemetry_emit.py` imports it only when the backend is
#    resolved to structlog; deliberately UNDECLARED (see that module: no measured gap
#    demands it, and "no new deps without confirmation").
ignore = ["DEP004"]
extend_exclude = ["\\.claude", "docs/audits", "docs/archive"]

[tool.deptry.per_rule_ignores]
DEP003 = ["tomli"]
DEP001 = ["structlog"]

[tool.ruff]
# === UNIVERSAL (fleet methodology — ARC 4 leg 1, 2026-07-18) ==================
# The three keys below are the equalized fleet ruff SHAPE (RULING-S reader-visible
# split; RULING-PY target baseline). Do not diverge without a `.methodology.yaml`
# declaration — fleet_parity gates them. Canonical: templates/ruff-config-block.toml.
required-version = ">=0.15.5"   # floor == pinned pre-commit ruff rev (v0.15.5)
target-version = "py311"        # RULING-PY baseline; "always newest Python" lift = #351
line-length = 120               # agreed fleet line-length (ARC 4 D1)
# .ruff.toml retired 2026-07-13 (W3) — this [tool.ruff] table is the one config home.

# === REPO-PERSONAL (this repo's lint posture — may differ; declared) ==========
# lane-python-standard-1 (2026-09-25): first code-standard tool, traced to
# to-browser/SESSION-lane-research-python-standard.md (C3). Candidate universe was C3's
# proposed families (B,SIM,C90,PL,RET,PERF,FURB,PTH,N,UP,ARG,ERA,TRY,FBT,RUF), measured
# tree-wide (6797 violations @ da11291b), auto-fixed with `--fix` (never `--unsafe-fixes`)
# only under scripts/+tests/ files no other WAVE5B-N2 lane owns, then re-measured. These
# ten individual codes are the only ones that reached ZERO violations tree-wide on the
# files this lane may touch; every other candidate code is measured-not-enforced (see this
# lane's session file to-browser/SESSION-lane-python-standard-1.md for the full
# before/after table and ROWS-OWED). Not whole rule families — per-code selection, since
# most C3 families still carry violations this lane cannot touch (owned by other lanes) or
# cannot auto-fix. PLE2515 and RUF010 were dropped in Repair 1 (integrator refusal,
# to-browser/REFUSED-lane-python-standard-1.md): their sole remaining tree-wide instances
# live inside scripts/audit_checks/check_routine_consumers.py and scripts/conductor.py,
# both owned by LANE-5B2-17-ci-signal.md — this lane cannot fix them, so it cannot claim
# zero (see ROWS-OWED, measured-not-enforced table).
# NOTE: RUF100 (unused-noqa) is excluded from every ruff invocation this lane ran with a
# narrowed --select, because RUF100's "is this noqa used" check is evaluated against
# WHATEVER rules are active in that invocation — a narrowed --select without E402/E731/etc.
# makes RUF100 misjudge every `# noqa: E402` as dead and `--fix` deletes it (caught and
# reverted once, see session file). Never run `--select ...RUF... --fix` without also either
# excluding RUF100 or using the real full config; this repo carries live `# noqa: E4xx`
# suppressions (313 at this writing) that a narrowed-select fix pass will destroy.
[tool.ruff.lint]
extend-select = [
    "FURB122",  # for-loop-writes
    "PLR1711",  # useless-return
    "RET501",   # unnecessary-return-none
    "RUF019",   # unnecessary-key-check
    "SIM300",   # yoda-conditions
    "SIM905",   # split-static-string
    "SIM910",   # dict-get-with-none-default
    "UP012",    # unnecessary-encode-utf8
    "UP033",    # lru-cache-with-maxsize-none
    "UP034",    # extraneous-parentheses
]

[tool.ruff.lint.per-file-ignores]
"tests/fixtures/**" = ["F401", "F811", "E402"]
