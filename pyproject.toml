# Dependency-isolation policy (#257, decided 2026-07-05): this repo runs on the
# SYSTEM Python 3.12 by design — no venv. Rationale: every enforcement surface
# (pre-commit `language: system` hooks, plugin Stop/SessionStart hooks, /ship
# pre-flight) invokes the system interpreter; a venv would fork interpreter
# paths across .pre-commit-config.yaml and hook wiring for zero isolation gain
# in a single-user, validators-only Layer-2 repo. The trade is made honest by
# DECLARING the dev toolchain below (PEP 735) so a rebuilt machine restores it
# reproducibly:
#   py -m pip install --group dev        (pip >= 25.1)
[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-xdist>=3.8",   # /ship pre-flight parallel runs (-n auto), #256
    "ruff>=0.15.5",        # matches [tool.ruff] required-version floor
    "pre-commit>=4.5",
    "pyyaml>=6.0",         # scripts/ validators (audit.py etc.)
]

[tool.pytest.ini_options]
# === UNIVERSAL (fleet methodology — ARC 4 leg 1, 2026-07-18; RULING-S split) ===
minversion = "9.0"   # declared fleet pytest floor (ARC 4 D2; live: hub/corp 9.0.2, ai-council 9.0.3)
# === REPO-PERSONAL (this repo's markers / ship tiering — may differ) ===========
# Diff-shaped ship pre-flight tiering (#256/#260). `live_repo` marks the tests that
# assert against the LIVE repo tree (markdown/docs) — the only tests a docs-only
# diff can break. Docs-only pre-flight: `pytest -m live_repo` + `audit.py ship-gate`.
markers = [
    "live_repo: test asserts against the live repo tree (docs/config), not a tmp_path fixture",
    "slow: opt-in slow test (subprocess / pre-commit / real-git spawns) — the #317 marker tier; the E2E consumer-lifecycle gauntlet gates additionally on RUN_E2E=1",
]
# Full SERIAL suite — the nightly/on-demand path (#256 S3). The tiered /ship
# pre-flight never runs this; it exists to catch what parallelism can mask
# (xdist worker crashes, test-ordering coupling, load-sensitive timing):
#   py -m pytest -q                  (full serial; ~9m42s wall, 2026-07-05 profile)
# Run it on demand when xdist behavior is itself suspect, or as a nightly
# sweep (no cron wired yet — deliberate; a documented invocation is the
# current contract). Parallel full equivalent: py -m pytest -n auto --dist worksteal -q

[tool.ruff]
# === UNIVERSAL (fleet methodology — ARC 4 leg 1, 2026-07-18) ==================
# The three keys below are the equalized fleet ruff SHAPE (RULING-S reader-visible
# split; RULING-PY target baseline). Do not diverge without a `.methodology.yaml`
# declaration — fleet_parity gates them. Canonical: templates/ruff-config-block.toml.
required-version = ">=0.15.5"   # floor == pinned pre-commit ruff rev (v0.15.5)
target-version = "py311"        # RULING-PY baseline; "always newest Python" lift = #351
line-length = 120               # agreed fleet line-length (ARC 4 D1)
# .ruff.toml retired 2026-07-13 (W3) — this [tool.ruff] table is the one config home.

# === REPO-PERSONAL (this repo's lint posture — may differ; declared) ==========
[tool.ruff.lint]
extend-select = []

[tool.ruff.lint.per-file-ignores]
"tests/fixtures/**" = ["F401", "F811", "E402"]
