# Environment-isolation toolchain (ADR-106, [#432], operator ruling 2026-07-26):
# this repo resolves, installs and runs its gate set through uv — the committed
# uv.lock + .python-version declare the environment; `uv sync --locked` rebuilds
# it reproducibly from a clean checkout. SUPERSEDES the #257 no-venv policy
# (2026-07-05): its system-interpreter rationale inverted once the enforcement
# surfaces (pre-commit hook entries, session hooks, verify cadence) moved onto
# `uv run --locked`, which resolves interpreter + deps per invocation.
#   uv sync --locked                     (dev group; the gate environment)
#   uv sync --locked --group analytics   (adds the L5a pandas lane)

[project]
name = "dev-knowledge"
version = "0.1.0"
description = "Universal LLM-driven development methodology hub (Layer 2 — markdown governance + read-only validators)"
requires-python = ">=3.12"

[tool.uv]
# Not a package: flat-layout governance repo, never built or installed — uv syncs
# only the dependency groups (also sidesteps the setuptools flat-layout trap).
package = false
# uv itself is PINNED EXACTLY (ADR-106): uv is pre-1.0 and ships ~every three days
# with behavioural drift in point releases (the 2026-07-23 release changed `--locked`
# semantics). A uv upgrade is its OWN gated change — bump this pin and regenerate
# uv.lock in a dedicated reviewed commit, never incidentally mid-arc.
required-version = "==0.11.19"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-xdist>=3.8",   # /ship pre-flight parallel runs (-n auto), #256
    "ruff==0.15.5",        # EXACT == the pinned pre-commit rev (v0.15.5) so the venv ruff and the hook ruff render one verdict; [tool.ruff] required-version stays the fleet floor
    "pre-commit>=4.5",
    "pyyaml>=6.0",         # scripts/ validators (audit.py etc.)
    "click>=8.0",          # audit.py CLI (was only in config/requirements-dev.txt)
    "rich>=13.0",          # deploy/tool.py console output (was undeclared — global-site-packages only)
    "pydantic>=2.0,<3",    # ADR-109 desired-state schema v1 (ecosystem/schema/, [#382] W2) — named by the operator-ratified intake #22 §E; <3 bound: StrictStr/extra semantics must not move under us (grok L5)
    "packaging>=24.0",     # PEP 440 version compare in scripts/fleet_parity.py (intake #23 library-first) — was already resolved transitively via pytest and present in uv.lock; declared explicitly so the gate does not depend on a transitive edge. NO ecosystem/dependency-baseline.yaml row: fleet_parity is hub-only, so this is not a dep consumers need to operate a methodology mechanism (the pandas/analytics precedent)
    "markdown-it-py>=4.0",  # CommonMark heading/fence identification in scripts/normalize_headers.py (library-first) — same shape as packaging above: already resolved transitively (via rich) and present in uv.lock, declared explicitly so a REWRITING hook does not ride a transitive edge. NO ecosystem/dependency-baseline.yaml row: normalize-dated-headers is HUB-ONLY — it is absent from .pre-commit-hooks.yaml and from the deploy manifest hook roster, so no consumer needs it to operate a methodology mechanism
]
# L5a descriptive analytics lane ([#384], intake #16 section 3). Separate group: the lane is
# HUB-ONLY (it mines siblings read-only but runs here), so a consumer never needs it and it
# deliberately carries NO row in ecosystem/dependency-baseline.yaml -- that surface governs
# deps required to OPERATE METHODOLOGY MECHANISMS fleet-wide, which this is not.
# pandas was already installed (2.3.3) but UNDECLARED; declaring it here fixes that real
# parity defect. PyDriller is deliberately absent -- see the D1 deviation note in
# scripts/fleet_analytics.py.
#   uv sync --locked --group analytics
analytics = [
    "pandas>=2.0",
]

[tool.mutmut]
# [#502] mutation-testing PILOT — CI-ONLY, scoped to the fleet_analytics slice.
#
# WHY CI-ONLY: mutmut requires fork(). Verbatim from its docs: "Mutmut must be run on a
# system with `fork` support. This means that if you want to run on windows, you must run
# inside WSL." This repo is Windows-developed, so the pilot CANNOT run on the operator's
# host — it is hosted by the [#501] report-only wall's `mutation-pilot` job. Do not try to
# run it locally on Windows; it will not work, and that is a tool constraint, not a defect.
#
# WHY SCOPED: the suite is 2400+ tests. An unscoped run over `scripts/` is not a slow pilot,
# it is an impractical one — module scoping is a precondition, not an optimization. The
# verdict this pilot owes is about ONE evidence class ([#392]), not a global mutation score.
#
# The calibration case, verified live: tests/test_fleet_analytics.py's
# `test_canonical_path_survives_a_cycle` asserts `canonical_path("a", {"a":"b","b":"a"})`
# is in {"a","b"}. Against the real implementation (scripts/fleet_analytics.py — a `.get()`
# chase, not dict iteration) the call returns "b" DETERMINISTICALLY, so the assertion passes
# for either member of the cycle and cannot catch a regression that flips which one comes
# back. Crash-safety landed; correctness did not. A mutant that changes WHICH node is
# returned should survive today — that surviving mutant is the pilot's calibration signal.
#
# Key names verified against mutmut 3.7.0's own `configuration.py` this session, NOT assumed:
# 3.x renamed `paths_to_mutate` -> `source_paths` and `tests_dir` ->
# `pytest_add_cli_args_test_selection` (both still accepted, both emit DeprecationWarnings).
source_paths = ["scripts"]
only_mutate = ["*fleet_analytics.py"]           # fnmatch, not glob; must end .py or *
pytest_add_cli_args_test_selection = ["tests/test_fleet_analytics.py"]
# CRITICAL INTERACTION: [tool.pytest.ini_options] addopts is `-n auto` (parallel by default
# since 2026-08-06). mutmut already forks one subprocess PER MUTANT, so letting each of those
# spawn a full xdist worker pool is a fork bomb in slow motion. Force serial inside mutmut.
#
# `-n 0` and NOT `-p no:xdist` (corrected 2026-08-06 by the batch-1 night audit, measured
# twice). Unloading the plugin ALSO unloads the `-n` option that `addopts` already supplies,
# so every mutant's pytest exits 4 on `unrecognized arguments: -n` before collecting a single
# test. Local repro: `pytest -p no:xdist --collect-only tests/test_fleet_analytics.py` ->
# usage error. CI repro: run 31127625224 job `mutation-pilot` — `mutmut exit: 1` with all 84
# mutants reported `not checked`, i.e. a pilot that measures nothing while looking green.
# `-n 0` keeps xdist loaded and runs in-process; addopts is PREPENDED, so the later `-n 0`
# wins over `-n auto` and the serial intent holds.
pytest_add_cli_args = ["-n", "0"]

[tool.pytest.ini_options]
# === UNIVERSAL (fleet methodology — ARC 4 leg 1, 2026-07-18; RULING-S split) ===
minversion = "9.0"   # declared fleet pytest floor (ARC 4 D2; live: hub/corp 9.0.2, ai-council 9.0.3)
# === REPO-PERSONAL (this repo's markers / ship tiering — may differ) ===========
# Diff-shaped ship pre-flight tiering (#256/#260). `live_repo` marks the tests that
# assert against the LIVE repo tree (markdown/docs) — the only tests a docs-only
# diff can break. Docs-only pre-flight: `pytest -m live_repo` + `audit.py ship-gate`.
markers = [
    "live_repo: test asserts against the live repo tree (docs/config), not a tmp_path fixture",
    "slow: opt-in slow test (subprocess / pre-commit / real-git spawns) — the #317 marker tier; the E2E consumer-lifecycle gauntlet gates additionally on RUN_E2E=1",
]
# PARALLEL BY DEFAULT — adopted on measurement, 2026-08-06 (intake #27 §A item 33,
# ARC-2 S-batch). Same tree, same day, 2362 tests collected:
#   serial          1785.61s  (29m45s)
#   -n auto  run 1   358.77s  (5m59s)   run 2   330.15s  (5m30s)   => ~5.2x
# Counts were IDENTICAL across all three runs — 2 failed / 2357 passed / 3 skipped, both
# failures the known [#457] legs, and no divergence between the two parallel runs. That
# is the evidence for making -n auto the standard path rather than an opt-in flag.
# The previous note here claimed "~9m42s wall, 2026-07-05 profile" for the serial suite;
# the measured cost is ~3x that, so the claim is corrected rather than left to be trusted.
addopts = "-n auto"
# Full SERIAL suite — still the on-demand sweep (#256 S3), now reached by OVERRIDING the
# default above. It exists to catch what parallelism can mask (xdist worker crashes,
# test-ordering coupling, load-sensitive timing):
#   uv run pytest -n 0 -q            (full serial; 1785.61s / 29m45s measured 2026-08-06)
# Run it when xdist behavior is itself suspect, or as a nightly sweep (no cron wired yet
# — deliberate; a documented invocation is the current contract).

[tool.ruff]
# === UNIVERSAL (fleet methodology — ARC 4 leg 1, 2026-07-18) ==================
# The three keys below are the equalized fleet ruff SHAPE (RULING-S reader-visible
# split; RULING-PY target baseline). Do not diverge without a `.methodology.yaml`
# declaration — fleet_parity gates them. Canonical: templates/ruff-config-block.toml.
required-version = ">=0.15.5"   # floor == pinned pre-commit ruff rev (v0.15.5)
target-version = "py311"        # RULING-PY baseline; "always newest Python" lift = #351
line-length = 120               # agreed fleet line-length (ARC 4 D1)
# .ruff.toml retired 2026-07-13 (W3) — this [tool.ruff] table is the one config home.

# === REPO-PERSONAL (this repo's lint posture — may differ; declared) ==========
[tool.ruff.lint]
extend-select = []

[tool.ruff.lint.per-file-ignores]
"tests/fixtures/**" = ["F401", "F811", "E402"]
