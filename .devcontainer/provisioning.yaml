# .devcontainer/provisioning.yaml — [#554] the cloud-lane provisioning declaration.
#
# WHY THIS FILE EXISTS. `provision.sh` and `devcontainer.json` between them already carry the
# four legs, but two of the lane contract's obligations are POLICY rather than code: which refs
# a cloud lane's clone must carry before a spine-walking gate may run (B1), and what the
# Codespaces prebuild configuration is supposed to be (A3). Both are settings, not logic, so
# they live here and `scripts/provision_legs.py` reads them — nothing below is duplicated
# into a Python constant or a bash literal.
#
# WHICH READER, AS OF 2026-09-15 ([#746]). `scripts/cloud_provisioning.py` read this file until
# it was retired at `3c9418cc` ([#734]); `scripts/provision_legs.py` reads it now, and carries
# the TWO legs [#746] names — `history` (B1) and `ecosystem` (L5) — and NOT the retired module's
# third command. So the `history` and `ecosystem` blocks below have a live reader and the
# `prebuild` block, alone, has NONE: it is a declaration of record with no checker behind it,
# and that block says so at its own head rather than leaving the reader to discover it.
#
# HONEST LIMIT, stated once rather than per-section. This file DECLARES; it does not enforce
# anything by existing. `scripts/provision_legs.py history --repair` acts on the `history`
# block and `scripts/provision_legs.py ecosystem --repair` on the `ecosystem` block; nothing
# acts on `prebuild`, whose subject is server-side GitHub state with no public API anyway (see
# the `prebuild` block).

schema: dev-knowledge-cloud-provisioning/1

# --- THE LIBRARY-FIRST CHECK, RECORDED ([#554] lane aa-1, 2026-09-15) -----------------------
#
# The rule, and it is a requirement rather than a preference: ANYTHING A DECLARED DEVCONTAINER
# FEATURE CAN DO STOPS BEING OUR SHELL SCRIPT. Less bespoke shell is fewer places that can die
# quietly, which is the failure mode this whole substrate is being rebuilt against.
#
# THIS BLOCK HAS A READER, which is what separates it from a comment that rots. Every `leg*()`
# function in `provision.sh` must carry a row here, asserted by
# `tests/test_substrate_heartbeat.py::test_every_provisioning_leg_carries_a_library_first_verdict`
# — so a NEW bespoke leg cannot be added without either finding a feature or writing down why
# there is none.
#
# HONEST LIMIT: the reader is a TEST, not a pre-commit gate, so it fires at suite time and not
# at the moment of the edit. That is deliberate rather than an omission — the check needs the
# live `.devcontainer/` tree and every consumer of provisioning that a fixture cannot stand in
# for, and a gate that can only run against the real repo is a gate a child repo inherits as a
# permanent red. `verdict` is one of:
#
#   feature        the leg IS a declared feature; provisioning asserts the result and installs
#                  nothing (the shell was deleted).
#   no-feature     checked, and no published feature does this.
#   rejected       a feature exists and was NOT taken; `reason` says why, and the reason has to
#                  survive being read back later.
features:
  leg1_uv:
    verdict: rejected
    feature: ghcr.io/va-h/devcontainers-features/uv
    reason: >-
      A community feature exists and takes a version as a static option. This repo's uv pin has
      ONE home (`pyproject.toml [tool.uv] required-version`, ADR-106) and `devcontainer.json`
      declares that it carries no version it does not have to; a feature option would be a
      second copy of the pin, free to drift from the one every gate reads. The shell here reads
      the pin at provision time, which is the property the feature cannot offer.
  leg2_unshallow:
    verdict: no-feature
    reason: >-
      No feature controls clone depth. Codespaces decides it, and the repair is a git command
      against an already-created clone.
  leg2b_history:
    verdict: no-feature
    reason: >-
      Ref sufficiency for a first-parent-spine walker is a property of THIS repo's gates; no
      general feature has the concept.
  leg5_ecosystem:
    verdict: no-feature
    reason: >-
      `ecosystem/*/state.yaml` self-registration is repo-specific state, gitignored by design.
  leg3_hooks:
    verdict: no-feature
    reason: >-
      A `pre-commit install` for three hook types in the RESOLVED hooks dir (honoring
      `core.hooksPath`) is repo-specific; the published pre-commit features install the tool,
      which `uv sync --locked` already does from the lockfile.
  leg_pc_login_path:
    verdict: no-feature
    reason: >-
      WAVE5B-N2 repair 1: exposing a repo-pinned venv's OWN binary (`pre-commit>=4.5`, resolved
      into `.venv/bin` by `uv sync --locked`) onto a fresh login shell's PATH is this repo's own
      admission-contract gap, not something a general devcontainer feature has a concept of — no
      published feature manages PATH visibility for an already-installed project dependency.
  leg_f1_claude:
    verdict: feature
    feature: ghcr.io/anthropics/devcontainer-features/claude-code:1.0
    reason: >-
      RESTORED 2026-09-15. The bespoke `curl … | bash` is deleted; the leg is now ASSERT-ONLY.
      The 2026-08-31 evidence against the feature was withdrawn the same day (both builds
      measured were `rebuild --full`s, which never applied the feature at all), leaving only a
      preference for the native installer — and a preference does not outrank library-first.
      The feature also installs Node.js when the base image does not provide it, which is the
      measured gap `leg_f1_node` exists for. No curl fallback is kept: a step that silently
      repairs a broken feature is how a substrate reports healthy with a dead leg.
  leg_f1_node:
    verdict: feature
    feature: ghcr.io/devcontainers/features/node:1
    reason: >-
      Declared 2026-09-15 on measurement. `devcontainer.json` previously INFERRED node from the
      base image's yarn apt source; the direct observation is that node's ABSENCE — not
      authentication — blocked copilot and codex in this container. The assert lives inside
      `leg_f1_claude`, which is why this row names a leg that is not its own function; the row
      exists so the feature decision is recorded per capability rather than per function.
  leg_f2_git_credential:
    verdict: no-feature
    reason: >-
      `ghcr.io/devcontainers/features/github-cli` installs `gh`; it does not wire a git
      credential helper from the repo-scoped token Codespaces already issues. Different act.
  leg_f4_workspace_trust:
    verdict: no-feature
    reason: >-
      Writing `hasTrustDialogAccepted` into `~/.claude.json` is a Claude Code runtime concern
      with no feature, and the documented alternative (an interactive trust dialog) cannot
      happen on a headless substrate.
  leg_l1_provenance:
    verdict: no-feature
    reason: >-
      The provenance marker is this repo's own identity claim (`scripts/substrate_provenance.py`).
      No feature has the concept, and one that did would be asserting somebody else's identity.

  # --- foundation-13 (R63 step 1): the lane's toolset. Each pin has ONE home, the `tools:` block
  # below; a feature option would be a second copy of it, which is the reason `leg1_uv` above
  # rejected the community uv feature.
  leg_f5_claude_pin:
    verdict: rejected
    feature: ghcr.io/anthropics/devcontainer-features/claude-code:1.0
    reason: >-
      The feature stays declared (it delivers node and the first binary) but installs the latest
      release and the CLI then auto-updates, per devcontainer.json's own reading of the doc:
      "the version tag pins the feature's install script, not the Claude Code release". The pin
      is applied over it by the documented native installer form `bash -s <version>`, and the
      updater is switched off by `DISABLE_AUTOUPDATER` (code.claude.com/docs/en/setup).
  leg_f5_gh:
    verdict: rejected
    feature: ghcr.io/devcontainers/features/github-cli:1
    reason: >-
      The feature exists and takes a version option, which would be a second copy of the pin in
      a file that cannot read the declaration; the leg installs the pinned release from the
      `tools:` block and asserts the result.
  leg_f5_codex:
    verdict: no-feature
    reason: >-
      No published devcontainer feature installs the Codex CLI; its README names
      `npm install -g @openai/codex`, and node is already declared as a feature.
  leg_f5_rclone:
    verdict: no-feature
    reason: >-
      No feature from devcontainers/features installs rclone, and Debian's packaged rclone trails
      the workstation's by many minor versions; rclone.org/install names the precompiled
      binary at a versioned URL, which is the form a pin can use.
  leg_f5_agy:
    verdict: no-feature
    reason: >-
      The Antigravity CLI ships through its own installer script only; no feature wraps it, and
      the script takes `--dir` but no version, so the leg installs what the vendor serves and
      asserts it equals the pin in `tools:` (b2-codespace-1to1).
  leg_f5_grok:
    verdict: no-feature
    reason: >-
      No published devcontainer feature installs the xAI Grok CLI. Its own installer
      (https://x.ai/cli/install.sh, read 2026-10-04) takes a version argument, which is the form a
      pin can use, and `GROK_DEPLOYMENT_KEY`, which is a credential and is never passed here.
      Added by b2-codespace-1to1 on the operator's order (2026-10-04): "1:1, all models in sync
      -- Grok, Codex, Gemini".

# --- foundation-13: THE LANE'S TOOLSET, pinned in one place --------------------------------------
#
# WHY. Codespace parity condition 1 (scripts/codespace_parity.py) compares `claude`, `gh`, `codex`,
# `grok` and `agy` between the workstation and a Codespace, and its first recorded run measured the
# container at claude 2.1.272 against 2.1.288 with gh, codex and agy absent
# (docs/audits/2026-10-03-technical-codespace-parity-run.md, condition 1); condition 4 needs `rclone`.
# Without them a Codespace lane cannot review, land or hand back over the transport.
#
# HOW. This block is the ONE home of every version below. The `tools get` command of the
# provision_legs module prints a pin, so `provision.sh` installs "the pin" and types no number;
# its `tools check` command asserts installed-and-at-pin, and each leg `die`s when that fails.
# Bumping a pin is an edit here and nowhere else. The values are what the workstation printed when this block was written; a
# workstation that moves on is a parity finding, not a reason to float the container.
#
# HONEST LIMIT (review, codex terra 2026-10-04): the `claude` and `agy` installers are vendor
# scripts fetched at run time (https://claude.ai/install.sh, https://antigravity.google/cli/install.sh)
# and are not themselves hash-pinned. The leg asserts the VERSION of the binary they leave, not the
# bytes of the script that ran. The agy script was read on 2026-10-04 and checks its payload's
# sha512 against the vendor manifest; for claude the vendor publishes a signed manifest
# (code.claude.com/docs/en/setup, "Binary integrity") that this leg does not verify.
# That is a supply-chain exception taken on the vendors' documented install path, not a pinned
# installer. `gh` and `rclone` are fixed release assets at a versioned URL, and `codex` is an npm
# version tag.
#
# `method` is the install form the tool's OWN documentation names, and `doc` is where it says so.
# `agy` is pinned although its installer takes no version (see its `reason`): the leg cannot choose
# the pin, so it asserts it, and a skew against the workstation then shows up in condition 1 by
# name instead of being hidden by a tool that floats.
tools:
  claude:
    version: "2.1.290"
    method: >-
      native installer with a version argument: curl -fsSL https://claude.ai/install.sh | bash -s <version>;
      auto-update off via DISABLE_AUTOUPDATER in settings.json env
    doc: https://code.claude.com/docs/en/setup
  gh:
    version: "2.93.0"
    method: >-
      prebuilt release binary: github.com/cli/cli/releases/download/v<version>/gh_<version>_linux_<arch>.tar.gz
    doc: https://github.com/cli/cli/blob/trunk/docs/install_linux.md
  codex:
    version: "0.155.0"
    method: npm install -g @openai/codex@<version>
    doc: https://github.com/openai/codex#readme
  rclone:
    version: "1.73.2"
    method: >-
      precompiled binary: downloads.rclone.org/v<version>/rclone-v<version>-linux-<arch>.zip
    doc: https://rclone.org/install/
  agy:
    version: "1.2.17"
    method: curl -fsSL https://antigravity.google/cli/install.sh | bash
    doc: https://codelabs.developers.google.com/antigravity-cli-hands-on
    reason: >-
      PINNED BUT NOT SELECTABLE (b2-codespace-1to1, R63): the vendor installer takes only --dir and
      installs the manifest's latest release, so the leg cannot choose this version. It ASSERTS it:
      a release the vendor publishes past the workstation's 1.2.17 is a named skew refusal here
      and a C1 version-skew FAIL, never a silent one. The manifest read 2026-10-04 named 1.2.16;
      it named 1.2.17 on 2026-10-05, when a Codespace created at the 1.2.16 pin refused (run 1 of
      b2-codespace-green: `L-F5 FAILED -- agy is not the pinned 1.2.16`), became a recovery
      container, and the workstation's own `agy --version` read 1.2.17.
  grok:
    version: "1.0.44"
    method: >-
      xAI first-party installer with a version argument: curl -fsSL https://x.ai/cli/install.sh | bash -s <version>;
      GROK_BIN_DIR picks the install directory. No credential is passed: a login is an operator act
    doc: https://github.com/xai-org/grok-build

# --- B1: history sufficiency ---------------------------------------------------------------
#
# The measured failure: `[#554]` leg 2 unshallows, so a cloud clone has DEPTH. It does not
# necessarily have REFS. `docs/audits/2026-08-19-technical-554-proof.md` §3 recorded a codespace
# whose clone carried 5329 commits and no local `main`, and every instrument that walks main's
# first-parent spine then errored rather than passing vacuously:
#
#   journal_spine_anchor: AnchorError(... 'fatal: Not a valid object name main')
#
# So "not shallow" is a necessary and INSUFFICIENT precondition, and this block states the
# sufficient one.
history:

  # `repair` — provisioning restores the refs below before any spine-walking instrument runs.
  # `exclude` — the instruments named below are declared out of scope for cloud lanes and the
  #   guard reports them as excluded instead of repairing.
  # The lane took `repair`; the reasoning is in ARTIFACT-lane-554.md section B1.
  disposition: repair

  # Refs a spine-walking instrument resolves by NAME. A cloud clone created from a non-default
  # branch has none of these locally even after `--unshallow`.
  required_refs:
    - main

  # The instruments that walk a first-parent spine, enumerated so `disposition: exclude` would
  # have a checkable subject if it were ever taken, and so a new spine walker has an obvious
  # place to register. Verified by `git grep -l -- --first-parent scripts/`.
  spine_walking_instruments:
    - scripts/validate_git_backlog.py
    - scripts/validate_no_ff.py
    - scripts/journal_anchor.py
    - scripts/block_ff_push.py
    - scripts/block_unanchored_push.py

# --- L5: the ecosystem registration a single-repo container cannot inherit -------------------
#
# `audit.py health` reports `repos registered (none)` in a fresh container and therefore exits
# non-zero, which is the LAST thing standing between this substrate and `[#554]`'s D1a
# Done-when (`docs/audits/2026-08-20-technical-codespaces-audit.md` §5.6).
#
# It is not structural. `discover_repos()` counts directories under `ecosystem/` carrying a
# `state.yaml`, and `ecosystem/*/state.yaml` is GITIGNORED (`.gitignore` line 69) — so no clone
# has ever carried one. On the workstation `scripts/worktree_seed.py` copies them from the
# primary checkout, and its own manifest comment names this exact symptom. A container has no
# primary to copy from, so it audits the one repo it does have and saves the result.
ecosystem:
  # Register the hub itself when nothing is registered. The name matches the directory that
  # `ecosystem/.dev-knowledge/history/` already occupies in the tree, so this seeds an existing
  # member rather than inventing one.
  self_register: true
  self_name: .dev-knowledge

# --- A3: the Codespaces prebuild declaration -------------------------------------------------
#
# NO READER SINCE 2026-09-15 ([#746]). `cloud_provisioning.py prebuild` was the only thing that
# ever read this block, and it went with that module at `3c9418cc`. `provision_legs.py` restores
# the two legs `[#746]` names and deliberately not this third command — so every sentence below
# that says "the checker" is describing something that no longer runs. The block is kept, not
# deleted: it is the repo-side record of what the operator UI state is supposed to be, and that
# record is the thing a future checker would be written against.
#
# NO PUBLIC API EXISTS for prebuild configurations. Probed 2026-08-21 against the live repo:
# `GET /repos/rdwornik/dev-knowledge/codespaces/prebuilds` returns 404, GraphQL schema
# introspection returns zero types and zero mutations matching `prebuild`, and `gh codespace`
# has no prebuild subcommand. The configuration is operator UI state
# (Settings -> Codespaces -> Set up prebuild), so this block is the repo-side DECLARATION of
# what that UI state is supposed to be. The retired `cloud_provisioning.py prebuild` compared
# it against the one field the API does expose — `prebuild_availability` on the machines
# endpoint — and nothing does so today (see this block's head).
#
# Every value below is the substrate audit's accepted LEAN v2 ruling
# (`docs/audits/2026-08-20-technical-codespaces-audit.md` §3.2, §4.5 step 3), not a preference.
prebuild:
  # Expected live state. `false` while the operator has not landed the configuration.
  # EXACTLY ONE COMBINATION IS FALSIFIABLE, because `prebuild_availability` answers a question
  # about AVAILABILITY and not about configuration: a `ready`/`in_progress` prebuild alongside
  # `configured: false` is observed drift (exit 1), and every other reading is indeterminate
  # (exit 2) — `none` is produced by an unrun or expired prebuild just as much as by no
  # configuration at all. The checker says which, and never reports a verification it cannot make.
  configured: true

  # "Every push", on the branch named by `ref:` below. CHANGED 2026-08-26 by the [#593] lane
  # contract, and this REVERSES the accepted LEAN v2 ruling that stood here — recorded rather
  # than quietly overwritten, because the reason the old value existed has not gone away.
  #
  # WHAT IT WAS AND WHY. `on_configuration_change` was chosen at
  # `docs/audits/2026-08-20-technical-codespaces-audit.md` §3.2 to bound Actions spend: that audit
  # measured 601 of 2000 included minutes already spent that month (30%), and prebuilds run on
  # Actions. That arithmetic is untouched by this change — every push to `main` now runs a
  # prebuild workflow, and the minute cost goes UP.
  #
  # WHAT IT BOUGHT, measured. Close packet §11 defect 3: a codespace created from the prebuilt
  # image came up at a 2026-08-22 commit against a pushed tip of `6882ef74`, with `git status -sb`
  # reporting no divergence because the clone had never fetched. Under
  # `on_configuration_change` the image is refreshed only when `.devcontainer/devcontainer.json`
  # or its Dockerfile changes — so a prebuild can serve an arbitrarily old source tree while
  # remaining, by its own definition, perfectly current.
  #
  # THE DOC LINE, quoted rather than paraphrased. docs.github.com, "Configuring prebuilds": of
  # "Every push (the default setting)" — "With this setting, prebuilds will be updated on every
  # push made to the given branch" — and it is the setting that will "ensure that codespaces
  # generated from a prebuild always contain the latest codespace configuration, including any
  # recently added or updated dependencies". The same page says the converse for the alternative:
  # with scheduled prebuilds "codespaces may be created that do not use the latest dev container
  # configuration changes".
  #
  # HONEST LIMIT — this line DECLARES, it does not configure. Prebuild configuration is
  # server-side operator UI state with no public API (probed 2026-08-21, recorded above), so
  # landing this needs an operator edit at Settings -> Codespaces -> Set up prebuild, and
  # the retired `cloud_provisioning.py prebuild` could only report drift against the one field
  # the API exposes, and nothing reports it at all today.
  # THE ENFORCEABLE HALF OF THE FRESHNESS REPAIR IS NOT HERE: it is `refresh_source_tree` in
  # `provision.sh`, which fetches and fast-forwards the checkout at every creation and reports
  # staleness at every start — that one runs, and it makes the image's own age irrelevant.
  # AMENDED [#746] (2026-09-15): "irrelevant" was TOO STRONG, and the gap it left killed a
  # container. `refresh_source_tree` made the age of everything EXCEPT `provision.sh` itself
  # irrelevant — the fast-forward replaces that file while bash is executing the copy it already
  # read, so on 2026-09-14 a 1401-commit-old body ran to completion against a freshly correct
  # tree and refused the container into a recovery container. provision.sh now digests itself
  # across the fast-forward and hands over to the refreshed copy, which is what makes the
  # original sentence true.
  # ---- INTEGRATION-TIME REVERT (batch W2, 2026-08-27) --------------------------
  # REVERTED to `on_configuration_change`. The block above is W2C's reasoning, kept
  # verbatim as the record of what the lane argued; this note is the integrator's act
  # on it, attributed rather than folded silently into the merge.
  #
  # WHY. The 2026-08-20 spend ruling stands: stay on the Codespaces free 4-core tier,
  # never buy overage. The block above concedes the case against itself -- "the minute
  # cost goes UP" -- against the same audit's measured 601 of 2000 included Actions
  # minutes already spent that month (30%), and prebuilds run on Actions.
  #
  # WHAT IS NOT LOST, and this is why the revert is cheap. The freshness defect [#593]
  # fixes stays fixed, because the block above says where the fix actually lives:
  # "THE ENFORCEABLE HALF OF THE FRESHNESS REPAIR IS NOT HERE: it is
  # `refresh_source_tree` in `provision.sh`" -- which fetches and fast-forwards at every
  # creation and reports staleness at every start, and is untouched by this revert.
  # This line only DECLARES (prebuild config is server-side operator UI state with no
  # public API), so reverting it costs no enforcement -- only the Actions spend.
  #
  # Re-reversing this is an operator SPEND decision, not a lane decision.
  trigger: on_configuration_change

  # EuropeWest only. The default is ALL regions x 2 retained versions — up to 8 multi-GB
  # prebuild images, which is the one thing that can exhaust the 15 GB-month free allowance.
  regions:
    - EuropeWest

  # Retain ONE prebuild version, against the default of 2.
  template_history: 1

  # The repository this configuration belongs to, so the checker needs no argument to find it.
  repository: rdwornik/dev-knowledge

  # The branch the availability query is asked about. `prebuild_availability` is answered IN THE
  # CONTEXT of a ref and a region, so both are sent; asking without them asks a different
  # question. The default branch is the one a prebuild is built from.
  ref: main
