# Pre-commit hooks for .dev-knowledge

repos:
  - repo: local
    hooks:
      - id: scope-tag-validator
        name: Validate scope tags (ADR-27)
        entry: python scripts/validate_scope_tags.py
        language: system
        types: [markdown]
        pass_filenames: true

      - id: normalize-dated-headers
        name: Normalize dated-log entry headers (auto-format)
        entry: python scripts/normalize_headers.py
        language: system
        types: [markdown]
        pass_filenames: true
