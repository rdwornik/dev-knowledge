# Pre-commit hooks for .dev-knowledge

# Install all three managed git-hook stages on a fresh `pre-commit install` so the
# pre-push gate (block-ff-push, #153) is wired alongside pre-commit + commit-msg.
# NOTE: changing this list does NOT install the pre-push hook into an existing clone
# — run `pre-commit install --hook-type pre-push` once per machine (called out in the
# #153 summary). Without it the git hook file is absent and the gate never fires.
default_install_hook_types: [pre-commit, commit-msg, pre-push]

# Scope every hook to the pre-commit stage by default. Without this, hooks that
# declare no `stages:` default to *all* stages, so they fire a SECOND time at the
# commit-msg git-hook (pre-commit is installed for both pre-commit and commit-msg).
# That second firing finds no staged files and prints a misleading
# "(no files to check) Skipped" for validate-backlog / codemap-freshness — even
# though they already ran and passed in the pre-commit stage. backlog-id-on-close
# opts back into commit-msg via its own explicit `stages:` override below.
default_stages: [pre-commit]

# THE COMMIT GATE WAS STRIPPED, 2026-09-17 (operator ruling, batch AB close). Measured before:
# 34 hooks, ~244 s mean commit wall, a single commit 9+ min as a detached process, fronting
# guards cited as permitting 477 of 573 calls (lane ab-808) -- a figure ab-808 RETRACTED before
# merging: per call the bypass rate was 13% and 4% (merge 06a2bccf, [#883]). No hook here carries a counter of what
# it caught, so which ones ever caught a real defect cannot be established -- and the ruling for
# that case is to keep ONLY data-loss protection: the JOURNAL anchor (block-unanchored-push,
# pre-push) and the index-freshness pair (audit-index-freshness, organ-index-freshness).
# block-ff-push stays with its pre-push sibling. EVERY OTHER HOOK is `stages: [manual]` and
# runs in `.github/workflows/conductor.yml` job `commit-gate` over the pushed range, REPORT-ONLY
# while conductor enforcement stays disabled. Temporarily fewer local gates, in exchange for
# being able to merge at all. A hook returns to the local stage only with a counter showing
# what it caught, at what cost, over what window.

repos:
  - repo: local
    hooks:
      - id: block-commit-on-main
        name: Block a direct (non-merge) commit on main ([#527] — core-invariant #5 prevent)
        # Pre-commit GATE, the commit-time half of core-invariant #5; block-ff-push below
        # stays the push-time half. The 2026-08-13 incident landed three direct-to-main
        # commits that the pre-push gate could only catch once they already existed, forcing
        # a commit-tree re-land to unwind — this refuses before one exists.
        #
        # FIRST in the list on purpose — but ORDERING BUYS OUTPUT ORDER, NOT COST OR
        # SIDE-EFFECT AVOIDANCE. An earlier comment here claimed it saved both; it does
        # not. `fail_fast` appears 0 times in this file (verified live across its hooks),
        # and pre-commit only short-circuits under `fail_fast`, so every hook still runs
        # after this one refuses: a blocked direct-commit-on-main still pays for the
        # codemap / audit / index checks below AND still has its markdown rewritten by
        # normalize-dated-headers. What being first actually buys is that the REASON for
        # the refusal is the first thing the operator reads. (NB3-A §7.2, non-blocking.)
        #
        # Predicate copied from upstream no-commit-to-branch (`git symbolic-ref HEAD`), plus
        # ONE carve-out: MERGE_HEAD present => allow, so a CONFLICTED integration merge on
        # main is never refused (a clean --no-ff merge is routed to pre-merge-commit and
        # never reaches this hook at all). Stated holes — detached HEAD passes; only
        # MERGE_HEAD carves out — are documented in the script and pinned by its tests.
        # `stages` is explicit though it matches default_stages, so the neighbouring
        # pre-push entries cannot make a reader guess which stage this one runs at.
        # HUB-ONLY. Fails CLOSED (exit 2) on internal error. Bypass: `git commit --no-verify`
        # (block-ff-push then still refuses the push).
        entry: uv run --locked python scripts/block_commit_on_main.py
        language: system
        stages: [manual]
        always_run: true
        pass_filenames: false
      - id: normalize-dated-headers
        stages: [manual]   # MOVED to the Actions conductor, 2026-09-17 -- see the header
        name: Normalize dated-log entry headers (auto-format)
        entry: uv run --locked python scripts/normalize_headers.py
        language: system
        types: [markdown]
        pass_filenames: true
      - id: codemap-freshness
        stages: [manual]   # MOVED to the Actions conductor, 2026-09-17 -- see the header
        name: Codemap freshness check
        entry: uv run --locked python -m scripts.codemap.cli check . --source-root scripts
        language: system
        files: '(^scripts/.*\.py$|^pyproject\.toml$|^tach\.toml$|^ARCHITECTURE\.md$)'
        pass_filenames: false
      - id: toc-freshness-playbook
        stages: [manual]   # MOVED to the Actions conductor, 2026-09-17 -- see the header
        name: PLAYBOOK.md TOC freshness check
        # Mirrors toc-freshness above. Regenerate with:
        # `python -m scripts.toc.cli generate protocols/PLAYBOOK.md --write`.
        # GENERATOR ADDED to `files:` 2026-09-07 ([#no-row], derived-copies lane, terra HIGH):
        # the selector watched this copy's inputs and its target but not the code that
        # RENDERS it, so an edit changing what the copy should contain fired nothing. Its
        # peers `audit-index-freshness` and `intake-index-freshness` already list their
        # generators; the omission here was the outlier, and
        # `ecosystem/derived-copies.yaml` is what surfaced it.
        entry: uv run --locked python -m scripts.toc.cli check protocols/PLAYBOOK.md
        language: system
        files: '(^protocols/PLAYBOOK\.md$|^scripts/toc/.*\.py$)'
        pass_filenames: false
      - id: roster-freshness
        stages: [manual]   # MOVED to the Actions conductor, 2026-09-17 -- see the header
        name: Methodology roster freshness check ([#244] P3)
        # Fail-on-stale, mirroring toc-freshness: regenerate with
        # `python scripts/gen_methodology_roster.py --write`. Catches BOTH drift
        # directions — a hand-edited roster AND a manifest change without a regen —
        # so the deployed-corpus roster (.claude/methodology-roster.md, @-imported
        # into CLAUDE.md) can no longer be hand-maintained and thus cannot rot (R3).
        # HUB-ONLY (n=1); deliberately NOT in the manifest precommit carrier — rolling
        # the generator to consumers is P6.
        # GENERATOR ADDED to `files:` 2026-09-07 ([#no-row], derived-copies lane, terra HIGH):
        # the selector watched this copy's inputs and its target but not the code that
        # RENDERS it, so an edit changing what the copy should contain fired nothing. Its
        # peers `audit-index-freshness` and `intake-index-freshness` already list their
        # generators; the omission here was the outlier, and
        # `ecosystem/derived-copies.yaml` is what surfaced it.
        entry: uv run --locked python scripts/gen_methodology_roster.py --check
        language: system
        files: '(^deploy/manifest-v.*\.yaml$|^\.claude/methodology-roster\.md$|^scripts/gen_methodology_roster\.py$)'
        pass_filenames: false
      - id: claude-rosters-freshness
        stages: [manual]   # MOVED to the Actions conductor, 2026-09-17 -- see the header
        name: CLAUDE.md generated-fragment freshness check ([#258] phase-2)
        # Fail-on-stale regen-and-diff, mirroring roster-freshness: regenerate with
        # `python scripts/gen_claude_rosters.py --write`. Guards the two @-imported
        # CLAUDE.md fragments (.claude/generated/{commands-repo,recent-adrs}.md) —
        # [#258] phase-1 generated them but left them ungated, so a new command file
        # or ADR (or a hand-edit) could drift the fragment silently. Fires on BOTH the
        # disk sources AND the targets, so either drift direction is caught. HUB-ONLY.
        # GENERATOR ADDED to `files:` 2026-09-07 ([#no-row], derived-copies lane, terra HIGH):
        # the selector watched this copy's inputs and its target but not the code that
        # RENDERS it, so an edit changing what the copy should contain fired nothing. Its
        # peers `audit-index-freshness` and `intake-index-freshness` already list their
        # generators; the omission here was the outlier, and
        # `ecosystem/derived-copies.yaml` is what surfaced it.
        entry: uv run --locked python scripts/gen_claude_rosters.py --check
        language: system
        files: '(^\.claude/commands/.*\.md$|^docs/decisions/ADR-.*\.md$|^\.claude/generated/(commands-repo|recent-adrs)\.md$|^scripts/gen_claude_rosters\.py$)'
        pass_filenames: false
      - id: audit-index-freshness
        name: Audits index freshness check (fleet-census A-2 ruling; #269 freshness-hook leg)
        # Fail-on-stale regen-and-diff, mirroring roster-freshness / claude-rosters-freshness:
        # regenerate with `uv run --locked python scripts/gen_audit_index.py --write`. Guards the
        # generated docs/audits/README.md against silent rot (the test_gen_audit_index red the
        # 2026-07-08 fleet census cleared at ca9ded0 can otherwise recur). The --check
        # regen-and-diff is shape-agnostic, so it survives #269's later count-tiered reshape.
        # HUB-ONLY.
        #
        # [#590] NARROWED, 2026-08-26, and the narrowing IS the fix. `files:` used to match ANY
        # docs/audits/*.md, which made regenerating the index mandatory for every lane that
        # wrote an artifact — and under the ADR-110 batch protocol every lane writes one. That
        # is what put this file in 6 of the last 7 conflicted merges (86% of all manual merge
        # resolution in the repo): parallel lanes were REQUIRED to touch it. Scoped to the
        # index and its generator, a lane no longer has to commit it for its artifact to be
        # indexed, which is [#590]'s first done-when.
        #
        # WHAT STILL REFUSES A STALE COMMITTED INDEX, since this hook no longer can: the
        # ship-gate-only `generated_artifact_freshness` leg, artifact `audits-index` — it WARNs
        # when the index is older than docs/audits/, and cmd_ship_gate REDs on an
        # undispositioned WARN. The guarantee moved from every-commit to at-ship, which is when
        # the index is read; it did not lapse. What this hook still catches at commit time is a
        # HAND-EDIT of the index, which is the other way it goes wrong.
        entry: uv run --locked python scripts/gen_audit_index.py --check
        language: system
        files: '(^docs/audits/README\.md$|^scripts/gen_audit_index\.py$)'
        pass_filenames: false
      - id: audit-title-gate
        stages: [manual]   # MOVED to the Actions conductor, 2026-09-17 -- see the header
        name: Audit TITLE gate (every indexed audit carries a heading; HUB-ONLY)
        # ARMED SEPARATELY FROM audit-index-freshness ON PURPOSE, and the separation is the
        # design. That hook is scoped by [#590] to the index and its generator, because
        # requiring every lane to regenerate a shared file put docs/audits/README.md in 6 of
        # the last 7 conflicted merges. This check WRITES NOTHING and touches no shared
        # artifact, so arming it on the audits tree re-creates none of that coupling -- and it
        # is the only path that catches a title-less artifact ON THE COMMIT THAT ADDS IT.
        #
        # Measured 2026-09-01: 20 of 837 indexed audits carry no `# ` heading and render as
        # `(no # title)`, nine of them harvested cloud artifacts. Those 20 are grandfathered in
        # ecosystem/audit-title-baseline.json; the 21st refuses. Re-measure deliberately with
        # `--write-title-baseline`, never to silence a finding.
        entry: uv run --locked python scripts/gen_audit_index.py --check-titles
        language: system
        files: '^docs/audits/.*\.md$'
        pass_filenames: false
      - id: doc-counts-pytest-freshness
        stages: [manual]   # MOVED to the Actions conductor, 2026-09-17 -- see the header
        name: Collected-test-count freshness (the pytest_collected claim, at the COMMIT gate)
        # THE GAP THIS CLOSES. `ecosystem/doc-counts.md` claims a collected-test count, and
        # `validate_doc_claims` marks that claim `expensive=True` so `reconcile` SKIPS it unless
        # run_expensive is set. The only caller that sets it is the SHIP tier (`audit.py run` /
        # ship-gate), so a commit could add or delete tests and land with the claim stale, and
        # nothing said so until a ship-gate ran -- possibly days and many commits later, by which
        # point the commit that broke it is no longer the one being looked at. `--gate` (used by
        # audit-health) skips it by design and is NOT a substitute.
        #
        # Witnessed, not hypothetical: the commit adding tests/test_manifest_link_route.py passed
        # the full commit mesh while making this exact claim stale (4917 -> 4923).
        #
        # WHY A HOOK RATHER THAN MOVING check_doc_claims TO TIER_COMMIT. The claim's ground truth
        # is a `pytest --collect-only` subprocess, MEASURED at 29s on this repo. Paying that on
        # every commit would fail the tiering rule the ALL_CHECKS comment states on cost. A hook
        # with a `files:` filter pays it only on commits that can actually change the count, which
        # is the same shape codemap-freshness uses for the same reason.
        #
        # SCOPE IS MEASURED, NOT ASSUMED. The collected count is a function of tests/, conftest.py
        # and pyproject.toml (testpaths / addopts) only: every `@pytest.mark.parametrize` list in
        # this suite is a LITERAL, so no source-registry edit changes collection. HONEST LIMIT --
        # if a future test parametrizes over a source registry (ALL_CHECKS, say), its count would
        # move without any file here matching, and this hook would stay silent. The ship-tier
        # `doc_claims` check remains the backstop for that case; it is narrowed, not replaced.
        entry: uv run --locked python scripts/gen_doc_counts.py --check
        language: system
        files: '(^tests/.*\.py$|^conftest\.py$|^pyproject\.toml$|^ecosystem/doc-counts\.md$)'
        pass_filenames: false
        # HUB-ONLY.
      - id: organ-index-freshness
        name: Organ index freshness check ([#132]; ecosystem/organ-index.md)
        # Fail-on-stale regen-and-diff, mirroring audit-index-freshness /
        # claude-rosters-freshness: regenerate with
        # `python scripts/generate_organ_index.py --write`. Guards the generated organ
        # inventory (ecosystem/organ-index.md) against silent rot — the surface that replaces
        # "operator-as-registry", so a stale one is worse than none. Fires on EVERY organ
        # source the generator reads (.claude/{agents,commands,skills,workflows,rules},
        # settings.json, this config itself, the plugin manifest, the declared L0
        # registry, the deploy manifest) plus the target and the generator, so both drift
        # directions are caught. Exit 0 clean / 1 stale (+diff) / 2 target missing.
        # HUB-ONLY (n=1), like its three peer freshness gates. Bypass: --no-verify.
        entry: uv run --locked python scripts/generate_organ_index.py --check
        language: system
        files: '(^\.claude/(agents|commands|skills|workflows|rules)/|^\.claude/settings\.json$|^\.pre-commit-config\.yaml$|^plugins/|^ecosystem/organ-registry\.yaml$|^deploy/manifest-v.*\.yaml$|^ecosystem/organ-index\.md$|^scripts/generate_organ_index\.py$)'
        pass_filenames: false
      - id: quality-requirements-freshness
        stages: [manual]   # MOVED to the Actions conductor, 2026-09-17 -- see the header
        name: Quality register -- schema, organ resolution and the ARCHITECTURE section ([#765], AN2-1)
        # THE HOOK IS WHAT MAKES THE REGISTER *READ* RATHER THAN MERELY PRESENT, which is
        # done-contract clause 1 of the lane that built it. AN2-1's complaint about the
        # previous state was that technical requirements lived in a paste — a session that
        # did not read the paste was in breach of nothing. A register nothing consults is
        # the same defect wearing a filename.
        #
        # THREE LEGS, ONE REFUSAL, and the message names every defect rather than the first
        # (a register is edited as a whole; one-at-a-time costs a commit cycle per line):
        #   * SCHEMA — a `measured` entry carries `organ` AND `trip_test`; a `candidate`
        #     entry carries NEITHER. The second half is the asymmetry the design rests on:
        #     a candidate naming an organ is a requirement dressed as enforcement, which is
        #     the failure the register exists to prevent, so it is refused rather than
        #     ignored.
        #   * RESOLUTION — each measured entry's organ and trip-test file exist in the tree.
        #   * REGEN-AND-DIFF — ARCHITECTURE.md's marker-delimited section byte-matches a
        #     re-render from the register, the same idiom codemap-freshness and the four
        #     index gates use, so the section cannot be hand-edited into agreement.
        #
        # WHAT THIS HOOK CANNOT SEE, stated because a gate that overstates its reach is
        # worse than none: whether a trip-test would NOTICE its organ being removed. A path
        # check cannot answer that. `tests/test_quality_requirements.py` runs each trip
        # against a NEUTERED stand-in for its organ and requires an AssertionError naming
        # the requirement — that leg lives in the suite, not here, and the register's
        # `measured` claim rests on both.
        #
        # `files:` names the register, the renderer, the render target and the trip-test
        # module, so every drift direction fires: a register edit, a renderer change, a
        # hand-edit of the section, and a trip-test module edit that could unname a test the
        # register cites. HUB-ONLY (n=1), like its peer freshness gates. Exit 0 clean, 1 on
        # any defect. Bypass: --no-verify.
        entry: uv run --locked python scripts/quality_requirements.py check
        language: system
        files: '(^ecosystem/quality-requirements\.yaml$|^scripts/quality_requirements\.py$|^ARCHITECTURE\.md$|^tests/test_quality_requirement_trips\.py$)'
        pass_filenames: false
      - id: validate-hermetization
        stages: [manual]   # MOVED to the Actions conductor, 2026-09-17 -- see the header
        name: ADR-101 hermetization refusal gate (#306; HUB-ONLY, prospective-only)
        # Prospective-only tree seal (ADR-101 §3): inspects only staged ADDs
        # (git diff --cached --diff-filter=A); existing files grandfathered. Rule A BLOCKs a
        # new unsanctioned Tier-1 top-level dir / file-class / docs/<genre>/ folder; Rule B
        # BLOCKs a docs/audits/*.md off the <date>-<class>-<slug> grammar, R4 casing, or the
        # CLOSED 11-class enum. Name-shape only, never date-accuracy. HUB-ONLY (the floor/plugin
        # carrier is the P6 rollout). Computes its own staged-add set → always_run. Bypass:
        # --no-verify.
        entry: uv run --locked python scripts/validate_hermetization.py
        language: system
        always_run: true
        pass_filenames: false
      - id: intake-index-freshness
        stages: [manual]   # MOVED to the Actions conductor, 2026-09-17 -- see the header
        name: Intake index freshness check (#307; docs/intake/README.md Contents block)
        # Fail-on-stale regen-and-diff, mirroring audit-index-freshness: regenerate with
        # `python scripts/gen_intake_index.py --write`. Guards the generated status-grouped
        # Contents block in docs/intake/README.md against silent rot. Fires on ANY
        # docs/intake/*.md (a status change or add/remove shifts the index) OR the generator.
        # The --check regen-and-diff is shape-agnostic. HUB-ONLY.
        entry: uv run --locked python scripts/gen_intake_index.py --check
        language: system
        files: '(^docs/intake/.*\.md$|^scripts/gen_intake_index\.py$)'
        pass_filenames: false
      - id: check-seal-identity
        stages: [manual]   # MOVED to the Actions conductor, 2026-09-17 -- see the header
        name: Bundle seal-identity gate ([#475] — verify_seal_identity at commit time)
        # Commit-time twin of the [#473] seal-time refusal: runs gen_handoff's
        # verify_seal_identity over the bundle dir of every staged docs/handoffs/** file,
        # so a hand-renamed directory / edited Slug row / copied bundle cannot become an
        # immutable committed artifact. Fires only when such files are staged (files: +
        # pass_filenames — zero cost otherwise). Exit: 0 clean, 1 violation, 2 internal
        # error (an error BLOCKS, never silently passes). HUB-ONLY. Bypass: --no-verify.
        entry: uv run --locked python scripts/check_seal_identity.py
        language: system
        files: '^docs/handoffs/'
        pass_filenames: true
      - id: validate-backlog
        stages: [manual]   # MOVED to the Actions conductor, 2026-09-17 -- see the header
        name: Validate BACKLOG.md story-map (ADR-66)
        # [#589]: fires on `tasks/` too, and that widening is a correctness fix rather than
        # extra caution. The validator's rules are rules about a row BODY, and since the view
        # became a one-line projection a body edit that leaves the title and band alone
        # changes NOTHING in BACKLOG.md — so scoped to the old pathspec this gate would sit
        # out exactly the commits that can introduce a schema violation. `manifest.json` is in
        # scope because retiring/reordering a row is a manifest-only edit.
        entry: uv run --locked python scripts/validate_backlog.py
        language: system
        files: '(^BACKLOG\.md$|^tasks/.*\.(md|json)$)'
        pass_filenames: false
      - id: row-archive-proof
        stages: [manual]   # MOVED to the Actions conductor, 2026-09-17 -- see the header
        name: Row-body archival byte-identity proof (legs A-E; [#612]/[#664] TRIGGER)
        # [#664]'s ratified TRIGGER row for `scripts/archive_row_body.py`, placed HERE
        # deliberately: the census named "the pre-commit stage, beside the row-lifecycle
        # gates" as its surface, and `validate-backlog` immediately above is that neighbour.
        # Until this row landed the module was referenced only by its own test file, and a
        # test proves a module works while scheduling nothing -- which is precisely why the
        # census counted it an orphan with a green test suite sitting next to it.
        #
        # `verify` AND NOT `relocate`/`rerender`, and the choice is load-bearing rather than
        # conservative. Those two WRITE: `relocate` moves clauses out of a live row and
        # `rerender` rewrites a record's prose. A gate reads and refuses; one that edits the
        # rows it is judging would make Layer 2 mutate the corpus at commit time (Critical
        # Rule #4), and relocation is an operator act with a `propose` step in front of it.
        # `tests/test_archive_row_body.py` pins the subcommand so a later widening cannot
        # quietly turn this gate into a writer.
        #
        # The `files:` selector reaches `tasks/` and not only `BACKLOG.md` because LEG E
        # enumerates from the ROWS: a record DELETED under `tasks/archive/` is the one change
        # that removes the only thing that could complain, so a selector blind to it would
        # sit out the failure the leg exists to catch. `BACKLOG.md` is a generated view and
        # is included for the same completeness reason, not because a body edit shows there.
        # Exit is 0 clean / 1 on a failed leg, so a FAIL blocks; the module never raises.
        entry: uv run --locked python scripts/archive_row_body.py verify
        language: system
        files: '(^BACKLOG\.md$|^tasks/.*\.(md|json)$|^scripts/archive_row_body\.py$)'
        pass_filenames: false
      - id: prepend-order
        stages: [manual]   # MOVED to the Actions conductor, 2026-09-17 -- see the header
        name: Newest-first prepend / append-only logs ([#786]; PLAYBOOK "Order conventions")
        # Gives teeth to ONE heading: protocols/PLAYBOOK.md:1399 "### Order conventions",
        # whose two prepend classes name LESSONS.md, JOURNAL.md and logs/TOKEN-LOG.md.
        # Placed beside row-archive-proof because they are the same genre -- a byte-identity
        # proof over a record that no later organ can reconstruct once it is overwritten.
        #
        # WHY A GATE AND NOT MORE PROSE: the rule already had four prose carriers (this
        # heading, ADR-29, CLAUDE.md §5 rule 1, and each file's own "Never edit old entries"
        # header) and zero organs, and it was breached anyway -- eb08075c (155+/157-),
        # 99a104ed (20+/20-), febafcac (7+/25-), each by a seat that had read the prose.
        # `scripts/hooks/block_immutable_edits.py` does NOT cover these files: its zone is
        # transcripts, and it matches the Edit/Write tools rather than the commit.
        #
        # BLOCKS (exit 1). Deterministic-automation posture per PLAYBOOK Ch10 -- fail-closed
        # on an executing path; exit 2 on internal error or a vacuous invocation. Chosen
        # over WARN because the damage is unrecoverable by inspection: once a rewritten
        # LESSONS.md is committed there is nothing left to compare it against, so an
        # advisory that is skipped under load fails exactly when it matters. The predicate
        # is a suffix test with no approximation in it, so the false-block surface is small,
        # and the header block above the first dated heading is deliberately exempt (a
        # `Last updated:` stamp bump is the common real edit; blocking it would teach
        # --no-verify).
        #
        # `--all` WITH pass_filenames: false, deliberately. Passing filenames would let a
        # commit that touches ONLY the script itself hand the gate an empty target list --
        # a vacuous pass, which this repo counts as a defect rather than a shorthand. All
        # three logs cost three `git show` pairs and three string compares. The script is
        # in `files:` for the same reason its peers list their generators: an edit to what
        # the gate MEANS must re-run it. LESSONS-legacy-*.md is in scope because it is the
        # ADR-29 archival escape's evidence.
        entry: uv run --locked python scripts/validate_prepend_order.py --all
        language: system
        files: '(^LESSONS\.md$|^JOURNAL\.md$|^logs/TOKEN-LOG\.md$|^LESSONS-legacy-.*\.md$|^scripts/validate_prepend_order\.py$)'
        pass_filenames: false
      - id: provider-registry-agreement
        stages: [manual]   # MOVED to the Actions conductor, 2026-09-17 -- see the header
        name: Provider/model registry agreement gate (CLOUD-4 v2; HUB-ONLY)
        # ecosystem/provider-registry.yaml is the declared home for every provider, CLI
        # and model string on the live surface (R2 section 3.3). Sites that can read YAML
        # read it; the rest -- .md frontmatter, a .js object literal, a JSON config,
        # committed prose -- are held in agreement by this checker. Fires only when one of
        # the checked files (or the registry itself) is staged, so it costs nothing on an
        # unrelated commit. Exit: 0 clean, 1 violation, 2 internal error (an error BLOCKS,
        # never silently passes). HUB-ONLY. Bypass: --no-verify.
        #
        # HONEST LIMIT, the checker's own: it asserts that the sites AGREE with the
        # registry. It cannot make frontmatter or a JS literal READ the registry, and it
        # says nothing about whether the pinned model is the RIGHT one -- routing is ruled
        # doctrine and its canonical table (~/.claude/ROUTING.md) is L0, outside this repo
        # (ARCHITECTURE Ch3, ruled 2026-08-22).
        entry: uv run --locked python scripts/check_provider_registry.py
        language: system
        # `protocols/AI_COUNCIL_PROCESS.md` joined the pattern with S31 (LANE L1,
        # 2026-08-23): the council provider roster is a checked site, so an edit to it has
        # to fire the gate that holds it in agreement with the registry's `council_alias`
        # vocabulary. A checked site absent from this pattern is a gate that only fires
        # from the other end of the coupling.
        #
        # The gate's OWN IMPLEMENTATION is in the pattern too, and that is the more
        # important half (terra HIGH, 2026-08-23). Without it, a commit whose whole content
        # is `def check_s31_council_panel(root): return []` matches nothing here, the hook
        # never runs, and the gate is silently disarmed by the one change that should most
        # obviously have triggered it. The suite still catches it -- but the suite is not
        # what runs at commit time, and this hook is.
        #
        # Two more paths follow from the same argument, and terra had to say so twice before
        # the pattern was drawn wide enough (round 4): THIS FILE, because a commit whose only
        # content is a narrowed `files:` selector is evaluated against the NEW selector and so
        # disarms the hook cleanly; and `scripts/toc/generator.py`, the CommonMark fence
        # instrument S31 now depends on -- neutering `_code_line_indices` there would make
        # fenced example rows read as the live roster, with this gate never running.
        #
        # `always_run: true` is what actually GUARANTEES the run, and it is here because
        # widening `files:` was not enough (terra CRITICAL, round 5): a commit that narrows
        # this very selector is evaluated against the NEW selector, so listing this file
        # inside a conditional pattern cannot protect it. The pattern below is retained as
        # the documented statement of which surfaces are coupled -- it no longer decides
        # whether the gate runs. Cost is one fast read-only checker per commit (the live
        # `--all-files` run returns in well under a second).
        always_run: true
        files: '^(ecosystem/(provider-registry|tool-versions|satellite-onboarding-rulings)\.yaml|ecosystem/schema/provider_registry\.py|scripts/(check_)?provider_registry\.py|scripts/toc/generator\.py|\.pre-commit-config\.yaml|\.claude/(settings\.json|agents/artifact-reader\.md|workflows/conformance-hub\.js)|protocols/(PLAYBOOK|AI_COUNCIL_PROCESS)\.md|pyproject\.toml)$'
        pass_filenames: false
      - id: lane-contract-check
        stages: [manual]   # MOVED to the Actions conductor, 2026-09-17 -- see the header
        name: Lane-contract shape gate ([#539]; HUB-ONLY)
        # A generator-emitted lane contract (Q6) is checkable at commit time: every
        # mandatory section present, the dispatch line and the routing row agreeing on
        # the tier, and the worktree<->file pairing self-consistent with the `worktree-`
        # prefix applied exactly once. Honest limit: it checks SHAPE, never whether the
        # contract's footprint claims are true.
        #
        # SCOPE, per the architect ruling of 2026-08-21: the `files:` pattern matches the
        # GENERATOR'S OWN EMITTED NAME SHAPE (`LANE-<slug>.md`), not the contract-of-record
        # home. The eleven batch-1 contracts committed at
        # `docs/audits/2026-08-21-*-lane-contract.md` predate `gen_lane_contract.py`, carry
        # a title-plus-prose shape, and fail this check 11-for-11. They are records of an
        # already-executed batch, not templates: retro-fitting them would falsify what was
        # actually dispatched, so they are grandfathered as immutable historical evidence
        # and deliberately left OUTSIDE this glob. The gate governs batch 2 onward.
        #
        # `always_run: true` + `pass_filenames: false` (lane-g-630, [#630]) — the same pair
        # already used at `provider-registry` and `audit-health` below. A `files:`-globbed
        # gate is not a guarantee; it is a gate that disappears exactly on a commit touching
        # zero `LANE-*.md` files, which is every commit except a freeze. The pattern is
        # retained as documentation of what this gate is scoped to — it no longer decides
        # whether the gate runs. `gen_lane_contract.py check` now runs on every commit and
        # reports "0 checked" rather than erroring on `PATHS` or passing silently.
        entry: uv run --locked python scripts/gen_lane_contract.py check
        language: system
        always_run: true
        files: '(^|/)LANE-[^/]*\.md$'
      - id: derived-copies-rebind
        stages: [manual]   # MOVED to the Actions conductor, 2026-09-17 -- see the header
        name: Derived-copy rebind gate (a staged source whose copy did not move; HUB-ONLY)
        # THE GAP THIS CLOSES, and it is the deliverable rather than a side effect. A derived
        # copy that drifts from its source was, for the `~/.claude/ROUTING.md` case, caught
        # only at ship-gate -- `check_routing_agreement` sits at TIER_SHIP by a deliberate
        # choice recorded beside it in scripts/audit.py, because the L0 file is on operator
        # disk and a blanket COMMIT-tier failure would refuse every commit in the repo over a
        # file this repo does not write. That choice stands and this hook does not disturb
        # it. What it adds underneath is the narrow leg the ship tier cannot express: the
        # commit that STAGES a registered source and leaves the copy behind is the commit
        # that is refused. Witnessed: routing-table.yaml at 5be038ff, the L0 copy at 16e11c7.
        #
        # TWO LEGS. (1) REBIND -- a `commit_gate: self` row in ecosystem/derived-copies.yaml
        # whose sources are staged is verified here and FAILs on divergence. A
        # `commit_gate: gate` row is NOT re-verified: the hook it names already did that work
        # in this same run, so nothing here doubles an existing cost. (2) DISARM -- every
        # hook id a row delegates to is asserted to still EXIST in this file, on every
        # commit. Nine of the eleven registered copies delegate, and deleting one of those
        # hooks otherwise leaves no trace anywhere in the tree.
        #
        # `always_run: true` + `pass_filenames: false`, for leg 2 and for the reason
        # provider-registry-agreement and lane-contract-check both record: a `files:`-globbed
        # gate cannot protect its own configuration, because a commit that narrows the
        # selector is evaluated against the NEW selector and so disarms the gate cleanly on
        # exactly the commit that should have tripped it. The checker computes its own staged
        # set from `git diff --cached` and costs one YAML parse on a commit that rebinds
        # nothing.
        #
        # HONEST LIMIT: leg 2 asserts a hook of that id is PRESENT. It does not read that
        # hook's `files:` selector, so a narrowing that keeps the id passes it. Presence is
        # the cheap half of the property, not the whole of it.
        #
        # Exit: 0 clean, 1 violation, 2 internal error (an error BLOCKS). HUB-ONLY.
        # Bypass: --no-verify.
        entry: uv run --locked python scripts/check_derived_copies.py
        language: system
        always_run: true
        pass_filenames: false
      # ---- [#664] THE DELIVERY SPINE: one rebuild, then three refusals that read it ----
      #
      # ORDER IS LOAD-BEARING HERE, and it is the only reason four hooks are four rather
      # than one. `graph-rebuild` writes the store; the three queries below READ it and
      # build nothing. A full FPG-1 build measures ~10 s on this tree, so three independent
      # builds would put half a minute on every commit; three store reads measure
      # milliseconds each. pre-commit runs hooks in file order, so the rebuild must sit
      # above its readers -- moving any of them past it silently reintroduces the cost or,
      # worse, reads a store from the previous commit.
      #
      # WHY NOT ONE HOOK. Three refusals with one exit code give the operator one reason
      # for four possible causes. Each hook here names the single property it refuses on,
      # which is what makes a red one actionable rather than a starting point.
      #
      # HUB-ONLY, all four. The graph is this repo's corpus; a consumer repo has its own.
      - id: graph-rebuild
        stages: [manual]   # MOVED to the Actions conductor, 2026-09-17 -- see the header
        name: Rebuild the persisted FPG-1 store ([#664] clause 1)
        # THE STORE IS NOT IN THE WORKING TREE. It is written under the RESOLVED git dir
        # (`git rev-parse --absolute-git-dir`), so it never dirties `git status`, never
        # trips session-end backpressure, and needs no `.gitignore` line. In a worktree
        # that resolves per-worktree, which is the correct granularity: a worktree is a
        # different tree and therefore a different graph.
        #
        # COST, MEASURED rather than assumed: ~14.6 s wall on the live tree at
        # 2260 nodes / 14,673 edges, and ~21.9 s for this four-hook chain end to end.
        # That is the number ADR-118's flip-condition 2 asks W-G1 to fix against the gate
        # budget, and it is recorded in this lane's artifact alongside the read cost it
        # buys (2-3 s per query: interpreter start, plus the mtime sweep each query pays
        # to prove the store is FRESH rather than merely present -- Terra pre-merge P1,
        # and the hole it closes is a query answering from yesterday's graph). If this
        # crosses the ship-gate budget the flip-condition is met, and the answer is an
        # incremental store -- a different design, ruled elsewhere, not a quiet tuning.
        #
        # Exit: 0 on a written-and-read-back store, non-zero if it cannot be built or read.
        # Bypass: --no-verify.
        entry: uv run --locked python scripts/graph_store.py rebuild
        language: system
        always_run: true
        pass_filenames: false
      - id: graph-orphan-census
        stages: [manual]   # MOVED to the Actions conductor, 2026-09-17 -- see the header
        name: Orphan census -- a process nothing triggers ([#664] clause 2, intake #86)
        # REFUSES on a process node (script / command / skill) that no wiring surface
        # reaches, transitively, and that carries no disposition. This is intake #86's
        # organ at commit tier: the process-trigger census's method, moved from a one-time
        # grep pass into a standing query -- *"this replaces the REPETITION of that pass,
        # not the pass itself."*
        #
        # It reads FPG-1 and computes NO EDGES OF ITS OWN, which is intake #86's acceptance
        # criterion 5 and ADR-118 §1's whole point. `tests/test_graph_spine.py` pins it.
        #
        # Exit: 0 clean, 1 on an undispositioned orphan. Bypass: --no-verify.
        entry: uv run --locked python scripts/graph_queries.py orphan-census
        language: system
        always_run: true
        pass_filenames: false
      - id: graph-task-coverage
        stages: [manual]   # MOVED to the Actions conductor, 2026-09-17 -- see the header
        name: Task coverage -- a staged file no OPEN row claims ([#664] clause 2)
        # "nic bez taska" as a mechanism, AT OPEN and not only at CLOSE. REFUSES when a
        # staged file has no inbound `implements` edge from an OPEN row -- either the row
        # names the file, or the file names the row.
        #
        # A GATE THAT CONSULTS A VIEW, and it says so rather than mis-filing itself.
        # DECLARE-REVIEWS §A.1 correction 2 rules that two-tree gates cannot be views: the
        # STAGED SET is commit-time state and stays a gate; the `implements` relation is
        # corpus structure and is a query. This hook is the join of the two.
        #
        # Exit: 0 clean, 1 on an unclaimed staged file. Bypass: --no-verify.
        entry: uv run --locked python scripts/graph_queries.py task-coverage
        language: system
        always_run: true
        pass_filenames: false
      - id: graph-process-list
        stages: [manual]   # MOVED to the Actions conductor, 2026-09-17 -- see the header
        name: Process list -- prose naming a process the graph lacks ([#664] clause 2)
        # The traversal that answers "all processes", plus its refusal: a `dangling_
        # reference` -- a process path named in ARCHITECTURE.md that the graph does not
        # hold. `--render` emits the Ch2 body from the same traversal; RENDERING Ch2 is a
        # different lane (the frozen contract pins ARCHITECTURE.md prose out of this one),
        # so this hook arms the refusal and produces the answer without rewriting the prose.
        #
        # Exit: 0 clean, 1 on a dangling reference. Bypass: --no-verify.
        entry: uv run --locked python scripts/graph_queries.py process-list
        language: system
        always_run: true
        pass_filenames: false
      - id: graph-edge-class-census
        stages: [manual]   # MOVED to the Actions conductor, 2026-09-17 -- see the header
        name: Edge-class ratchet -- a NEW private five-kind edge computation ([#664] Done-when)
        # REFUSES when a module NEWLY computes a corpus-structure relation of DECLARE-REVIEWS
        # section A.1's five-kind class -- citation, generation, template, test, script
        # call-site -- by scanning source text, and no row of `EDGE_COMPUTATIONS` verdicts it.
        # Newly means an ADD, or an edit that gives a module a shape its HEAD version lacked;
        # the HEAD comparison is the whole reason an add-only reading was rejected.
        #
        # A RATCHET, NOT A BAR, AND THAT IS A RULING. Eighteen private computations are live
        # and owe their W-G3 migration ONE ORGAN PER LANE (ADR-118 section 5, which rejects
        # the big bang by name). Refusing all eighteen would refuse every commit in the repo
        # on a defect no single committer can legally repair -- the unbounded-refusal shape
        # `decision-coverage` above already era-bounds against. So the set may SHRINK and may
        # not GROW, and driving it to zero stays a migration lane's act.
        #
        # NOT A VIEW, AND IT SAYS SO RATHER THAN MIS-FILING ITSELF. The other three hooks here
        # are SELECTs over FPG-1. This one joins commit-time state (the staged set, plus the
        # HEAD comparison) to a CURATED REGISTER: "this module computes an edge privately" is
        # a ruling about a module's design, which no graph holds and none should. What is
        # computed mechanically is only the SHAPE of one module's source -- never a relation
        # between two corpus files, so nothing here re-derives what FPG-1 already answers.
        #
        # Second leg: a register row naming a file, or a symbol, that is GONE. It BLOCKS where
        # the orphan register's equivalent only notes, because a row leaving silently moves N
        # without a ruling -- the module docstring carries the full reasoning.
        #
        # Exit: 0 clean, 1 on a new computation or a rotted row. HUB-ONLY. Bypass: --no-verify.
        entry: uv run --locked python scripts/graph_queries.py edge-class-census
        language: system
        always_run: true
        pass_filenames: false
      - id: decision-coverage
        stages: [manual]   # MOVED to the Actions conductor, 2026-09-17 -- see the header
        name: Decision coverage -- an accepted decision no row implements ([#692], A9-1)
        # REFUSES when a decision -- an ADR at `Accepted`, an intake at `ACCEPTED`, a
        # transport `DECLARE-`/`AMEND-` -- carries neither an implementing row (an FPG-1
        # `implements` edge from a `tasks/` row's `implements:` key) nor a written "no
        # implementation required" disposition. The refusal LISTS the decisions and STATES
        # WHAT MUST BE DONE, which is A9-1's own second half: a process deviation raises an
        # exception that teaches, rather than a tripwire that only says no.
        #
        # TWO LEGS, BOTH ERA-BOUNDED AT `decision_coverage.ARM_DATE`, and the bound is the
        # reason this can be armed at all. Leg 1 is the commit's own decision files -- the
        # moment the obligation arises and the moment it can be discharged in the same
        # commit. Leg 2 is every in-era accepted decision, armed here (the CLI default),
        # because leg 1 alone is satisfiable by never touching the file again. MEASURED when
        # this landed: 112 accepted-but-unexecuted decisions predate the `implements:` key,
        # so an unbounded refusal would refuse every commit in the repo on a defect the
        # committer cannot legally repair. They are COUNTED rather than refused --
        # `decision_coverage.py metrics` reports the grandfathered size and the age of the
        # oldest on every run, and a bound that is not measured is an exemption.
        #
        # It reads the STORE for the `implements` relation and the DOCUMENTS for the
        # population, and the split is deliberate: FPG-1 mints `adr:N` only for an ADR
        # something CITES, so reading the population off the graph would be blind to exactly
        # the uncited, unimplemented decision this refuses on. tests/test_decision_coverage.py
        # pins both halves.
        #
        # Exit: 0 clean, 1 on an in-era decision with no row and no disposition.
        # Bypass: --no-verify.
        entry: uv run --locked python scripts/decision_coverage.py check
        language: system
        always_run: true
        pass_filenames: false
      - id: impacted-tests-guard
        stages: [manual]   # MOVED to the Actions conductor, 2026-09-17 -- see the header
        name: Zero-selection refusal -- a changed script no test covers ([#278] leg b)
        # AW2-1 leg (b): "A commit that changes a `scripts/*.py` file and selects zero
        # tests is REFUSED, and the refusal message names the RED-first test to write --
        # the operator's rule that a process deviation raises an exception which teaches
        # the agent." The message names `tests/test_<stem>.py`, not just the gap.
        #
        # SCOPE IS MEASURED, NOT ASSUMED, and this is the leg the lane contract warned
        # about: "Do not arm the (b) refusal tree-wide on its first day -- a gate that
        # refuses every scripts/*.py commit wedges the batch it is running inside."
        # Measured 2026-09-11 over the whole tree: 136 of 140 scripts/**.py already
        # select at least one test; exactly 4 select none (2.9%). The feared wedge is not
        # there, so the gate arms over all of scripts/ with those 4 named as a
        # grandfathered ratchet in `impacted_tests.ZERO_COVER_GRANDFATHERED` -- a set that
        # may shrink and must never grow. Each of the 4 was cross-checked against the
        # lane's independent coverage oracle, which also records zero executing tests, so
        # they are real gaps rather than selector defects.
        #
        # `deploy/` and `plugins/` are deliberately OUT of scope: they were not measured
        # for this, and a gate armed over ground nobody measured is the thing the contract
        # told this lane to refuse.
        #
        # ENFORCEMENT IS NOT KEYED TO A `files:` REGEX, deliberately. This row used to
        # carry `files: '^scripts/.*\.py$'` and pass_filenames; a reviewer HIGH on
        # 2026-09-11 showed that a commit could add an uncovered `scripts/new_tool.py`
        # AND narrow that regex in the same act -- pre-commit evaluates the staged
        # config, so the hook was skipped and the gate was disarmed by the change it
        # exists to inspect. It now `always_run`s and reads the staged set itself via
        # `git diff --cached --diff-filter=ACMRT` (see `staged_from_git`), which is the
        # same shape `audit-health` below uses. Cheap on an unrelated commit: with no
        # staged scripts the guard returns before building any coverage table.
        # `tests/test_impacted_tests.py::test_the_guard_cannot_be_disarmed_by_its_own_wiring`
        # pins this row so re-adding a filter goes RED rather than quietly narrowing.
        #
        # Exit: 0 clean, 1 on a zero-selection script. Bypass: --no-verify.
        entry: uv run --locked python scripts/impacted_tests.py guard
        language: system
        always_run: true
        pass_filenames: false
        # HUB-ONLY.
      - id: dispatch-conformance
        stages: [manual]   # MOVED to the Actions conductor, 2026-09-17 -- see the header
        name: Generator<->verb dispatch conformance (AX25-2, [#675] clause 1; HUB-ONLY)
        # AX25-2's REFUSAL LEG, verbatim: "A commit that changes either side and leaves the
        # test red is refused." That sentence is what makes this a CONFORMANCE gate rather
        # than a regression test -- the seam cannot be re-opened silently by a later patch
        # to one owner, which is exactly how four symptoms ([#716] base, [#717] model,
        # [#718] location, [#740] fence) accumulated while every individual check passed.
        #
        # THE GATE PROBES, IT DOES NOT GREP. It renders a contract with the live generator
        # and asks the ruled verb `dispatch <FILE.md>` to resolve it with -DryRun, then
        # asserts fence / contract location / model / base as ONE record. A name-grep over
        # the generator would prove the string is there, not that the reader accepts it.
        #
        # SCOPE IS COMPUTED, NOT GLOBBED -- the same correction `impacted-tests-guard`
        # above carries. A `files:` regex would let a commit edit the generator AND narrow
        # the regex in one act; pre-commit evaluates the STAGED config, so the gate would
        # be disarmed by the change it exists to inspect. It always_runs and reads
        # `git diff --cached` itself (`dispatch_conformance.SEAM_PATHS`), returning
        # immediately -- before spawning anything -- on a commit that touches neither side.
        #
        # HONEST LIMITS, two, and both matter:
        #   * The READER lives in another repo (win-tooling's Invoke-Dispatch.ps1), so this
        #     gate cannot fire on a commit that changes IT. A reader change is caught at the
        #     next commit here that touches the seam, on a host that has the verb -- later
        #     than the writer's half, and stated rather than implied.
        #   * Off a host with the verb, `fence` is judged against a PINNED admission rule
        #     carrying its locator and date. Coverage does not narrow (all four properties
        #     are still computed, and the check still REDs on a non-conforming line); the
        #     EVIDENCE weakens, and the record says which it used.
        #
        # NO ecosystem/parity-surfaces.yaml ROW, and deliberately: that manifest carries
        # fleet-template surfaces plus a few declared hub-local ones, and a gate over a
        # HUB-ONLY generator ships in no carrier and in no deploy-manifest component. Same
        # posture as `graph-orphan-census`, `impacted-tests-guard` and `decision-coverage`,
        # none of which carry a row either.
        #
        # Exit: 0 clean or out of scope, 1 on a non-conforming seam. Bypass: --no-verify.
        entry: uv run --locked python scripts/dispatch_conformance.py --guard
        language: system
        always_run: true
        pass_filenames: false
        # HUB-ONLY.
      - id: audit-health
        stages: [manual]   # MOVED to the Actions conductor, 2026-09-17 -- see the header
        name: Audit self-conformance gate (FAIL blocks the commit; WARN only informs)
        # `audit.py health` exits 1 only on a FAIL finding (structural integrity,
        # A2 freshness, conformance); WARN-level findings (A1 30-day backstop,
        # missing last_reviewed, etc.) print but exit 0. ~1.4s. Bypass: --no-verify.
        entry: uv run --locked python scripts/audit.py health --parallel
        language: system
        always_run: true
        pass_filenames: false
      - id: coherence-nudge
        stages: [manual]   # MOVED to the Actions conductor, 2026-09-17 -- see the header
        name: Coherence forgotten-version-bump nudge (non-blocking)
        # Fires on a registered spec changed-without-a-version-bump (the
        # reconciliation checker's false-negative). NON-BLOCKING: always exits 0
        # (a nudge, not a gate); appends every fire to logs/COHERENCE-NUDGE.log.
        # Spec set is single-sourced from validate_reconciliation._SPEC_REGISTRY.
        entry: uv run --locked python scripts/coherence_nudge.py
        language: system
        files: '^protocols/HANDOFF_PROCESS\.md$'
        pass_filenames: true
      - id: backlog-id-on-close
        name: Require [#id] when a commit removes a backlog task
        entry: uv run --locked python scripts/check_backlog_commit_msg.py
        language: system
        stages: [manual]
        always_run: true
      - id: backlog-filing-backpressure
        name: Filing backpressure — kill-candidates on new task id (+ #279 intake WARN)
        # Add-side sibling of backlog-id-on-close: a commit ADDING a new `- [#id]` must
        # carry a `kill-candidates:` line (BLOCK); a new L-epic lacking an intake-id earns
        # an advisory WARN (#279, ADR-98). Proposals only — never auto-removes anything.
        entry: uv run --locked python scripts/check_backlog_filing.py
        language: system
        stages: [manual]
        always_run: true
      - id: commit-message-type-prefix
        name: Commit message must carry a Conventional-Commits-shaped type prefix (#834)
        # PLAYBOOK.md "### Commit message standard" -- structural shape only (a leading
        # `type` or `type(scope)` token before the colon). Does NOT gate the closed
        # six-type list (perf/build/lessons are live sanctioned extensions) or the
        # ~72-char length / one-logical-change prose, both measured as too disruptive
        # to gate as written (5680/7985 historical commits exceed the length rule).
        # Measured wall time: ~2.9s warm (uv startup dominated), same order as the two
        # sibling commit-msg hooks above.
        # LANDED AT `manual`, 2026-09-17: merged after the commit gate was stripped, and it carries no
        # catch counter -- under that ruling a new gate does not take a local stage until it has one.
        entry: uv run --locked python scripts/check_commit_message_type.py
        language: system
        stages: [manual]
        always_run: true
      - id: block-ff-push
        name: Block direct-to-main / FF push to main (#153 prevent — core-invariant #5)
        # Pre-push GATE (the PREVENT half of #5; validate_no_ff stays the WARN detector).
        # Refuses a push that would put a non-merge commit on main's first-parent spine
        # (direct-to-main or true FF merge); a --no-ff merge passes. HUB-ONLY.
        # FAILS CLOSED on internal error (exit 2) per the ADR-85 amendment 2026-08-03 §A6 —
        # it previously printed "degraded — allowing push" and returned 0, silently
        # auto-allowing the exact push it exists to refuse. Bypass: `git push --no-verify`.
        # Activate locally once: `pre-commit install --hook-type pre-push`.
        entry: uv run --locked python scripts/block_ff_push.py
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
      - id: block-unanchored-push
        name: Block a push to main carrying an unanchored spine entry (ADR-85 amend. 2026-08-03)
        # The ADR-85 HARD leg (§A5/FR1-FR2). Refuses a push targeting main whose range
        # carries first-parent spine entries with NO JOURNAL anchor. Discharge is
        # range-level: a JOURNAL entry naming >=1 SHA the range INTRODUCED (a merge cannot
        # name its own hash). Lives here and not at Stop because a Stop hook's unit is a
        # model-turn boundary and the host force-ends a turn after N blocks — an organ that
        # can be EXHAUSTED cannot carry teeth. HUB-ONLY; FAILS CLOSED (exit 2) on internal
        # error. Sole escape: `git push --no-verify`, made non-silent by the audit backstop
        # audit.py::check_journal_spine_anchor (a gap is a FAIL, not a WARN).
        # Activate locally once: `pre-commit install --hook-type pre-push`.
        entry: uv run --locked python scripts/block_unanchored_push.py
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Fleet-canonical form (matches corp-monorepo + ai-council): a pinned-rev managed
    # hook, converted from the former hub-local `language: system` ruff for fleet parity.
    # rev pins v0.15.5 == the pyproject.toml [tool.ruff] required-version floor, so the
    # managed ruff and any system / dev-group ruff agree — no version-mismatch phantom
    # errors (the corp-monorepo I001 lesson). Gate mode: `args: []` == `ruff check`
    # (no --fix), so violations surface + block and are never auto-fixed.
    rev: v0.15.5
    hooks:
      - id: ruff
        stages: [manual]   # MOVED to the Actions conductor, 2026-09-17 -- see the header
        args: []
