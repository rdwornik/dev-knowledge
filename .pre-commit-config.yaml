# Pre-commit hooks for .dev-knowledge

# Install all three managed git-hook stages on a fresh `pre-commit install` so the
# pre-push gate (block-ff-push, #153) is wired alongside pre-commit + commit-msg.
# NOTE: changing this list does NOT install the pre-push hook into an existing clone
# — run `pre-commit install --hook-type pre-push` once per machine (called out in the
# #153 summary). Without it the git hook file is absent and the gate never fires.
default_install_hook_types: [pre-commit, commit-msg, pre-push]

# Scope every hook to the pre-commit stage by default. Without this, hooks that
# declare no `stages:` default to *all* stages, so they fire a SECOND time at the
# commit-msg git-hook (pre-commit is installed for both pre-commit and commit-msg).
# That second firing finds no staged files and prints a misleading
# "(no files to check) Skipped" for validate-backlog / codemap-freshness — even
# though they already ran and passed in the pre-commit stage. backlog-id-on-close
# opts back into commit-msg via its own explicit `stages:` override below.
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: block-commit-on-main
        name: Block a direct (non-merge) commit on main ([#527] — core-invariant #5 prevent)
        # Pre-commit GATE, the commit-time half of core-invariant #5; block-ff-push below
        # stays the push-time half. The 2026-08-13 incident landed three direct-to-main
        # commits that the pre-push gate could only catch once they already existed, forcing
        # a commit-tree re-land to unwind — this refuses before one exists.
        #
        # FIRST in the list on purpose — but ORDERING BUYS OUTPUT ORDER, NOT COST OR
        # SIDE-EFFECT AVOIDANCE. An earlier comment here claimed it saved both; it does
        # not. `fail_fast` appears 0 times in this file (verified live across its hooks),
        # and pre-commit only short-circuits under `fail_fast`, so every hook still runs
        # after this one refuses: a blocked direct-commit-on-main still pays for the
        # codemap / audit / index checks below AND still has its markdown rewritten by
        # normalize-dated-headers. What being first actually buys is that the REASON for
        # the refusal is the first thing the operator reads. (NB3-A §7.2, non-blocking.)
        #
        # Predicate copied from upstream no-commit-to-branch (`git symbolic-ref HEAD`), plus
        # ONE carve-out: MERGE_HEAD present => allow, so a CONFLICTED integration merge on
        # main is never refused (a clean --no-ff merge is routed to pre-merge-commit and
        # never reaches this hook at all). Stated holes — detached HEAD passes; only
        # MERGE_HEAD carves out — are documented in the script and pinned by its tests.
        # `stages` is explicit though it matches default_stages, so the neighbouring
        # pre-push entries cannot make a reader guess which stage this one runs at.
        # HUB-ONLY. Fails CLOSED (exit 2) on internal error. Bypass: `git commit --no-verify`
        # (block-ff-push then still refuses the push).
        entry: uv run --locked python scripts/block_commit_on_main.py
        language: system
        stages: [pre-commit]
        always_run: true
        pass_filenames: false
      - id: normalize-dated-headers
        name: Normalize dated-log entry headers (auto-format)
        entry: uv run --locked python scripts/normalize_headers.py
        language: system
        types: [markdown]
        pass_filenames: true
      - id: codemap-freshness
        name: Codemap freshness check
        entry: uv run --locked python -m scripts.codemap.cli check . --source-root scripts
        language: system
        files: '(^scripts/.*\.py$|^pyproject\.toml$|^tach\.toml$|^ARCHITECTURE\.md$)'
        pass_filenames: false
      - id: toc-freshness-playbook
        name: PLAYBOOK.md TOC freshness check
        # Mirrors toc-freshness above. Regenerate with:
        # `python -m scripts.toc.cli generate protocols/PLAYBOOK.md --write`.
        entry: uv run --locked python -m scripts.toc.cli check protocols/PLAYBOOK.md
        language: system
        files: '^protocols/PLAYBOOK\.md$'
        pass_filenames: false
      - id: roster-freshness
        name: Methodology roster freshness check ([#244] P3)
        # Fail-on-stale, mirroring toc-freshness: regenerate with
        # `python scripts/gen_methodology_roster.py --write`. Catches BOTH drift
        # directions — a hand-edited roster AND a manifest change without a regen —
        # so the deployed-corpus roster (.claude/methodology-roster.md, @-imported
        # into CLAUDE.md) can no longer be hand-maintained and thus cannot rot (R3).
        # HUB-ONLY (n=1); deliberately NOT in the manifest precommit carrier — rolling
        # the generator to consumers is P6.
        entry: uv run --locked python scripts/gen_methodology_roster.py --check
        language: system
        files: '(^deploy/manifest-v.*\.yaml$|^\.claude/methodology-roster\.md$)'
        pass_filenames: false
      - id: claude-rosters-freshness
        name: CLAUDE.md generated-fragment freshness check ([#258] phase-2)
        # Fail-on-stale regen-and-diff, mirroring roster-freshness: regenerate with
        # `python scripts/gen_claude_rosters.py --write`. Guards the two @-imported
        # CLAUDE.md fragments (.claude/generated/{commands-repo,recent-adrs}.md) —
        # [#258] phase-1 generated them but left them ungated, so a new command file
        # or ADR (or a hand-edit) could drift the fragment silently. Fires on BOTH the
        # disk sources AND the targets, so either drift direction is caught. HUB-ONLY.
        entry: uv run --locked python scripts/gen_claude_rosters.py --check
        language: system
        files: '(^\.claude/commands/.*\.md$|^docs/decisions/ADR-.*\.md$|^\.claude/generated/(commands-repo|recent-adrs)\.md$)'
        pass_filenames: false
      - id: audit-index-freshness
        name: Audits index freshness check (fleet-census A-2 ruling; #269 freshness-hook leg)
        # Fail-on-stale regen-and-diff, mirroring roster-freshness / claude-rosters-freshness:
        # regenerate with `uv run --locked python scripts/gen_audit_index.py --write`. Guards the
        # generated docs/audits/README.md against silent rot (the test_gen_audit_index red the
        # 2026-07-08 fleet census cleared at ca9ded0 can otherwise recur). The --check
        # regen-and-diff is shape-agnostic, so it survives #269's later count-tiered reshape.
        # HUB-ONLY.
        #
        # [#590] NARROWED, 2026-08-26, and the narrowing IS the fix. `files:` used to match ANY
        # docs/audits/*.md, which made regenerating the index mandatory for every lane that
        # wrote an artifact — and under the ADR-110 batch protocol every lane writes one. That
        # is what put this file in 6 of the last 7 conflicted merges (86% of all manual merge
        # resolution in the repo): parallel lanes were REQUIRED to touch it. Scoped to the
        # index and its generator, a lane no longer has to commit it for its artifact to be
        # indexed, which is [#590]'s first done-when.
        #
        # WHAT STILL REFUSES A STALE COMMITTED INDEX, since this hook no longer can: the
        # ship-gate-only `generated_artifact_freshness` leg, artifact `audits-index` — it WARNs
        # when the index is older than docs/audits/, and cmd_ship_gate REDs on an
        # undispositioned WARN. The guarantee moved from every-commit to at-ship, which is when
        # the index is read; it did not lapse. What this hook still catches at commit time is a
        # HAND-EDIT of the index, which is the other way it goes wrong.
        entry: uv run --locked python scripts/gen_audit_index.py --check
        language: system
        files: '(^docs/audits/README\.md$|^scripts/gen_audit_index\.py$)'
        pass_filenames: false
      - id: audit-title-gate
        name: Audit TITLE gate (every indexed audit carries a heading; HUB-ONLY)
        # ARMED SEPARATELY FROM audit-index-freshness ON PURPOSE, and the separation is the
        # design. That hook is scoped by [#590] to the index and its generator, because
        # requiring every lane to regenerate a shared file put docs/audits/README.md in 6 of
        # the last 7 conflicted merges. This check WRITES NOTHING and touches no shared
        # artifact, so arming it on the audits tree re-creates none of that coupling -- and it
        # is the only path that catches a title-less artifact ON THE COMMIT THAT ADDS IT.
        #
        # Measured 2026-09-01: 20 of 837 indexed audits carry no `# ` heading and render as
        # `(no # title)`, nine of them harvested cloud artifacts. Those 20 are grandfathered in
        # ecosystem/audit-title-baseline.json; the 21st refuses. Re-measure deliberately with
        # `--write-title-baseline`, never to silence a finding.
        entry: uv run --locked python scripts/gen_audit_index.py --check-titles
        language: system
        files: '^docs/audits/.*\.md$'
        pass_filenames: false
      - id: organ-index-freshness
        name: Organ index freshness check ([#132]; ecosystem/organ-index.md)
        # Fail-on-stale regen-and-diff, mirroring audit-index-freshness /
        # claude-rosters-freshness: regenerate with
        # `python scripts/generate_organ_index.py --write`. Guards the generated organ
        # inventory (ecosystem/organ-index.md) against silent rot — the surface that replaces
        # "operator-as-registry", so a stale one is worse than none. Fires on EVERY organ
        # source the generator reads (.claude/{agents,commands,skills,workflows,rules},
        # settings.json, this config itself, the plugin manifest, the declared L0
        # registry, the deploy manifest) plus the target and the generator, so both drift
        # directions are caught. Exit 0 clean / 1 stale (+diff) / 2 target missing.
        # HUB-ONLY (n=1), like its three peer freshness gates. Bypass: --no-verify.
        entry: uv run --locked python scripts/generate_organ_index.py --check
        language: system
        files: '(^\.claude/(agents|commands|skills|workflows|rules)/|^\.claude/settings\.json$|^\.pre-commit-config\.yaml$|^plugins/|^ecosystem/organ-registry\.yaml$|^deploy/manifest-v.*\.yaml$|^ecosystem/organ-index\.md$|^scripts/generate_organ_index\.py$)'
        pass_filenames: false
      - id: validate-hermetization
        name: ADR-101 hermetization refusal gate (#306; HUB-ONLY, prospective-only)
        # Prospective-only tree seal (ADR-101 §3): inspects only staged ADDs
        # (git diff --cached --diff-filter=A); existing files grandfathered. Rule A BLOCKs a
        # new unsanctioned Tier-1 top-level dir / file-class / docs/<genre>/ folder; Rule B
        # BLOCKs a docs/audits/*.md off the <date>-<class>-<slug> grammar, R4 casing, or the
        # CLOSED 11-class enum. Name-shape only, never date-accuracy. HUB-ONLY (the floor/plugin
        # carrier is the P6 rollout). Computes its own staged-add set → always_run. Bypass:
        # --no-verify.
        entry: uv run --locked python scripts/validate_hermetization.py
        language: system
        always_run: true
        pass_filenames: false
      - id: intake-index-freshness
        name: Intake index freshness check (#307; docs/intake/README.md Contents block)
        # Fail-on-stale regen-and-diff, mirroring audit-index-freshness: regenerate with
        # `python scripts/gen_intake_index.py --write`. Guards the generated status-grouped
        # Contents block in docs/intake/README.md against silent rot. Fires on ANY
        # docs/intake/*.md (a status change or add/remove shifts the index) OR the generator.
        # The --check regen-and-diff is shape-agnostic. HUB-ONLY.
        entry: uv run --locked python scripts/gen_intake_index.py --check
        language: system
        files: '(^docs/intake/.*\.md$|^scripts/gen_intake_index\.py$)'
        pass_filenames: false
      - id: check-seal-identity
        name: Bundle seal-identity gate ([#475] — verify_seal_identity at commit time)
        # Commit-time twin of the [#473] seal-time refusal: runs gen_handoff's
        # verify_seal_identity over the bundle dir of every staged docs/handoffs/** file,
        # so a hand-renamed directory / edited Slug row / copied bundle cannot become an
        # immutable committed artifact. Fires only when such files are staged (files: +
        # pass_filenames — zero cost otherwise). Exit: 0 clean, 1 violation, 2 internal
        # error (an error BLOCKS, never silently passes). HUB-ONLY. Bypass: --no-verify.
        entry: uv run --locked python scripts/check_seal_identity.py
        language: system
        files: '^docs/handoffs/'
        pass_filenames: true
      - id: validate-backlog
        name: Validate BACKLOG.md story-map (ADR-66)
        # [#589]: fires on `tasks/` too, and that widening is a correctness fix rather than
        # extra caution. The validator's rules are rules about a row BODY, and since the view
        # became a one-line projection a body edit that leaves the title and band alone
        # changes NOTHING in BACKLOG.md — so scoped to the old pathspec this gate would sit
        # out exactly the commits that can introduce a schema violation. `manifest.json` is in
        # scope because retiring/reordering a row is a manifest-only edit.
        entry: uv run --locked python scripts/validate_backlog.py
        language: system
        files: '(^BACKLOG\.md$|^tasks/.*\.(md|json)$)'
        pass_filenames: false
      - id: provider-registry-agreement
        name: Provider/model registry agreement gate (CLOUD-4 v2; HUB-ONLY)
        # ecosystem/provider-registry.yaml is the declared home for every provider, CLI
        # and model string on the live surface (R2 section 3.3). Sites that can read YAML
        # read it; the rest -- .md frontmatter, a .js object literal, a JSON config,
        # committed prose -- are held in agreement by this checker. Fires only when one of
        # the checked files (or the registry itself) is staged, so it costs nothing on an
        # unrelated commit. Exit: 0 clean, 1 violation, 2 internal error (an error BLOCKS,
        # never silently passes). HUB-ONLY. Bypass: --no-verify.
        #
        # HONEST LIMIT, the checker's own: it asserts that the sites AGREE with the
        # registry. It cannot make frontmatter or a JS literal READ the registry, and it
        # says nothing about whether the pinned model is the RIGHT one -- routing is ruled
        # doctrine and its canonical table (~/.claude/ROUTING.md) is L0, outside this repo
        # (ARCHITECTURE Ch3, ruled 2026-08-22).
        entry: uv run --locked python scripts/check_provider_registry.py
        language: system
        # `protocols/AI_COUNCIL_PROCESS.md` joined the pattern with S31 (LANE L1,
        # 2026-08-23): the council provider roster is a checked site, so an edit to it has
        # to fire the gate that holds it in agreement with the registry's `council_alias`
        # vocabulary. A checked site absent from this pattern is a gate that only fires
        # from the other end of the coupling.
        #
        # The gate's OWN IMPLEMENTATION is in the pattern too, and that is the more
        # important half (terra HIGH, 2026-08-23). Without it, a commit whose whole content
        # is `def check_s31_council_panel(root): return []` matches nothing here, the hook
        # never runs, and the gate is silently disarmed by the one change that should most
        # obviously have triggered it. The suite still catches it -- but the suite is not
        # what runs at commit time, and this hook is.
        #
        # Two more paths follow from the same argument, and terra had to say so twice before
        # the pattern was drawn wide enough (round 4): THIS FILE, because a commit whose only
        # content is a narrowed `files:` selector is evaluated against the NEW selector and so
        # disarms the hook cleanly; and `scripts/toc/generator.py`, the CommonMark fence
        # instrument S31 now depends on -- neutering `_code_line_indices` there would make
        # fenced example rows read as the live roster, with this gate never running.
        #
        # `always_run: true` is what actually GUARANTEES the run, and it is here because
        # widening `files:` was not enough (terra CRITICAL, round 5): a commit that narrows
        # this very selector is evaluated against the NEW selector, so listing this file
        # inside a conditional pattern cannot protect it. The pattern below is retained as
        # the documented statement of which surfaces are coupled -- it no longer decides
        # whether the gate runs. Cost is one fast read-only checker per commit (the live
        # `--all-files` run returns in well under a second).
        always_run: true
        files: '^(ecosystem/(provider-registry|tool-versions|satellite-onboarding-rulings)\.yaml|ecosystem/schema/provider_registry\.py|scripts/(check_)?provider_registry\.py|scripts/toc/generator\.py|\.pre-commit-config\.yaml|\.claude/(settings\.json|agents/artifact-reader\.md|workflows/conformance-hub\.js)|protocols/(PLAYBOOK|AI_COUNCIL_PROCESS)\.md|pyproject\.toml)$'
        pass_filenames: false
      - id: lane-contract-check
        name: Lane-contract shape gate ([#539]; HUB-ONLY)
        # A generator-emitted lane contract (Q6) is checkable at commit time: every
        # mandatory section present, the dispatch line and the routing row agreeing on
        # the tier, and the worktree<->file pairing self-consistent with the `worktree-`
        # prefix applied exactly once. Honest limit: it checks SHAPE, never whether the
        # contract's footprint claims are true.
        #
        # SCOPE, per the architect ruling of 2026-08-21: the `files:` pattern matches the
        # GENERATOR'S OWN EMITTED NAME SHAPE (`LANE-<slug>.md`), not the contract-of-record
        # home. The eleven batch-1 contracts committed at
        # `docs/audits/2026-08-21-*-lane-contract.md` predate `gen_lane_contract.py`, carry
        # a title-plus-prose shape, and fail this check 11-for-11. They are records of an
        # already-executed batch, not templates: retro-fitting them would falsify what was
        # actually dispatched, so they are grandfathered as immutable historical evidence
        # and deliberately left OUTSIDE this glob. The gate governs batch 2 onward.
        #
        # `always_run: true` + `pass_filenames: false` (lane-g-630, [#630]) — the same pair
        # already used at `provider-registry` and `audit-health` below. A `files:`-globbed
        # gate is not a guarantee; it is a gate that disappears exactly on a commit touching
        # zero `LANE-*.md` files, which is every commit except a freeze. The pattern is
        # retained as documentation of what this gate is scoped to — it no longer decides
        # whether the gate runs. `gen_lane_contract.py check` now runs on every commit and
        # reports "0 checked" rather than erroring on `PATHS` or passing silently.
        entry: uv run --locked python scripts/gen_lane_contract.py check
        language: system
        always_run: true
        files: '(^|/)LANE-[^/]*\.md$'
        pass_filenames: false
      - id: audit-health
        name: Audit self-conformance gate (FAIL blocks the commit; WARN only informs)
        # `audit.py health` exits 1 only on a FAIL finding (structural integrity,
        # A2 freshness, conformance); WARN-level findings (A1 30-day backstop,
        # missing last_reviewed, etc.) print but exit 0. ~1.4s. Bypass: --no-verify.
        entry: uv run --locked python scripts/audit.py health --parallel
        language: system
        always_run: true
        pass_filenames: false
      - id: coherence-nudge
        name: Coherence forgotten-version-bump nudge (non-blocking)
        # Fires on a registered spec changed-without-a-version-bump (the
        # reconciliation checker's false-negative). NON-BLOCKING: always exits 0
        # (a nudge, not a gate); appends every fire to logs/COHERENCE-NUDGE.log.
        # Spec set is single-sourced from validate_reconciliation._SPEC_REGISTRY.
        entry: uv run --locked python scripts/coherence_nudge.py
        language: system
        files: '^protocols/HANDOFF_PROCESS\.md$'
        pass_filenames: true
      - id: backlog-id-on-close
        name: Require [#id] when a commit removes a backlog task
        entry: uv run --locked python scripts/check_backlog_commit_msg.py
        language: system
        stages: [commit-msg]
        always_run: true
      - id: backlog-filing-backpressure
        name: Filing backpressure — kill-candidates on new task id (+ #279 intake WARN)
        # Add-side sibling of backlog-id-on-close: a commit ADDING a new `- [#id]` must
        # carry a `kill-candidates:` line (BLOCK); a new L-epic lacking an intake-id earns
        # an advisory WARN (#279, ADR-98). Proposals only — never auto-removes anything.
        entry: uv run --locked python scripts/check_backlog_filing.py
        language: system
        stages: [commit-msg]
        always_run: true
      - id: block-ff-push
        name: Block direct-to-main / FF push to main (#153 prevent — core-invariant #5)
        # Pre-push GATE (the PREVENT half of #5; validate_no_ff stays the WARN detector).
        # Refuses a push that would put a non-merge commit on main's first-parent spine
        # (direct-to-main or true FF merge); a --no-ff merge passes. HUB-ONLY.
        # FAILS CLOSED on internal error (exit 2) per the ADR-85 amendment 2026-08-03 §A6 —
        # it previously printed "degraded — allowing push" and returned 0, silently
        # auto-allowing the exact push it exists to refuse. Bypass: `git push --no-verify`.
        # Activate locally once: `pre-commit install --hook-type pre-push`.
        entry: uv run --locked python scripts/block_ff_push.py
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
      - id: block-unanchored-push
        name: Block a push to main carrying an unanchored spine entry (ADR-85 amend. 2026-08-03)
        # The ADR-85 HARD leg (§A5/FR1-FR2). Refuses a push targeting main whose range
        # carries first-parent spine entries with NO JOURNAL anchor. Discharge is
        # range-level: a JOURNAL entry naming >=1 SHA the range INTRODUCED (a merge cannot
        # name its own hash). Lives here and not at Stop because a Stop hook's unit is a
        # model-turn boundary and the host force-ends a turn after N blocks — an organ that
        # can be EXHAUSTED cannot carry teeth. HUB-ONLY; FAILS CLOSED (exit 2) on internal
        # error. Sole escape: `git push --no-verify`, made non-silent by the audit backstop
        # audit.py::check_journal_spine_anchor (a gap is a FAIL, not a WARN).
        # Activate locally once: `pre-commit install --hook-type pre-push`.
        entry: uv run --locked python scripts/block_unanchored_push.py
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Fleet-canonical form (matches corp-monorepo + ai-council): a pinned-rev managed
    # hook, converted from the former hub-local `language: system` ruff for fleet parity.
    # rev pins v0.15.5 == the pyproject.toml [tool.ruff] required-version floor, so the
    # managed ruff and any system / dev-group ruff agree — no version-mismatch phantom
    # errors (the corp-monorepo I001 lesson). Gate mode: `args: []` == `ruff check`
    # (no --fix), so violations surface + block and are never auto-fixed.
    rev: v0.15.5
    hooks:
      - id: ruff
        args: []
