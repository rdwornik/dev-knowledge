# Pre-commit hooks for .dev-knowledge

# Install all three managed git-hook stages on a fresh `pre-commit install` so the
# pre-push gate (block-ff-push, #153) is wired alongside pre-commit + commit-msg.
# NOTE: changing this list does NOT install the pre-push hook into an existing clone
# — run `pre-commit install --hook-type pre-push` once per machine (called out in the
# #153 summary). Without it the git hook file is absent and the gate never fires.
default_install_hook_types: [pre-commit, commit-msg, pre-push]

# Scope every hook to the pre-commit stage by default. Without this, hooks that
# declare no `stages:` default to *all* stages, so they fire a SECOND time at the
# commit-msg git-hook (pre-commit is installed for both pre-commit and commit-msg).
# That second firing finds no staged files and prints a misleading
# "(no files to check) Skipped" for validate-backlog / codemap-freshness — even
# though they already ran and passed in the pre-commit stage. backlog-id-on-close
# opts back into commit-msg via its own explicit `stages:` override below.
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: normalize-dated-headers
        name: Normalize dated-log entry headers (auto-format)
        entry: python scripts/normalize_headers.py
        language: system
        types: [markdown]
        pass_filenames: true
      - id: codemap-freshness
        name: Codemap freshness check
        entry: python -m scripts.codemap.cli check . --source-root scripts
        language: system
        files: '(^scripts/.*\.py$|^pyproject\.toml$|^tach\.toml$|^ARCHITECTURE\.md$)'
        pass_filenames: false
      - id: toc-freshness-playbook
        name: PLAYBOOK.md TOC freshness check
        # Mirrors toc-freshness above. Regenerate with:
        # `python -m scripts.toc.cli generate protocols/PLAYBOOK.md --write`.
        entry: python -m scripts.toc.cli check protocols/PLAYBOOK.md
        language: system
        files: '^protocols/PLAYBOOK\.md$'
        pass_filenames: false
      - id: roster-freshness
        name: Methodology roster freshness check ([#244] P3)
        # Fail-on-stale, mirroring toc-freshness: regenerate with
        # `python scripts/gen_methodology_roster.py --write`. Catches BOTH drift
        # directions — a hand-edited roster AND a manifest change without a regen —
        # so the deployed-corpus roster (.claude/methodology-roster.md, @-imported
        # into CLAUDE.md) can no longer be hand-maintained and thus cannot rot (R3).
        # HUB-ONLY (n=1); deliberately NOT in the manifest precommit carrier — rolling
        # the generator to consumers is P6.
        entry: python scripts/gen_methodology_roster.py --check
        language: system
        files: '(^deploy/manifest-v.*\.yaml$|^\.claude/methodology-roster\.md$)'
        pass_filenames: false
      - id: claude-rosters-freshness
        name: CLAUDE.md generated-fragment freshness check ([#258] phase-2)
        # Fail-on-stale regen-and-diff, mirroring roster-freshness: regenerate with
        # `python scripts/gen_claude_rosters.py --write`. Guards the two @-imported
        # CLAUDE.md fragments (.claude/generated/{commands-repo,recent-adrs}.md) —
        # [#258] phase-1 generated them but left them ungated, so a new command file
        # or ADR (or a hand-edit) could drift the fragment silently. Fires on BOTH the
        # disk sources AND the targets, so either drift direction is caught. HUB-ONLY.
        entry: python scripts/gen_claude_rosters.py --check
        language: system
        files: '(^\.claude/commands/.*\.md$|^docs/decisions/ADR-.*\.md$|^\.claude/generated/(commands-repo|recent-adrs)\.md$)'
        pass_filenames: false
      - id: audit-index-freshness
        name: Audits index freshness check (fleet-census A-2 ruling; #269 freshness-hook leg)
        # Fail-on-stale regen-and-diff, mirroring roster-freshness / claude-rosters-freshness:
        # regenerate with `python scripts/gen_audit_index.py --write`. Guards the generated
        # docs/audits/README.md against silent rot (the test_gen_audit_index red the 2026-07-08
        # fleet census cleared at ca9ded0 can otherwise recur). Fires on ANY docs/audits/*.md
        # (an add/edit/remove changes the index) OR the generator itself. The --check regen-and-diff
        # is shape-agnostic, so it survives #269's later count-tiered reshape. HUB-ONLY.
        entry: python scripts/gen_audit_index.py --check
        language: system
        files: '(^docs/audits/.*\.md$|^scripts/gen_audit_index\.py$)'
        pass_filenames: false
      - id: validate-hermetization
        name: ADR-101 hermetization refusal gate (#306; HUB-ONLY, prospective-only)
        # Prospective-only tree seal (ADR-101 §3): inspects only staged ADDs
        # (git diff --cached --diff-filter=A); existing files grandfathered. Rule A BLOCKs a
        # new unsanctioned Tier-1 top-level dir / file-class / docs/<genre>/ folder; Rule B
        # BLOCKs a docs/audits/*.md off the <date>-<class>-<slug> grammar, R4 casing, or the
        # CLOSED 11-class enum. Name-shape only, never date-accuracy. HUB-ONLY (the floor/plugin
        # carrier is the P6 rollout). Computes its own staged-add set → always_run. Bypass:
        # --no-verify.
        entry: python scripts/validate_hermetization.py
        language: system
        always_run: true
        pass_filenames: false
      - id: intake-index-freshness
        name: Intake index freshness check (#307; docs/intake/README.md Contents block)
        # Fail-on-stale regen-and-diff, mirroring audit-index-freshness: regenerate with
        # `python scripts/gen_intake_index.py --write`. Guards the generated status-grouped
        # Contents block in docs/intake/README.md against silent rot. Fires on ANY
        # docs/intake/*.md (a status change or add/remove shifts the index) OR the generator.
        # The --check regen-and-diff is shape-agnostic. HUB-ONLY.
        entry: python scripts/gen_intake_index.py --check
        language: system
        files: '(^docs/intake/.*\.md$|^scripts/gen_intake_index\.py$)'
        pass_filenames: false
      - id: validate-backlog
        name: Validate BACKLOG.md story-map (ADR-66)
        entry: python scripts/validate_backlog.py
        language: system
        files: '^BACKLOG\.md$'
        pass_filenames: false
      - id: audit-health
        name: Audit self-conformance gate (FAIL blocks the commit; WARN only informs)
        # `audit.py health` exits 1 only on a FAIL finding (structural integrity,
        # A2 freshness, conformance); WARN-level findings (A1 30-day backstop,
        # missing last_reviewed, etc.) print but exit 0. ~1.4s. Bypass: --no-verify.
        entry: python scripts/audit.py health
        language: system
        always_run: true
        pass_filenames: false
      - id: coherence-nudge
        name: Coherence forgotten-version-bump nudge (non-blocking)
        # Fires on a registered spec changed-without-a-version-bump (the
        # reconciliation checker's false-negative). NON-BLOCKING: always exits 0
        # (a nudge, not a gate); appends every fire to logs/COHERENCE-NUDGE.log.
        # Spec set is single-sourced from validate_reconciliation._SPEC_REGISTRY.
        entry: python scripts/coherence_nudge.py
        language: system
        files: '^protocols/HANDOFF_PROCESS\.md$'
        pass_filenames: true
      - id: backlog-id-on-close
        name: Require [#id] when a commit removes a backlog task
        entry: python scripts/check_backlog_commit_msg.py
        language: system
        stages: [commit-msg]
        always_run: true
      - id: backlog-filing-backpressure
        name: Filing backpressure — kill-candidates on new task id (+ #279 intake WARN)
        # Add-side sibling of backlog-id-on-close: a commit ADDING a new `- [#id]` must
        # carry a `kill-candidates:` line (BLOCK); a new L-epic lacking an intake-id earns
        # an advisory WARN (#279, ADR-98). Proposals only — never auto-removes anything.
        entry: python scripts/check_backlog_filing.py
        language: system
        stages: [commit-msg]
        always_run: true
      - id: block-ff-push
        name: Block direct-to-main / FF push to main (#153 prevent — core-invariant #5)
        # Pre-push GATE (the PREVENT half of #5; validate_no_ff stays the WARN detector).
        # Refuses a push that would put a non-merge commit on main's first-parent spine
        # (direct-to-main or true FF merge); a --no-ff merge passes. HUB-ONLY; fail-soft
        # to exit 0 on any git error. Bypass: `git push --no-verify`.
        # Activate locally once: `pre-commit install --hook-type pre-push`.
        entry: python scripts/block_ff_push.py
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Fleet-canonical form (matches corp-monorepo + ai-council): a pinned-rev managed
    # hook, converted from the former hub-local `language: system` ruff for fleet parity.
    # rev pins v0.15.5 == the pyproject.toml [tool.ruff] required-version floor, so the
    # managed ruff and any system / dev-group ruff agree — no version-mismatch phantom
    # errors (the corp-monorepo I001 lesson). Gate mode: `args: []` == `ruff check`
    # (no --fix), so violations surface + block and are never auto-fixed.
    rev: v0.15.5
    hooks:
      - id: ruff
        args: []
